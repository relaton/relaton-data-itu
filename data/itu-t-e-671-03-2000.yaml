abstract:
- language: en
  script: Latn
  content: This Recommendation proposes a post-selection delay Grade of Service (GOS)
    parameter and target values when part of a PSTN/ISDN connection is replaced by
    Internet Protocol (IP) based network(s). This parameter is defined and their target
    values specified assuming that the network and the network components are fully
    operational. Also, only point-to-point connections supporting basic call flows
    are considered in this release of the Recommendation.
