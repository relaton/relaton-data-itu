abstract:
- language: en
  script: Latn
  content: "Supplement 60 to ITU-T L-series Recommendations shows how a life cycle
    assessment (LCA) of an information and communication technology (ICT) good, such
    as a mobile phone, is performed by an ICT manufacturer, based on Recommendation
    ITU-T L.1410. \r\nFor compliance with ITU-T L.1410 all body text and annexes need
    to be considered when performing an LCA. The LCA presented in this Supplement
    is fully compliant with Recommendation ITU-T L.1410 as described in clause 6.2
    of that Recommendation, except for a few deviations listed in the 'Reporting'
    clause 5.12 of this Supplement.\r\n"
