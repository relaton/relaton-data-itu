  content: "Recommendation ITU-T M.3411 specifies the user identity and access management
    requirements for telecommunication management networks (TMNs). It mainly consists
    of the architecture and the functional requirements for identity and access management
    (IAM) in TMN, which include identity management functions and access management
    functions.\r\nThis Recommendation applies to the guidance of the design and development
    of IAM solutions for TMN.\r\n"
