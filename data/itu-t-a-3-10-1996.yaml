abstract:
- language: en
  script: Latn
  content: This author's Guide for preparing ITU-T texts (e.g. draft Recommendations)
    permits uniform, efficient preparation of texts by the TSB for publication. It
    covers the rules for drafting a Recommendation in a standard manner. Its provisions
    should be applied in all instances where texts (such as draft Recommendations)
    are being prepared by Study Group authors for approval and publication. The methods
    presented in this Guide are the basis for a template and will remain stable until
    changes to current text treatment procedures necessitate their modification.Recommendation
    A.1500 (Example of an ITU-T Recommendation)
