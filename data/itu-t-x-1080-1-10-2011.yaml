  content: This Recommendation defines a generic telecommunication protocol that supports
    interactions between a medical station local to a patient and a remote medical
    center providing greater expertise.It specifies a set of protocols, including
    security features that enable these interactions to take place.The protocol specification
    is generic, and can be supplemented by standards from other Standard Development
    Organizations.
