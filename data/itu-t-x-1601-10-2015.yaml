abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1601 describes the security framework for cloud
    computing. The Recommendation analyses security threats and challenges in the
    cloud computing environment, and describes security capabilities that could mitigate
    these threats and address security challenges. A framework methodology is provided
    for determining which of these security capabilities will require specification
    for mitigating security threats and addressing security challenges for cloud computing.
    Appendix I provides a mapping table on how a particular security threat or challenge
    is addressed by one or more corresponding security capabilities.\r\n"
