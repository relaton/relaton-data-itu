abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1198 specifies a virtual machine-based security
    platform for the renewable service and content protection (SCP) system. The virtual
    machine supports an abstract function of hardware devices. This Recommendation
    defines a common interface and functional logic in the Internet protocol television
    (IPTV) terminal device and includes the data structure of SCP client and system
    components for a terminal device such as an embedded SCP, media client and control
    client.
