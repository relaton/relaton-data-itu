abstract:
- language: en
  script: Latn
  content: This Recommendation describes the support of the Broadband Connectionless
    Data Bearer Service (BCDBS) by the B-ISDN. It describes the framework for network
    support of BCDBS and the protocols used at the user interface and network interface.This
    Recommendation relates to the direct provision of the BCDBS as defined in Recommendation
    I.211 using connectionless service functions. However, aspects of this Recommendation
    can be applied also to the indirect provision of the BCDBS.
