abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4231 provides requirements and capability framework
    of the Internet of things (IoT) for vision, a typical IoT for vision application
    workflow as well as some relevant IoT for vision use cases.\r\nWith the popularization
    and development of smart cities and numerous IoT based verticals, the connotation
    of the Internet of things (IoT) is expanding and is no longer limited to simple
    sensor data collection and discrimination. \r\nThe IoT for vision is one of the
    main development directions of the IoT which uses digital cameras and other types
    of sensors to perceive objects of interest (including human beings, vehicles,
    animals, etc.) for diverse applications based on appropriate analysis.\r\n"
