abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.2007 aligns with fundamental ITU-T documents for
    NGN, such as:- Supplement 7 to ITU-T Y-series Recommendations regarding NGN release
    2 scope;- Recommendation ITU-T Y.2201 on requirements and capabilities for ITU-T
    NGN;- Recommendation ITU-T Y.2012 dealing with functional requirements and architecture
    of NGN;- technical specifications (e.g., protocol related) identified as being
    part of NGN capability set 2.NGN capability set 2 includes all features of NGN
    capability set 1 (Recommendation ITU-T Y.2006) and features related to Internet
    protocol television (IPTV) basic services such as linear TV and video on demand
    services. Moreover, it provides a description of the network framework and protocols
    that have been standardized in ITU-T.
