abstract:
- language: en
  script: Latn
  content: 'This Recommendation provides requirements for the interworking and interconnection
    functions between public ATM and other types of public switched telephone networks
    (including wireless networks) for the transmission of speech, voiceband data and
    audio signals. The functions include: interfaces of TDM to ATM networks, TDM to
    ATM conversion, transport, multiplexing, switching and echo cancellation.'
