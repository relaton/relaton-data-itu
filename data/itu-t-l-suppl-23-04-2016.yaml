abstract:
- language: en
  script: Latn
  content: 'Supplement 23 to ITU-T L-series of Recommendations provides technical
    information about the use of microwave radio systems which are available for use
    in telecommunication networks for rural communications in developing countries.
    Example applications include: high-capacity backbone networks, synchronous digital
    hierarchy (SDH) network systems, and use in enterprise networks and mobile backhauls.
    The attractive features of microwave systems for rural communications in developing
    countries are: independence from geographical features, such as mountains and
    archipelagos; rapid system integration at a low cost; robustness against disasters;
    and security against human interference.'
