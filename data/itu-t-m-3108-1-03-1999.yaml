abstract:
- language: en
  script: Latn
  content: This Recommendation provides a GDMO-based information model to support
    the management of the leased circuit service as outlined in Recommendation M.3208.1.
    Appendix I provides a protocol-independent version of this information model in
    "structured" English. Appendix II provides a mapping from the management functions
    in Recommendation M.3208.1 to the Managed Objects defined in this Recommendation.
    Appendix III provides a Unified Modelling Language (UML) view of the same information
    model.
