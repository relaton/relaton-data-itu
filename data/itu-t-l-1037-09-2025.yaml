abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T L.1037 addresses the growing challenge of waste electrical
    and electronic equipment (WEEE) due to the rapid replacement and obsolescence
    of electrical and electronic equipment (EEE). As technological innovations accelerate,
    EEE products are replaced more frequently, contributing to a global surge in e-waste.
    The global E-waste Monitor 2024 reports that 62 million tonnes of e-waste were
    generated in 2022, a figure expected to reach 82 million tons by 2030. Despite
    this growth, only a small percentage of e-waste is properly collected and recycled,
    particularly in developing countries. Much of the waste is dismantled in informal
    sectors, where unsafe practices lead to environmental and health risks.\r\nThis
    Recommendation provides a comprehensive framework for the collection, transportation,
    storage, dismantling, valorization and final disposal of WEEE in a safe and environmentally
    sound manner, as well as for improving the valorization of WEEE in developing
    countries. It aims to improve recycling rates and resource recovery, particularly
    in developing countries, while supporting stakeholders in making environmentally
    conscious decisions and facilitating sustainable e-waste management. Additionally,
    the Recommendation contributes to creating a circular economy and increasing resource
    efficiency for EEE, particularly for information and communication technologies
    (ICTs), helping to harmonize global e-waste management practices. Encouraging
    traceability and well-defined classification systems facilitates more effective
    monitoring and sustainable management of e-waste.\r\n"
