abstract:
- language: en
  script: Latn
  content: "With the widespread use of mobile devices and applications, APPs have
    become a primary vector for malicious activities. The attackers gain users' trust
    by disguising a malicious APP as a legitimate one, to obtain economic benefits.
    For example, malicious APPs may be disguised as legitimate credit or shopping
    applications to deceive users for financial gain. To detect and prevent such malicious
    activities, traditional approaches rely on APP store reviews and alerts from security
    software installed in the mobile device. However, this solution faces several
    challenges. While APP store reviews can help block malicious applications, attackers
    continuously develop new techniques to evade detection and bypass APP store reviews.
    In addition, some malicious applications are distributed through third-party platforms
    where they entice users to download and install them. Mobile security software
    primarily focuses on detecting viruses and application vulnerabilities making
    it difficult to effectively identify malicious applications specifically designed
    to carry out malicious activities.\r\nMalicious applications on mobile devices
    typically operate through four stages: download, installation, execution and payment
    inducement. Each stage presents distinct risks.\r\nDuring the download and installation
    stage, malicious applications often disguise themselves as legitimate applications
    to evade detection by security software. They may also implant Trojans on the
    mobile device during this phase.\r\nIn the execution stage, these applications
    may steal user information through the implanted Trojans or trick users into voluntarily
    disclosing sensitive data by mimicking legitimate applications.\r\nIn the payment
    inducement stage, malicious applications often build trust by offering small rewards
    or profits through various schemes. Once user trust is established, they lure
    users into transferring money. In some cases, the deception is direct, for example,
    by masquerading as legitimate shopping applications to exploit unsuspecting users.\r\nThe
    entire process of detecting and preventing malicious activities is highly complex,
    requiring close coordination between mobile devices and applications. Recommendation
    ITU-T X.1130 analyses the characteristics and risks of malicious applications
    across multiple stages, including download, installation, execution and payment
    inducement, and provides a comprehensive technical solution for detecting and
    preventing malicious activities, based on the interactions between mobile devices
    and applications.\r\n"
