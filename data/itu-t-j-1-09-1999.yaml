abstract:
- language: en
  script: Latn
  content: This Recommendation points to a recommended glossary of terms, definitions
    and acronyms applicable to ITU texts on the transmission of television and sound-programme
    signals and of related data signals for purposes of contribution, primary distribution
    and secondary distribution, which have been compiled from ITU-T Recommendations
    of the J series and a selection from Recommendation N.1. The terminology covers,
    among other subjects, cable television and its related services.
