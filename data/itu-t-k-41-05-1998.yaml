  content: This Recommendation specifies test methods and levels for the resistibility
    test against surge overvoltages on internal interface lines within a telecom centre
    interconnecting the several system blocks. The tests simulate surge overvoltages
    caused by magnetic fields from lightning strokes in or near the telecom building.
