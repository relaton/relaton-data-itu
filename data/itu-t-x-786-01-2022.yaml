abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.786 establishes guidelines for implementation conformance
    statement (ICS) proformas for interface systems based on representational state
    transfer (REST). Recommendation ITU-T X.786 provides an overview and constructions
    for the open application programming interface (OpenAPI) specification (OAS),
    and provides several proformas (tables) for each OAS syntax component to be used
    in REST-based interfaces. Instructions on how to complete the columns in the conformance
    tables are also provided. Examples of REST-based interface ICSs are provided in
    appendices.
