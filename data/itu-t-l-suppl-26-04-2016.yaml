abstract:
- language: en
  script: Latn
  content: 'This Supplement presents a case study of assessment of the greenhouse
    gas emissions of a hybrid satellite and terrestrial broadband system over its
    life cycle. The goal of this assessment was to calculate the additional emissions
    of a hybrid satellite system assuming that an existing broadband system is present,
    which does not meet the European Digital Agenda rate of 30 Mbps. The GHG emissions
    model that was developed for the assessment was then used to identify those parts
    of the BATS system that would contribute the most to the GHG emissions, so that
    attention could be focussed on mitigating those emissions. The network is the
    subject of research and development and is aimed at providing 30 Mbps broadband
    services to rural or remote households in Europe. The proposed system lifetime
    is 2020-2035. The work was funded under the European Union 7th Framework Programme.
    This study was completed in 2014 by BATS (Broadband Access via integrated Terrestrial
    & Satellite systems) Project partners. '
