abstract:
- language: en
  script: Latn
  content: Sign language and lip-reading are two important application areas of video
    communication. For the successful transmission of the components of visual language,
    certain quality requirements must be met.This supplement is an application profile
    document that gives the background to the requirements and offers as well guidance
    on how these requirements can be met. The purpose of this supplement is not to
    propose new video coding schemes, but rather to indicate how current and future
    video coding schemes can be applied to these two areas of application, with good
    results.
