abstract:
- language: en
  script: Latn
  content: This Supplement to the Q series of ITU-T Recommendations contains a Technical
    Report that specifies the general aspects of AAL type 2 signalling requirements
    for the development of AAL type 2 signalling Capability Set 3 (CS-3). It shall
    be read in conjunction with TRQ.2400 [1] and TRQ.2401 [2] to realise the full
    set of requirements.This Supplement identifies what can be viewed as the capabilities
    for AAL type 2 signalling. In addition, it describes the essential features and
    models useful for the development of functional entity actions in support of AAL
    type 2 signalling.
