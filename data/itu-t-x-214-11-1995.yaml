abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard defines the service provided
    by the transport layer to the session layer at the boundary between the transport
    and session layers of the OSI reference model, which includes:a) the primitive
    actions and events of the service;b) the parameter data associated with each primitive
    action and event; andc) the relationship between, and the valid sequence of, these
    actions and events.
