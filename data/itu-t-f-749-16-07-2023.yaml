abstract:
- language: en
  script: Latn
  content: At present, logistics express delivery based on civilian unmanned aerial
    vehicles (CUAVs) is developing rapidly all over the world. Compared with general
    water transportation and land transportation, CUAV transportation has the advantages
    of low cost and flexible scheduling, and can make up for the shortcomings of traditional
    air transportation. It will change people's consumption mode. Recommendation ITU-T
    F.749.16 provides the requirements for the service system and management of CUAV
    logistics express delivery.
