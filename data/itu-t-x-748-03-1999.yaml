  content: This Recommendation | International Standard defines a systems management
    function which may be used by an application process in a centralized or decentralized
    environment to interact for the purposes of systems-management. It defines the
    response time monitoring function that consists of services, functional units,
    generic definitions and protocols. It is positioned in the OSI application layer.
