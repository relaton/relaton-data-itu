abstract:
- language: en
  script: Latn
  content: "Supplement 31 to ITU-T P-series Recommendations describes subjective methods
    to evaluate the quality experienced by end-users during audio-visual communication
    using videotelephony services. It includes both non-interactive subjective evaluation
    methods for one-way communication, and interactive subjective evaluation methods
    for two-way communication. The focus is on audio quality, video quality, audiovisual
    quality, interaction delay experience, media synchronization experience, and overall
    videotelephony quality perceived by end-users.\r\nThe subjective evaluation methods
    described in this Supplement were applied to construct the subjective test database
    required for the training and validation of the quality of experience (QoE) /
    quality of service (QoS) monitor model for videotelephony services recommended
    in Recommendation ITUT P.940. These subjective evaluation methods can also be
    used for purposes including, but not limited to, subjective quality evaluation
    of videotelephony services, comparison of quality on different devices or in different
    environments, and comparison of quality between different videotelephony services.\r\n"
