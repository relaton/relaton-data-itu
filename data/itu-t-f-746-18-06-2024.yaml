abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.746.18 specifies the functional requirements of
    interactive low-latency multimedia transmission system (ILMTS) over the Internet.
    It identifies the key functional requirements from the different aspects, such
    as service level, application level and management level. According to those requirements,
    this Recommendation also introduces a reference framework of ILMTS. Some use cases
    are described in the appendix.\r\nService providers who provide the interactive
    live content delivery service with low-latency media delivery can design a standardized
    real-time multimedia service system by following the requirements defined in this
    Recommendation.\r\n"
