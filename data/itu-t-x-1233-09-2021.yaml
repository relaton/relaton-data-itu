abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1233 establishes guidelines for instant messaging
    (IM) service providers (SPs) and users to counter spam over instant messaging
    (SPIM) and to reduce propagation of SPIM in cyberspace and improve the IM user
    experience.\r\nThis Recommendation analyses scenarios of SPIM generation in IM,
    specifies technical measures and mechanisms to counter SPIM for IM SPs, and establishes
    guidelines to counter SPIM for IM users.\r\n"
