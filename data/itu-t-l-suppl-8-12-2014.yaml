- language: en
  script: Latn
  content: Supplement 8 to the L series of Recommendations refers to the best practices
    defined in Recommendation ITU-T L.1300. More precisely, this Supplement first
    provides an introduction of potential for primary energy savings in TLC/ICT centres
    through the free cooling solution. Then, a probabilistic model for the inlet conditions
    is defined, and finally an analysis on room temperature and energy consumption
    is reported.
