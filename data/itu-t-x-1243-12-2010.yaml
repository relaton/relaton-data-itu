abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1243 specifies the interactive gateway system for
    countering spam as a technical means for countering inter-domain spam. The gateway
    system enables spam notification among different domains, and it prevents spam
    traffic from passing from one domain to another.In addition, this Recommendation
    specifies the architecture for the gateway system, describes basic entities, protocols
    and functions of the gateway system, and provides mechanisms for spam detection,
    information sharing and specific actions in the gateway system for countering
    spam.
