abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T A.8 provides working methods and procedures for approving
    draft new and revised ITU-T Recommendations using the alternative approval process.\r\nWhile
    this edition does not modify the alternative approval process, it:\r\n–Adds clarification
    on copyright clearance;\r\n–consolidates into ITU-T A.8 text concerning steps
    following updates to normative references during comment resolution (mirroring
    text from Recommendation ITU-T A.5);\r\n–streamlines the deadlines for availability
    of resolved drafts after comment resolution;\r\n–reinstates the provisions from
    Recommendation ITU-T A.8 (2008) which are more accurate concerning the deletion
    of Recommendations approved under AAP;\r\n–includes a redrawn Figure 1 to better
    illustrate the various steps of the AAP, with updates to the respective notes.\r\n"
