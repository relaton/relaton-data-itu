abstract:
- language: en
  script: Latn
  content: The purpose of this annex is to give guidance on tunnelling DSS1 over H.323
    networks. This annex requires ITU-T H.323 and ITU-T H.225.0 versions 4 or later.
    Version 4 products can be identified by H.225.0 messages containing a protocolIdentifier=
    {itu-t (0) recommendation (0) h (8) 2250 version (0) 4} and H.245 messages containing
    a protocolIdentifier= {itu-t (0) recommendation (0) h (8) 245 version (0) 7}.
