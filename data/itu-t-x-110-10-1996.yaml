abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the routing principles that should be applied
    for the establishment of packet-switched virtual calls or circuit switched calls
    when interconnecting public data networks. This Recommendation contains the guidelines
    which Administrations should follow with the aim of encouraging the spread of
    public data networks internationally and foster commonality of understanding leading
    to an orderly development of the international network, making effective and economical
    use of network resources.
