abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T D.50 recognizes the sovereign right of each State
    to regulate its telecommunications. It recommends that Administrations involved
    in the provision of international Internet connections negotiate and agree to
    bilateral commercial arrangements enabling direct international Internet connections
    that take into account the possible need for compensation between them for the
    value of elements such as traffic flow, number of routes, geographical coverage
    and cost of international transmission amongst others.
