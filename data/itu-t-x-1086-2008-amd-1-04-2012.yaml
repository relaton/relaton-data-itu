abstract:
- language: en
  script: Latn
  content: "Amendment 1 updates Recommendation ITU-T X.1086 to incorporate multiple
    biometric information in telebiometric protection procedures by modifying the
    summary, keywords, scope, references, definitions, abbreviations and acronyms,
    and bibliography.\r\nThe amendment defines new vulnerabilities and proposes guidelines
    for the protection of the multibiometric system at four different fusion levels:
    the sample-level, the feature-level, the score-level, and the decision-level.\r\nAmendment
    1 adds Appendix V to describe techniques to be applied for the protection of multibiometric
    data."
