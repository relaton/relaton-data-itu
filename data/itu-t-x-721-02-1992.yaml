    placed on other CCITT Recommendations | International Standards that make use
    of these definitions.\r\nThis Recommendation | International Standard is applicable
    to the development of OSI managed object class specifications and provides generic
    definitions that support OSI systems management functions. These definitions may
    also be used in other Recommendations | International Standards specifying object
    classes, attributes, notifications and action types.\r\n"
