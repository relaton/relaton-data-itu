abstract:
- language: en
  script: Latn
  content: Supplement 9 to the ITU-T L series of Recommendations refers to the best
    practices defined in Recommendation ITU-T L.1300. More precisely, this Supplement
    provides details of a case study related to the reduction of the energy spent
    for air conditioning through the use of optical fibre based thermometry. A general
    description of the temperature measurement is provided, then the optimization
    process for the air conditioning is highlighted. Finally, the results of temperature
    measurements made using optical fibre sensors are shown.
