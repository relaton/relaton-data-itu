abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1033 addresses security aspects of the information
    services provided by telecommunication operators. In the transformation from providing
    traditional basic telecommunication services to providing comprehensive information
    services, operators have expanded their services to include content services and
    information and communication technology (ICT). These new services not only change
    the operational models but they also add new security issues to be resolved.\r\nThis
    Recommendation provides guidelines on the security of the individual information
    services provided by telecommunication operators. The scope of this Recommendation
    covers the classification, security requirements, mechanisms and coordination
    of individual information services."
