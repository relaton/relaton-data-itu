abstract:
- language: en
  script: Latn
  content: Given the rapid multiplication and expansion of telecommunication services,
    there is a growing need for subscribers to those telecommunications services to
    be able to communicate with each other. In order to facilitate such intercommunications
    for the subscribers of the various services, operator assisted and public Directory
    Services will be required. The Service Definition in this Recommendation supports
    the provision of those Directory Services.
