abstract:
- language: en
  script: Latn
  content: "With the liberalization in telecommunications, unbundling becomes commonplace
    in telecommunication networks. The unbundling of the access network increases
    the number of operators that may provide services within a common access network
    cable. In this context, unbalance is not only related to the transmission performance
    of the services, but also strongly related to electromagnetic compatibility (EMC)
    performance of the services. The longitudinal conversion loss (LCL) of telecommunication
    lines or telecommunication ports is a measure of the degree of unwanted transverse
    signal produced at the terminals of the network due to the presence of a longitudinal
    signal on the connecting leads.\r\nConsidering the frequency range of broadband
    services such as integrated services digital network (ISDN), asymmetric digital
    subscriber line (ADSL), ADSL2, ADSL2plus, very high-speed digital subscriber line
    (VDSL) and VDSL2, Recommendation ITU-T K.86 presents the method for measuring
    longitudinal conversion loss for the frequency range from 9 kHz to 30 MHz and
    presents the suggestion of the admissible value for the unbundling condition."
