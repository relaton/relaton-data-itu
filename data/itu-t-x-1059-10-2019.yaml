abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1059 provides guidance for telecommunication organizations
    on the risk management of their assets globally accessible in IP-based networks,
    the assets which are exposed directly to hackers and attackers. These assets may
    also be connected to the traditional (and even old) assets of legacy telecommunication
    networks, which might have some design level vulnerabilities that could be difficult
    to fix. Therefore, it would be practical to consider all the assets globally accessible
    in IP-based networks (AGIT) of a telecommunication organization as a whole, and
    to introduce some specific security controls to continuously reduce the overall
    risks and to strengthen the overall security of telecommunication services and
    networks. \r\n\r\nIt is suggested that the proposed controls be applied with high
    priority to assets globally accessible in IP‑based networks. The controls might
    also be applicable to other assets.\r\n"
