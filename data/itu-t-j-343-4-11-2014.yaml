abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.343.4 provides Hybrid-reduced reference (Hybrid-RR)
    objective perceptual video quality measurement methods for HDTV and multimedia
    when a reduced reference signal and non encrypted bitstream data are available.
    The following list shows example applications that can use this Recommendation:
    \r\n•\tpotentially real-time, in-service quality monitoring at the head-end;\r\n•\tvideo
    television streams over cable/IPTV networks including those transmitted over the
    Internet using Internet protocol;\r\n•\tvideo quality monitoring at the receiver
    when a reduced reference signal and non-encrypted bitstream data are available;\r\n•\tvideo
    quality monitoring at measurement nodes located between point of transmission
    and point of reception when a reduced reference signal and non-encrypted bitstream
    data are available;\r\n•\tquality measurement for monitoring of a transmission
    system that utilizes video compression and decompression techniques, either a
    single pass or a concatenation of such techniques;\r\n•\tlab testing of video
    transmission systems.\r\nThis Recommendation includes an electronic attachment
    containing test vectors, including video sequences, bitstream files and predicted
    objective model scores.\r\n"
