abstract:
- language: en
  script: Latn
  content: "A digital twin is developed for specific purposes in domains such as manufacturing,
    transportation, energy and safety. It is suitable for providing functions and
    services for each domain, but functional expansion is required to provide services
    for smart sustainable cities and communities with multiple domains. Digital twin
    federation (DTF) is a combination of digital twin systems in various fields.\r\nA
    digital twin federation may face security threats such as a system denial of service,
    data tampering, distributed denial of service attacks, illegal data sharing, authority
    upgrading, etc. Sending illegal instructions or malicious codes to other digital
    twin systems through the DTF could seriously affect the security and operation
    of the DTF.\r\nTo ensure the security of a DTF, security threats and relevant
    security requirements specific to DTFs need to be analysed and security measures
    established.\r\nRecommendation ITU-T X.2013 identifies security threats specific
    to DTFs, analyses security requirements and thus establishes security measures
    for DTFs.\r\n"
