abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4504 describes the service framework in terms of
    prediction for intelligent Internet of things (IoT) services by reflecting the
    development of artificial intelligence (AI) technology and the requirements from
    the market. To do this, this Recommendation introduces the concept of service
    framework of prediction for intelligent IoT and the requirements. This Recommendation
    describes a functional architecture of service framework of prediction for intelligent
    IoT.\r\nAs the AI technology develops and begins to be applied to various fields,
    enhanced IoT services using AI technology are being developed. Machine learning,
    the core of the AI technology, has been mostly researched in the direction of
    increasing the accuracy of inference. To apply the AI technology to real fields
    and to provide intelligent IoT services, the AI services must be operated at a
    level that can be provided to customers effectively. It is needed to study the
    technologies to efficiently provide AI services by focusing on inference (prediction)
    rather than training (learning).\r\n"
