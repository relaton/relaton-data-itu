abstract:
- language: en
  script: Latn
  content: This Supplement contains objectives, scope, requirements, approaches, and
    introductory overview of Signalling and Protocol Framework for an Evolving Environment
    (SPFEE). It provides a signalling and protocol framework for an evolving environment
    [and related specification(s) where applicable] for those telecommunications-related
    systems in the coming broadband and information era.Primary area of SPFEE is Session
    related framework and specifications (e.g. interfaces provided for "clients" of
    Session related components and those required from them to the underlying components).
    SPFEE covers the control plane (signalling) aspects, with management plane aspects
    also included as a part of the problem domain.
