abstract:
- language: en
  script: Latn
  content: The nature of common public radio interface (CPRI) signals is such that
    they require special consideration when carried as a client signal over the ITU-T
    G.709 optical transport network (OTN). One consideration is the stringent frequency
    accuracy requirements for CPRI. Another consideration is that the native line
    coding of the CPRI signals can be transcoded into a more bandwidth efficient coding,
    which allows the carriage of additional CPRI client signals in some important
    applications. Supplement 56 to ITU-T G-series Recommendations describes alternatives
    for mapping and multiplexing CPRI client signals into the OTN. This Supplement
    relates to Recommendations ITU‑T G.872, ITU-T G.709/Y.1331, ITU-T G.798 and ITU-T
    G.959.1.
