  content: Supplement 16 to the ITU-T K-series Recommendations provides guidance on
    the radio frequency electromagnetic field (RF-EMF) compliance assessment considerations
    for the International Mobile Telecommunication system (IMT 2020) wireless networks
    also known as 5th generation of wireless networks (5G). Also, the 5G technical
    standards have been finalized and commercial 5G networks are now launched in many
    countries.
