abstract:
- language: en
  script: Latn
  content: This Recommendation provides a methodology for constructing multimedia
    services which is timely and responsive to the needs of both the End-User and
    Service Provider. This methodology is based on a modular approach using a set
    of network independent building blocks or other communications capabilities being
    developed within ITU-T.The methodology is intended for use in developing a series
    of General Service Recommendations which combine the required modular elements
    in order to build generic services.
