abstract:
- language: en
  script: Latn
  content: This supplement presents the overview of infrastructure in cities. Generally
    the city infrastructure can be classified as digital/ICT infrastructure and physical
    infrastructure. The intelligent improvement of physical infrastructure can be
    achieved through the widely adoption of information and communication technologies.
    In this sense, ICT acts as an enabler to construct Smart Sustainable Cities.  Consequently
    using ICTs in SSC results in cost and energy saving, increased economic growth,
    improved quality of life (QoL), and reduced environmental footprint.
