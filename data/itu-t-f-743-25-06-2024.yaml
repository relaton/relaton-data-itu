abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.743.21 provides a high-level overview of a data
    asset management framework with its corresponding objects, activities and supports.
    A standard multimedia data asset management procedure is needed in order to manage
    data assets effectively so that the value of multimedia data assets can be maintained
    and added. The procedures can help different enterprises to identify, recognize,
    share, exchange and apply multimedia data assets in a unified and standardized
    way.\r\nRecommendation ITU-T F.743.25 contains the procedures for the life cycle
    management of multimedia data assets. The procedures include multimedia data asset
    catalogue management, identification, registration, application, inventory check,
    change, assessment and disposal. It also provides the detailed requirements for
    each part of the procedures, and the use cases of how these processes can be applied
    are also provided in an appendix.\r\n"
