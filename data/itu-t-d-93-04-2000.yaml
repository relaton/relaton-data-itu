abstract:
- language: en
  script: Latn
  content: In this Recommendation adopted in Melbourne (1988), it is recommended that
    the same collection charge and accounting rate is used when an international call
    from a fixed network terminates at fixed networks or mobile networks. However,
    taking into account that the cost of terminating traffic on fixed networks and
    on mobile networks may differ, it is now proposed to revise these principles so
    that different charging and accounting may be introduced according to the nature
    of the terminating network.
