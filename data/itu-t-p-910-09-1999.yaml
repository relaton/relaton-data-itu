abstract:
- language: en
  script: Latn
  content: This Recommendation describes non-interactive subjective assessment methods
    for evaluating the one-way overall video quality for multimedia applications such
    as videoconferencing, storage and retrieval applications, tele-medical applications,
    etc. These methods can be used for several different purposes including, but not
    limited to, selection of algorithms, ranking of audiovisual system performance
    and evaluation of the quality level during and audiovisual connection. This Recommendation
    also outlines the characteristics of the source sequences to be used, like duration,
    kind of content, number of sequences, etc.
