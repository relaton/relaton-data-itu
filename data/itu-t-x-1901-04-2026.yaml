abstract:
- language: en
  script: Latn
  content: "Age-related eligibility decisions are required when a person must either
    be of a certain age, older or younger than a given age or be within an age range,
    where ages are counted in years and where these criteria are dependent upon the
    type of goods, content, services, venues or spaces provided. \r\nRecommendation
    ITU-T X.1901 addresses issues associated with inadequately defined age assurance
    processes and associated lack of trust in terms of functionality, performance,
    privacy, security and acceptability. This Recommendation establishes a framework
    for age assurance systems and describes their core characteristics, including
    privacy and security, for enabling age-related eligibility decisions. The aim
    of this Recommendation is to enable policy makers (such as governments, regulators
    or providers of age restricted goods, content, services, venues or spaces) to
    specify applicable types of age assurance systems and associated indicators of
    effectiveness in their policy requirements.\r\n"
