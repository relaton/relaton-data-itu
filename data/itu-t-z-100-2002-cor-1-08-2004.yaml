abstract:
- language: en
  script: Latn
  content: "This corrigendum describes a number of minor changes to ITU-T Rec. Z.100
    (08/2002) and to Amendment 1 to Z.100 (10/2003) to correct and clarify some minor
    issues in the main body of Z.100 and in Annex B.The changes are divided into three
    parts:\r• Changes to the main body (and Annex D) of Z.100 published in Z.100 (08/2002);\r•
    Replacement of Annex B.9;\r• Additions to Annex B.Each of the changes to the main
    body (and Annex D) of Z.100 is described with a heading stating if it is a clarification,
    deficiency correction, extension or modification (see Appendix II/Z.100) followed
    by the number of the heading in Z.100 for the text to be changed. In most cases
    the sub-division (Abstract grammar, Concrete grammar, Semantics or Model) in the
    Z.100 text is also given. The heading of each change concludes with a few descriptive
    words.The changes to Annex B are to add the legacy syntax for data type definitions,
    which had been overlooked in the first publication of that annex in Amendment
    1 to Z.100 (10/2003)."
