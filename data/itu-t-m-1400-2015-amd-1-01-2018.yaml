abstract:
- language: en
  script: Latn
  content: The 2016 edition of Recommendation ITU-T G.709 has introduced support for
    optical transport networks with rates beyond 100 Gb/s. This draft amendment augments
    clause 29 of Recommendation ITU-T M.1400 with new function codes for the corresponding
    Optical Data Units and Optical Transport Units. It also corrects a few editorial
    inconsistencies.
