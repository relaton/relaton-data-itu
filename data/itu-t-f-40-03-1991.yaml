abstract:
- language: en
  script: Latn
  content: "Administrations providing the international public telemessage service
    as a form of telecommunication in accordance with Article 4.3 c) of the International
    Telecommunication Regulations (Melbourne, 1988) should explicitly agree to this
    on the basis of this Recommendation, which contains the relevant operational provisions.\r\nThe
    international public telemessage service may operate in parallel with, or as an
    alternative to, the international public telegram service. The international public
    telemessage service shall provide the capability of operating in conjunction with
    the international public telegram service in those cases where it is used as an
    alternative to the international public telegram service.\r\nThe tariff principles
    for the international public telemessage service are laid down in Recommendation
    ITU-T D.45.\r\nWhile this Recommendation implies an implementation related to
    the long established message retransmission system defined in Recommendation ITU-T
    F.31 the telemessage service is not restricted to the F.31 based techniques.\r\n"
