abstract:
- language: en
  script: Latn
  content: "In the current in-force Recommendation ITU-T M.3160 “Generic, protocol-neutral
    management information model”, the top object and naming rules are not explicitly
    defined. It is not clear which class the protection group object class is derived
    from. Though it is thought that it may be derived from the Top, but it is not
    mentioned in M.3160. There are no operations to manage the objects defined in
    M.3160. \r\n\r\nAmendment 1 to Recommendation ITU-T M.3160  added the “Top” class
    definition, modified the “Protection Group” class definition by adding some figures
    and the protection switch operations."
