abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.780.3 describes the use cases and technical requirements
    of an ultra-high-definition (UHD) teleconsulting system. UHD teleconsulting system
    is an important application of UHD display technology and the information and
    communication technology (ICT) in the medical field, under the background of unbalanced
    medical resources, especially during the COVID-19 pandemic, which can realize
    the optimal allocation of medical resources and benefit people in areas with less
    developed medical resources.\r\nIt recommends the framework, functional requirements,
    and performance requirements of a UHD teleconsulting system which are the necessary
    hardware and software foundations for teleconsultation.\r\nFinally, the Recommendation
    also provides two application cases of the UHD teleconsulting system in Appendix
    I, including the roles of different participants, as well as the teleconsultation
    process.\r\nThis Recommendation is suitable for the development, construction,
    and evaluation of the UHD teleconsulting system in different countries and regions.\r\n"
