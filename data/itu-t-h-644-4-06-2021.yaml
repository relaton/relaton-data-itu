abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.644.4 specifies a functional architecture for mobile/multi-access
    edge computing (MEC) enabled content delivery network (MEC-CDN). The functions
    and functional blocks within this functional architecture and the related reference
    points are specified in this Recommendation for matching the requirements in Recommendation
    ITU-T F.743.10. Particularly, this Recommendation also provides the deployment
    of virtualized content delivery network (CDN) service and the interworking between
    virtualized CDN functionalities and MEC management system, within a MEC-CDN ecosystem.
    In addition, a containerized solution of MEC-CDN is given in this Recommendation,
    followed by the basic information flows. \r\n"
