abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.743.11 defines requirements for video surveillance
    with mobile premises units. Mobile premises units can effectively enhance the
    flexibility of surveillance perspectives, expand surveillance scenarios and the
    application scope of video surveillance technology. Meanwhile, since the current
    wireless communication technology can support the mobile wireless transmission
    of video or image data, the application of wireless communication technology to
    mobile premises units can greatly improve the flexibility of video surveillance
    and construct a comprehensive video surveillance system. This Recommendation describes
    the application scenarios and the requirements for video surveillance with mobile
    premises units.
