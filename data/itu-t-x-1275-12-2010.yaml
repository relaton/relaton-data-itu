abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1275 recognizes that radio frequency identification
    (RFID) technology renders information pertaining specifically to the merchandise
    worn or carried by individuals open to abuse even as it greatly facilitates access
    to and distribution of such information for useful purpose. The abuse can manifest
    as tracking the location of the individual or invasion of his or her privacy in
    another malfeasant manner. For this reason, this Recommendation provides guidelines
    regarding the RFID procedures that can be used to enjoy the benefits of RFID while
    attempting to protect personally identifiable information.
