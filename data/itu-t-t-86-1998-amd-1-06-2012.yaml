abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T T.86 | ISO/IEC 10918-4 provides for the unique registration
    of JPEG and SPIFF Profiles, SPIFF Tags, SPIFF colour Spaces, application-specific
    Markers, SPIFF Compression types and images registration authorities as defined
    in Rec. ITU-T T.81 | ISO/IEC 10918-1 and Rec. ITU-T T.84 | ISO/IEC 10918-3.\r\nNew
    Annex D contains a list of currently known application markers (APPn). The intended
    use of this list is to aid in the identification of APPn markers that are known
    to be commonly used."
