abstract:
- language: en
  script: Latn
  content: "Supplement 79 to ITU-T G-series Recommendations describes the latency
    control and deterministic capability of passive optical network (PON) systems.
    It reviews feasible technologies of latency control and optimization technologies
    over a PON and discusses possible future expansion on a PON system including use
    cases and requirements, technologies for latency control and deterministic improvement,
    and possible extensions in the future.\r\n"
