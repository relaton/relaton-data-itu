abstract:
- language: en
  script: Latn
  content: "The Internet Protocol version 6 (IPv6) is intended to provide many built-in
    benefits such as large address space, and self-configuration capabilities. Because
    it is a new protocol that is likely to be massively adopted in the coming years
    and operates differently than the Internet Protocol version 4 (IPv4), both foreseeable
    and unforeseeable security issues will arise. Many new functions or requirements
    of IPv6, i.e., automatic configuration of interfaces, multicast addressing for
    specific services, the ability to assign multiple IPv6 addresses to a given interface,
    and for the use of the ICMPv6 protocol as the cornerstone of the IPv6 protocol
    machinery (dynamic neighbour discovery, ICMPv6 Router Advertisement (RA) messages
    that convey configuration information so that IPv6 terminal devices can automatically
    access to the IPv6 network, etc.) can be identified. Although somewhat equivalent
    capabilities exist in IPv4 and have been exposed to security threats for quite
    some time, IPv6 implementation and operation differs from IPv4, at the risk of
    raising specific security issues.\r\nFrom that perspective, Recommendation ITU-T
    X.1037 provides a set of technical security guidelines for telecommunication organizations
    to deploy and operate IPv6 networks and services. The content of this Recommendation
    focuses on how to securely deploy network facilities for telecommunication organizations
    and how to ensure security operations for the IPv6 environment."
