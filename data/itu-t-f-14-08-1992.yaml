abstract:
- language: en
  script: Latn
  content: This Recommendation sets out the general procedures for the implementation
    of one-stop-shopping (OSS) arrangements associated with the customer provision
    of international telecommunication services. OSS may be defined as an optional
    arrangement for both customer and Administration whereby a single Administration
    (the coordinating Administration) provides and/or coordinates with other Administrations
    (the participating Administrations) the provision of one or more telecommunication
    services. It is designed to simplify for the customer the ordering, implementation
    and billing procedures currently undertaken by each Administration for the establishment
    and ongoing provision of international services.
