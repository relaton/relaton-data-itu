  content: The Call Waiting service is a supplementary service which permits a subscriber
    to be notified of an incoming  call (as per basic call procedures) with an indication
    that no interface information channel is available. The user then has the choice
    of accepting, rejecting or ignoring the waiting call (as per basic call procedures).
