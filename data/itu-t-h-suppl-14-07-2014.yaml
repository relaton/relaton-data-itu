abstract:
- language: en
  script: Latn
  content: "Gateway control protocols may require additional session description protocol
    (SDP) codepoints for specific interworking functions supported at bearer plane
    level beyond for example the SDP information used by call control protocols.\r\nSupplement
    14 to ITU-T H-series Recommendations summarizes SDP codepoints that have been
    identified in the time-frame from June 2000 to the date of approval of this Supplement.
    It identifies SDP codepoints that meet ITU-T H.248.x sub-series requirements for
    gateway control protocols and that are available for general use by the wider
    standards community.\r\nRelease 1 of this Supplement covers:\r\n–\tSDP codepoints
    for the ITU-T H.248 based control of transport layer security (TLS) and datagram
    transport layer security (DTLS) traffic in ITU-T H.248 media gateways.\r\n–\tPreliminary
    SDP codepoint information for stream control transmission protocol (SCTP) traffic
    [ITU-T H.248.SCTP].\r\nThis Supplement is used as a codepoint repository for the
    Internet Engineering Task Force (IETF) driven registration process of SDP codepoints
    with the Internet Assigned Numbers Authority (IANA).\r\n\a\r\n\a"
