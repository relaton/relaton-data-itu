  content: Recommendation ITU-T X.1092 provides an integrated framework to protect
    biometric data and private information in e-health and telemedicine. It defines
    a model of health services using telebiometrics for user identification and authentication.
    It identifies threats in transmitting various sensory data related to human health
    and provides countermeasures for secure transmission when applying the integrated
    framework.
