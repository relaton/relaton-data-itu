abstract:
- language: en
  script: Latn
  content: "Scope-objective\r\nThis Recommendation defines SDL (Specification and
    Description Language) intended for unambiguous specification and description of
    telecommunication systems. The scope of SDL is elaborated in clause 1. This Recommendation
    is a reference manual for the language.\r\nCoverage\r\nSDL has concepts for behaviour,
    data description and (particularly for larger systems) structuring. The basis
    of behaviour description is extended finite state machines communicating by messages.
    Data description is based on data types for values and objects. The basis for
    structuring is hierarchical decomposition and type hierarchies. These foundations
    of SDL are elaborated in the respective main clauses of this Recommendation. A
    distinctive feature of SDL is the graphical representation.\r\nApplications\r\nSDL
    is applicable within standard bodies and industry. The main applications areas
    for which SDL has been designed are stated in 1.2, but SDL is generally suitable
    for describing reactive systems. The range of application is from requirement
    description to implementation.\r\nStatus/Stability\r\nThis Recommendation is the
    complete language reference manual supported by guidelines for its usage in Supplement
    1. Annex F gives a formal definition of SDL semantics. The main text of this Recommendation
    is stable and needs to be issued immediately to meet market needs, but further
    study is required to complete Annex F. Appendix I records the status of ITU-T
    Rec.Z.100, and should be updated as further studies are completed. Although further
    language extensions are anticipated in the future, SDL 2000 as defined in this
    Recommendation should meet most user needs for some years. The current version
    is based on wide user experience of SDL and recent additional user needs.\r\nThe
    main text is accompanied by annexes:\r\n- Annex A   Index of non-terminals\r\n-
    Annex B   Reserved for future use (Annex B (03/93) is no longer valid)\r\n- Annex
    C   Reserved for future use (Annex C (03/93) is no longer in force)\r\n- Annex
    D   SDL predefined data\r\n- Annex E   Reserved for examples\r\n- Annex F   SDL
    Formal Definition (published separately)\r\n- Appendix I  Status of ITU-T Rec.
    Z.100, related documents and Recommendations\r\n- Appendix II  Guidelines for
    the maintenance of SDL\r\n- Appendix III  Systematic conversion of SDL-92 to SDL-2000\r\nITU-T
    Rec. Z.100 has also an independently published supplement:\r\n- Z.100 Supplement
    1 SDL+ methodology: use of MSC and SDL (with ASN.1)\r\nAssociated work\r\nOne
    method for SDL usage within standards is described in ITU-T Rec. Q.65. A recommended
    strategy for introducing a formal description technique like SDL in standards
    is available in ITU-T Rec. Z.110. For references to additional material on SDL,
    and information on industrial usage of SDL, see http://www.sdl-forum.org."
