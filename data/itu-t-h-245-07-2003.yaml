abstract:
- language: en
  script: Latn
  content: This Recommendation specifies syntax and semantics of terminal information
    messages as well as procedures to use them for in-band negotiation at the start
    of or during communication. The messages cover receiving and transmitting capabilities
    as well as mode preference from the receiving end, logical channel signalling,
    and Control & Indication. Acknowledged signalling procedures are specified to
    ensure reliable audiovisual and data communication.Products claiming compliance
    with Version 10 of H.245 shall comply with all of the mandatory requirements of
    this Recommendation. Version 10 products can be identified by H.245 TerminalCapabilitySet
    messages containing a protocolIdentifier value of {itu-t (0) recommendation (0)
    h (8) 245 version (0) 10}.
