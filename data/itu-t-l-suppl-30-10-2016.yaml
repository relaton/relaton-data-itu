abstract:
- language: en
  script: Latn
  content: 'This system “Cellular network with capacity transfer” has been developed
    taking into account  specific requirements for communications in rural and remote
    areas with the special attention to a low-cost of  all components of the system
    with low operating cost, low power consumption, very effective coverage zones
    and low requirements for maintenance of the system. The key benefit is achieved
    by relaying of the cellular air-interface in a frequency band other than standard
    cellular, which allows the substitution of significant part of the base station
    (BS) and microwave link (ML) or optical fiber links interconnecting them. '
