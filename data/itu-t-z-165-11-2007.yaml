abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation Z.165 provides the specification of the runtime interface
    for TTCN-3 (Testing and Test Control Notation 3) test system implementations.
    The TTCN-3 Runtime Interface provides the recommended adaptation for timing and
    communication of a test system to a particular processing platform and the system
    under test, respectively. This Recommendation defines the interface as a set of
    operations independent of target language.The interface is defined to be compatible
    with ITU-T Recommendation Z.161. This Recommendation uses the CORBA Interface
    Definition Language (IDL) to specify the TRI completely. Clauses 6 and 7 specify
    language mappings of the abstract specification to the target languages Java and
    ANSI-C. A summary of the IDL-based interface specification is provided in Annex
    A.
