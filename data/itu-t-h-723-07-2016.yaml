abstract:
- language: en
  script: Latn
  content: This Recommendation describes the functionalities of the mobile model IPTV
    terminal device (TD) for IPTV basic services defined in [ITU-T H.720]. This Recommendation
    describes the required aspects on requirements, capabilities, architecture, and
    interfaces of mobile model IPTV TD that can consume IPTV services irrespective
    of changes of the location or technical environment of mobile device. The meaning
    of the mobile model IPTV TD is that IPTV terminal function (ITF) is implemented
    on mobile devices such as smart phone, smart pad, and it is connected to IPTV
    service provider through wireless or mobile access networks. The quality of IPTV
    service depends on such parameters as network conditions, terminal capability,
    etc. The mobile model IPTV TD can access an IPTV service provider via wireless
    networks or mobile access network in the home as well as out of home environments.
