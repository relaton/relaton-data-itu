abstract:
- language: en
  script: Latn
  content: Amendment 1 to Recommendation ITU-T H.361 introduces three new annexes.Annex
    A describes the procedures of H.323 quality of service (QoS) signalling when RSVP-based
    QoS signalling is used in the transport plane. Resource reservation protocol (RSVP)
    is the QoS signalling protocol used in the integrated services (IntServ) architecture.
    RSVP is a path-based QoS mechanism which is used to reserve resources for both
    individual flows and flow aggregates. RSVP can be used in a pure IntServ architecture
    or can be coupled with differentiated services architecture (DiffServ) to provide
    IntServ operation over DiffServ network. Annex A describes the procedures for
    H.323 QoS to allow the use of RSVP in the transport plane.Annex B describes the
    procedures of H.323 QoS signalling under the differentiated services (DiffServ)
    architecture in the transport plane. DiffServ is a class-based QoS architecture
    which supports in-band signalling. The signalling occurs via a value defined in
    the differentiated services (DS) field of the IP header. This value is referred
    to as the differentiated services code point (DSCP). The packet forwarding treatment
    given to a packet in a network device is based on the DSCP value.Annex C describes
    the QoS service priority support signalling used for H.323 systems. The service
    priority mechanism defines procedures and constructs within the signalling plane
    that are used to prioritize bearer traffic during periods of resource contention.
    This allows traffic of higher priority to receive preferred QoS treatment.
