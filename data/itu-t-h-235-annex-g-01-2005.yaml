abstract:
- language: en
  script: Latn
  content: The purpose of Annex G to ITU-T Rec. H.235 is to provide recommendations
    of security procedures for H.323/H.235-based systems to use the IETF MIKEY key
    management protocol in conjunction with the IETF SRTP security protocol.This annex
    is written as a security profile of H.235 that is offered as an option and may
    complement the other media security features of H.235 (Annex B, Annex D.7).H.235
    Annex G enables deploying SRTP media security where the MIKEY key management supplies
    the necessary keys and security parameters among the involved endpoints end-to-end.
    Annex G can be deployed within a H.323 domain among H.235 Annex-G-enabled H.323
    systems. The annex defines the security protocol extensions to H.225.0 RAS and
    Call Signalling as well as H.245 along with the corresponding procedures. Furthermore,
    this annex provides the capabilities to support interworking with IETF SIP entities
    that have implemented the MIKEY key management and SRTP.
