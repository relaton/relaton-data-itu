abstract:
- language: en
  script: Latn
  content: This amendment to Rec. X.720 | ISO/IEC 10165-1 covers the generalization
    of terms so that these terms and concepts can be reused in the General Relationship
    Model (see Recommendation X.725). It is intended that the generalization in terms
    does not change the semantics in the Management Information Model (see Recommendation
    X.720). The general approach for the specified terms (characteristics, inheritance,
    hierarchy, multiple inheritance and specialization) is to remove the term "managed
    objet class" and use the more general term "class". It is beneficial if the General
    Relationship Model does not have different terminology for the same general concepts
    as the Management Information Model.
