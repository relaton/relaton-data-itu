abstract:
- language: en
  script: Latn
  content: The virtual trunk approach provides a mechanism in which pseudo wires function
    as trunks through which ATM switches can transparently establish and maintain
    virtual channel connections (VCCs) and virtual path connections (VPCs). The virtual
    trunk approach decouples control plane activity in the ATM and MPLS control planes,
    and pseudo wire setup or teardown is requested explicitly.
