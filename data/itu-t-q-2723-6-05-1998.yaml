abstract:
- language: en
  script: Latn
  content: "This Recommendation belongs to the set of Q.2723 series of ITU-T Recommendations
    that cover the support of additional traffic parameters through the Broadband
    Integrated Services digital network User Part (B-ISUP). \r\nThis Recommendation
    describes the B-ISUP support of the SBR 2 and SBR 3 ATM transfer capabilities
    defined in Recommendation ITU-T I.371 [1] and Annex A/Q.2961.6 [2]. It defines
    additional code points and procedures beyond the ones already specified by Recommendations
    ITU-T Q.2763, ITU-T Q.2723.1 and ITU-T Q.2723.2."
