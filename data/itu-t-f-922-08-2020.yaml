abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T F.922 establishes requirements for an information
    service system for visually impaired persons (ISS-VIPs), based on the mobile Internet,
    which connects visually impaired persons (VIPs) and volunteers. With the assistance
    of volunteers, the system enables VIPs to solve problems not yet handled by automatic
    assistive technology. The ISS-VIPs is constructed in client/server mode, enabling
    VIPs and volunteers to access it through their client software and to use its
    services or to provide its services to another person. The ISS-VIPs provides three
    kinds of service: image recognition; video assistance; and trip companion. The
    ISS-VIPs also supports the use of other software tools for assisting VIPs, so
    as to save valuable volunteer resources for service provision in person. While
    provision of services to VIP is the top priority, the ISS-VIPs can also be used
    by non-VIP with special service requirements.'
