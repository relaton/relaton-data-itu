abstract:
- language: en
  script: Latn
  content: "This Recommendation provides two sets of packages: syntactic and functional.
    The syntactic packages provide the ability to specify announcements with variable
    content, with a degree of flexibility constrained only by the provisioning of
    the MG and MGC. This syntax may in principle be used to specify multimedia announcements,
    although its application in this Recommendation is to evoke audio content. The
    functional packages provide advanced control of an Audio Resource Function using
    the H.248.1 protocol. The packages provide the ability to play recorded announcements
    with variable content, carry out prompted collection of digits, and carry out
    prompted collection of recorded audio. An additional package provides the ability
    to manage recorded media segments on the Media Gateway.Additional functionality
    incorporated by H.248.9 Revision 1:\r\n• 6.3.6.11 New variable type \"tone\" for
    dynamic audio segment specification.\r\n• 6.4 Set extension of basic syntax: introduction
    of a new selector for text attributes.\r\n• 6.5.5.1 Variable type \"Phrase\":
    introduction of subtypes.\r\n• 9.3.1 Signal PlayCollect: enhanced functionality,
    new parameters.NOTE - This Recommendation has been renumbered in 2002. It was
    formerly known as ITU-T Rec. H.248 Annex M.1."
