  content: Recommendation ITU-T X.783 provides guidelines for implementation conformance
    statement (ICS) proformas for web services-based interface systems. It provides
    an overview and constructions for the web service description language (WSDL),
    and provides several proformas (tables) for each WSDL component to be used in
    interfaces. Instructions on how to complete the columns in the conformance tables
    are also provided. Examples of web services interface ICSs are provided in appendices.
