abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.208 specifies methods for harmonization of integrated
    broadcast-broadband \r\n(IBB) systems or their application environment by identifying
    commonalities across IBB systems and \r\nmaximizing portability of IBB applications.
    \r\n\r\nRecommendations ITU-T J.207 and ITU-R BT.2075 provide guidance to IBB
    service providers on the \r\n\r\nselection of IBB systems for their use. In general,
    IBB systems comprise various hardware and \r\n\r\nsoftware components, and tailoring
    them for a specific IBB system leads to extensive development by \r\n\r\nmanufacturers.
    On the other hand, in order to deploy the services in a wider area, IBB service
    providers \r\n\r\nneed to develop their IBB applications for each IBB system if
    operators or broadcasters on which \r\n\r\nservice providers intend to deploy
    their services use a different IBB system to that on which the \r\n\r\nservices
    are originally deployed.  \r\n\r\nThus, it is beneficial for both IBB service
    providers and manufacturers of IBB capable reception \r\n\r\ndevices such as set-top
    boxes to harmonize IBB systems. Note that the use of companion devices is \r\n\r\nalready
    a part of IBB services. \r\n\r\nIn addition, information about the IBB application
    environment for the implementation of IBB \r\n\r\napplication software for other
    IBB systems is useful in the deployment of the same service on different \r\n\r\nIBB
    systems. \r\n"
