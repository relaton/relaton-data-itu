abstract:
- language: en
  script: Latn
  content: "This Recommendation provides audio performance requirements for portable
    digital cordless and mobile handsets and hands-free terminals. The requirements
    apply to narrow-band systems (3.1 kHz) regardless of the coding algorithm used
    in the terminal. Associated test methods are also given. Requirements are specified
    for the major electro-acoustic performance parameters affecting audio quality,
    including sending and receiving levels, frequency responses, noise, sidetone,
    stability, echo path and delay. The requirements given in the Recommendation should
    ensure satisfactory service quality in a high percentage of installations under
    normal conditions.Changes over the previous ITU-T Rec. P.313 (1999) are as follows:\r•
    Specifications for hands-free terminals have been added. These requirements are
    intended for mobile terminals in the car environment.\r• For handsets fitted with
    a volume control, the maximum weighted Terminal Coupling Loss (TCLw) requirement
    of handsets with a volume control has been established at not less than 40 dB
    for the higher gain settings above the nominal setting of the volume control.
    \r• The receiving mask for handsets has been slightly modified to align with other
    mobile standards.\r• Out-of-band singles requirement for handsets has been added.\r•
    The Sidetone Masking Rating (STMR) requirement is modified. The STMR range is
    increased from 10 dB to 18 dB, to a range of 10 dB to 20 dB. Testing methods for
    handsets have been updated.This revision provides, for the first time, an ITU
    standard for transmission characteristics of hands-free mobile terminals. Changes
    in the handset requirements should improve quality and increase usage with updated
    testing methods."
