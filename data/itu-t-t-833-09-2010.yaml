abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T T.833 is technically aligned with ISO/IEC 29199-3
    but is not published as identical text. It was drafted in collaboration with ISO/IEC
    JTC 1/SC 29/WG 1 (which is informally known as "JPEG").This Recommendation | International
    Standard is the Motion JPEG XR file format specification. The Motion JPEG XR file
    format is designed to contain one or more motion sequences of JPEG XR images,
    with their timing. The format is based on the ISO base media file format. It is
    intended as a 'building block', specifying only the video format. An application
    would be expected to combine Motion JPEG XR with suitable audio, metadata, etc.,
    for a complete application specification; that specification would normally select
    profiles and levels of Motion JPEG XR, and could also specify application profiles
    and levels that apply to the integration.Motion JPEG XR is expected to be used
    in a variety of applications, particularly where JPEG XR image coding technology
    is already available for other reasons, or where the high-quality frame-based
    approach, with no inter-frame coding, is appropriate.Motion JPEG XR is a flexible
    format, permitting a wide variety of usages, such as editing, display interchange,
    and streaming.
