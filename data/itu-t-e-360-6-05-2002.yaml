abstract:
- language: en
  script: Latn
  content: The E.360.x series of Recommendations describes, analyses, and recommends
    methods which control a network's response to traffic demands and other stimuli,
    such as link failures or node failures. The functions discussed and recommendations
    made related to traffic engineering (TE) are consistent with the definition given
    in the Framework document of the Traffic Engineering Working Group (TEWG) within
    the Internet Engineering Task Force (IETF):Internet Traffic Engineering is concerned
    with the performance optimization of operational networks. It encompasses the
    measurement, modelling, characterization, and control of Internet traffic, and
    the application of techniques to achieve specific performance objectives, including
    the reliable and expeditious movement of traffic through the network, the efficient
    utilization of network resources, and the planning of network capacity.The methods
    addressed in the E.360.x series include call and connection routing, QoS resource
    management, routing table management, dynamic transport routing, capacity management,
    and operational requirements. Some of the methods proposed herein are also addressed
    in, or are closely related to those proposed in ITU-T Recs E.170 to E.179 and
    E.350 to E.353 for routing, E.410 to E.419 for network management and E.490 to
    E.780 for other traffic engineering issues.The recommended methods are meant to
    apply to IP-based, ATM-based, and TDM-based networks, as well as the interworking
    between these network technologies. Essentially, all of the methods recommended
    are already widely applied in operational networks worldwide, particularly in
    PSTN networks employing TDM-based technology. However, these methods are shown
    to be extensible to packet-based technologies, that is, to IP-based and ATM-based
    technologies, and it is important that networks which evolve to employ these packet
    technologies have a sound foundation of methods to apply. Hence, it is the intent
    that the methods recommended in this series of Recommendations be used as a basis
    for requirements for specific methods, and, as needed, for protocol development
    in IP-based, ATM-based, and TDM-based networks to implement the methods.The methods
    encompassed in this Recommendation include traffic management through control
    of routing functions, which include QoS resource management. Results of analysis
    models are presented which illustrate the tradeoffs between various approaches.
    Based on the results of these studies, as well as established practice and experience,
    methods are recommended for consideration in network evolution to IP-based, ATM-based,
    and/or TDM-based technologies.
