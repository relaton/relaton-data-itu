abstract:
- language: en
  script: Latn
  content: This Recommendation provides a specification for the design of the Human-Machine
    Interface (HMI) for object browsers. An object browser allows a user to select
    an object from a group of objects and perform some required functions on that
    object. This specification is called a pattern. A software pattern is used by
    designers to generate templates and specific instantiations for products. Object
    browsing is one of a few generic tasks performed by operators of telecommunications
    networks across a wide range of network and service management applications.
