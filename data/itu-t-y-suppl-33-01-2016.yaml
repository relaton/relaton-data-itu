  content: This Supplement provides a methodology of making master plan of building
    smart sustainable cities (SSC), which will be interested by the municipalities
    and stakeholders. A general overview of the stages of SSC is presented. It provides
    a guide for the implementation of SSC based on intensive use of ICTs, and refers
    the reader to a series of thematic reports, that address the specific technical
    aspects involved in the design and operation of SSC strategies.
