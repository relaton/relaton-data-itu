abstract:
- language: en
  script: Latn
  content: This Recommendation describes characteristics and the construction of optical
    fibre cables for access networks. Such cables are required to have some additional
    performance characteristics (e.g., high fibre count, mid-span access) compared
    with cables for trunk systems. Characteristics, relevant to the appropriate performance
    of an optical access network cable, are described. Required conditions may differ
    according to the installation environment and, therefore, detailed conditions
    of experiments and tests need to be agreed between a user and a supplier on the
    basis of the environment where a cable is to be used.
