abstract:
- language: en
  script: Latn
  content: This T.89 Recommendation, "Application Profiles for Recommendation T.88",
    specifies application profiles of the JBIG2 coding scheme, defined in Recommendation
    T.88 | ISO/IEC 14492, for facsimile applications. The JBIG2 Recommendation specifies
    a collection of standard encoder/decoder components, referenced as a toolkit,
    that are used in generating and decoding JBIG2 conformant data streams. JBIG2
    has standardized seven profiles, and encourages definition of additional application
    profiles to satisfy further needs of various application environments.
