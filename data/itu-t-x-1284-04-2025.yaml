- language: en
  script: Latn
  content: "Recommendation ITU-T X.1284 presents an authentication framework based
    on one-time authentication key (AFOTAK) using distributed ledger technology (DLT).
    This Recommendation:\r\n•defines the one-time authentication key-based authentication
    framework and its authentication procedures;\r\n•specifies security requirements
    for the one-time authentication key-based authentication framework; \r\n•describes
    how the one-time authentication key is generated and verified; \r\n•identifies
    security threats, and \r\n•specifies security controls.\r\n"
