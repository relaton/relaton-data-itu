abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T X.1205 provides a definition for cybersecurity. This
    Recommendation provides a taxonomy of the security threats from an organization
    point of view. Cybersecurity threats and vulnerabilities including the most common
    hacker''s tools of the trade are presented. Threats are discussed at various network
    layers.Various cybersecurity technologies that are available to remedy the threats
    are discussed, including: routers, firewalls, antivirus protection, intrusion
    detection systems, intrusion protection systems, secure computing and audit and
    monitoring. Network protection principles, such as defence in depth, access management
    with application to cybersecurity are discussed. Risk management strategies and
    techniques are discussed including the value of training and education in protecting
    the network. Examples for securing various networks, based on the discussed technologies,
    are also discussed.'
