abstract:
- language: en
  script: Latn
  content: The operation of the "Telegram Retransmission System", described in Recommendation
    F.31, depends on the use of a standard format in telegrams. The format contains
    routing and other operational information in a heading part. This includes a four-letter
    "destination indicator", which is one of the key elements used for routing a telegram
    at switching centres in the origin country, and in any transit country(ies). They
    are also used for routing in the destination country. This Recommendation lays
    down the general principles applying to the selection of destination indicators,
    the allocation of the indicators' four letters, the application of analogous two-
    and four-letter codes for certain other purposes in operating the telegram service,
    procedures for changing or adding to code allocations and the timely promulgation
    of the information on codes to Recognized Operating Agencies (ROAs).
