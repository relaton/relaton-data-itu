  content: This Recommendation provides reference connections and network configurations
    for IP access networks for the provision of IP telephony and TCP/IP-supported
    data services such as web-browsing, e-mail, file transfer and high-speed data
    access. Other services such as video telephony, video-on-demand, are for further
    study. Also, only point-to-point reference connections are considered in this
    release of the Recommendation.
