abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1702 defines a generic functional architecture
    of a quantum entropy source, a common method to estimate and validate the entropy
    of a noise source under evaluation, and a common method to specify randomness
    extractors when they are part of the implemented system.\r\nIn contrast to the
    causal nature of classical physics, the inherently probabilistic nature of quantum
    physics is particularly suited to implement noise sources with an entropy that
    can be estimated based on information theory. However, there are currently no
    existing standards that explicitly distinguish between noise sources based on
    quantum physics and classical physics. This Recommendation is an add-on to existing
    noise or entropy source standards that allow specification of the noise source
    under evaluation based on quantum physics.\r\n"
