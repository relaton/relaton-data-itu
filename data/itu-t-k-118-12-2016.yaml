abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T G.9701 specifies a gigabit broadband access technology
    that exploits the existing infrastructure of wire pairs that were originally deployed
    for plain old telephone service (POTS) services. Equipment implementing this Recommendation
    can be deployed from fibre to the distribution point (FTTdp) located very near
    the customers’ premises.\r\nRecommendation ITU-T K.118 contains the necessary
    information to enable the protection of a distribution point (DP) node in the
    access network and the associated equipment in the customers' premises. It includes
    information on the resistibility requirements of the equipment, the rating of
    the lightning protection, when the installation of protection is necessary and
    on how to install this protection.\r\n"
