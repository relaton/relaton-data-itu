abstract:
- language: en
  script: Latn
  content: "Supplement 65 to the G-series Recommendations describesthe mathematical
    modelling and simulation analyses to support the developmentof ITU-T Recommendations
    on the transport of time over packet networks. Themain purpose of this Supplement
    is to document this work, as it forms thebasis for the requirements in the relevant
    Recommendations.\r\n\r\nBoth time-domain and frequency domain models and analysesare
    described.\r\n\r\nSince SyncE noise accumulation results are needed as an inputto
    the simulation of time error accumulation, models and simulation analysesfor SyncE
    noise generation and accumulation are also described. The modellingand simulation
    work described here is limited to steady-state behaviour,non-enhanced clocks,
    full-timing support from the network, and frequencyprovided by the physical layer
    by SyncE. Simulation cases that do not havethese limitations are for further study.\r\n"
