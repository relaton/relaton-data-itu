abstract:
- language: en
  script: Latn
  content: "This Supplement summarizes packages that have been standardized in the
    time-frame from June 2000 to August 2005. It identifies packages that meet H.248.x
    sub-series requirements for package definition and are for general use by the
    wider standards community.H.248.x sub-series packages guide - Release 7 provides
    for the:\r\n• identification of packages that are considered technically consistent
    with H.248.x sub-series principles and packages definition rules in clause 12/H.248.1;\r\n•
    identification of packages that are currently being worked upon;\r\n• identification
    of packages that have worked upon over a certain period of time;\r\n• identification
    of packages with overlapping functionality.Implementers are encouraged to review
    the packages in this Supplement before proposing new packages.\r\nRevision 7 contains
    the revision of packages in H.248.1 version 3 and new packages defined in H.248.36
    and H.248.37. It also contains an explicit indication of the version of the packages.
    New 3GPP and TISPAN packages are also recorded."
