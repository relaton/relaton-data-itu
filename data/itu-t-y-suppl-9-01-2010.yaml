abstract:
- language: en
  script: Latn
  content: Supplement 9 to ITU-T Y-series Recommendations describes the scenarios,
    use cases and benefits of multi-connection, in which a user equipment keeps more
    than one network connection simultaneously. Multi-connection brings a number of
    benefits compared to the single connections currently available. This supplement
    provides the basis for development of requirements and development of an architecture
    that supports multi-connection.
