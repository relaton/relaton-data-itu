abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3178 specifies a functional framework for network
    service provisioning based on artificial intelligence (AI) in future networks,
    including international mobile telecommunication-2020 (IMT-2020). This Recommendation
    addresses the following aspects:\r\n–\ta business role-based model for AI-based
    network service provisioning;\r\n–\thigh-level requirements for the roles and
    their interactions from an AI-based operational perspective;\r\n–\tfunctional
    components and their interactions for AI-based operations for network service
    provisioning.\r\n"
