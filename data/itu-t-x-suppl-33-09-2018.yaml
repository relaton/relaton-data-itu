abstract:
- language: en
  script: Latn
  content: This Supplement provides an overall technical framework and related best
    practices for countering telephone service scams. In the framework, entity functions
    and processing procedures are specified. The best practices cover those found
    to be the most effective in stopping known telephone service scam methods. In
    addition, this Supplement specifies the characteristics and sources of the telephone
    service scams and categorizes their main methods and relevant technical requirements
    according to the key technologies of the telephone service scam discovery, judgment
    and disposition.
