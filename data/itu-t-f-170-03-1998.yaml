abstract:
- language: en
  script: Latn
  content: In accordance with the general conditions of Recommendation F.160, this
    Recommendation describes an international public facsimile service between public
    bureaux, provided that terminals are compatibles or compatibility is ensured by
    the network from the standpoint of the characteristics specified in the relevant
    Recommendations and in accordance with bilateral or multilateral agreements. This
    service, known internationally as Bureaufax, may be provided by telecommunication
    Recognized Operating Agencies (ROA) or by postal Administrations.
