abstract:
- language: en
  script: Latn
  content: 'Objective: ITU-T Recommendation Z.109 defines a UML profile that maps
    to SDL-2000 semantics so that UML can be used in combination with SDL.Coverage:
    This Recommendation presents a definition of the UML-to-SDL-2000 mapping for use
    in the combination of SDL-2000 and UML.Application: The main area of application
    of this Recommendation is the specification of telecommunication systems. The
    combined use of SDL-2000 and UML permits a coherent way to specify the structure
    and behaviour of telecommunication systems, together with data.Status/stability:
    This Recommendation is the complete reference manual describing the UML to SDL-2000
    mapping for use in the combination of SDL-2000 and UML. It replaces the previous
    Rec. Z.109 that concerned an earlier version of UML and had a different style
    of profile description.Associated work: ITU-T Recommendations Z.100, Z.104, Z.105,
    Z.106 and Z.107 concerning the ITU-T Specification and Description Language (SDL-2000).'
