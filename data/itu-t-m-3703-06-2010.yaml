abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T M.3703 provides the requirements and analysis for
    one of the common management services - alarm management. The functional requirements
    for the alarm management interface include the management functions for alarm
    forwarding and filtering, clearing of alarms, storage and retrieval of alarms
    in/from the agent, configuration of alarms, alarm acknowledgement and alarm notification
    failure. In the analysis part, the detailed information model supporting the above
    functions across the management interface is provided.
