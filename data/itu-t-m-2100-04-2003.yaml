abstract:
- language: en
  script: Latn
  content: This Recommendation provides limits for bringing-into-service and maintenance
    of international multi-operator PDH paths which operate at or above the primary
    rate, and connections which operate below the primary rate. Error, timing and
    availability performance are considered. A method for deriving ES and SES from
    in-service measurement is given for all hierarchical levels. Sections are not
    covered by this Recommendation. BIS limits and maintenance procedures for radio
    sections are described in the relevant ITU-R Recommendations.
