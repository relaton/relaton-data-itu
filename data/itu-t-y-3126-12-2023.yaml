abstract:
- language: en
  script: Latn
  content: "Interworking capability is an essential function to support quality of
    service (QoS)-guaranteed data transmission across heterogeneous networks. The
    data transmission of deterministic communication services in local networks usually
    involves multiple technology domains. In order to provide an efficient QoS guarantee
    for deterministic communication services in heterogeneous technology domains,
    this Recommendation defines three types of interworking capability and specifies
    QoS assurance requirements, framework instances and operational procedures of
    interworking capabilities, based on the models defined in Recommendation ITU-T
    Y.3121.\r\n"
