abstract:
- language: en
  script: Latn
  content: "This Recommendation ITU-T P.915 describes non-interactive subjective assessment
    methods for evaluating the one-way overall video quality for three dimensional
    (3D) video applications such as 3D videoconferencing, and 3D cable television.
    These methods can be used for several different purposes including, but not limited
    to, selection of algorithms, ranking of system performance and evaluation of the
    quality level during a video connection. This Recommendation also outlines the
    characteristics of the source sequences to be used, like duration, kind of content,
    number of sequences, etc.\r\n\r\nDetails within this document are expected to
    change, based on experiments into how best to conduct 3DTV subjective tests."
