abstract:
- language: en
  script: Latn
  content: This Recommendation defines protocols between a server and a client in
    order to distribute sound and television programs by J.120, i.e. perform "webcasting",
    over a general IP network, which is a non-QoS guaranteed network where data error
    or packet losses may occur. The use of these protocols results in an improvement
    of quality.A scheme is provided wherein a quality report is sent from a client
    to the server, and the server performs optimum data distributions according to
    the client's report.This Recommendation defines the kinds of parameters that a
    client should report to the server, as well as a transmission protocol that is
    used for sending the report from the client to the server. This Recommendation
    also defines transmission of supporting parameters that are useful for the server
    to analyze the client's report.
