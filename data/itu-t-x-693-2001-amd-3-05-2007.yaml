abstract:
- language: en
  script: Latn
  content: Amendment 3 to ITU-T Rec. X.693 | ISO/IEC 8825-4 permits the use of left
    and right square brackets around XER encoding instructions (followed by the target
    list) in the XER encoding control section of an extended XER specification (provided
    in Amendment 1 to ITU-T Rec. X.693/Amd. 1| ISO/IEC 8825-4). This is provided to
    produce the same syntax as that used in PER (Packed Encoding Rules) encoding control
    sections, and for increased readability. It also corrects some defects identified
    against ITU-T Rec. X.693 | ISO/IEC 8825-4.
