abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T E.169.1 details the application of the ITU-T E.164
    Numbering Plan for the Universal International Freephone Numbers (UIFN) in the
    provisioning of International Freephone Service (IFS) as defined in Recommendation
    ITU-T E.152. It has been amended and refined in the light of experience gained
    by service providers and the UIFN Registrar since the inauguration of the UIFN
    in early 1997.\r\nThis Recommendation was previously numbered ITU-T E.169. It
    has been renumbered as ITU-T E.169.1, and forms part of the ITU-T 169.x-series
    Recommendations describing the numbering plans and assignment procedures for various
    international services.\r\n"
