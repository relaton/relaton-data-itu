abstract:
- language: en
  script: Latn
  content: "Keywords such as ultra-high-resolution content delivery, end-to-end access
    service proliferation, high-speed transmission, and broadband transmission are
    becoming the basic requirements that network providers who are responsible for
    data transmission and receive should be accommodated.\r\n\r\nIn particularly,
    as various IoT services, personal media, and cloud-based services become gradually
    common, there is a demand for the high data rate by subscribers’.\r\n\r\nCable
    networks are also undergoing various network evolution process to develop and
    apply technologies that satisfy the requirements of the service ecosystem.\r\n\r\nCurrently,
    cable broadcasting networks have limited upstream frequency bands that can transmit
    data.\r\n\r\nIn order to overcome these limitations and enable symmetric upstream
    and downstream transmission, we are developing in-band full-duplex (IFDX) transmission
    technology that enables simultaneous transmission and reception in the same band.\r\n"
