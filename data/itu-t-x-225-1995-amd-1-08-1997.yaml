abstract:
- language: en
  script: Latn
  content: This amendment is one of a set of amendments to the OSI upper-layers standards
    produced to facilitate the interconnection of information processing systems in
    an open environment where efficiency of communications is paramount. Such efficiencies
    include:a) reduction in the overhead needed to encode control information for
    use in bandwidth-limited environments (such as radio links) or processing-limited
    systems (such as switching systems);b) reduction in the delay to set up the association
    between the communicating applications so that data transfer can begin expeditiously;c)
    reduction in the support of unneeded functionality in certain environments where
    the communications requirements of the applications are limited.This amendment
    modifies the connection-oriented session protocol to support the "fast-associate"
    mechanism for establishing session and higher layer connections and also specifies
    the short-encoding and null-encoding protocol mechanisms. The fast-associate mechanism
    allows the exchange of an identifier, and associated parameters that allow establishment
    of the session and higher-layer connections (and associations) with any specified
    set of options. The short-encoding option provides alternative, and much smaller
    protocol control information for the most commonly occurring session protocol
    data units. The null-encoding option eliminates session protocol in the data transfer
    phase completely and can be selected when the session user has no requirements
    for orderly release of the session connection and no session layer addressing
    information needs to be exchanged. A special form of the fast-associate mechanism
    can be used indicating that the null-encoding will be used.[The null-encoding,
    and the special form of fast-associate (involving the short-connect SPDU) is specified
    in Recommendation X.225/Amd. 2.]
