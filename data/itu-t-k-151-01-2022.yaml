abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.151 provides guidelines for electrical safety and
    lightning protection requirements for medium voltage power electronic converter
    systems, which have medium voltage input with rated system voltages from 1 000
    V AC up to 36 kV AC and low voltage output with rated voltages up to ±400 V DC,
    used in information and communication technology (ICT) data centres, telecommunication
    centres, or other application environments.  With the development of big data
    and cloud computing technology, the quantity and total capacity of the data centres
    and telecommunication centres together with ICT equipment power densities are
    increasing rapidly. In this condition, it was found that the traditional power
    distribution equipment and power systems had the disadvantages of low energy efficiency,
    high energy consumption, high maintenance difficulties, and high costs in many
    existing data centres and telecommunication centres. In order to solve these problems,
    it is necessary to develop a new structure of a whole power system, which may
    be powered directly by medium voltage and based on power electronic conversion.
    From the perspective of electrical safety and lightning protection, there are
    lots of differences between the data centre and telecommunication centre powered
    by traditional low-voltage alternating current (AC) and that powered by medium
    voltage. This Recommendation focuses mainly on electrical insulation, partial
    discharge, electrical safety, resistibility and lightning surge protection. \r\n"
