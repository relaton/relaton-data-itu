abstract:
- language: en
  script: Latn
  content: "This Recommendation defines parameters that may be used in specifying
    and assessing the performance of speed, accuracy, dependability, and availability
    of packettransfer over a Label Switched Path on a Multi-Protocol Label Switching
    (MPLS) network. The defined parameters apply to end-to-end, point-to-point and
    multipoint-to-point LSP and to any MPLS domain that provides, or contributes to
    the provision of, packet transfer services.Two categories of MPLS networks are
    considered:\r\n1)    TE-LSP: Traffic Engineering Label Switched Path, or configured
    LSP. These are point-point paths.\r\n2)    LDP-based LSP: This includes point-to-point
    and multipoint to point LSPs."
