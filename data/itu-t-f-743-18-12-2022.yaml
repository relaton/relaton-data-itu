abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.743.18 specifies functional, performance and security
    requirements of IMT-2020 ultra-high definition (UHD) surveillance cameras, in
    order to ensure reliable UHD video transmission in IMT-2020. This Recommendation
    also specifies services for classification of IMT 2020 UHD surveillance, service
    level agreement ranking of IMT-2020 UHD surveillance and network requirements
    for IMT-2020 UHD video surveillance, which are very relevant to IMT 2020 surveillance
    scenarios, to meet the actual user's UHD video capture and transmission requirements.
    Recommendation ITU-T F.743.18 also describes typical use cases.
