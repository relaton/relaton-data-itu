abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T D.1041 offers policy and methodological principles
    for Member States interested in establishing transparent co-location access and
    service rates. Co-location is an important telecommunications wholesale service,
    essential to a competitive telecommunications landscape and a sustainable environment,
    as it eliminates the need for operators to buildout new or replicate existing
    infrastructure. A key component for encouraging co-location is the establishment
    of reasonable co-location access and service rates on the principles of fairness
    and equity. \r\n"
