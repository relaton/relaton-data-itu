abstract:
- language: en
  script: Latn
  content: This Recommendation contains a network element information model for managing
    MTP Level 2 and SAAL signalling links.This Recommendation reuses Recommendation
    Q.751.1 and allows the usage of one object model for both SAAL (Recommendation
    Q.2140) - and MTP Level 2 (Recommendation Q.703; dealing with its high-speed link
    appendix is for further study) - signalling links.Management of a mixed MTP network
    is for further study.
