abstract:
- language: en
  script: Latn
  content: Supplement 16 to the ITU-T K-series Recommendations provides guidance on
    the radio frequency‑electromagnetic field (RF-EMF) compliance assessment considerations
    for IMT‑2020 wireless networks also known as 5G. Given that the 5G technical standards
    have just been finalised and commercial 5G networks are not due to be launched
    before 2019-2020, the first version of this Supplement is mainly to address the
    computational assessment options and the assessments of trial networks.
