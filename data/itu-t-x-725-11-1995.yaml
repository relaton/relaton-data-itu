abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard provides a model for the definition,
    representation and management of relationships between resources and the notational
    "tools" for specifying these. In addition, the definitions of general management
    information that may be used in the representation of relationships are specified.
    Finally guidelines for the development of conformance statement proformas are
    provided. The capability afforded by this Recommendation | International Standard
    is important for those concerned with specifying a management information model.
