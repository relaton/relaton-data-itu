abstract:
- language: en
  script: Latn
  content: Recommendation X.805 defines a network security architecture for providing
    end-to-end network security. The architecture can be applied independently of
    the network's underlying technology to various kinds of networks where the end-to-end
    security is a concern. This Recommendation defines the general security-related
    architectural elements that are necessary for providing end-to-end security. The
    objective of this Recommendation is to serve as a foundation for developing the
    detailed recommendations for the end-to-end network security.
