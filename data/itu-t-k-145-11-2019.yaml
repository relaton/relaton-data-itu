abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T K.145 includes guidance on the protection of workers
    against radio frequency electromagnetic fields (RF-EMFs) exposure in their working
    environments. Radio frequency (RF) workers range from installation engineers and
    tower climbers to R&D personnel and laboratory testing engineers. All of these
    RF workers are exposed to stronger RF-EMF fields than the general public. There
    are also RF informed workers who have been provided with information on RF-EMF
    safe working practices for a site as well as all other workers who are regarded
    as members of the public for the purposes of RF-EMF exposure limits. This Recommendation
    provides minimum general safety guidance for telecommunication RF workers around
    the world.
