abstract:
- language: en
  script: Latn
  content: The design of network management user interfaces is critical for the successful
    operation of telecommunications networks. This Recommendation provides a set of
    guidelines for the design of Human-Computer Interfaces (HCI) for the management
    of telecommunications networks. The general body of human factors knowledge and
    practice is important to these designs. In addition, telecommunications network
    management user interfaces can benefit from the application of the additional
    design guidelines in this Recommendation.Annex A contains a number of important
    generic design principles selected from the HCI literature.Appendix I contains
    additional reference material.Appendix II contains a technical framework which
    relates these guidelines to the HCI reference model provided in Recommendation
    Z.352
