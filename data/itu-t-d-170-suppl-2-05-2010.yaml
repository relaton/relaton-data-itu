abstract:
- language: en
  script: Latn
  content: Supplement 2 to Recommendation ITU-T D.170 is intended to present guidelines
    for the process and proposition of dispute forms for international settlements.
    It may help to simplify and assist telecommunication carriers in proper and fast
    resolution of any kind of financial dispute. The exact nature of the dispute resolution
    should be agreed upon the bilateral arrangements between the carriers concerned.This
    supplement describes the whole process, details possible reasons and sources of
    financial disputes and advises how to investigate and handle them. This supplement
    is intended to provide carriers with information regarding possible procedures
    and example forms for use in the dispute resolution process. These processes may
    help save time and human labour, as well as improve bilateral business relations
    between partners.
