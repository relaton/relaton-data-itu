abstract:
- language: en
  script: Latn
  content: "The telebiometric multimodal model has been developed from two main sources
    that provide the solid foundation for the model. The first is a considerable body
    of theoretical work on systems, scale propinquity, hierarchies and modalities
    of interaction between a human being and the environment. The second comes from
    the specifications in the ISO/IEC 80000-series of quantities and units, for all
    known forms of measurement of the magnitude of physical interactions between a
    person and its environment.\r\n\r\nThe telebiometric multimodal model is not limited
    to consideration of purely physical interactions, but also recognizes behavioural
    interactions. Such interactions are currently not quantified by standard units.
    It also recognizes the importance of examining all possible interactions using
    the insights provided by a number of different fields of academic study. The model
    itself consists of a specification of a number of dimensions related to interactions
    in a set of specified modalities, in both directions, at various intensities,
    using the complete range of quantities and units specified in the ISO/IEC 80000-series.
    This provides a taxonomy of all possible interactions, which contains more than
    1600 combinations of measurement units, modalities and fields of study."
