abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.266.1 \"Conformance specification for ITU-T H.266
    versatile video coding\" specifies tests for (non-exhaustive) testing to verify
    whether bitstreams and decoders meet the normative requirements specified in Rec. ITUT H.266
    | ISO/IEC 23090-3 Versatile video coding (VVC). The bitstreams provided with this
    document correspond to the 04/2022 (V2) edition of Rec. ITU-T H.266. Relative
    to the previous first edition, this version adds bitstreams for the 12-bit and
    16-bit profiles that were added in the second edition of Rec. ITU-T H.266.\r\nThis
    Recommendation was developed collaboratively with ISO/IEC JTC 1, Information technology,
    Subcommittee SC 29, Coding of audio, picture, multimedia and hypermedia information,
    and corresponds with ISO/IEC 23090-15 as technically aligned twin text.\r\nThe
    conformance bitstreams needed for this Recommendation are available at: .\r\n"
