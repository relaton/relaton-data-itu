abstract:
- language: en
  script: Latn
  content: This Recommendation provides an architectural framework for support of
    Quality of Service (QoS) in packet networks. Central to the architectural framework
    is a set of generic network mechanisms (or QoS building blocks) for controlling
    the network service response to a service request, which can be specific to a
    network element, or for signalling between network elements, or for controlling
    and administering traffic across a network. Distributed across three logical planes
    (namely the Control Plane, Data Plane and Management Plane), the building blocks
    can be used in combination to form various approaches for delivering the satisfactory
    collective effect of varying service performance required by a range of applications,
    such as file transfer and multimedia conferencing.
