abstract:
- language: en
  script: Latn
  content: The introduction of third generation digital mobile systems known as FPLMTS,
    which are scheduled to start service around the year 2000 subject to market considerations,
    will result in mobile communication becoming available to mass markets for the
    purpose of global communication. This Recommendation defines the service objectives
    and principles for FPLMTS which will enable the development of FPLMTS into the
    future. These objectives and principles are produced to aid the intercommunication
    of services provided over both FPLMTS and the fixed telecommunication network
    and to provide guidance for further development of FPLMTS.
