abstract:
- language: en
  script: Latn
  content: "This Recommendation deals with lightning protection of the dedicated transformer
    for Radio Base Station (RBS). \r\n\r\nRBSs are usually powered by the local power
    utility with a dedicated power line operating at medium voltage (e.g., from 10kV
    to 20 kV). A dedicated transformer is installed at the RBS for transforming the
    medium voltage to low voltage (e.g., 380V or 240 V), which is then used to power
    the RBS.\r\n\r\nFrequently, the dedicated transformer is installed in a pole,
    and the associated overhead lines (medium and low voltage lines) have poor earthing
    conditions. Therefore, these transformers are exposed to lightning effects and,
    consequently, the power interruptions caused by lightning flashes can severely
    affect normal operations of the RBS. \r\n\r\nThe main objective of this Recommendation
    is to reduce risk of damage to RBS dedicated transformer  due to lightning flashes,
    which will improve the safety and reliability of the RBS itself and its related
    equipment.\r\n\r\nThis Recommendation includes the following features:\r\n\r\n1)
    \     Need of protection for dedicated transformer ;\r\n\r\n2)      Earthing and
    bonding of transformer and RBS; \r\n\r\n3)      Direct lightning protection for
    transformers;\r\n\r\n4)      Transformers insulation  requirements;\r\n\r\n5)
    \     MV/LV arresters and LV SPDs;\r\n\r\n6)      Protection of ancillary facilities.\r\n"
