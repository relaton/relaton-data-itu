abstract:
- language: en
  script: Latn
  content: Defines the requirements for an equipment to perform in-service monitoring
    of digital signals at bit rates of 2, 8, 34 and 140 Mbit/s using the frame alignment
    signal. Keywords - frame alignment signal monitoring; - frame analyser; - in-service
    monitoring; - measurement; - tester.PREAMBLE Section 1 applies to all four bit
    rates (2048, 8448, 34 368 and 139 264 kbit/s). Section 2 provides additional information
    applicable to 2048 kbit/s signals only.
