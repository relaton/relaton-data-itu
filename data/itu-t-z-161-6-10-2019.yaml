abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Z.161.6 defines the support of advance matching of
    Testing and Test Control Notation-3 (TTCN-3). TTCN-3 can be used for the specification
    of all types of reactive system tests over a variety of communication ports. Typical
    areas of application are protocol testing (including mobile and Internet protocols),
    service testing (including supplementary services), module testing, testing of
    Object Management Group (OMG) Common Object Request Broker Architecture (CORBA)
    based platforms, application programming interfaces (APIs), etc. TTCN-3 is not
    restricted to conformance testing and can be used for many other kinds of testing
    including interoperability, robustness, regression, system and integration testing.
    The specification of test suites for physical layer protocols is outside the scope
    of this Recommendation.\r\n\r\nTTCN-3 packages are intended to define additional
    TTCN-3 concepts, which are not mandatory as concepts in the TTCN-3 core language,
    but which are optional as part of a package which is suited for dedicated applications
    and/or usages of TTCN-3.\r\n\r\nWhile the design of TTCN-3 package has taken into
    account the consistency of a combined usage of the core language with a number
    of packages, the concrete usages of and guidelines for this package in combination
    with other packages is outside the scope of this Recommendation."
