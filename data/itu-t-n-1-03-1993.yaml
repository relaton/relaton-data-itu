abstract:
- language: en
  script: Latn
  content: "This Recommendation identifies the international call routing principles
    and guidance in the user plane for the restricted short-term UPT service scenario,
    the basic UPT service scenario and the beginnings of the enhanced UPT service
    scenario which are applicable to UPT InCalls, UPT OutCalls and UPT to UPT calls.\r\nThis
    Recommendation is intended to enable early implementations without providing exhaustive
    or restrictive lists of implementations."
