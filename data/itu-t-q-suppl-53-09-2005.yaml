abstract:
- language: en
  script: Latn
  content: This Supplement is an information document intended to identify the signalling
    requirements required to support the International Emergency Preference Scheme
    (IEPS). IEPS is described in ITU-T Rec. E.106 and allows authorized users to have
    access to the International Telephone Service while the service is restricted
    due to damage, congestion, and/or other faults. IEPS capabilities provide authorized
    users with preferential call and connection handling.
