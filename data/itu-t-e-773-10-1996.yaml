  content: This Recommendation introduces the Grade of Service (GOS) concept for both
    satellite- and terrestrial-based maritime and aeronautical mobile systems. This
    Recommendation confines initially the GOS concept to circuit-switched user plane
    traffic. Signalling traffic issues associated with the user plane traffic are
    covered under separate Recommendations.
