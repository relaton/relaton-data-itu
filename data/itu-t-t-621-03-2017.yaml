abstract:
- language: en
  script: Latn
  content: This Recommendation defines an interactive mobile comic and animation file
    structure used for organization and storage of mobile animation contents. It consists
    of a header, a resource file list, an asset list, an index of all movies and a
    movie list that contains animation and interactive attributes. This Recommendation
    can be used as a guideline for creation, processing, transmission and play of
    mobile animation contents.
