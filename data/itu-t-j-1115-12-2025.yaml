abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.1115 describes the functional requirements of IP-based
    smart digital audio services. To provide IP-based smart digital audio services
    over broadcasting networks, several functional requirements need to be considered:
    transmission and coding efficiency, bit rates, IPbased transport packaging for
    interoperability with diverse networks, scheduling, metadata services and auxiliary
    services.\r\nThis Recommendation is Part 2 of a multi-part deliverable composed
    of the following three parts:\r\nPart 1: General requirements for IP-based smart
    digital audio services (published as ITU-T J.1114);\r\nPart 2: Functional requirements
    for IP-based smart digital audio services;\r\nPart 3: Specifications for IP-based
    smart digital audio services (to be published as ITU-T J.1116).\r\n"
