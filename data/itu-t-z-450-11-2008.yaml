abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Z.450 provides guidelines on the quality aspects
    of protocol-related ITU-T Recommendations with the objective of:\r\n  1) improving
    the quality of protocol-related Recommendations; and\r\n  2) helping to improve
    the interoperability of products based on these Recommendations.\r\nIn order to
    encourage the widest possible use of ITU-T protocol-related Recommendations, it
    is important that these Recommendations are of the highest possible quality. Several
    aspects of quality that play an important role for the users of these ITU-T Recommendations
    have been selected for this purpose. These are: readability, completeness, correctness,
    consistency, unambiguity, implementability and testability.\r\nAnnex A contains
    a quality checklist to identify the level of compliance of a Recommendation with
    the quality aspects."
