abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.511 provides guidance for the use of directory
    services to support tag\x1Ebased identification applications by reference to the
    directory capabilities specified in the ITU\x1ET X.500 series of Recommendations
    | ISO/IEC 9594 (all parts), and in the lightweight directory access protocol (LDAP)
    specifications as developed within Internet Engineering Task Force (IETF). A tag
    is also called an automatic identification and data capture (AIDC) media. It holds
    an identifier that identifies the item to which the AIDC media is affixed or associated.
    The directory may be used to store information associated with the AIDC media.\r\nThis
    Recommendation identifies two cases: one case is where the identifier is used
    as a whole to access a centralized directory, and the other case is where the
    structure of the identifier is explored to access distributed directory systems,
    when it is not feasible for a specific environment to hold all relevant information
    in a single directory. In the latter situation the top-level information could
    be held by some types of independent service providers, while the company and/or
    item-related information may be held by the information owner.\r\nThe primary
    focus is on radio frequency identification (RFID) tags as specified in the GS1
    EPCglobal specifications and in ISO and ISO/IEC International Standards."
