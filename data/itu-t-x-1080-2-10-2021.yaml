abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1080.2 defines a general protocol for the exchange
    of biometric information from a patient facility to a medical expert facility
    so that a medical centre could remotely monitor a patient and retrieve information
    from that patient. It also allows the medical expert facility to control the sensors
    and other devices at the patient facility and to establish the environment for
    a monitor session at the patient facility. It defines a versatile and open-ended
    information model that allows any type of medical and non-medical information
    to be transferred. This Recommendation is a biosignal communication protocol between
    computing devices and biological systems. This protocol is based upon an aggregation
    of the interactions between a computing device and the biological system. Biometric
    interactions are described using the telebiometric multimodal model as defined
    by Recommendation ITU-T X.1081, which is a three-layer model combining the science,
    sensor and metric layers. It is a horizontal market protocol designed to be used
    for all IoT biometric metric applications, for example, in the aerospace, medical,
    automotive, industrial and consumer markets. In the case of clinical medical trials,
    this protocol enriches the application with a versatile and open-ended information
    model filled with interaction descriptions thereby ensuring an accurate comparison
    of measurement processes. \r\n"
