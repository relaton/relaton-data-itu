abstract:
- language: en
  script: Latn
  content: ITU-T Recs M.3050.x series contain a reference framework for categorizing
    the business activities that a service provider will use. The Enhanced Telecom
    Operations Map (or eTOM for short), which has been developed by the TeleManagement
    Forum, describes the enterprise processes required by a service provider and analyse
    them to different levels of detail according to their significance and priority
    for the business. This business process approach has built on the concepts of
    Management Services and Functions in order to develop a framework for categorizing
    all the business activities.This Supplement provides a definition of the taxonomy
    of B2B Transactions called the eTOM Public B2B Business Operations Map (ePBOM)
    and provides a taxonomy/content for the ICT industry equivalent to the RosettaNet
    Business Operations Map (BOM), and the proposed ebXML Repository
