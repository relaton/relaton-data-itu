abstract:
- language: en
  script: Latn
  content: This Supplement is an "information" document and is intended as a roadmap
    and a source of references for documents related to IMT-2000 specifications from
    ITU-T as well as from sources outside the ITU (e.g. 3GPPs and SDOs.) The list
    of documents contained in this Supplement should therefore be treated as "bibliographic"
    references. The scope includes any relevant standards that are targeted toward
    the specification of IMT-2000 systems. NOTE - This version of this Supplement
    (Issue 2) includes information up to November, 2000 whereas the previous version
    (Issue 1) included information up to February, 2000. Clause 7 has been substantially
    extended and Clauses 8 and 9 have been revised and updated. Updates will be reflected
    in future versions.
