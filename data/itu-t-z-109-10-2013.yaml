abstract:
- language: en
  script: Latn
  content: "Objective: Recommendation ITU\x1ET Z.109 defines a unified modeling language
    (UML) profile that maps to SDL\x1E2010 semantics so that UML is able to be used
    in combination with the ITU\x1ET Specification and Description Language. Appendix
    I includes an (informative) Example language specification for a concrete grammar
    and its mapping to the UML profile.\r\nCoverage: This Recommendation presents
    a definition of the UML\x1Eto\x1ESDL\x1E2010 mapping for use in the combination
    of SDL\x1E2010 and UML.\r\nApplication: The main area of application of this Recommendation
    is the specification of telecommunication systems. The combined use of SDL\x1E2010
    and UML permits a coherent way to specify the structure and behaviour of telecommunication
    systems, together with data. \r\nStatus/Stability: This Recommendation is the
    complete reference manual describing the UML to SDL\x1E2010 mapping for use in
    the combination of SDL\x1E2010 and UML. It replaces the previous Recommendation ITU\x1ET
    Z.109 that concerned earlier versions of UML and Specification and Description
    Language.\r\nAssociated work: Recommendations ITU\x1ET Z.100, ITU\x1ET Z.101,
    ITU\x1ET Z.102, ITU\x1ET Z.103, ITU\x1ET Z.104 and ITU\x1ET Z.107 concerning the
    ITU\x1ET Specification and Description Language 2010 (SDL\x1E2010)."
