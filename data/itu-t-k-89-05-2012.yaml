abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.89 gives the methodology for evaluating the need
    to protect users of telecommunication equipment in structures and that of building
    occupants related to the telecommunication installation.\r\nThis method is based
    on a risk assessment: protection measures are necessary when the risk is greater
    than the tolerable risk. A maximum value of the tolerable risk is suggested.\r\nThe
    risk is evaluated using the lightning risk components which can be a source of
    injury to telecommunication service users and building occupants (lightning flashes
    direct to the line or to the structures connected at the ends of the line).\r\nThe
    risk assessment is done according to Edition 2 of IEC 62305-2. A simple risk assessment
    is provided to enable the telecommunication network operator to decide when to
    install gas discharge tubes (GDTs) at the point of entry of the telecommunication
    line into the structure independent of the structure attributes. This Recommendation
    can be used together with Recommendation ITU T K.47, which provides a more accurate
    risk assessment of lightning flashes directly to the telecommunication line, and
    IEC 62305 2, which provides the risk assessment of lightning flashes to the structure.\r\n"
