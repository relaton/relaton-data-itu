abstract:
- language: en
  script: Latn
  content: "Supplement 2 to ITU-T H-series Recommendations summarizes packages that
    have been standardized in the time-frame from June 2000 to November 2009. It identifies
    packages that meet ITU-T H.248.x sub-series requirements for package definition
    and are for general use by the wider standards community.H.248.x sub-series packages
    guide - Release 13 provides for the:\r• identification of packages that are considered
    technically consistent with ITU-T H.248.x sub-series principles and packages definition
    rules in clause 12 of Recommendation ITU-T H.248.1;\r• identification of packages
    that are currently being worked upon;\r• identification of packages that have
    been worked upon over a certain period of time;\r• identification of packages
    with overlapping functionality.Implementors are encouraged to review the packages
    in this supplement before proposing new packages.Release 13 contains:\r• New packages
    defined in Recommendations ITU-T H.248.9, ITU-T H.248.64, ITU-T H.248.71 and ITU-T
    H.248.74.\r• Revised packages defined in Recommendation ITU-T H.248.1 v3.\r• References
    to new work items: Recommendations ITU-T H.248.SRTP and ITU-T H.248.FILTER."
