abstract:
- language: en
  script: Latn
  content: This supplement proposes an integrated management solution for smart sustainable
    cities (IMSSC). With IMSSC, the sensors, nodes, and models can function in an
    organized way. As a result, when emergency events occur, the data, models and
    other resources needed can be rapidly discovered and acquired. To achieve the
    goal of making a city smarter and more sustainable, the first step is to analyse
    real-time processes and understand event patterns through event modeling. Additional
    capabilities, in terms of processing units, application units, as well as models,
    might be needed. The second step is to fuse processing so that different sources
    of observation can be combined together to compensate their own deficiencies and
    attain the goal more efficiently. Finally, services for information resource publishing
    and sharing as well as result fusing are also necessary to disseminate information
    across the concerned agencies. By adopting the integrated management system, each
    city can make a big step towards the implementation of the smart sustainable city
    vision.
