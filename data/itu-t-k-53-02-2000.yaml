abstract:
- language: en
  script: Latn
  content: This Recommendation gives permissible voltages on a telecommunications
    line caused by influence from a nearby a.c. power or railway plant during normal
    operation and fault condition. These values set the maximum permissible voltages
    and durations that a.c. power and railway operators are allowed to cause by any
    type of electromagnetic coupling on a telecommunications line without being responsible
    for mitigation measures.
