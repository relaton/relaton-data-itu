abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1252 defines of key terms used in identity management
    (IdM). The terms are drawn from many sources, but all are believed to be in common
    use in IdM work. Recommendation ITU-T X.1252 is not intended to be a huge compendium
    of IdM-related terms. Instead, the terms defined here are limited to those considered
    to constitute a baseline list of the most important and commonly-used IdM-specific
    terms. Recommendation ITU-T X.1252 includes an annex that explains the rationale
    for some of these key terms. One of the main objectives of Recommendation ITU-T
    X.1252 is to promote a common understanding of these terms among the groups currently
    developing (or planning to develop) IdM-related standards. The definitions are
    constructed so that, as far as possible, they are independent of implementations
    or specific context and, therefore, should be suitable as baseline definitions
    for any IdM work. It is acknowledged that, in some instances and contexts, greater
    detail may be required for a particular term, in which case, elaboration of the
    baseline definition may be considered. \r\n"
