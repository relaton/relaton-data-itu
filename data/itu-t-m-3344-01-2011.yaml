abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T M.3344 contains the requirements and analysis for
    appointment management for the business-to-business and customer-to-business interfaces
    in support of NGN. Appointment management covers appointment processes for managing
    the establishment of a mutually acceptable appointment time between the service
    provider (SP) and the service customer (SC). Appointment management is needed
    for handling visits to shared facilities or customer facilities: for example,
    to access customer premises, locked engineering or other facilities, or for joint
    testing between two enterprises. Appointment management can be used in either
    the service provisioning or the service assurance process.The requirements and
    analysis are provided using the management interface specification methodology
    described in Recommendation ITU-T M.3020.'
