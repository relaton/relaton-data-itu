  content: This Recommendation provides OSI protocol profile testing methodology based
    on the protocol testing methodology specified in Recommendation X.291. This Recommendation
    describes the meaning of conformance to a profile, the method of expressing profile
    conformance requirements, and profile testing principles which are based on the
    methodology defined for the base protocol specifications. The text was developed
    jointly with ISO/IEC JTC1.
