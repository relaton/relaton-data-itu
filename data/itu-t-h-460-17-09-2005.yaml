abstract:
- language: en
  script: Latn
  content: 'The current version of ITU-T Rec. H.323 requires two completely independent
    transports: one for RAS and another for H.225.0 call signalling. For several reasons,
    one of them is FW/NAT traversal; it would be advantageous to be able to use the
    same transport for both protocols. This Recommendation defines the mechanism of
    encapsulating RAS messages inside H.225.0 messages and the method for discovering
    the ability of a peer H.323 entity to support features defined in this Recommendation.'
