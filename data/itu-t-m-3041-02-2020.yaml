abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T M.3041 introduces a framework of smart operation,
    management and maintenance (SOMM). In this Recommendation, characteristics, scenarios
    and the functional architecture of SOMM are provided to support service operation,
    network management and infrastructure maintenance for both traditional non software-defined
    networking/network function virtualization (non-SDN/VFN), and SDN/NFV aware networks.
    This Recommendation also describes the relationship of the functional architecture
    of SOMM with the logical layered architecture (LLA) of a telecommunications management
    network (TMN).
