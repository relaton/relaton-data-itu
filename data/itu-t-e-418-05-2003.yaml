abstract:
- language: en
  script: Latn
  content: This Recommendation lays down a framework for supporting and defining the
    role of network management for IMT-2000 networks. IMT-2000 networks consist of
    various network elements and telecommunication technologies such as wireless and
    IP-based services. It is intended to give some guidance to identify data that
    is needed to check the status/performance of networks, especially IMT-2000 networks.Network
    management requires real-time monitoring of current network status and performance
    and the ability to take prompt action to control the performance and resources
    of the network when necessary. It should be noted that the complete range of network
    status and performance parameters are not necessary for the introduction of a
    network management capability.
