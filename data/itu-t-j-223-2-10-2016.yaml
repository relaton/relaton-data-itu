abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T J.223.2 defines the system architecture, functional
    modules within the cabinet data over cable service interface specification (C-DOCSIS)
    system, three C-DOCSIS systems utilizing the functional modules and the data and
    control interfaces between these modules for each system. It also defines general
    device requirements for the three C-DOCSIS systems. With a C-DOCSIS system, the
    modules that perform the physical layer and data link layer functions can be deployed
    in the optical nodes of the hybrid fibre and coaxial (HFC) cable network. This
    Recommendation is technically identical to the ETSI ES 203 312 standard.
