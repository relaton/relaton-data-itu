abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.740.9 specifies the requirements and the Internet
    protocol television (IPTV) functional architecture for enabling virtual reality
    (VR) services. As presented in this Recommendation, VR services are integrated
    into IPTV services using two approaches: the thick client model, which performs
    all processing on the device, and the thin client model, which leverages cloud-based
    processing. The related functional components, service procedures, requirements,
    and interaction models are defined accordingly.\r\nWith this Recommendation, IPTV
    service providers can enhance their offerings by supporting immersive VR experiences,
    including 360° panoramic content and interactive VR applications. These enhancements
    enable IPTV systems to deliver superior quality of experience (QoE) for VR services
    while maintaining interoperability with existing ITU-T IPTV related Recommendations.
    Furthermore, new user-centric VR service scenarios, such as single-user and multi-user
    immersive experiences, can be developed based on the capabilities specified in
    this Recommendation.\r\n"
