  content: Supplement 8 to ITU-T X-series Recommendations provides practical solutions
    as best practices for countermeasures against botnet threats. These best practices
    can be utilized by network operators in implementing countermeasures against botnet
    threats. The best practices are applicable to management, control, and user activities
    to mitigate security incidents caused by botnet. This Supplement features two
    best practices.
