abstract:
- language: en
  script: Latn
  content: Supplement 54 to ITU-T L-series Recommendations provides a guidance for
    assessing the greenhouse gas (GHG) emissions consequences of the financial effects
    (gains or losses) generated by information and communication technologies (ICT),
    separately considering the user and the vendor financial benefits or losses from
    the solution. It thus assesses the GHG impact of this common case of rebound effect
    due to changes in behaviour.
