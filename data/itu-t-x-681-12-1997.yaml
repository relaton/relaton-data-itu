abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard provides the ASN.1 notation
    which allows information object classes as well as individual information objects
    and sets thereof to be defined and given reference names. An information object
    class is a template for a collection of information that makes up the attributes
    of any members of that class.
