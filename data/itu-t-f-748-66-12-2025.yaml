abstract:
- language: en
  script: Latn
  content: "Embodied artificial intelligence (EAI) extends artificial intelligence
    into the physical world. It integrates artificial intelligence into a physical
    body that interacts autonomously with and adapts to the physical world. Embodied
    intelligence systems enable machines to perceive, decision making, execute, and
    autonomously adapt to complex real-world environments. \r\nRecommendation ITU-T
    F.748.66 provides the definition of EAI and introduces the framework and technical
    requirements for embodied artificial intelligence systems. It provides a unified
    framework for system capability building and performance requirements that guide
    the design, development, evaluation, and interoperability of embodied artificial
    intelligence (AI) systems.\r\n"
