abstract:
- language: en
  script: Latn
  content: Biometric technologies are developed in various products and populated
    in application systems such as border control, physical access control, etc.,
    for identity verification. These technologies are also expected to be applied
    to open network systems for reliable user authentication. However, open network
    systems need to manage risks in biometric products and system configurations for
    secure remote services. Recommendation ITU-T X.1084 specifies biometric authentication
    protocols and profiles for telecommunication systems in open networks.
