abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.225 defines the fourth generation of high-speed
    data-over-cable systems. The fourth-generation transmission systems introduce
    a number of new features that build upon what was present in previous Recommendations
    ITU-T J.112, ITU-T J.122, ITU-T J.222 and ITU-T J.223. This Recommendation includes
    key new features for the physical (PHY) layer and defines Full Duplex DOCSIS Mode
    of operation, including enhancements to the media access control (MAC) layer protocols
    as well as requirements for upper layer protocols (e.g., IP, DHCP, etc.). The
    fourth-generation cable modem specifications are incorporated fully in this Recommendation.
    Informative Supplement 10 to the ITU-T J series of Recommendations contains the
    correspondence between the DOCSIS versions and the ITU-T Recommendations revisions
    and generations. NOTE – The structure and content of this Recommendation have
    been organized for ease of use through direct reference to the original source
    material, based on the recognition of CableLabs by ITU in accordance with Recommendation
    ITU-T A.5.\r\n1  Recommendation ITU-T A.5 (2019), Generic procedures for including
    references to documents of other organizations in ITU-T Recommendations. See:
    https://www.itu.int/en/ITU-T/extcoop/Pages/sdo.aspx"
