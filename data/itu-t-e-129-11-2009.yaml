abstract:
- language: en
  script: Latn
  content: The objective of Recommendation ITU-T E.129 is to specify a methodology
    that will provide a standardized method for presenting ITU-T E.164 numbers in
    the national numbering plans of all countries (i.e., each country's application
    of ITU-T E.164). This Recommendation also includes a method by which this information
    is made available to all interested parties, as well as timely information on
    numbering plan changes that influence the routing, charging and accounting of
    international telecommunications traffic.
