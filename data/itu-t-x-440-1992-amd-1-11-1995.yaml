abstract:
- language: en
  script: Latn
  content: AbstractThis amendment contains the proposed technical revisions to Recommendation
    X.440 (1992) that:1) Resolve the "For further study" item contained in Recommendation
    X.440 (1992) by specifying a mapping between the 4-bit per word encoding of 32
    kbit/s ADPCM as defined in G.721 (1988) and X.440's 8-bit per word encoding of
    OCTETS. It also specifies rules for mapping G.728's 16 kbit/s LD-CELP 10-bit per
    word encoding onto X.440's 8-bit per word encoding.2) Officially integrate the
    resolved defect report changes contained in the MHS Implementors Guide version
    12.
