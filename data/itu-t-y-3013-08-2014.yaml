abstract:
- language: en
  script: Latn
  content: "The need for a socio-economic assessment of future networks (FNs) is documented
    in the \"Social and economic awareness\" objective and in the \"Economic incentives\"
    design goal of Recommendation ITU-T Y.3001. \r\nRecommendation ITU-T Y.3013 introduces
    tussle analysis as a meta-method for such a socio\x1Eeconomic assessment of FN
    technology. Different methods are proposed to implement the three steps that comprise
    tussle analysis. The benefits of integrating tussle analysis into the standardization
    phase of FN technology are highlighted."
