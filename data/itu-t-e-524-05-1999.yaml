abstract:
- language: en
  script: Latn
  content: To ensure accurate network design and planning in the presence of multiple
    streams (arising, e.g. from different services on the same network), it is imperative
    to determine the individual means and variances of the overflows of the different
    traffic streams offered to a common trunk group arrangement. The exact calculation
    of these parameters for the individual overflow streams is a very hard problem.
    Thus, this Recommendation introduces different approximate methods for the calculation
    of the individual overflows. These methods are evaluated in terms of accuracy,
    processing time, memory requirements and programming effort. This Recommendation
    also provides sample numerical results based on exact calculations to which the
    results based on these methods may be compared.
