abstract:
- language: en
  script: Latn
  content: "Supplement ITU-T L.Suppl.5 has been developed to provide information for
    the practical implementation of the life-cycle approach in companies, facilities
    and plants as well as distributors, including chapters on best practices with
    a specific focus on material usage and selection.\r\nThe information on facilities
    and the different stakeholders includes:\r\n•\tICT product design issues, supplementing
    international standard IEC 62430 on environmentally-conscious design for electrical
    and electronic products, with a focus on practical implementation;\r\n•\tICT life-cycle
    approach to address health, environment and socio-economic aspects including avoiding
    hazardous emissions from uncontrolled disassembly, burning or disposal of e-waste,
    occupational health and involvement of the informal sector;\r\n•\treduction of
    the end of life impact through technical guidance applicable to refurbishment
    and repair facilities;\r\n•\treuse and end of life management;\r\n•\tmarketing
    of used ICT goods, including risk prevention, minimization measures and eco-environmentally
    sound processing;\r\n•\tdonation of ICT goods, including quality control for donated
    equipment, technical support in the country of destination, following international
    procedures on transparency and documentation of contracts, notifications and consent
    prior to delivery;\r\n•\tmanagement of equipment and components destined for reuse.\r\n"
