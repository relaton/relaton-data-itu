abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T M.3361 introduces the specification for high level
    requirements of business-to-government (B2G) management interfaces, including
    its general requirements, specific requirements, as well as security requirements.
    This Recommendation also defines the concept of B2G management interfaces and
    its relationship with existing business-to-business and customer-to-business management
    interfaces (B2B and C2B) Recommendations.The B2G management interface has additional
    requirements to those of B2B/C2B interfaces, which has impacts on the activities
    of both the service provider/network operator (SP/NO) as well as on the National
    Administrations/Government (G) activities.The interactions between SP/NO and G
    entities are addressed in clauses 6 to 9. B2B and C2B interface specifications
    will be reused in the development of the B2G management interface.
