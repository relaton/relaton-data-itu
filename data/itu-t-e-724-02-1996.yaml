abstract:
- language: en
  script: Latn
  content: To ensure the effective deployment of Intelligent Network (IN) capabilities,
    performance objectives must be established to serve as a basis for traffic engineering
    and related network planning. This Recommendation defines performance parameters
    for a range of IN services and provides corresponding Grade of Service (GOS) performance
    objectives. Currently only one such objective, namely incremental post-selection
    delay is addressed.For the successful introduction of new service capabilities
    provided by intelligent networks, network planning and engineering should be based
    on the fundamental requirement of providing acceptable service to the end user.
    Reasonable grade of service performance objectives have been developed by understanding
    user expectations and typical implementations of representative IN services.The
    Recommendation introduces the notion of service classes that are defined on the
    basis of end user requirements.Performance requirements during periods of network
    congestion are for further study.
