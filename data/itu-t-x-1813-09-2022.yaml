abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1813 specifies the security requirements for the
    operation of vertical services supporting ultra-reliable low-latency communications
    URLLC in an IMT-2020 private network. It identifies threats and risks which arise
    when providing vertical services supporting URLLC in an IMT-2020 private network
    and describes security deployment scenarios of the IMT-2020 private network for
    operation of vertical services supporting URLLC. Monitoring of communication contents
    is out of the scope of this Recommendation.\r\nIMT-2020 private network, also
    regarded as IMT-2020 non-public network (NPN), is intended for the sole use of
    a private entity such as an enterprise and may be deployed in a variety of configurations,
    utilizing both virtual and physical elements. It will deliver on speed, low latency
    and other benefits promised by the IMT-2020 to support next-generation applications.\r\nIn
    vertical services for smart factories and smart cities that use a private IMT-2020
    network, many Internet of things (IoT) devices use massive machine-type communications
    (mMTC) and ultra-reliable low-latency communications (URLLC). These communications
    can be exposed to security threats and their associated risks. In addition, these
    threats can deteriorate the stable operation of the vertical services supporting
    URLLC. It cannot be guaranteed when the performance of vertical services is degraded
    due to these risks.\r\n"
