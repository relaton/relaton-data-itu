abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1412 analyses security threats and challenges and
    provides security requirements for smart contract management in distributed ledger
    technology (DLT) systems. As smart contracts are widely used in DLT systems, they
    are faced with a lot of security threats and challenges. \r\nAs such this Recommendation
    can be used by smart contract designers, developers, and managers to manage smart
    contracts, including design and development, compilation and deployment, invocation
    and execution, maintenance and management in DLT systems. This Recommendation
    does not deal with the security issues of wallets or distributed applications
    related to smart contracts.\r\n"
