abstract:
- language: en
  script: Latn
  content: The fast associate (upper-layer context identifier) mechanism allows a
    presentation connection, and the application association it carries to be established
    using a compressed form of the information that would otherwise be sent on the
    P-CONNECT exchange. In this Amendment, a conceptual parameter is added which summarizes
    the contents of the user-data of the P-CONNECT primitives.
