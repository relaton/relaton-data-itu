abstract:
- language: en
  script: Latn
  content: This Recommendation discusses various facsimile measurement methodologies
    focusing on G3 facsimile as defined by Recommendations T.4, T.6, T.30 and used
    on PSTN as defined by Recommendations F.180 and F.182. The Recommendation evaluates
    the advantages and disadvantages of intrusive (test-call based), non-intrusive,
    mixed-mode and terminal based measurements. Test planning aspects including planning
    approach, measurement topology, test location points, and some statistical aspects
    are also discussed.
