abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3110.1 specifies a set of requirements to enable
    the cooperative management of the shared network resources across the X-interface
    between the master operator (MOP) and the participating operator(s) (POP(s)),
    and provides high-level use cases as well as function sets for exchanging shared
    management information across the X-interface for the management of shared network
    resources. The function sets across this interface include: business activation,
    operation management, fault handling, resource allocation management and security
    management, and the interface is developed following the interface specification
    methodology from Recommendation ITUT M.3020, in a protocol neutral manner.\r\n"
