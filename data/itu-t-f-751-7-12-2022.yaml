abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.751.7 defines functional assessment methods for
    distributed ledger technology (DLT) platforms based on the assessment criteria
    defined in Recommendation ITU-T F.751.1. For each item of the assessment criteria
    defined in Recommendation ITU-T F.751.1, one test case is defined in this Recommendation
    accordingly. The description of each test case is composed of test purpose, test
    workflows and expected results.
