abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.1110 describes performance requirements and test
    methods for wideband hands‑free communication in motor vehicles. This Recommendation
    covers:\r\n\r\n–           built-in hands-free systems,\r\n\r\n–           aftermarket
    hands-free car kits,\r\n\r\n–           corded headsets, and\r\n\r\n–           wireless
    headsets\r\n\r\nto be used in motor vehicles for communication.\r\n\r\nThis Recommendation
    addresses the test of complete systems as well as the subsystems hands-free microphone
    and the telephone with short-range wireless transmission link used to transmit
    the speech signals from the hands-free system to the mobile network.\r\n\r\nFor
    testing purposes, the test set-up and the recommended environmental conditions
    are described.\r\n\r\nThe methods, the analysis and the performance parameters
    described in this Recommendation are based on test signals and test procedures,
    as defined in Recommendations ITU‑T P.501, ITU‑T P.502, ITU‑T P.340, and ITU‑T
    P.380.\r\n"
