abstract:
- language: en
  script: Latn
  content: Nowadays, the numerous complex parameters that determine the speech quality
    of telecommunication equipment as well as the end-to-end speech quality can be
    interpreted by technical experts only. This Recommendation provides a novel quality
    representation methodology which is easy to use and also easy to understand for
    non-experts and which can serve as a basis for commercial decisions on a management
    or marketing level.
