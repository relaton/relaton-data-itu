abstract:
- language: en
  script: Latn
  content: Failures of Ethernet local area network (LAN) ports have been attributed
    to use of inappropriate surge protective devices (SPDs), lack of insulation coordination
    and inappropriate wiring, which causes the failure of transformers, associated
    wiring, components and connectors. Recommendation K.126 discusses isolation transformer
    parameters and how they influence the equipment common-mode and differential-mode
    surge performance. Access to the full text of [ITU‑T K.95] is necessary to fully
    understand this document.
