abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.1903 describes detailed functional requirements
    of mobile IPTV, which is an application of IPTV (Recommendation ITU-T Y.1901).
    It applies to where the IPTV terminal device is connected to the IPTV service
    provider via an IPTV-enabled mobile network to provide the IPTV services irrespective
    of changes of the location or technical environment. This Recommendation focuses
    on the requirements for networking aspects of an IPTV terminal device to the IPTV
    service provider. This Recommendation does not address the common functional requirements
    of an IPTV service, which are covered by Recommendation ITU-T Y.1901, but provides
    the requirements specific to mobile IPTV services only. Thus, these functional
    requirements are used to develop the detailed specifications of the IPTV functional
    components which are defined in Recommendation ITU-T Y.1910 for support of mobile
    IPTV.
