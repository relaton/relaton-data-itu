abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T J.1304 is intended to define functional requirements
    for a cable television operator to provide an over-the-top (OTT) service to cable
    television customers in conjunction with their cable television services, video
    on demand (VOD) service, high-speed cable internet and so on by collaboration
    with an OTT service provider. As a reference architecture, the system architecture
    and interfaces between a cable television operator and one or more OTT service
    provider(s) are specified. To exemplify the collaboration patterns of a cable
    television operator with an OTT provider, this Recommendation also describes the
    configuration patterns of relevant entities including a user, a cable television
    operator and one or more OTT service provider(s).
