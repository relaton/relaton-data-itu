abstract:
- language: en
  script: Latn
  content: "Cloud virtual reality based on cloud capabilities, can effectively shield
    terminal differences, reduce the difficulty of application development, lower
    some specific industry entry barriers, and promote the industry business chain
    cooperation.\r\nRecommendation ITU-T F.746.14 focuses on the overall requirements
    of cloud virtual reality systems and the related requirements of each layer including
    content requirements, network requirements, control requirements, resource requirements
    and terminal requirements, as well as the reference framework for related high-level
    functions.\r\n"
