  content: Recommendation ITU-T X.1257 develops a specification to ensure that necessary
    business meaning is assigned to IAM roles and permissions and that this business
    meaning is traceable and reference-able throughout IAM process lifecycle so that
    permissions can be efficiently assigned to user, separation of duties (SoD) controls
    successfully implemented across applications, and access review and reconciliation
    processes can be carried out efficiently.
