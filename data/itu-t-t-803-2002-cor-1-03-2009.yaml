abstract:
- language: en
  script: Latn
  content: Rec. ITU-T T.803 | ISO/IEC 15444-4 provides the framework, concepts and
    methodology for testing and the criteria to be achieved to claim compliance to
    Rec. ITU-T T.800 | ISO/IEC 15444-1, which describes a flexible image compression
    system known as "JPEG 2000".This corrigendum provides a clarification regarding
    the contents of the Compatibility List of the File Type box for the JP2 test images
    that are included as part of this Recommendation | International Standard.
