abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard belongs to a series of Recommendations
    which provide a set of facilities to aid the construction of OSI Upper Layer protocols
    which support the provision of security services. This Recommendation defines
    the service provided by the Security Exchange Service Element (SESE). The SESE
    is an application-service-element (ASE) which facilitates the communication of
    security information to support the provision of security services within the
    Application Layer of OSI.
