- language: en
  script: Latn
  content: "Supplement 70 to ITU-T G-series Recommendations describes existing and
    a synchronous digital hierarchy (SDH) based method to support the transport of
    sub-1G signals through the optical transport network (OTN). A sub-1G signal is
    a digital signal whose bit rate is included in a range from nominally 2 Mbit/s
    to less than nominally 1 Gbit/s. \r\n"
