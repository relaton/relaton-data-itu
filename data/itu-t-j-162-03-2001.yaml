abstract:
- language: en
  script: Latn
  content: Many cable television operators are upgrading their facilities to provide
    two-way capability and using this capability to provide high-speed IP data services
    per ITU-T J.83 and ITU-T J.112. These operators now want to expand the capability
    of this delivery platform to include a variety of time-critical services. This
    Recommendation is one of a series of Recommendations required to achieve this
    goal. It provides a network-based call signalling protocol necessary to establish
    connections.
