abstract:
- language: en
  script: Latn
  content: This Recommendation lays down general principles on the continued availability
    of traditional services to facilitate global interconnection and interoperability
    of telecommunication facilities, pending the establishment of new services and
    to ensure the efficiency, usefulness and availability to the public of international
    telecommunication services. It addresses the coordination needed between Administrations
    to achieve that continued availability. Members should take any necessary steps
    to ensure that coordination. Within the framework of this Recommendation, "traditional"
    services include the international public telegram, telex and telephone services.
