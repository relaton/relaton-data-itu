abstract:
- language: en
  script: Latn
  content: Many terminal devices are available that may be substituted for, or used
    in conjunction with, subscribers' telephones in the public telephone service.
    This Recommendation outlines some difficulties that may arise from this practice,
    particularly for the calling party. It also offers some guidelines to be considered
    when setting national requirements for terminal equipment. This Recommendation
    does not address issues related to PBXs, and it may not be applicable for telephone
    services entirely provided via the ISDN.
