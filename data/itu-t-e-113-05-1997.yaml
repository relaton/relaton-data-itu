abstract:
- language: en
  script: Latn
  content: The expanded use and the increased number of charge cards require Card
    Issuers (or authorized agents) to implement adequate security against fraudulent
    use.Therefore, a critical facet in the provision of such a system is the ability
    to ensure the validity of the card and its authorized use in a uniform manner.
    The purpose of this Recommendation is to define the procedures for the validation
    process between Administrations. This validation process makes no attempt to specify
    any equipment, facilities and data transmission techniques.
