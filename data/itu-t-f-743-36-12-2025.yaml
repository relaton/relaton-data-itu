abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.743.36 defines the requirements for vehicle recognition
    application in intelligent video surveillance systems, including requirements
    for function, service, performance and data security aspects. It also describes
    typical use cases of vehicle recognition applications.\r\nThe vehicle recognition
    application, as one typical application of intelligent video surveillance services,
    performs vehicle related monitoring, detection and recognition based on surveillance
    images or videos, which is of benefit in vehicle management and traffic planning.
    This Recommendation provides a reference for the implementation of vehicle recognition
    application and can be applied in the fields of intelligent transportation, public
    security and smart city governance.\r\n"
