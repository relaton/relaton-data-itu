  content: "This Supplement provides technical guidance to public authorities to improve
    their procurement practices to purchase green ICT goods and services.\r\n\r\nTo
    this end, this Supplement collects and presents relevant standards, ecolabels
    and certifications from different organizations to help public authorities achieve
    green ICT public procurement practices.\r\n\r\nThe guidance can be also used by
    private organizations interested in improving their green ICT procurement practise.\r\n"
