abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.746.9 describes the requirements and architecture
    for an indoor conversational robot system. This Recommendation defines different
    functions to support indoor conversational robot systems. The scope of this Recommendation
    is focused on architecture, terminals, servers and interfaces between modules.
    It also describes different functions including a variable‑distance speech preprocessing
    function, user identifying speech recognition function, multitask dialogue processing
    function and speech synthesis function. Additionally, it describes interfaces
    between modules for indoor conversational robot systems.
