abstract:
- language: en
  script: Latn
  content: RTP crosstalk is a situation, when a RTP endpoint (RA) is wrongly sending
    RTP packets to another RTP endpoint (RD), in which RD is part of an active communication
    session (e.g., a RTP session between RD and RC). RA was typically a used resource
    in another communication session (e.g., a RTP session between RA and RB). Such
    a failure situation may be caused by a couple of reasons. This Supplement describes
    potential failure scenarios in detail and provides possible solution proposals
    for each scenario.
