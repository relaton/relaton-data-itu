abstract:
- language: en
  script: Latn
  content: "Supplement 7 to ITU-T L-series Recommendations describes the rationale
    for a minimum data set for evaluating energy efficiency and for controlling data
    centre equipment with a view to power saving based on Recommendation ITU\x1ET L.1300.
    More precisely, this Supplement reports the data set necessary for: evaluation
    of energy efficiency and coordinated control to save power in data centres. Finally,
    it provides a summary of the minimum data set and gap analysis with other standards."
