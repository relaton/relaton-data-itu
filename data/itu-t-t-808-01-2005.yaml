abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation | International Standard is to provide
    a network protocol that allows for the interactive and progressive transmission
    of JPEG 2000 coded data and files from a server to a client. This protocol allows
    a client to request only the portions of an image (by region, quality or resolution
    level) that are applicable to the client's needs. The protocol also allows the
    client to access metadata or other content from the file.
