abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3389 provides the requirements for artificial intelligence
    (AI)-based customer experience management of telecom services, key implementation
    processes, typical application scenarios and a use case. The goal is to explain
    the use of AI technology to achieve closed-loop management of customer experience
    evaluation, analysis, guarantee and optimization. This Recommendation considers
    the application of AI technology in customer experience quality monitoring, analysis
    and optimization strategy generation.\r\n"
