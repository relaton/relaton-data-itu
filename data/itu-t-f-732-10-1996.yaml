abstract:
- language: en
  script: Latn
  content: This Recommendation encompasses a broad range of related services, including
    the videoconference service, and also the audiographic conference service, the
    videophone conference service and CDH (Collaborative Document Handling). It is
    part of a general framework for Recommendations on multimedia services.This Recommendation
    refers to Recommendation F.702 (Multimedia conference services) and contains only
    those parts that require complements or choices between options in order to apply
    it specifically to B-ISDN and to take full advantage of its enhanced capabilities.Because
    in the coming years the broadband conference rooms will have to interwork with
    the existing narrow-band systems, a large part of this Recommendation is devoted
    to the various possible configurations for interworking (see clause 8). Thus,
    when B-ISDN is interconnected with 64 kbit/s-based ISDN, it will also have to
    provide the services which are currently provided by this network, and insure
    interworking with existing narrow-band terminals.
