abstract:
- language: en
  script: Latn
  content: Based on the framework set forth in ITU-T Rec. Y.140, this Recommendation
    concentrates on one of the interconnection scenarios relevant to GII, the interconnection
    between operators of public telecommunication networks (PTNOs) and service providers
    (SPs). After looking at the situation before and during transition to a full implementation
    of the so-called enterprise model, attributes of reference points for interconnection
    between PTNOs and SPs are dealt with in some detail. Separate clauses treat the
    various aspects of these attributes, in particular, security, service interaction,
    charging/billing, service availability, access to a network address and management.
    The content of this Recommendation should be seen as a guideline for consideration
    by involved parties when implementing the GII concept within a Next Generation
    Network.
