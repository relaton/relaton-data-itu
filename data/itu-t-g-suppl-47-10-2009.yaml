abstract:
- language: en
  script: Latn
  content: Supplement 47 to ITU-T G-series Recommendations provides information on
    the general transmission characteristics of single-mode optical fibres and cables
    specified in the ITU-T G.65x-series Recommendations related to the practical use
    condition. It covers the environmental and length related characteristic of ITU-T
    G.65x-series optical fibre and cable. The fibre material related characteristics
    are also described in Appendix I.
