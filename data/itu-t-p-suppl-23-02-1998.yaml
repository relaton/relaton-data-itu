abstract:
- language: en
  script: Latn
  content: Supplement 23 to the P series of ITU-T Recommendations is a database of
    coded and source speech material used in the ITU-T 8 kbit/s codec (Recommendation
    G.729) characterization tests. The purpose of this database is to provide source,
    pre-processed and processed speech material, and related subjective test plans
    and scores, for the development of new and revised ITU Recommendations relating
    to objective voice quality measures. The coded speech database is delivered on
    three CD-ROMs.
