abstract:
- language: en
  script: Latn
  content: This Recommendation provides the requirements to measurements needed at
    the cell level for an ATM (Asynchronous Transfer Mode)-based B-ISDN (Broadband
    Integrated Services Digital Network) network. Measurements may be both for real
    time and for record. The first release of this Recommendation focuses on the latter.
    This Recommendation is not restricted to point-to-point connections, but covers
    point-to-multipoint connections as well.
