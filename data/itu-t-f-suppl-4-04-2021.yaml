abstract:
- language: en
  script: Latn
  content: "Artificial intelligence (AI) is one of core essential driving forces of
    a new round of industrial reform, which can affect promoting the upgrading of
    the traditional industries. Blockchain presents opportunities for disruptive innovations,
    which enables global businesses to transact business with less friction and more
    trust. AI and blockchain promote and influence each other, and their convergence
    could provide major driving forces for industries and great creativity across
    a wide range of business applications in many fields. There are many benefits
    and challenges to combining AI and blockchain together. This Supplement focuses
    on the research on the convergence of AI and blockchain, specifically analyses
    the mutual promotion between AI and blockchain, and provides a technical reference
    for the application of AI and blockchain. In addition, Supplement 4 to ITU-T F-series
    Recommendations also provides application analysis of the convergence of AI and
    blockchain. \r\n"
