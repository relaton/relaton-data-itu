abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard defines the set of capabilities,
    in terms of an abstract service definition, provided by the Data Link Layer to
    the Network Layer. For designers of Network Layer protocols, it provides a definition
    of the Data Link service to allow design and implementation independent of details
    of the Data Link Layer protocol. For designers of Data Link Layer protocols, it
    defines the set of capabilities to be made available through the action of the
    protocol.
