abstract:
- language: en
  script: Latn
  content: This Recommendation provides the service description of and the procedures
    for the implementation, operation and management of the International Premium
    Rate Service (IPRS) which is provided on a managed basis by a Recognized Operating
    Agency (ROA) in the country of an information service provider in conjunction
    with an ROA(s) in the country of the caller.Through the availability of IPRS,
    a wide range of products offered by information service providers in one country
    can be made available to callers in another country. Examples of such products
    could include:· access to recorded information services (speech, facsimile or
    data);· access to interactive services (speech, facsimile or data);· access to
    promotions, competitions and opinion surveys.
