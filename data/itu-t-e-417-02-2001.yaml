abstract:
- language: en
  script: Latn
  content: This Recommendation lays down a framework for supporting and defining the
    role of network management in IP-based telecommunications networks. IP-based networks
    generally make use of various telecommunications technologies that support a range
    of multimedia services such as voice, data, still image and video. Such IP-based
    networks are referred to here as converged networks. Network Management (NM) goals,
    principles and functions that are intended for use with IP-based equipment are
    defined. The major part of this Recommendation suggests ways to monitor traffic
    and provides some indication of parameters for promptly detecting abnormal network
    traffic conditions. After detection of an abnormal condition, automatic and possibly
    manual controls must be temporarily applied to the network to alleviate the problem
    until it is resolved. It is also necessary to frequently check the performance
    of the network after applying the NM controls to note whether the control is mitigating
    the problem and to determine when to modify or remove it from the network.
