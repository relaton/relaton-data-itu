abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the protocol, called the Directory Assistance
    protocol, to be used for Directory Assistance information exchange among service
    providers. This supports assistance/inquiry as part of the international telephone
    operator service. This Recommendation also gives a description of the principles
    and procedures to be followed in interconnecting different national computerized
    directory assistance services.
