abstract:
- language: en
  script: Latn
  content: A customer contact point is a conceptual point at which a service provider
    can interact with any customer of the offered service for the purpose of maintaining
    communication services.This Recommendation describes principles for the minimum
    maintenance information to be exchanged at customer contact point (MICC) with
    the application of a reference model and terms for maintenance information exchange
    between a customer and a service provider's customer care staff at customer contact
    point under environment of multiservice providers.
