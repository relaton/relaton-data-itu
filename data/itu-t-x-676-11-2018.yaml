abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.676 specifies an object identifier (OID)-based resolution
    framework for identifying various services in IoT environments. OID is an identifier
    to name an object with a hierarchically assigned namespace. In Internet of things
    (IoT), thousands of IoT services based on heterogeneous resources will be provided
    as combinations of various services. For efficiency, various technologies, such
    as service binding, dynamic services or frequently switching services will be
    required, along with resolution and identification of grouped services. This Recommendation
    describes the concepts of IoT grouped services, considerations, architectures,
    and procedures for an OID-based resolution framework for IoT grouped services.
