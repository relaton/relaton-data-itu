abstract:
- language: en
  script: Latn
  content: "Supplement 95 to ITU-T Y-series Recommendations provides an overview of
    open service environment (OSE) for future networks, including related use cases
    and typical procedures. The OSE allows applications to make use of service capabilities
    with different types. Application developers will be able to create and provide
    new applications via OSE regardless of the type of underlying network and/or equipment.
    In future networks, within an OSE, each capability is able to function either
    independently or in conjunction with other capabilities for the realization of
    applications run in different usage scenarios.\r\n"
