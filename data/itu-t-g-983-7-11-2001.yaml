  content: This Recommendation describes the ONT management and control interface
    (OMCI) specifications required for the Dynamic Bandwidth Assignment (DBA) function
    in a Broadband Passive Optical Network (B-PON) system.This Recommendation builds
    on the core functions specified in ITU-T G.983.2 and specifies managed entities
    of a protocol-independent Management Information Base (MIB) that models the exchange
    of information between OLT and ONT.
