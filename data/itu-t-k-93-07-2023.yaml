abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.93 aims to ensure normal operation of home networking
    devices and to provide a new additional immunity test method for broadband services,
    especially for devices that are sensitive to broadband interference. The introduction
    of high-speed data services to customer premises that rapidly adopt new technologies
    allows the distribution of such data within customer premises. This is leading
    to a number of different wireless (e.g., wireless local area network (LAN) and
    digital enhanced cordless telecommunications) and wireline technologies (e.g.,
    LAN and technologies designed to exploit existing telephone extension and power
    distribution wiring) to interconnect a variety of in-home electronic and electrical
    equipment (e.g., set top boxes), and personal computers. Many types of broadband
    services are provided on Internet protocol networks, such as voice over Internet
    protocol, video on demand and broadcasting. Moreover, the electromagnetic environment
    in the home changes due to this situation. Therefore, new electromagnetic compatibility
    issues may occur in a home network environment. \r\n"
