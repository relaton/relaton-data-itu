abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.743.17 describes the requirements for a cloud gaming
    system including user requirements, service requirements, performance requirements,
    management requirements, security requirements, network requirements and terminal
    requirements for a cloud gaming system. It also describes the typical scenarios
    including cloud game distribution scenario, cloud game running scenario, cloud
    game cross-platform scenario and cloud game live streaming scenario for cloud
    gaming system in Appendix I.\r\nThis Recommendation is intended to provide a reference
    for cloud gaming service providers, platform providers, and developers when they
    build and operate a cloud gaming system.\r\n"
