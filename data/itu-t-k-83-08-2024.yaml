abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.83 gives guidance on how to make long-term measurements
    for the monitoring of electromagnetic fields (EMF) in the selected areas that
    are under public concern, in order to show that EMFs are under control and under
    the limits. The purpose of this Recommendation is to provide the general public,
    clear and easily available data concerning electromagnetic field levels in the
    form of results of continuous measurement.\r\n"
