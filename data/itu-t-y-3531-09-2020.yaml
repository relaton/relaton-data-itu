abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3531 provides cloud computing requirements for
    machine learning as a service (MLaaS), which addresses requirements from use cases.
    MLaaS is a cloud service category in which the capability provided to the cloud
    service customer is the provision and use of a machine learning (ML) framework,
    which is a set of functionalities for provisioning ML data, as well as training,
    deployment and management of an ML model.\r\nFrom the perspective of cloud computing
    service provision, Recommendation ITU-T Y.3531 provides the functional requirements
    for MLaaS to identify functionalities such as ML data pre-processing, ML model
    training and ML model testing. Also, Recommendation ITU-T Y.3531 is aligned with
    the cloud computing reference architecture specified in Recommendation ITU-T Y.3502."
