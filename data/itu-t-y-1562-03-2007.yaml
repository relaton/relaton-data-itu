abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation Y.1562 defines the parameters and methodology used
    to assess the service provided by higher-layer protocols. Parameters include performance
    parameters and availability parameters, such as high-layer packet transfer throughput,
    service delay, availability and so on. The methodology and parameters described
    in this Recommendation are applicable to networks supporting both IPv4 and IPv6.
