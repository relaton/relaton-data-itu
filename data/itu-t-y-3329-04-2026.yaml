abstract:
- language: en
  script: Latn
  content: "Energy efficiency (EE) is the relation between the useful output and the
    energy/power consumption (Recommendations ITU-T L.1330 and ITU-T L.1331). Since
    the sustainability requirements of networks are becoming more and more stringent,
    novel capabilities are needed for IMT-2020 networks and beyond from the EE perspective.
    Among them, the end-to-end EE monitoring and control through coordination between
    the user equipment (UE), access network, core network, data network, services
    and applications is essential (Recommendation ITU-T Y.3102).\r\nRecommendation
    ITU-T Y.3329 focuses on the requirements and capability framework of IMT-2020
    networks and beyond from the EE perspective.\r\nAppendix I provides typical scenarios
    of IMT-2020 networks and beyond from the EE perspective.\r\n"
