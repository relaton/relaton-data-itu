abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the Segmentation and Reassembly Service Specific
    Convergence sublayer of the ATM Adaptation Layer (AAL) type 2 which provides for
    the bandwidth-efficient transmission of low-rate, short, and variable length packets
    in delay sensitive applications. On one or more AAL type 2 user information streams,
    the Segmentation and Reassembly Service Specific Convergence sublayer may be deployed.
    In this Recommendation, the sublayer structure and the procedures for the segmentation
    and reassembly process, as well as the optional transmission error detection and
    assured data transfer, are defined in depth.
