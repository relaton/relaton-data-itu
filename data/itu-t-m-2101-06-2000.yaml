abstract:
- language: en
  script: Latn
  content: This ITU-T Recommendation provides limits for Bringing-Into-Service (BIS)
    and maintenance for international SDH paths, including tandem connections, and
    international SDH multiplex sections using equipment designed according to ITU-T
    Recommendation G.828. Error, timing and availability performance events are addressed.
    This ITU-T Recommendation also deals with all levels of PDH signals transported
    within SDH containers. Regenerator sections are not covered by this ITU-T Recommendation.
    BIS limits and maintenance procedures for radio regenerator sections are described
    in the relevant ITU-R Recommendations. SDH systems designed according to ITU-T
    Recommendation G.826 (i.e. prior to the approval of ITU-T Recommendation G.828)
    are not required to be re-engineered to meet the objectives and limits of this
    ITU-T Recommendation.Maintenance of systems designed to ITU-T Recommendation G.826
    should use the limits given in ITU-T Recommendation M.2101.1.
