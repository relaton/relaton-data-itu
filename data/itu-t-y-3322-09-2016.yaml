abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the architecture and implementations of Software-defined
    network intelligence capability enhancement (S-NICE). S-NICE is a specific implementation
    of NICE making use of software defined networking concept and technologies. This
    Recommendation defines the functional architecture of S-NICE, describes the enhancement
    functions based on NICE, the reference points among different functions and some
    typical implementation flows.
