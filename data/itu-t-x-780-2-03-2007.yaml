abstract:
- language: en
  script: Latn
  content: This Recommendation defines a set of TMN CORBA managed object and façade
    object modelling guidelines required to support service-oriented interfaces. It
    specifies how service-oriented CORBA TMN interfaces are to be defined. It covers
    IDL repertoire, information modelling in IDL and IDL style conventions. It also
    provides guidelines on redesigning fine-grained and coarse-grained interfaces
    to service-oriented interfaces. An IDL module is provided defining basic data
    types, exceptions, notification constructs, a base CORBA struct to be included
    by every service-oriented managed object and a base CORBA interface to be inherited
    by every service-oriented CORBA interface. This Recommendation and ITU-T Recommendation
    Q.816.2 together compose a framework for CORBA-based service-oriented TMN interfaces
    with a wide range of applications.
