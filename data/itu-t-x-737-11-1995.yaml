abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard specifies a number of generally
    useful "test categories" such as "connection request", loop back test and data
    integrity test. For each of these, a standard approach is used in terms of the
    components of the test category such as the purpose of the test, the resources,
    as defined in Recommendation X.745, test environment and content of result report,
    etc. The "inheritance" relationship among test object classes (representing test
    categories) is defined and the specifications of these as managed objects, included.
    This Recommendation | International Standard provides a means for other, notably
    TMN related groups, to use the same method for test category specification. This
    Recommendation | International Standard should be considered with the Test Management
    Function in Recommendation X.745.
