abstract:
- language: en
  script: Latn
  content: This Recommendation provides performance objectives and procedures for
    provisioning and maintenance of IP-based networks. It focuses attention on parameters
    that significantly affect the quality of service perceived by the customer, and
    the methods of measuring those parameters. These include those parameters that
    affect delay performance at the application layer. Performance limits for temporary
    dial-up access links, end-customer owned portions and MPLS networks are not covered
    by this Recommendation and are for further study. However, the performance of
    fixed access links, whose routing does not change, is covered.
