abstract:
- language: en
  script: Latn
  content: "Supplement 38 to ITU-T X-series Recommendations defines a contact tracing
    application as a tool that enables the identification, assessment, and management
    of people who have been in contact with individuals that may have been infected
    with a contagious disease to prevent onward transmission. These applications help
    prevent the spread of infectious diseases by proactively finding people at higher
    risk than others due to potential exposure, notifying them if possible and determining
    whether a quarantine is necessary.\r\nThis Supplement guides the development of
    interoperable systems to automatically trace and inform potentially infected users,
    in addition to manual notification methods, with consideration for reducing potential
    security risks associated with data processed in contact tracing applications.
    It also describes various use cases for contact tracing applications, provides
    data processing models including their data processing flow and identifies threats
    and risks from a security and personally identifiable information (PII) protection
    perspective.\r\n"
