abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T L.1017 provides a standardized method to measure
    and assess the environmental performance of smartphones. It includes a method
    to evaluate an aggregate score, reflecting the overall environmental performance
    and considering material efficiency and life cycle assessment (LCA) aspects. This
    Recommendation aims to evaluate the following attributes of a smartphone:\r\n–Durability.\r\n–Reparability,
    reusability and upgradeability.\r\n–Recyclability and recoverability.\r\n–Use
    of hazardous or restricted substances.\r\n–Use of recycled materials.\r\n–Characteristics
    of the product packaging.\r\n–Environmental impact considerations.\r\n"
