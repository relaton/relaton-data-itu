abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation is to define the videotelephony services
    provided over IP networks. The services enable two users in different locations
    to have conversational communications over IP networks. The service description,
    function model, service profiles, application scenarios and requirements of the
    IP videotelephony services are provided. The IP videotelephony services are one
    class of the generic services identified in ITU-T Rec. F.720, and their description
    follows the methodology described in ITU-T Rec. F.701. The requirements for the
    IP videotelephony services are derived from the scenarios for different applications
    the said services can support. Therefore, the services requirements accommodate
    the demands of different kinds of users and assist in enabling intercommunications
    between the services provided by different telecom operators and/or different
    IP videotelephony systems.
