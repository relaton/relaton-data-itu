abstract:
- language: en
  script: Latn
  content: "Supplement 47 to ITU-T L-series Recommendations provides various examples
    of resource saving in building systems, factories, plants, and home applications
    due to the progress of resource saving within the information and communications
    technology (ICT) sector. One example is the home network which uses the single-pair
    Ethernet (SPE) technology.\r\nAnother example is related to the semiconductor
    manufacturing technologies. Semiconductor dies (also known as chips) are currently
    mostly manufactured on disks (known as wafers) made of silicon, gallium arsenide
    or gallium nitride. These chips have a rectangular shape which lead to losses
    at the edge of the wafer. Bigger the die more important is the loss. Some techniques
    used in the current industries are also introduced for personal computers or server
    processors (CPU), and for graphics processing units (GPU) to reduce these losses.\r\nTo
    achieve sustainable growth under the constraints of the environment and resources,
    it is necessary to radically change conventional waste and recycling measures.
    Conventional waste countermeasures have mainly been recycling (reuse as a raw
    material), but in addition to this, reduction (control of waste generation) and
    reuse are also important.\r\nSince twisted pair cables, such as 4-pairs of unshielded
    twisted pair (UTP) or shielded twisted pair (STP) cables, are mainly used in various
    local area networks (LANs), a large number of copper resources are still required
    to provide Internet services around the world. If fewer pairs can achieve the
    same communication performance as the 4-pair type, resource saving can be realized
    in the network.\r\n"
