abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1602 analyses the maturity levels of software as
    a service (SaaS) application and proposes security requirements to provide a consistent
    and secure service execution environment for SaaS applications. These proposed
    requirements originate from cloud service providers (CSP) and cloud service partners
    (CSN) as they need a SaaS application environment to meet their demands on security.
    The requirements are general and independent of any service or scenario specific
    model (e.g. web services, or representational state transfer (REST)), assumptions
    or solutions.
