abstract:
- language: en
  script: Latn
  content: This Recommendation describes a time-division multiplexing (TDM) format
    for transmission of multiple MPEG-2 transport streams using a simple implementation
    on cable television systems. The TDM frame encapsulates the MPEG-2 transport streams
    prior to transmission. The format features interoperability with the existing
    conventional satellite transmodulation format, which is designed based on the
    specification of Annex C/J.83 and Annex C/J.84 (SMATV system C(III)).This format
    may be applicable to other transmission systems. Information about the frame format
    should be transmitted in the network information table simultaneously, when this
    format is introduced into the existing digital cable television systems. It is
    needed for the set-top box to identify the digital channel containing multiple
    MPEG-2 transport streams.
