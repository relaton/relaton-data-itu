abstract:
- language: en
  script: Latn
  content: "Rec. ITU-T T.800 | ISO/IEC 15444-1 defines a set of lossless and lossy
    compression methods for coding continuous-tone, \r\nbi-level, greyscale or colour
    digital still images. This Recommendation | International Standard provides three
    \r\nindependently created software reference implementations of Rec. ITU-T T.800
    | ISO/IEC 15444-1, in order to assist \r\nimplementers of Rec. ITU-T T.800 | ISO/IEC
    15444-1 in testing and understanding its content. The packages are JASPER, \r\nJJ2000
    and OPENJPEG. \r\n\r\nThis Recommendation | International Standard also provides
    an independently created software reference implementation \r\nof Rec. ITU-T T.814
    | ISO/IEC 15444-15, which specifies a high-throughput (HT) block coding algorithm
    that can be used \r\nin place of the block coding algorithm of Rec. ITU-T T.800
    | ISO/IEC 15444-1, in order to assist implementers of \r\nRec. ITU-T T.814 | ISO/IEC
    15444-15 in testing and understanding its content. The package is TT. \r\nThis
    Recommendation | International Standard additionally provides an independently
    created software reference \r\nimplementation for parsing of a JP2 file format
    specified in Rec. ITU-T T.800 | ISO/IEC 15444-1 and a JPH file format \r\nspecified
    in Rec. ITU-T T.814 | ISO/IEC 15444-15, The package is Codestream-parser. \r\n\r\nThis
    Recommendation | International Standard does not define any additional part of
    the JPEG 2000 image coding system. \r\nThe reference software is intended for
    use as a testing and validation tool for other implementations of JPEG 2000, and
    to \r\nhelp in the understanding of Rec. ITU-T T.800 | ISO/IEC 15444-1 and Rec.
    ITU-T T.814 | ISO/IEC 15444-15. Although \r\ncomponents of the reference software
    may find application in software intended for product development, this was not
    an \r\nobjective of the development of this software, and prospective implementers
    are cautioned against making any estimations \r\nof performance or resource usage
    based on the reference software. "
