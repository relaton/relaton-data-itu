abstract:
- language: en
  script: Latn
  content: Recommendation ITU T Y.3602 describes a model and operations for big data
    provenance. This Recommendation also provides the functional requirements for
    a big data service provider (BDSP) to manage big data provenance. The reliability
    of data is an important factor in determining the reliability of the analysis
    result. Data provenance aims to ensure the reliability of data by providing transparency
    of the historical path of the data. In a big data environment, complex data processing
    and migration due to the big data lifecycle and data distribution cause various
    difficulties in managing data provenance.
