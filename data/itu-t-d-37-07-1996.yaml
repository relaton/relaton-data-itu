abstract:
- language: en
  script: Latn
  content: "This Recommendation is intended to provide the general accounting and
    settlement principles applicable to Public Directory Services  between interconnected
    Directory Management Domains (DMDs). In this context, a DMD is defined to be a
    collection of Directory System Agents (DSAs) and Directory User Agents (DUAs)
    managed by a single Domain Management Organization (DMO). The F.500 and X.500
    Recommendations distinguish between two types of DMOs, administration and private
    organizations, and the two corresponding types of DMDs, Administration DMDs (ADDMDs)
    and Private DMDs (PRDMDs), respectively. The distinction between these two types
    of DMDs is that the former provides public directory services while the latter
    typically does not.\r\nThis Recommendation seeks to provide simplicity in accounting
    and settlements. While the information detailed in this Recommendation provides
    guidelines for the DMOs, the specific details of each particular arrangement between
    DMOs is the subject of bilateral agreements.\r\n"
