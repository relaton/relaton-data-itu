abstract:
- language: en
  script: Latn
  content: "For quantum key distribution networks (QKDN), Recommendation ITU-T Y.3810
    specifies the framework of QKDN interworking (QKDNi). This Recommendation describes
    the overview of interworking QKDNs, the reference models, and the functional models
    of gateway functions (GWFs) and interworking functions (IWFs). The configurations
    for QKDNi are specified. Appendix I includes QKDNi with different key relay schemes.\r\nCorrigendum
    1 corrects the following editorial errors:\r\n1.Modifies the expansion for FCAPS
    in clause 4.\r\n2.Adds Qqc to the quantum layer in Figures 1, 3 and 4.\r\n3.Modifies
    Note 3 in clause 7.1 to align with the revised Figure 1.\r\n4.Modifies the first
    sentence in clause 8.1 to align with the revised Figures 3 and 4.\r\n5.Modifies
    the second sentence in clause 9.1 to include Qqc.\r\n"
