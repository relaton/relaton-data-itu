abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1216 describes a general procedure for cybersecurity
    incident response and investigation. It also analyses sources of cybersecurity
    incident evidence and specifies capability requirements for tools used for collection
    and preservation of such evidence in an investigative process. This Recommendation
    also specifies reliability assurance requirements for these tools as guidelines
    to developers who design tools for such purpose. \r\n"
