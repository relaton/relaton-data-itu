abstract:
- language: en
  script: Latn
  content: "The use of the active antenna system (AAS) is widespread within communication
    systems and vertical industries. Its main benefit is higher beam-forming gain,
    which can overcome the high path loss of higher carrier frequency. For the introduction
    of AAS, especially the integrated antenna array, special attention should be paid
    to corresponding electromagnetic compatibility test configuration and measurement
    methods. Radiated immunity, as an example, will increase dramatically as the antenna
    array gain cannot be distinguished. Supplement 26 to K-series Recommendations
    also discusses other technical issues such as the radiated immunity test, communication
    link establishment, performance assessment, and the electromagnetic field exposure
    problem for test personnel. \r\n"
