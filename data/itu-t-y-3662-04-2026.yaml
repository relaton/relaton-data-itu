abstract:
- language: en
  script: Latn
  content: "The big data plane of big-data-driven networking (bDDN) is responsible
    for data awareness, data storage, data analysis and providing data services and
    intelligent services for network plane and management plane. For these functionalities,
    the transmission of massive amounts of data is the basic capability of the big
    data plane.\r\nRecommendation ITU-T Y.3662 specifies the data transmission mechanism
    in bDDN. It includes an overview of data transmission in bDDN, data transmission
    mechanism within the big data plane, as well as the data transmission mechanism
    between the big data plane and network plane, the data transmission mechanism
    between the big data plane and management plane and security considerations.\r\n"
