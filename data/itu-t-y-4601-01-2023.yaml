abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4601 specifies the requirements and capability
    framework of a digital twin for smart firefighting.\r\nA digital twin is a digital
    representation of an object of interest and may require different capabilities
    according to the specific domain of application such as synchronization between
    a physical thing and its digital representation, and real-time support (see Recommendation
    ITU-T Y.4600).\r\nThrough the Internet of things (IoT) technology deployment and
    the information integration process, a digital twin can provide high fidelity
    digital representation of a fire scene, enable dynamic convergence between the
    physical entity and digital entity, achieve comprehensive understanding and control
    of the past, present and future of the fire scene. The current state of the art
    for firefighting lacks comprehensive dynamic sensing capability and prediction
    capability. It cannot provide delayed information, and adequate visibility of
    the interaction between personnel and a fire scene. \r\nThrough the deployment
    of gateways, sensors, high quality networks, multi-physics simulations, dynamic
    analysis and predictions and three dimensional (3D) visualizations, the smart
    firefighting digital twin enables intelligent services such as personnel tracking,
    hazard tracking, fire scene dynamic analysis, rescue strategy optimization, pre-simulation,
    historical scene reconstruction, etc. These intelligent services can help to improve
    decision-making processes and reduce casualties. \r\n"
