abstract:
- language: en
  script: Latn
  content: This Recommendation describes the functional architecture of the ATM transport
    assembly using the transport functional architecture defined in Recommendation
    G.805. The ATM transport assembly consists of the VC layer network, the VC to
    VP adaptation, the VP layer network and the VP to Transmission path adaptation.
    The features described in the I-Series Recommendations that are relevant to ATM
    transport networks are described in this Recommendation. Annex A describes the
    correspondence between the terms used in Recommendations I.326 and I.311.
