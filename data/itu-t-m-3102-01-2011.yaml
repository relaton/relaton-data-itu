abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3102 provides a management information model for
    unified connection-oriented and connectionless networks, based on the unified
    functional architecture of transport networks specified in Recommendation ITU-T
    G.800. This model describes information object classes (IOCs) and their properties
    that are generic and useful to describe information exchanged across all interfaces
    defined in Recommendation ITU-T M.3010, TMN architecture. These generic information
    object classes are intended to be applicable across different technologies, architecture
    and services. The information object classes in this Recommendation may be specialized
    to support the management of various telecommunications networks.\r\n\r\nThis
    Recommendation follows Recommendation ITU-T M.3020, management interface specification
    methodology on the analysis phase. The information models provided in this Recommendation
    are in a protocol-neutral manner, and can be mapped to multiple protocol-specific
    information models (design phase)."
