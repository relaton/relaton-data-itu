abstract:
- language: en
  script: Latn
  content: "Scope-objectiveThis Recommendation with other Recommendations in the Z.150
    series defines URN (User Requirements Notation) for describing user requirement
    as goals and scenarios in a formal way without any reference to implementation
    mechanisms and with optional dependency on component specification. Such a notation
    is needed to capture user requirements prior to any design.CoverageURN has concepts
    for the specification of behaviour, structuring, goals, and non-functional requirements.
    This Recommendation focuses on language requirements for URN and on providing
    the context for a requirements engineering framework. Other Recommendations in
    the Z.150 series define the notation for URN.ApplicationsURN is applicable within
    standards bodies and industry. URN helps to describe and communicate requirements,
    and to develop reasoning about them. The main applications areas include telecommunications
    systems and services, but URN is generally suitable for describing most types
    of reactive systems. The range of applications is from goal modelling and requirements
    description to high-level design.Status/StabilityThis Recommendation provides
    the scope and requirements for URN.The main body of the Recommendation has following
    attachments:\r• Annex A Compliance to this Recommendation;\r• Appendix I Requirements
    engineering activities;\r• Appendix II Guidelines for the maintenance of URN;\r•
    Bibliography.Associated workThis work is associated with languages, notations,
    and methodological aspects related to other ITU-T Study Group 17 languages."
