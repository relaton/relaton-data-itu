abstract:
- language: en
  script: Latn
  content: "The complexity of telecommunication operation and management for networks
    and services is increasing significantly due to evolving network architectures
    and service demands. To address this, knowledge graphs offer a structured approach
    to modelling domain knowledge and support intelligent applications in telecommunication
    operation and management, such as fault diagnosis, service optimization, and network
    planning. The constructed telecommunication operation and management knowledge
    graph describes various concepts and their relationships in telecommunication
    scenarios. It forms a semantic graph that systematizes and interconnects knowledge
    in the field of telecommunication operation and management. It is required to
    outline the process and detailed steps for building telecommunication operation
    and management knowledge graph to guide its construction in telecommunication
    operation and management scenarios.\r\nRecommendation ITU-T M.3351.2 provides
    principles, process and typical use cases for the construction of telecommunication
    operation and management knowledge graph.\r\n"
