abstract:
- language: en
  script: Latn
  content: The fast associate (upper-layer context identifier) mechanism is an efficiency
    enhancement which allows a session connection, and the upper-layer connection/association
    it carries to be established using a compressed form of the information that would
    otherwise be sent on the S-CONNECT exchange. A conceptual parameter is added which
    summarizes the contents of the user-data of the S-CONNECT primitives.
