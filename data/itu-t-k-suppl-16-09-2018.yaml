abstract:
- language: en
  script: Latn
  content: This Supplement provides guidance on the RF-EMF compliance assessment considerations
    for IMT-2020 wireless networks also called as 5G. Given that the 5G technical
    standards have just been finalised and commercial 5G networks are not due to launch
    until 2019 – 2020, the first version of this Supplement is addressing mainly the
    computational assessment options and assessments of trial networks.
