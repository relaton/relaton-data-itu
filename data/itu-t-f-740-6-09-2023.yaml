abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.740.6 specifies the requirements of the Internet
    protocol multimedia subsystem (IMS) early media and extension service (EMES) system.
    It defines the reference framework and requirements for network, user equipment
    (UE), and security of the system. It also describes several typical application
    scenarios including: \r\n–playing the early media before the called party alerting;\r\n–playing
    the early media during the called party alerting;\r\n–playing the early media
    when the call is failed;\r\n–playing the media after the call is answered;\r\n–playing
    the media during the release of the call;\r\n–interactive scenarios.\r\n\r\n"
