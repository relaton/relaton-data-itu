abstract:
- language: en
  script: Latn
  content: 'This Recommendation contains guidelines for the design of public telephone
    terminals for voice communication to make them more usable for older people, whose
    sensory, cognitive and motor functions may have deteriorated. "Public telephones"
    include all telephones that are not in private offices or households, but that
    are generally accessible to many people. These guidelines are derived from the
    requirements of older people that can be identified for each of the steps connected
    to using a public telecommunication terminal: locating it; initiating a call;
    providing payment; identifying oneself and the communication counterpart; actually
    communicating; possibly setting up a further call; terminating the communication.'
