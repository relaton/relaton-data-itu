abstract:
- language: en
  script: Latn
  content: This Recommendation addresses the required functions for network interworking
    between a client Ethernet network and an MPLS server network, specifically the
    user plane interworking mechanisms and procedures. One of the key aspects of network
    interworking is to provide network support for Ethernet services during the evolution
    of networks. Details of the interworking model and required interworking functions
    are described.
