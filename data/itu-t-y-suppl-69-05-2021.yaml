abstract:
- language: en
  script: Latn
  content: "Data models play a critical role in data, applications, systems, and businesses
    across various industries as they provide the definition and format of data to
    support data, computer systems, and related businesses. Supplement 69 to ITU-T
    Y-series Recommendations provides a web-based data model for Internet of things
    (IoT) and smart cities. More specifically, this Supplement covers the following:
    – Suggestions for generic considerations of data format; – Necessity for a new
    type of metadata for interoperability; – Necessity and importance for a common
    data model for bridging existing data models; – Necessity, importance, and adequacy
    of microdata formats for data management in web environments; – Fundamental concepts
    and background of current web environments and microdata formats in terms of structuring
    and managing data in detail; – A new category of metadata, called procedural metadata,
    and its basic principles. \r\n"
