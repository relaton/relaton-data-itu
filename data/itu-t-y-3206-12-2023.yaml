abstract:
- language: en
  script: Latn
  content: "Capability exposure provides functionalities for network functions to
    expose their capabilities to third parties (e.g., users or other operators). Fixed,
    mobile and satellite convergence (FMSC) is the capability that provides services
    and applications to end users regardless of the fixed, mobile or satellite access
    technologies. Recommendation ITU-T Y.3206 specifies the scenarios, requirements,
    reference points, network function enhancements, procedures and security considerations
    of capability exposure for FMSC, in the context of IMT-2020 networks and beyond.\r\n"
