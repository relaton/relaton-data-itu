abstract:
- language: en
  script: Latn
  content: Supplement 17 to ITU-T K-series Recommendations provides background information
    that explains how the various lightning and power fault test configurations and
    electrical values in Recommendation ITU-T K.44 were derived. Examples show how
    test procedures can be minimized by knowing how the surge and power fault test
    conditions can vary with time and voltage. How ITU-T Recommendation K.44 relates
    to its dependent Recommendations is explained.
