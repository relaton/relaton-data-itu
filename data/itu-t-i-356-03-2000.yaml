abstract:
- language: en
  script: Latn
  content: This Recommendation defines parameters for quantifying the ATM cell transfer
    performance of a broadband ISDN connection. It includes adjusted parameter definitions
    that might be used when cells do not conform with the negotiated traffic contract.
    This Recommendation includes provisional performance objectives for cell transfer,
    some of which depend on the user's selection of quality-of-service (QoS) class.
    Recommendation includes the definitions for those QoS classes. Finally, each performance
    objective is allocated to the individual national portions involved in providing
    the international connection.Annexes A, B, C and D provide information about ATM
    adaptation layer performance, information about factors contributing to cell transfer
    delay and cell delay variation, information about performance measurement methods,
    and information about QoS preferences conveyed through signalling.
