abstract:
- language: en
  script: Latn
  content: The purpose of Recommendation ITU-T F.743 is to define a visual surveillance
    service based on IP networks. The visual surveillance service provides the display
    and storage of the video captured by multiple remote cameras over an IP network
    for multiple users. It also provides other functionalities such as remote control
    and alarming. This Recommendation provides the service description, a brief functional
    model, application scenarios and requirements for the visual surveillance service.
    The requirements for the visual surveillance service are derived from the scenarios
    of different applications that a visual surveillance service can support. Therefore,
    the service requirements meet the needs of different kinds of users and enables
    interoperability among visual surveillance systems of different telecom operators
    and units of different vendors.
