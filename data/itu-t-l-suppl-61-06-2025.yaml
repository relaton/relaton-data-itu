- language: en
  script: Latn
  content: "Supplement 61 to the ITU-T L-series Recommendations contains a baseline
    set of definitions of terms commonly used in the context of environmental efficiency
    for artificial intelligence and other emerging technologies. The definitions provide
    a basic characterization of the term, and where appropriate, a note is included
    to provide additional clarity. The concept and rationale for some of the key terms
    and definitions is described in clause 7.\r\n"
