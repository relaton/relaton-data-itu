abstract:
- language: en
  script: Latn
  content: "Supplement 32 to ITU-T K-series Recommendations presents results of case
    studies of radio frequency-electromagnetic field (RF-EMF) exposure levels, including
    fifth generation (5G) systems, taken in different conditions and areas. All results
    of EMF exposure assessment were delivered by ITU-T members and include calculations
    and measurements of the RF-EMF exposure levels in the vicinity of different radio
    communication systems. RF-EMF exposure levels vary depending on the environment
    in which they are taken and type of radio communication systems that are in operation.\r\nThe
    results included in Supplement 32 to ITU-T K-series Recommendations provide information
    about RF-EMF exposure levels in real situations. The EMF exposure assessments
    are included in appendices.\r\nSupplement 32 to ITU-T K-series Recommendations
    aims mainly to resolve the problem of EMF compliance assessments of base station
    systems through typical case studies including computation evaluation and measurement
    evaluation, and also provides the case support on implementation of Supplement
    16 to ITU-T K-series Recommendations and of IEC 62232.\r\n"
