abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T G.9955 contains the physical layer specification
    for narrowband OFDM power line communications transceivers for communications
    via alternating current and direct current electric power lines over frequencies
    below 500 kHz. This Recommendation supports indoor and outdoor communications
    over low voltage lines, medium voltage lines, through transformer low\x1Evoltage
    to medium-voltage and through transformer medium-voltage to low-voltage power
    lines in both urban and in long distance rural communications. This Recommendation
    addresses grid to utility meter applications, advanced metering infrastructure
    (AMI), and other Smart Grid applications such as charging of electric vehicle,
    home automation, and home area networking (HAN) communications scenarios. \r\nThis
    version integrates Recommendation ITU-T G.9955 (12/2011) with its Amendment 1."
