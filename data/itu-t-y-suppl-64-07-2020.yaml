abstract:
- language: en
  script: Latn
  content: "IMT-2020 is rapidly evolving and for many organizations, including administrations,
    it is important to be aware of these new developments. At this stage, it is critical
    to have an awareness on use cases of IMT-2020 and possible migration scenarios
    from existing networks to IMT-2020.\r\nSupplement 64 to the ITU-T Recommendation
    series ITU-T Y.3100.x on IMT-2020 has been developed to provide awareness on use
    cases and migration aspects of IMT-2020. The Supplement was developed by Q5/13
    with initial collaboration of Q20/13."
