abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T M.3340 contains the business to business/customer
    to business (B2B/C2B) interface framework for NGN service fulfilment and assurance
    management in the NGN management view. The framework of the interface across several
    administrative domains in the NGN service supply chain is provided. The interface
    framework is provided using the telecommunications management network (TMN) interface
    specification methodology described in Recommendation ITU-T M.3020, the NGN management
    architecture described in Recommendation ITU-T M.3060/Y.2401, the public B2B business
    operations map described in Recommendation ITU-T M.3050 Supplement 2.
