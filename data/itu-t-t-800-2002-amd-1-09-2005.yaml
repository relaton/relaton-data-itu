abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation | International Standard is to provide
    two additional profiles to ISO/IEC 15444-1:2004 for digital cinema applications.
    The first new profile describes codestream restrictions for 2K motion pictures,
    while the second profile describes codestream restrictions for 4K motion pictures.
    2K motion pictures are characterized by a maximum frame size of 2048 ? 1080, while
    4K motion pictures are characterized by a maximum frame size of 4096 ? 2160. The
    two profiles are necessary to limit the scope of decoder implementations for motion
    picture distribution and exhibition.
