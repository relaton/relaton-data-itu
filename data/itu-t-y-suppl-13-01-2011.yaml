abstract:
- language: en
  script: Latn
  content: 'This Supplement describes various scenarios for evolution of NGN to enhanced
    network capabilities by introducing new technologies and/or new business models.
    The following enhanced capabilities of NGN are considered: information delivery,
    information storage and information processing. These enhanced capabilities can
    bring new services for the end user and better performance for the NGN itself.
    Some key use cases of the enhanced network capabilities are introduced from different
    perspectives: enhanced capability itself, provisioning of the enhanced capability
    and consumption of the enhanced capability.'
