abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.265.2 contains an accompanying reference software
    for Rec. ITU-T H.265 | ISO/IEC 23008-2 High efficiency video coding. The reference
    software includes both encoder and decoder functionality.\r\n\r\nReference software
    is useful in aiding users of a video coding standard to establish and test conformance
    and interoperability, and to educate users and demonstrate the capabilities of
    the standard. For these purposes, the accompanying software is provided as an
    aid for the study and implementation of Rec. ITU‑T H.265 | ISO/IEC 23008-2. This
    edition of ITU-T H.265.2 matches the technical descriptions in the second edition
    of ITU-T H.265 (2014-10).\r\n\r\nThe software has been jointly developed by the
    ITU-T Video Coding Experts Group (VCEG, Question 6 of ITU-T Study Group 16) and
    the ISO/IEC Moving Picture Experts Group (MPEG, Working Group 11 of Subcommittee
    29 of ISO/IEC Joint Technical Committee 1). It was developed jointly with MPEG
    and corresponds in a technically aligned manner to ISO/IEC 23008‑5.\r\n\r\nThe
    Reference source code for ITU-T H.265.2 is found in the electronic attachment
    to this Recommendation.\r\n"
