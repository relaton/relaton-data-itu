abstract:
- language: en
  script: Latn
  content: This Recommendation defines general arrangements for interworking between
    networks providing Frame Relay Data Transmission Services (FRDTS) and B-ISDN.
    It includes reference configurations, protocol stacks, FR/ATM element mapping
    and other general arrangements required for various interworking scenarios between
    the two types of networks. In particular, it focuses on the cases where dedicated
    Frame Relay networks are involved in such interworking scenarios.
