abstract:
- language: en
  script: Latn
  content: This amendment comprises the following changes:a) The T.30 Indicator is
    mandatory.b) Annex B is modified to clarify the TCP Start-up.c) The ASN.1 text
    in Annex B is removed. A reference to ITU-T H.245 V7 replaces it.d) ITU-T.38 version
    number is 2, and the table introduced in Amendment 3 is updated.
