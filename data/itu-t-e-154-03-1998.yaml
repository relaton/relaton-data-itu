abstract:
- language: en
  script: Latn
  content: The International Shared Cost Service (ISCS) enables an ISCS customer in
    one country to be assigned one or more special telephone numbers in other countries
    which allow ISCS callers in those countries to call the ISCS customer at a rate
    equivalent to a national call charge in the country of origin. All other service
    and call-related charges are paid by the ISCS customer.This Recommendation provides
    the service description for the International Shared Cost Service (ISCS), along
    with information on the service ordering process and other service operational
    aspects.
