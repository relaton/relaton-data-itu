abstract:
- language: en
  script: Latn
  content: "Supplement 96 to ITU-T Y-series Recommendations provides the standardization
    roadmap for machine learning (ML) in the information and communication technologies
    area. This ML standardization roadmap has been developed to assist in the development
    of ML related standards in the information and communication technology (ICT)
    fields by providing information about existing and under development standards
    in key standards development organizations (SDOs). In addition, it provides the
    overviews of ML and ML related technical areas from the standards perspective,
    ML related activities in standards development organizations (SDOs) and gap analysis.\r\n"
