abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T E.164.2 contains the criteria and procedures for
    an applicant to be temporarily assigned a three-digit identification code within
    the shared ITU-T E.164 country code 991 for the purpose of conducting an international
    non-commercial trial. The purpose of the trial will be to determine the viability
    of a proposed new international public correspondence service.\r\nThe 2024 revision
    of this Recommendation clarifies the conditions for reclamation in the case of
    nonpayment of membership fees.\r\n"
