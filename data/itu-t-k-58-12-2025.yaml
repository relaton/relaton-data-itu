abstract:
- language: en
  script: Latn
  content: "With the liberalization of telecommunications and the convergence of information
    technology (IT) and communication equipment, many services are provided by several
    operators on the same cable and within the same location. Equipment owned by different
    operators is installed in the same telecommunication facilities and information
    and communication technology (ICT) installations and, in many cases, is interconnected.
    Therefore, problems related to electromagnetic compatibility (EMC), resistibility
    and safety can occur.\r\nRecommendation ITU-T K.58 describes the necessary steps
    to ensure safe and problem-free operation in colocated ICT installations from
    EMC, resistibility and safety points of view.\r\nThis Recommendation also gives
    guidance for determining responsibility for EMC problems in colocated ICT installations.\r\n"
