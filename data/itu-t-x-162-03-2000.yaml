abstract:
- language: en
  script: Latn
  content: This Recommendation is one of a set of Recommendations for the customer
    network management service for data networks, which cover the architecture, services,
    and management information required to achieve such services between a network
    and a customer.This Recommendation is, in particular, concerned with the definition
    of information for the customer network management service, such as managed objects,
    attributes, name bindings, in the OSI Systems Management context (CMISE).This
    Recommendation corresponds to Recommendation X.163, which defines management information
    to be used with the CNMe interface.
