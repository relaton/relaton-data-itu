abstract:
- language: en
  script: Latn
  content: This Recommendation describes general work methods for ITU-T study groups.
    It provides guidelines related to work methods, such as the conduct of meetings,
    preparation of studies, management of study groups, Joint Coordination Groups,
    the role of Rapporteurs and the processing of ITU-T contributions and temporary
    documents.This revision provides for submission and processing of a single type
    of input contribution. Contributions are submitted by Member States, Sector Members
    and Associates, while other documents are submitted as temporary documents. This
    revision also provides procedures for preparation of liaison statements between
    scheduled meetings.
