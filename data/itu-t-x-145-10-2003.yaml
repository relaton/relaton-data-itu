abstract:
- language: en
  script: Latn
  content: This Recommendation defines performance parameters for quantifying the
    connection establishment and disengagement performance of a frame relay Switched
    Virtual Connection (SVC) service. These include call control delay and accuracy
    and dependability parameters. The defined parameters are used in combination with
    the user information transfer performance parameters defined in ITU-T Rec. X.144
    to fully quantify SVC service performance.This revision was undertaken to take
    account of the development of ITU-T Rec. X.147 which specifies network availability
    objective values together with techniques for assessing frame relay network availability.
    Information previously pertaining to SVC availability has been moved to ITU-T
    Rec. X.147.
