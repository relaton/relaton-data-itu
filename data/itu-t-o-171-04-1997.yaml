abstract:
- language: en
  script: Latn
  content: The requirements for the characteristics of the jitter and wander measuring
    equipment which are described below must be adhered to in order to ensure compatibility
    between equipment produced by different manufacturers.While requirements are given
    for the equipment, the realization of the equipment configuration is not covered
    and should be given careful consideration by the designer and user. In particular,
    it is not required that all features listed below shall be provided in one piece
    of equipment. Users may select those functions which correspond best to their
    applications.
