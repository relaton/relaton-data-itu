abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Z.103 defines the shorthand and annotation features
    of the Specification and Description Language. Together with Recommendations ITU-T
    Z.100, ITU-T Z.101, ITU-T Z.102, ITU-T Z.104, ITU-T Z.105, ITU-T Z.106 and ITU-T
    Z.107, this Recommendation is part of a reference manual for the language. The
    language defined in this document covers features of the language not included
    in Basic SDL-2010 in Recommendation ITU-TZ.101 or Comprehensive SDL-2010 in Recommendation
    ITU-T Z.102. Features defined in this Recommendation either do not have their
    own abstract grammar and are transformed to concrete grammar defined by Recommendations
    ITU-T Z.101, ITU-T Z.102 and ITU-T Z.104 (and ITU-T Z.107 for object-oriented
    data), or are annotations with no formal meaning. \r\n"
