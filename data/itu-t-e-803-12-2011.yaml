abstract:
- language: en
  script: Latn
  content: "Performance data on the non-utilization stages of services, in addition
    to the service specific performance usually dealing with in-use performance, are
    necessary to enable customers to choose a service provider (SP) most suited to
    meet their specific quality of service (QoS) requirements. Recommendation ITU-T
    E.803 lists 88 generic parameters over the product life cycle of ICT services
    which will enable a regulator, stakeholder or any interested party to select a
    pertinent number of parameters about the SP that provide performance data. \r\n\r\nQoS
    performance on non-utilization stages can benefit customers, regulators, stakeholders
    and service providers (SPs) to monitor performance levels for the benefit of the
    customers and ICT industry. The essential information to be obtained for measurement
    and reporting of performance levels is illustrated on a selection of parameters.
    Guidance on presentation of performance results is also provided. Service providers
    reporting of delivered performance to a recommended procedure will enable comparability
    among providers."
