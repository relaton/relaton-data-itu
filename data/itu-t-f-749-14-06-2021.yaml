abstract:
- language: en
  script: Latn
  content: Civilian unmanned aerial vehicle (CUAV) coordination refers to utilizing
    the coordination of multiple CUAVs to accomplish specific tasks through network
    communication. To enable CUAVs to cooperate well and accomplish tasks successfully,
    three important parts need to be fulfilled. First, a stable and reliable network
    connection is required to be established among CUAVs to ensure that every CUAV
    can connect to the others; second, efficient and reliable data transmission among
    CUAVs is required so as to ensure that the perception information, control information,
    coordination information and other required information is exchanged among CUAVs;
    finally, a CUAV collaborative task execution strategy is required to be reasonably
    worked out during the coordination process in order to improve the efficiency
    and quality of collaborative task execution. Recommendation ITU-T F.749.14 specifies
    the requirements of CUAV coordination, including the requirements of network connection
    among CUAVs, the requirements of data transmission among CUAVs, and the requirements
    of CUAV collaborative task execution.
