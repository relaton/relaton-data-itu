abstract:
- language: en
  script: Latn
  content: This ITU-T Recommendation addresses the framework architecture for interworking
    of IP-based networks with non-IP networks. The service plane concept applied for
    interworking is defined in terms of both service and network interworking. General
    interworking scenarios for service interworking and network interworking are also
    identified. Details of the interworking model and required interworking functions
    are described for the case of B-ISDN, N-ISDN or PSTN interworking with IP-based
    networks.
