abstract:
- language: en
  script: Latn
  content: This Technical Corrigendum addresses a defect in ITU-T Rec. X.681 | ISO/IEC
    8824-2 that was identified when resolving ballot comments on ITU-T Rec. X.680
    (2002)/Amd.3 | ISO/IEC 8824-1:2002/Amd.3 (time types amendment).The time types
    amendment has (inter alia) added new built-in type reference names to ITU-T Rec.
    X.680 | ISO/IEC 8824-1, but there is a copy of built-in ASN.1 type reference names
    in ITU-T Rec. X.681 | ISO/IEC 8824-2, 10.6, preventing the use of such names as
    a "Literal" in order to avoid ambiguity. This list needs to be updated to include
    the new built-in time type reference names.This Technical Corrigendum updates
    the list in ITU-T Rec. X.681 | ISO/IEC 8824-2, 10.6, and also corrects a cross-reference
    to ITU-T Rec. X.680 | ISO/IEC 8824-1 which was also noted to be in error.
