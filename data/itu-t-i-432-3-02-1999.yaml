abstract:
- language: en
  script: Latn
  content: This Recommendation covers Physical Layer characteristics for transporting
    ATM cells using existing Primary Rate ISDN systems. It includes both 1544 and
    2048 kbit/s interfaces at the TB and SB reference points of the B-ISDN User-Network
    Interface (UNI). These Physical Layer characteristics may be used to take advantage
    of existing transmission equipment and building wiring.This Recommendation is
    part of the I.432-series, and includes references to Recommendation I.432.1 on
    general characteristics, and Recommendation I.432.2 on OAM aspects.
