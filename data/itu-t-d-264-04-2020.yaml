abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T D.264 proposes a set of possible methods to help
    telecommunication providers save costs and enhance efficiency through the shared
    uses of the telecommunication infrastructure, including passive and active infrastructure
    sharing, and including when enabled by aggregation of frequency bands assigned
    to operators who have acquired property rights over the spectrum to enable active
    infrastructure sharing implementation. \r\n"
