abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T P.1320 advises on aspects of importance for quality
    of experience (QoE) assessment of telemeetings with extended reality elements.
    The goal is to define the human, context and system factors that affect the choice
    of the QoE assessment procedure and metrics when extended reality telemeeting
    systems are under evaluation.
