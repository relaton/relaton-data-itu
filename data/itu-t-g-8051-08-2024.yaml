abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T G.8051 addresses management aspects of the Ethernet
    transport (ET) capable network element containing transport functions of one or
    more of the layer networks of the Ethernet transport network. The management of
    the Ethernet layer networks is separable from that of its client layer networks
    so that the same means of management can be used regardless of the client. The
    management functions for fault management, configuration management, performance
    monitoring and security management are specified.\r\nThe 2009 revision of this
    Recommendation added the management of additional transport functions that were
    introduced in the 2009 revision of Recommendation ITUT G.8021/Y.1341.\r\nThe 2013
    revision of this Recommendation added the management of additional functions,
    including: client signal fail (CSF); proactive loss measurement using loss measurement
    message (LMM)/loss measurement reply (LMR); proactive delay measurement using
    delay measurement message (DMM)/delay measurement reply (DMR) and one-way delay
    measurement (1DM); synthetic loss measurement using synthetic loss message (SLM)/synthetic
    loss reply (SLR) and one-way synthetic loss measurement (1SL) (proactive and on-demand);
    performance management (PM) requirements on protocol data unit (PDU) generation
    type, message period, measurement interval, repetition period, start time, stop
    time and session duration; and PM data collection requirements.\r\nThe 2015 revision
    of this Recommendation updated the management information (MI) signals for the
    ETHx_FT function in clause 8.5, the MI signals for the ETHx/MCC function in clause
    8.6, the one-way synthetic loss measurement (1SL) management information (MI)
    signal for the ETHDe_FT_Sk function in clause 8.8 and the on-demand and proactive
    loss measurement requirements in clause 10.2.\r\nThe 2018 revision of this Recommendation
    updated the fault cause persistency function at the ETH connection (ETH-C) function
    for ring protection, the configuration management for protection switching and
    connection functions. Finally, in alignment with Recommendation ITUT G.8021/Y.1341,
    this revision removed both fault management functions and the management information
    (MI) signals that are related to ETYn_TT, ODUkP-X-L/MT_A and ETYn/ETH_A. This
    revision also removed the MI signals to activate processes in adaptation functions
    (i.e., MI_Active).\r\nThe 2020 revision of this Recommendation has updated clause
    6 to clause 8 by referring to Recommendation ITU-T G.7710/Y.1701; the fault cause
    persistency function, and the provisioning and reporting for adaptation functions
    for FlexE related functions as defined in Recommendation ITUT G.8023; and transferring
    ODU related adaptation functions in some tables to Recommendation ITU-T G.874.\r\nITU-T
    G.8051/Y.1345 (2020) Amendment 1 (2023) updated the fault cause persistency function;
    alarm reporting control function; operational state function in clause 7; the
    provisioning and reporting for flow termination and adaptation functions in clause
    8 in alignment with ITU-T G.8021 and ITUT G.8023. Also, this Amendment created
    clause 8.14 \"Administrative state\" in alignment with ITUT G.7710.\r\nITU-T G.8051/Y.1345
    (2020) Corrigendum 1 (2024) removed 4 MIs of ETHx-Np/ETH-LAG-Na_A_Sk in Table
    8-3 because they should not be in this table as they are already in Table10-1.
    \r\nThe 2024 revision of this Recommendation has updated LM related MIs in Table
    8-1, some default values in CSF related MIs ain Table8-3, and OAM-related Priority
    MIs in Table 8-1, Table 8-2 and Table 8-3.2.\r\n"
