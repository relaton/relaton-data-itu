abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Z.169 defines the mapping rules for W3C Schema to
    TTCN-3 to enable testing of XML-based systems, interfaces and protocols.This first
    revision of the Recommendation contains numerous amendments (conformance and compatibility,
    mapping of namespaces, import and include elements and the control namespace,
    support of element and type substitutions, mapping of the use, nillable, block
    and blockDefault, final and finalDefault and substitutionGroup, processContents
    attributes, description of the encoding instructions),clarifications (e.g., new
    definitions, name conversion rules, mapping of different XSD elements and attributes),
    corrigenda and editorial corrections.This Recommendation is technically aligned
    with ETSI ES 201 873-9 V4.2.1 (2010-07).
