abstract:
- language: en
  script: Latn
  content: Telecommunication charge cards may be issued by Operating Agencies (OAs)
    to allow customers to use their card in connection with various international
    services at appropriate charges for each transaction and have the charges billed
    to their account in the country where the OA issued the charge card. Cards issued
    by OAs in accordance with this Recommendation conform to the appropriate ISO standards.This
    Recommendation has been revised to allow alternative, application-specific standards
    for IC cards where unique form factors require such alternatives.
