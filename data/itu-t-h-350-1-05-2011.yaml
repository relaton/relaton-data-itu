abstract:
- language: en
  script: Latn
  content: "This Recommendation describes an LDAP schema to represent H.323 endpoints.
    It is an auxiliary class related to ITU-T Rec. H.350 and derives much of its functionality
    from that architecture. Implementors should review ITU-T Rec. H.350 in detail
    before proceeding with this Recommendation. Its attributes include all H.323 Alias
    types. These aliases can be downloaded to an endpoint for automatic configuration,
    accessed by a gatekeeper for call signalling and authorization, and published
    to white pages to create user dialling directories.\r\n\r\nThe scope of this Recommendation
    does not include normative methods for the use of the LDAP directory itself or
    the data it contains. The purpose of the schema is not to represent all possible
    data elements in the H.323 protocol, but rather to represent the minimal set required
    to accomplish the design goals enumerated in ITU-T Rec. H.350.\r\n\r\nThis revised
    version of H.350.1 introduces several enhancements and clarifications to the previous
    version, primarily addition of X.500 directories support and clarification of
    h323IdentitypartyNumber."
