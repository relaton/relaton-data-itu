abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.751.8 defines the technical framework for distributed
    ledger technology (DLT) to cope with regulation, including regulatory challenges
    and technical capacities. The design of the technical framework of DLT in this
    Recommendation is closely related to DLT properties including decentralization,
    immutability and openness. This Recommendation can be used as guidance for the
    DLT system when facing regulation for DLT service providers and DLT system developers.
