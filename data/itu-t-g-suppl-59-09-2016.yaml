abstract:
- language: en
  script: Latn
  content: This document provides guidance regarding the long term reliability of
    cabled optical fibres. This document uses currently accepted models combined with
    current experience to describe items that can impact the performance of an optical
    fibre over time. The document describes “optical reliability” for fibres, “mechanical
    reliability” for fibres and describes how optical cables impact these properties.
