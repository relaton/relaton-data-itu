abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.1112 specifies functional requirements of a digital
    video convergence service (DVCS) based on the Internet protocol (IP) including
    IP-based switched digital video technologies taking into consideration a convergence
    environment.\r\nAs digital broadcasting services have been rapidly deployed, many
    service operators are considering more effective transmission of digital broadcasting
    services. Recently, digital broadcasting services have been changed to use resources
    efficiently and transmit them to easily accommodate the varying needs and environments
    of subscribers. Therefore, it is necessary to redefine the advanced IP-based DVCS
    to maintain quality of service (QoS) and using bandwidth effectively for transmission
    on broadband network environment.\r\nThe IP-based DVCS is a service mechanism
    for distributing digital video via IP-based broadband networks. It is the service
    mechanism for providing interfaces and functionalities to enable the service operators
    to offer QoS-guaranteed broadcasting to subscribers via IP-based converged broadband
    networks.\r\n\r\n"
