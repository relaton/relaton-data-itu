abstract:
- language: en
  script: Latn
  content: This Recommendation "Transmission systems for interactive cable television
    services" extends the scope of Recommendation J.83 "Digital multi-programme systems
    for television, sound and data services for cable distribution" to make provision
    for bidirectional data over coaxial and hybrid fibre-coax cables for interactive
    services. Like Recommendation J.83, this Recommendation also contains several
    annexes in recognition of different existing media environments. The annexes in
    this Recommendation are intended to be read in conjunction with the corresponding
    annexes in Recommendation J.83.It is recommended that for the introduction of
    fast Internet access and/or interactive cable television services, the systems
    in this Recommendation be used to achieve the benefits of economies of scale and
    facilitate interoperability.
