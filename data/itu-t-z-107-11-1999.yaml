abstract:
- language: en
  script: Latn
  content: 'Scope-objectiveThis Recommendation defines how to use ASN.1 embedded in
    SDL. The intention is to allow an SDL user to declare SDL types using directly
    ASN.1 data definitions and type constructors, and to describe SDL actions using
    directly the ASN.1 value constructors. This Recommendation is an extension of
    Recommendations Z.100 (1999) and Z.105 (1999).CoverageThis Recommendation details
    the extensions to the Z.100 production rules related to data definition, type
    constructor and extended primary expression.ApplicationsThe main area of application
    of this Recommendation is the specification and design of telecommunication systems.
    ASN.1 embedded in SDL permits a coherent use of ASN.1 when building SDL models.Status
    and stabilityThis Recommendation is the complete reference manual describing the
    in-line use of ASN.1 in SDL. It has to be considered jointly with Recommendations
    Z.100 (1999) and Z.105 (1999).Changes to either Recommendation X.680, or Recommendation
    Z.100 or Recommendation Z.105 may require modifications to this Recommendation.Associated
    work- Recommendation Z.100 (1999): SDL;- Recommendation Z.105 (1999): SDL combined
    with ASN.1 modules;- Recommendation X.680: ASN.1.'
