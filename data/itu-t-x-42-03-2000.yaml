abstract:
- language: en
  script: Latn
  content: "This Recommendation puts forth the definition and framework for providing
    access to a Public Data Network (PDN) by a DTE operating under the control of
    a generalized polling protocol, via the use of a Packet Assembly/Disassembly (PAD)
    device situated within (or associated with) the PDN. The PAD supporting the generalized
    polling protocol aspect is referred to as a \"GPAD\". The generalized polling
    environment provides support for access, along with basic requirements necessary
    within the PAD to enable the selection and modification of the protocol Aspect.
    This Recommendation has been developed in realization that a well-established
    base of 10s of 1000s of DTEs operating under control of a generalized polled protocol
    have need to access a PDN. This Recommendation enables these terminals to communicate
    over the public data network. This work is also an expansion on related work undertaken
    in ITU-T X.8 and X.28.\r\nThe revision to this Recommendation has introduced the
    definition and framework for higher layer protocol communication via ITU-T X.42.
    \ In particular, this will allow Internet Protocol enabled (IP) devices to access
    their corresponding networks over the generalized polling protocol defined under
    ITU-T X.42.\r\n"
