abstract:
- language: en
  script: Latn
  content: "There are many Internet of things (IoT) platforms to process and manage
    the same IoT data in different stages and in different areas. In traditional solutions,
    each IoT platform usually stores its activity logs for IoT data processing and
    management (IoT DPM) within its storage separately. These activity logs are separated
    and managed by the IoT platforms. Therefore, their accessibility and trustworthiness
    are not guaranteed, and it is not easy to trace the activities related to IoT
    DPM in the full lifecycle of the activity logs that are stored and managed by
    different IoT platforms.\r\nIn order to trace IoT DPM activities, different IoT
    platforms may use the same activity log storage and related functionalities. Activity
    log management (ALM) enabled by blockchain technologies provides functionalities
    to manage the full lifecycle of activity logs for IoT DPM across IoT platforms.
    Different IoT platforms can individually save activity logs of IoT DPM in trustworthy
    shared storage via the ALM for IoT DPM. When they read activity logs of IoT DPM
    via the ALM, they can obtain all the relevant activity logs of IoT DPM, across
    their full lifecycle, from trustworthy shared storage via the ALM for IoT DPM,
    if authorized. The ALM and the trustworthy shared storage are based on blockchain
    technologies and can protect the activity logs from being tampered with. The ALM
    can facilitate IoT platforms' storing and tracing of activity logs of IoT DPM
    across their full lifecycle, transparently and in a trustworthy manner.\r\nRecommendation
    ITU-T Y.4508 presents a blockchain-based ALM for IoT data processing and management
    and specifies its characteristics, functional requirements and architecture.\r\n"
