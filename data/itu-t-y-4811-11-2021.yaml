abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4811 is intended to develop a converged identification
    and authentication service to overcome relevant challenges in decentralized Internet
    of things (IoT) identification and authentication management systems, so as to
    ensure efficient communication among IoT devices and services in decentralized
    environments. The challenges in decentralized environments are to support effective
    and efficient interactions (e.g., secured interoperability, scalability, low latency,
    etc.) among a huge number of IoT devices and IoT services, which are using different
    decentralized IoT identification and authentication systems.\r\nThis Recommendation
    introduces a converged service for identification and authentication for IoT devices
    in decentralized environment (CSIADE), and provides relevant common characteristics,
    general requirements, functional architecture, main capabilities and procedures
    of CSIADE. CSIADE can facilitate IoT devices and IoT services to identify and
    authenticate each other in IoT decentralized environments when they use the same
    or different types of decentralized IoT identification solutions.\r\n"
