abstract:
- language: en
  script: Latn
  content: This Recommendation provides some reference architectures for existing
    and future public land mobile telecommunication networks (PLMN) and also provides
    a high level reference connection for Future Public Land Mobile Telecommunication
    Systems (FPLMTS) call/connection setup. The primary purpose of the reference connection
    is to provide a basis for developing traffic Grade of Service (GOS) Recommendations
    for networks supporting mobile services. The underlying FPLMTS call flow model
    in the reference connection should be used as a basis for more implementation-specific
    configurations for detailed performance analysis and GOS target setting.
