abstract:
- language: en
  script: Latn
  content: "Supplement 26 to ITU-T P-series Recommendations concerns subjective quality
    assessment of telemeeting systems that provide audio-only or audio-visual communication
    for multiple parties. The term multiple parties refers to more than two meeting
    participants who can be located at two, or more than two, locations.\r\nEvaluation
    of those systems can focus on audio-only, video-only, or audio-visual quality
    aspects and non-interactive or conversational quality can be assessed. \r\nThis
    supplement provides example test scenarios that can be used to conduct conversation
    tests for multiparty audio-only telemeetings.\r\n"
