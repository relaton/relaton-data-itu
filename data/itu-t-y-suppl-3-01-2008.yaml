abstract:
- language: en
  script: Latn
  content: This Supplement defines service scenarios for convergence services in a
    multiple network and application service provider environment, and it defines
    convergence terminal capabilities for describing convergence service scenarios.
    In addition, the deployment architecture for a multiple network and application
    service provider environment is described. Finally, typical scenarios of convergence
    services on the contents level and functional level, such as personal broadcasting
    services and event driven services, are introduced.
