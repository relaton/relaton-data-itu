abstract:
- language: en
  script: Latn
  content: Transmission-induced scan line errors are one of the important impairments
    perceived by customers in non-Error Correction Mode (see Recommendations T.4 and
    T.30) Group 3 facsimile. This proposed text develops a set of scan line related
    performance metrics that can help benchmark the performance of transmission networks
    with respect to Group 3 facsimile.In this text, certain criteria are developed
    for declaring a received facsimile page Error-Free, Errored, and Severely-Errored.
    These criteria are based on the number and distribution of errored scan lines
    and were developed based on customer perception studies of facsimile images.
