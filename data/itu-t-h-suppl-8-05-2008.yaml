abstract:
- language: en
  script: Latn
  content: Supplement 8 to ITU-T H-series Recommendations defines a time coordination
    function that may be used by an application process and/or a gateway control protocol
    in a decentralized gateway environment such as ITU-T H.248 decomposed gateways.Within
    the working assumptions defined, this supplement establishes a time coordination
    function model, addressing the components of a generic time service involving
    communication between gateway and gateway controller entities that relate the
    service and generic definitions provided by this function to the user requirements.
    It also identifies time synchronization protocols. The scope of this supplement
    is on "time of day" information, not on other elements related to timing. Further
    more, the provision of time information within a local system and implementation
    aspects are also out of the scope of this supplement.
