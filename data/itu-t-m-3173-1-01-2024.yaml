abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3173.1 specifies interface requirements for synergy
    management of cloud and networks based on software-defined networking (SDN). Recommendation
    ITU-T M.3173.1 describes the interface position for the synergy management system,
    and synergy management scenarios for cloud and SDN-based networks. Recommendation
    ITU-T M.3173.1 also specifies the management interface requirements and the related
    use cases for the synergy management interface at a technology independent level
    (protocol neutral).\r\n"
