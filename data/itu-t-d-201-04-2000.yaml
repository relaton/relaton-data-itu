abstract:
- language: en
  script: Latn
  content: Owing to the fact that the telecommunication industry has witnessed considerable
    advances, it has enabled Administrations to offer various options to customers,
    including call-back practices. Some of these practices are considered illegal
    by some Administrations, while they are accepted in the more liberalized countries
    and markets.This Recommendation sets out principles for Administrations to follow
    while providing or permitting the provision of call-back practices, taking into
    consideration the guidelines contained in Resolution 21 of Kyoto 1994, Resolution
    29 of WTSC-96, Resolution 22 of WTDC-98 and Resolution PLEN/5 of Minneapolis 1998.
