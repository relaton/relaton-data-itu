  content: This Supplement compares different types of methodologies for service modelling
    to determine their suitability in relation to protocol development for IN in the
    IN CS-4 time-frame. It also investigates the evolution from SIB based techniques
    and considers different technologies such as APIs.This Supplement supplements
    the information contained within Recommendation Q.65.RationalThe purpose of this
    Supplement is to provide a discussion of service modelling aspects related to
    IN CS-4.
