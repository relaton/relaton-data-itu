abstract:
- language: en
  script: Latn
  content: "ISO/IEC 23008-12 specifies a framework for the interchange of images and
    image sequences using tools defined in the International Organization for Standardization
    (ISO) base media file format (ISO/IEC 14496-12), which is commonly used worldwide.
    This framework is defined independently of the formats of the images and image
    sequences, allowing a wide range of such formats to be used in combination with
    ISO/IEC 23008-12.\r\n\r\nTo simplify the use of the JPEG 2000 family of image
    formats (Rec. ITU-T T.8xx series | ISO/IEC 15444) in applications that use the
    ISO base media file format, this Recommendation | International Standard specifies
    the encapsulation of these image formats in the framework defined in ISO/IEC 23008-12.\r\n\r\nRecommendation
    ITU-T T.815 (2019) is a common text with ISO/IEC 15444-16:2019, both in their
    first edition."
