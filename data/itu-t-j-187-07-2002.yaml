abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the general transport mechanism for conveying
    all the service elements required for contribution and primary distribution applications
    of TV programs whose vertical resolution is quite high compared to 525/60 or 625/50
    television systems (e.g. 1125/60 system) using the MPEG-2 4:2:2 profile or Main
    profile at High level compression. The service elements provided to MPEG-2 coding
    systems are assumed to be (4:2:2) component video signals, studio quality audio
    signals and various data signals, e.g. time code. This Recommendation ensures
    the compatibility on the level of the bit-stream into a decoder. It is based on
    and is in conformity with the MPEG-2 standard ITU-T Rec. H.222.0 | ISO/IEC 13818-1.
