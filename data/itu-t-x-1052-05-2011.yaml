abstract:
- language: en
  script: Latn
  content: The Recommendation describes and recommends the framework of information
    security management for telecommunications to support Recommendation ITU-T X.1051
    and other Recommendations ITU-T X.1055 etc. Information security management framework
    (ISMF) is based on a process approach to describe a set of security management
    areas which gives guidelines to telecommunications to fulfill the control object
    defined in Recommendation ITU-T X.1051 and other Recommendations ITU-T X.1055
    etc. The management areas include asset management, incident management, risk
    management, policy management and so on, which map the controls defined by Recommendation
    ITU-T X.1051 to the implementation methodologies, so ISMF relates the Recommendation
    ITU-T X.1051 which gives the baselines for the telecommunications and other Recommendations,
    such as ITU-T X.1055 and ITU-T X.1056, which gives the practical methodologies
    focusing on a specific area of information security management.
