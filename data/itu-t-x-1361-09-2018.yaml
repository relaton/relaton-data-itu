abstract:
- language: en
  script: Latn
  content: "The Internet of Things (IoT) is a global infrastructure for the information
    society, enabling advanced services by interconnecting (physical and virtual)
    things based on existing and evolving interoperable information and communication
    technologies. \r\n\r\nRecommendation ITU-T X.1361 describes a security framework
    for the Internet of things (IoT) using security gateways. This Recommendation
    analyses security threats and challenges in an IoT environment, and describes
    capabilities that could address and mitigate these threats and challenges. A framework
    methodology is provided for determining which security capabilities are required
    for mitigating and addressing these threats and challenges for the IoT.\r\n"
