abstract:
- language: en
  script: Latn
  content: 'This supplement provides a technical framework based on real-time blocking
    list (RBL) for countering Voice over Internet Protocol (VoIP) spam, which consists
    of four functional entities: VoIP spam prevention system (VSPS), VoIP spam prevention
    policy server (VSPPS), RBL central system for VoIP spam prevention (VSP-RBL),
    and user reputation system (URS). This supplement also specifies the functionalities,
    procedures, and interfaces of each functional entity for countering VoIP spam.'
