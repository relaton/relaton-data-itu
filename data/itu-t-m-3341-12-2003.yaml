abstract:
- language: en
  script: Latn
  content: This Recommendation addresses end-to-end Quality of Service (QoS) information
    collection, aggregation and exchange between Service Customers, Service Providers
    and Network Operators. In the context of this Recommendation, Service Providers
    (SPs) include Telecom SPs, Internet SPs, Application SPs and Content SPs. Service
    Customers include end-Customers and other SPs. Functions and interfaces required
    to ensure end-to-end QoS classes are specified for the complete service life cycle.
