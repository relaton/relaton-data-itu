abstract:
- language: en
  script: Latn
  content: "\r\nRecommendation ITU-T Y.1540 defines the parameters that may be used
    in specifying and assessing the performance of speed, accuracy, dependability
    and availability of IP packet transfer of regional and international Internet
    protocol (IP) data communication services. The defined parameters apply to an
    end-to-end, point-to-point IP service and to the network portions that provide,
    or contribute to the provision of, such a service in accordance with the normative
    references specified in clause 2. Connectionless transport is a distinguishing
    aspect of the IP service that is considered in this Recommendation. \r\n\r\nFollowing
    over 20 years as an in-force Recommendation, the 2019 edition recognizes many
    changes in the design of IP services and in the protocols employed by end users.
    It introduces the new Annex A that defines IP-layer capacity parameters in ways
    that cater toward assessment, and provides requirements for methods of measurement
    of IP-layer capacity. This new annex is the result of years of study, and application
    of ITU-T Study Group 12 principles of accurately evaluating performance parameters
    and methods of measurement against a \"ground truth\" reference in laboratory
    and field measurements. Flow-related throughput parameters and methods of measurement
    (reliable delivery transport), remain for further study, and the text makes a
    clear distinction between this IP-layer capacity parameters. In the same way,
    parameters describing performance of a specific reliable transport layer protocol
    (TCP) remain for further study, and recognize that reliable transport protocols
    for the Internet are constantly changing and the subject of ongoing research.\r\n\r\nAnnex
    B provides a second, more capable search algorithm for the IP capacity method
    of measurement defined in Annex A.\r\n \r\n\r\n\r\n"
