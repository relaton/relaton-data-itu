abstract:
- language: en
  script: Latn
  content: The intention of this Recommendation is to address telecommunication issues
    that are encountered by people with disabilities. Telecommunications providers
    will be challenged with the opportunity of addressing the service requirements
    of this growing population. This initiative might also contribute to the requirements
    of the percentage of the population, ranging from 4-12%, that has some form of
    severe physical impairment.
