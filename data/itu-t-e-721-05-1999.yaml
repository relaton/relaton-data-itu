abstract:
- language: en
  script: Latn
  content: This Recommendation provides network Grade of Service (GOS) parameters
    for circuit-switched services in ISDN, based on the ISDN Grade of Service concept
    and guidelines for selecting GOS parameters provided in Recommendation E.720.
    The parameter values assume that the network and the components are fully operational
    and take account of the evolving nature of the ISDN and Signalling System No.
    7 capabilities.This version of this Recommendation includes revised parameters
    for GOS target values for circuit-switched services in the evolving ISDN.
