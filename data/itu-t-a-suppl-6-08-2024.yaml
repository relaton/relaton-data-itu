abstract:
- language: en
  script: Latn
  content: "Supplement 6 to the ITU-T A-series Recommendations provides guidelines
    for ITU-T study groups to develop a standardization gap analysis based on standards
    developed by other ITU study groups or other standards development organizations.
    A standardization gap analysis may be beneficial for a study group when considering
    new areas of work (e.g., establishing a new Question, establishing a focus group,
    adding a new work item to its work programme). A focus group may also develop
    a standardization gap analysis.\r\n"
