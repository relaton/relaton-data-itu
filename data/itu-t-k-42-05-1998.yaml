abstract:
- language: en
  script: Latn
  content: This Recommendation explains the basic principles on which EMC standardization
    is based in ITU-T taking into account EMC standards published by IEC and CISPR.
    It describes procedures which are followed in the preparation of ITU-T Recommendations
    on Electromagnetic Compatibility (EMC) requirements which apply to telecommunications
    equipment. Recommendations concerning resistibility requirements for equipment
    as well as EMC characteristics of telecommunications networks, mitigation methods,
    bonding and earthing, etc. are outside the scope of this Recommendation.
