abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation X.1143 describes the security architecture and scenarios
    for message security in mobile web services.Security services for messages are
    the most fundamental security requirements for mobile web services. Although the
    components for message security such as WS-Security have been standardized, standard
    architecture and service scenarios for providing message security for mobile web
    services have yet to be defined. Since simple object access protocol (SOAP) messages
    use hypertext transfer protocol (HTTP) ports, they cannot be filtered by firewalls;
    hence the need to provide a message filtering mechanism based on the message contents
    in the architecture for secure mobile web services as well as to integrate the
    security policy mechanism suitable for mobile web services message security and
    the message filtering mechanism into the architecture. Since many mobile terminals
    do not have sufficient processing power to support the web services protocol stack
    fully, and many back-end application servers are not based on web services, interworking
    mechanisms and scenarios between mobile web services and legacy non-web services
    applications should be provided.This Recommendation seeks to establish a guideline
    for security architecture and security service scenarios for message security
    in mobile web services satisfying the above-mentioned requirements
