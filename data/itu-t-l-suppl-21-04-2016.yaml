abstract:
- language: en
  script: Latn
  content: "This Supplement provides a set of guidelines to assist ICT downstream
    small and medium-sized enterprises (SME) in developing and implementing a comprehensive
    conflict minerals management system, based on the “Due diligence guidance for
    responsible supply chains of minerals from conflict-affected and high-risk areas”
    of the Organisation for Economic Co-operation and Development [b-OECDa] Guidance.\r\n\r\nTo
    this end, this Supplement also collects, collates and makes reference to other
    relevant information from different organizations to avoid conflicting guidance
    and to provide a more detailed standardized methodology where applicable.\r\n\r\nThis
    Supplement can be used by any ICT downstream company and can be adjusted to meet
    the company’s specific needs, nature, organizational structure and characteristics.\r\n"
