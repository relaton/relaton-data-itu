abstract:
- language: en
  script: Latn
  content: This Recommendation describes general guidelines for Telecommunications
    Operators in order that they can improve the QOS and NP through the optimization
    of Operation and Maintenance (O&M) processes focusing on the customer satisfaction
    of the telephone service. The proposed method foresees the correlation between
    the assessment performance results of the international telephone network with
    a general index which represents the difficulty levels of O&M environment.
