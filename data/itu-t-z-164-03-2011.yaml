  content: Recommendation ITU-T Z.164 defines the operational semantics of TTCN-3
    (Testing and Test Control Notation 3). The operational semantics are necessary
    to unambiguously interpret the specifications made with TTCN-3. This Recommendation
    is based on the TTCN-3 core language defined in ITU-T Z.161.This Recommendation
    is technically aligned with ETSI ES 201 873-4 V4.2.1 (2010-07).
