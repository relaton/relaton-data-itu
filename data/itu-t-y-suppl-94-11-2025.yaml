  content: "Supplement 94 to the ITU-T Y-series Recommendations introduces use cases
    and expectations for network resource sharing based on network resource sharing
    based on distributed ledger technology (NRS-DLT) for supporting large-scale deep
    learning models, within an enterprise or trusted partners, not in public network
    environment. This Supplement builds on Recommendations ITU-T Y.2345 and ITU-T
    Y.2348.\r\n"
