abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1379 specifies the security requirements for roadside
    unit (RSU) in intelligent transportation systems (ITS) based on security threat
    analysis.\r\nThis Recommendation will help to guide vendors and operators of RSUs
    to adopt the appropriate security schemes to fulfil security requirements specified
    to protect RSUs from security risks and attacks from cyberspace thus to ensure
    the security of ITS."
