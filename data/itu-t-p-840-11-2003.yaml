abstract:
- language: en
  script: Latn
  content: This Recommendation describes a subjective listening test method which
    can be used to evaluate the speech quality of Circuit Multiplication Equipment
    (CME). It is intended for use with CME systems, such as those described in ITU-T
    Recs G.763, G.767,G.768 (DCME), G.765 (PCME) and G.769/Y.1242 (IP-CME) which use
    digital speech interpolation (DSI) techniques.In this version, the scope is expended
    to more recent speech coders implemented in CME. Updating the Recommendation includes
    tandemming situations and comfort noise test configuration.The new Appendix I
    gives guidance for conversation tests.
