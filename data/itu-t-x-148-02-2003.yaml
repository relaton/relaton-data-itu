abstract:
- language: en
  script: Latn
  content: This Recommendation defines procedures for the measurement and assessment
    of the user information transfer performance parameters of Frame Relay virtual
    connections. Use is made of OAM Frames and methods for measuring Frame Transit
    Delay, Frame Delay Jitter and Frame Loss Ratio are specified. The techniques are
    applicable to both PVCs and SVCs. The techniques defined enable in-service real
    time performance estimation.
