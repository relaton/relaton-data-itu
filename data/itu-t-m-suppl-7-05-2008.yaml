  content: The Directory of external terminology schemas is a directory to a coordinated
    set of Recommendations/standards for management of telecommunication services
    and resources. The external terminology schemas define data for end user interfaces
    and for management applications. Data for communication over other management
    interfaces may be derived from the external terminology schemas.
