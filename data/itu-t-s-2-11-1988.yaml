abstract:
- language: en
  script: Latn
  content: Existing terminal equipment making use of International Telegraph Alphabet
    no. 2 (ITA2) may not discriminate between capital and small letter printing. The
    decision to print in all capital or all small letters is a national matter and
    not affected by the received code combination of ITA2. This Recommendation specifies
    a procedure whereby the terminal equipment may transmit information to allow the
    receiving terminal to discriminate between capital and small letter printing.
