abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T K.12 defines the basic characteristics to be met by
    gas discharge tubes for the protection of exchange and outdoor equipment, subscriber
    or customer equipment and telecommunication lines from surges. It is intended
    to be used for the harmonization of existing or future specifications issued by
    gas discharge tube manufacturers, telecommunication equipment manufacturers, administrations
    or network operators
