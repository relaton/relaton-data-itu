abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T E.156 outlines the procedures for reporting and taking
    action regarding alleged misuse of numbers. It also outlines the procedures that
    the Director of the Telecommunication Standardization Bureau should undertake
    upon receipt of reports of alleged misuse from members, including methods to address
    and counter any alleged misuse when such reports are brought to the attention
    of the Director. Amendment 1 (2020) includes Appendix IV, which reproduces verbatim
    the attachment to WTSA Resolution 61 (Rev. Dubai, 2012) on \"Suggested guidelines
    for regulators, administrations and operating agencies authorized by Member States
    for dealing with number misappropriation\". \r\n"
