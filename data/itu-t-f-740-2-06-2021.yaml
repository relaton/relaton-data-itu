abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.740.2 describes the requirements, application scenarios
    and reference framework for the digital representation of cultural relics and
    artworks using augmented reality (AR), which is known as an augmented reality
    cultural service system (ARCSS). This Recommendation describes the AR digital
    presentation requirements, cultural connotation interpretation requirements, cultural
    venue tour guide requirements, platform management requirements and performance
    requirements for ARCSSs. This Recommendation describes a reference framework of
    an ARCSS with an AR cloud creation platform, AR cloud management platform and
    mobile devices. Procedures of augmented reality cultural service are provided
    in this Recommendation including an AR content creation procedure, AR service
    management procedure and AR content display procedure.
