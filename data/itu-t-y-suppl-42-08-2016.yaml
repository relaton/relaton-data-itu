abstract:
- language: en
  script: Latn
  content: "By orchestrating local and/or remote ICT resources, User-Centric work
    Space (UCS) service can provide a personalized work space. Instances of ICT resources
    that UCS can orchestrate include file, printer, monitor and keyboard. \r\n\r\nWith
    UCS service, smart devices, such as smart phones and smart pads, can utilize local
    and/or remote ICT resources to configure the user’s own work space. \r\n\r\nThis
    Supplement to ITU-T Y-series Recommendations provides a description of the UCS
    concept and its associated enhanced user experience. Also, this Supplement provides
    use cases of UCS service to illustrate how this service can be implemented. \r\n"
