abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.743.13 describes the requirements for a function
    that enables the cooperation of multiple edge gateways (CMEG) to complete complex
    tasks. It also describes the required capabilities and requirements of key components.
    The CEMG function can support the information exchanging among multiple edge gateways
    and deal with gateway failure cooperatively. It can also specify the central gateway
    which is responsible for selecting a cooperative gateway for each gateway, which
    in turn monitors the status of its partner gateway and manages the cooperative
    data and devices.
