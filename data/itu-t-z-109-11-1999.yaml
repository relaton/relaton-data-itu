abstract:
- language: en
  script: Latn
  content: 'ObjectiveThis Recommendation defines the specialized subset of UML that
    maps directly to SDL and that can be used in combination with SDL.CoverageThis
    Recommendation presents a definition of the UML-to-SDL mapping for use in the
    combination of SDL and UML.ApplicationThe main area of application of this Recommendation
    is the specification of telecommunication systems. The combined use of SDL and
    UML permits a coherent way to specify the structure and behaviour of telecommunication
    systems, together with data.Status/stabilityThis Recommendation is the complete
    reference manual describing the UML to SDL mapping for use in the combination
    of SDL and UML.Associated workRecommendation Z.100: SDL.'
