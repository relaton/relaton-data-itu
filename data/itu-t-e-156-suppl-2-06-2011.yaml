abstract:
- language: en
  script: Latn
  content: "This supplement to Recommendation ITU-T E.156 identifies possible actions
    that are open to Member States and Sector Members when perceived or potential
    misuse of national ITU-T E.164 numbers occurs. The decision to publish this supplement
    was taken by ITU-T in order for guidance to be provided immediately. The intention
    is to further develop this supplement with a detailed review of Recommendation
    ITU-T E.156, based on contributions received in the future.\r\n\r\nThis supplement
    is a first step towards identifying possible actions that might be taken to counter
    misuse, in advance of discussions over the suitability of including such information
    within Recommendation ITU-T E.156."
