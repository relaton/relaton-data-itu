abstract:
- language: en
  script: Latn
  content: This Recommendation provides working methods and procedures for approving
    draft new and revised ITU-T Recommendations using the alternative approval process.This
    revision provides an opportunity for Member States to recognize that policy or
    regulatory implications might have been introduced to a draft Recommendation undergoing
    final revision at the study group meeting referenced in ITU-T Recommendation A.8,
    clause 5.2.This revision to ITU-T Recommendation A.8 also aligns the text of clauses
    5.2 and 7.1 with revised ITU-T Recommendation A.1 (07/2006) in which normal and
    delayed contributions are combined into a single type of input contribution.
