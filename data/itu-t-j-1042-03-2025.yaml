abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.1042 is Part 3 of a multi-part deliverable composed
    of four parts. Part 3 describes the client framework and defines related interfaces
    of digital rights management for video and audio content distribution (DRMVACD).
    These interfaces include digital rights management (DRM) function interfaces and
    client execution environment interfaces.\r\nThe service requirements for the application
    of new generation video and audio technologies, along with new video service models
    coupled with a diverse range of consumer devices used for the reception of content,
    bring new demands and opportunities to the video industry, especially broadcast
    and television video services, and raise higher requirements for DRM, described
    in Recommendation ITU-T J.1040. The DRM system not only needs to have well defined
    security levels to meet the content protection requirements of different quality
    and different distribution window periods but also needs to have sufficient platform
    compatibility to cover various terminal devices. In addition, higher encryption/decryption
    efficiency and encryption/decryption modes decoupled from content encapsulation
    are required to match the rapid development and transformation of video and audio
    technologies. In addition, an interoperability mechanism is required to achieve
    a more open DRM ecosystem.\r\n\r\n"
