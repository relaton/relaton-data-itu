abstract:
- language: en
  script: Latn
  content: "Recommendation X.1407 specifies the security threats and requirements
    in digital integrity proofing based on distributed ledger technology (DLT).  The
    original proof protected is stored in the off-chain. The hashed data values are
    stored in the on-chain. Recommendation ITU-T X.1407 analyses the security threats
    to the digital integrity proofing services based on DLT, namely, proof registration
    and proof provenance. This Recommendation also describes the security requirements
    that could address security threats.\r\n"
