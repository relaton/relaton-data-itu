abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the electrical characteristics of a balanced
    digital interchange circuit, that may be employed when specified for the interchange
    of serial binary signals between Data Terminal Equipment (DTE) and Data Circuit-Terminating
    Equipment (DCE) or in any point-to-point interconnection of serial binary signals
    between data equipments. The balanced digital interchange circuit will normally
    be utilized on data and timing, or control circuits where the data signalling
    rate is up to a maximum limit of 52 Mbit/s.
