abstract:
- language: en
  script: Latn
  content: The ever increasing demand for the international telephone service, coupled
    with the introduction of larger digital transmission and switching systems along
    with common channel signalling, has resulted in an international telephone network
    which is highly interconnected and interactive and increasingly vulnerable to
    overload and congestion. This revised Recommendation gives an overview of the
    activities necessary to reduce the effect on service of any situation affecting
    unfavourably the international telephone network.
