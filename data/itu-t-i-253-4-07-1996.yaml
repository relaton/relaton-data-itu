abstract:
- language: en
  script: Latn
  content: Completion of Calls on No Reply (CCNR) is an ISDN supplementary service
    offered to the calling user. The CCNR supplementary service enables the calling
    user A, upon encountering destination B, which does not answer the call (no reply),
    to be notified when destination B becomes free after having terminated an activity.
    If user A desires, then the network will reinitiate the call to the specified
    destination B.
