abstract:
- language: en
  script: Latn
  content: "Supplement 59 to ITU-T Y-series Recommendations provides the standardization
    roadmap for IMT2020 and beyond in the information and communication technologies
    area. This revised Supplement 59 to ITU-T Y.3100-series Recommendations IMT-2020
    and beyond standardization roadmap has been developed to assist in the development
    of IMT-2020 and beyond related standards in the ICT fields by providing information
    about existing and under developing standards in key standards development organizations
    (SDOs).\r\n"
