abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the ATM Adaptation Layer (AAL) type 2. The
    AAL type 2 provides for the bandwidth-efficient transmission of low-rate, short,
    and variable length packets in delay sensitive applications. More than one AAL
    type 2 user information stream can be supported on a single ATM connection. In
    this Recommendation, the general framework and the Common Part Sublayer (CPS)
    of the AAL type 2 are defined in depth.
