abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.740.7 specifies the reference architecture for
    a mobile terminal computational photography system, which includes three functional
    blocks, namely the optical imaging block, image processing block and application
    block. This Recommendation also describes requirements for the mobile terminal
    computational photography system.\r\nThis Recommendation can facilitate cooperation
    between manufacturers, and enhance developing efficiency, so as to provide end
    users with better photography experiences. The aim is to define the reference
    architecture and requirements for the mobile terminal photography system.\r\n"
