abstract:
- language: en
  script: Latn
  content: The TM Forum's multi-technology network management (MTNM) solution suite
    realizes a TMN interface between the NML and EML according to ITU-T Recommendation
    M.3010 for the FCAPS management of multi-technology fixed transport, access and
    aggregation telecommunications networks.This Recommendation provides a physical
    and logical overview of the MTNM solution suite where the logical overview focuses
    on the MTNM business objectives and the suite of MTNM supporting documents. This
    Recommendation also explains the chosen approach to reference the TMF MTNM deliverables
    in ITU-T Recommendations such that they get hooked into ITU-T's management architectures
    and frameworks without the need to change any TM Forum deliverable.
