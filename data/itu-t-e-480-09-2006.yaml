abstract:
- language: en
  script: Latn
  content: Service management (SM) is a new operational discipline being introduced
    to manage the increasing complexity associated with services built up from multiple
    interconnected networks delivering content from multiple sources. This Recommendation
    is intended to support and define the role of service management. It explains
    the service management principles and functions. The major part of this Recommendation
    provides a definition of service management and provides a framework for further
    analysis of the operational activities associated with service management.
