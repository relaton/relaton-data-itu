abstract:
- language: en
  script: Latn
  content: "The recent advancement of wireless-based communication technology and
    electronics has facilitated the implementation of a low-cost, low-power sensor
    network. Basically, a ubiquitous sensor network (USN) consists of three parts:
    a sensor network consisting of a large number of sensor nodes, a base station
    (also known as a gateway) interfacing between the sensor network and an application
    server, and the application server controlling the sensor node in the sensor network
    or collecting the sensed information from the sensor nodes in the sensor network.\r\nRecommendation
    ITU-T X.1311 | ISO/IEC 29180 describes the security threats to and security requirements
    of the ubiquitous sensor network. In addition, this Recommendation | International
    Standard categorizes the security technologies according to the security functions
    that satisfy the said security requirements and where the security technologies
    are applied in the security model of the ubiquitous sensor network. Finally, the
    security functional requirements and security technologies for the ubiquitous
    sensor networks are presented.\r\n"
