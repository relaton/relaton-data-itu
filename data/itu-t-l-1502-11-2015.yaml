abstract:
- language: en
  script: Latn
  content: "Information and Communication Technologies (ICTs) can be part of the solution
    to climate change by, for example, helping countries adapt to the effects of climate
    change. At the same time, ICT equipment and infrastructure are themselves exposed
    to the effects of climate change and therefore need to be both robust and resilient.
    \ \r\n\r\nThis Recommendation identifies direct and indirect threats of climate
    change on ICT services and provides options for adaptation and mitigation. These
    threats include extreme rainfall, flooding, landslides, extreme wind, lightning,
    extreme humidity, drought, ice storms and heavy snowfall. \r\n\r\nThis Recommendation
    was developed within the framework of Recommendation ITU-T L.1500. It focuses
    on telecommunication networks and infrastructure. \r\n"
