abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1248 identifies characteristics of spam over instant
    messaging (SPIM) and specifies technical requirements for countering it. As instant
    messaging (IM) increases in popularity, the proliferation of SPIM becomes an increasingly
    serious problem. The characteristics of IM, such as being Internet protocol (IP)-based
    with widespread usage that is free of charge, potentially allows SPIM to spread
    widely and uncontrollably. If SPIM problems are not carefully addressed, they
    can have negative impacts on the utilization of the IM service itself.\r\n\r\n
    \r\n"
