abstract:
- language: en
  script: Latn
  content: "Intelligent surface-defect detection service in industrial production
    lines refers to the accurate product defect location determination, high-speed
    classification of defect types, real-time output and transmission of visual and
    auditory information to ensure the quality of industrial products. Compared with
    inspection carried out manually by workers, the intelligent surface-defect detection
    service can improve efficiency and consistency and reduce manual operations in
    dangerous areas. This Recommendation specifies requirements for intelligent surface-defect
    detection service in industrial production lines, including performance requirements,
    application requirements and functional requirements. To provide an effective
    surface-defect detection service, it is required to fulfil three important parts.
    Firstly, it is important to ensure the accuracy location determination and classification.
    Secondly, the inference efficiency of the service is also required to satisfy
    the real-time settings. Last but not least, the service is required to adapt to
    the typical application scenarios in industrial production line inspection tasks.\r\nRecommendation
    ITU-T F.747.11 provides related requirements for intelligent surface-defect detection
    service in industrial production lines.\r\n"
