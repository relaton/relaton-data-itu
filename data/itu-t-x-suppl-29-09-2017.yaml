abstract:
- language: en
  script: Latn
  content: "Supplement 29 to Recommendation ITU-T X.1242 provides universal guidelines
    on short message service (SMS) phishing which is a fraudulent technique through
    mobile phones by causing phishing frauds with smartphones, acquiring personal
    information on the smartphones, or by enabling small amounts of money to be approved
    and paid while the account holder is not aware of the approval. \r\n\r\nThe purpose
    of this Supplement is to universalize the guideline for countermeasures against
    SMS phishing incident by defining a security guideline about security technology
    against SMS phishing incident and method, and specification of report contents.\r\n"
