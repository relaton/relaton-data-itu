abstract:
- language: en
  script: Latn
  content: This Amendment to ITU-T Rec. X.519 | ISO/IEC 9594-5 provides extensions
    to the protocol specifications of the Directory:- to support requirements expressed
    in ITU-T Rec. F.510;- to support the UTF8 encoding of the ISO/IEC 10646 character
    set; and- to specify a simple mapping of Directory protocols onto TCP/IP.
