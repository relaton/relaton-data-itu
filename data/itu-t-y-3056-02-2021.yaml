abstract:
- language: en
  script: Latn
  content: "Rapid advancements in communications and associated technologies has led
    to the emergence of distributed ecosystems with a large number of devices, applications
    and use cases requiring open access to trusted services. This open access to trusted
    services in distributed ecosystems can be provisioned by using the inherent security
    capabilities and mechanisms already present in the devices and the underlying
    networks. Recommendation ITU-T Y.3056 provides a concept of bootstrapping of devices
    and applications by network operators who can share the network security capabilities
    with users and providers of new devices and services. It describes the requirements
    to be fulfilled by the entities of the ecosystem such that they may benefit from
    the bootstrapping capabilities. Based on the requirements, a reference model as
    well as a functional architecture is provided, which together describe the elements,
    functions and reference points needed for provisioning of the bootstrapping capabilities.
    Finally, this Recommendation provides the information flows required to enable
    the bootstrapping capabilities. \r\n"
