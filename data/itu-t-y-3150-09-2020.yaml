abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3150 describes how network softwarization, whose
    usefulness is globally recognized, and its most typical substantiation, network
    slicing, contribute to International Mobile Telecommunications-2020 systems. Recommendation
    ITU-T Y.3150 explores network slicing from two viewpoints: vertical and horizontal
    aspects. Recommendation ITU-T Y.3150 further describes network slicing for mobile
    fronthaul and backhaul, introduction to advanced data-plane programmability and
    capability exposure. These descriptions are expected to lead to the detailed study
    of these technical characteristics. \r\n\r\nThis edition contains: i) a change
    in the basic model, which contains software-defined networking, network functions
    virtualization, cloud computing and other technical environments; and ii) security
    considerations for network slicing. In addition, information on hierarchical orchestration
    is included. \r\n"
