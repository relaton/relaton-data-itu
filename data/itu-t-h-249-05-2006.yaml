abstract:
- language: en
  script: Latn
  content: "The current version of ITU-T Rec. H.245 defines a method of transferring
    user keystrokes in userInputIndication messages. That method allows implementation
    of simple user interfaces. Many endpoint devices are equipped with advanced keypads,
    touch pad input, etc., and require more sophisticated tools from the protocol.
    This Recommendation provides a means to add such user interface features within
    the structure of H.245.The extensions defined in this Recommendation may be beneficial
    for several types of applications. For example: \r\n• Video on demand - navigating
    a menu (provided by the server) of possible steaming sources.\r\n• Map navigation
    - using navigation keys to move/zoom a map image provided by the server."
