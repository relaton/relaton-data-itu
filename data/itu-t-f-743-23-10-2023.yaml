- language: en
  script: Latn
  content: 'Recommendation ITU-T F.743.23 defines premises unit (PU) device security
    classification, functional requirements, typical use case and scenario for video
    surveillance systems. The Recommendation specifies the functional requirements,
    including PU access security requirements, transmission security requirements,
    platform security requirements, application security requirements, network security,
    and security management centre in video surveillance systems.

