abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.746 defines multimedia optimization control components
    (MOCCs), which can provide guidance services to multimedia applications and services
    in the process of service node selection, traffic optimization, performance enhancement,
    etc. This Recommendation specifies the MOCC requirements and defines a MOCC functional
    model. Some typical MOCC deployment scenarios are also described.
