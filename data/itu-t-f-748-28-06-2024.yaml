abstract:
- language: en
  script: Latn
  content: "Multimedia services are becoming increasingly useful for education, video-based
    marketing, digital museum, e-health, etc., providing an enriched user experience
    in e-meetings, distance training and product demonstrations.\r\nDigital twin realizes
    the interconnection, intercommunication and interoperability between the physical
    world and the digital world, constructs the description, diagnosis, prediction
    and decision-making of the physical world in the virtual world.\r\nAt present,
    the digital twin system in different multimedia services has common requirements
    and functions, and it is necessary to develop a digital twin platform to realize
    the services for upper multimedia applications. The digital twin platform provides
    general services, twin services, interactive services for multimedia applications
    such as the fields of education, video-based marketing, digital museum, E-health,
    etc.\r\nRecommendation ITU-T F.748.28 specifies the requirements and functional
    architecture of the digital twin platform for supporting multimedia services.\r\n"
