  content: Supplement 54 to ITU-T Y.-series Recommendations establishes a set of data
    fields that reflect consumer preferences for IoT‑enabled devices in specific environments.
    These data fields could be incorporated into a consumer device, stored in some
    fashion, and used by compatible IoT devices in the home and elsewhere to automatically
    implement those preset user preferences.
