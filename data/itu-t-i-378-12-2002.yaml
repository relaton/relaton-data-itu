abstract:
- language: en
  script: Latn
  content: This Recommendation provides a general description as well as objectives
    and procedures for AAL type 2 traffic control and congestion control. It introduces
    the concept of AAL type 2 transfer capability. For each AAL type 2 transfer capability,
    it specifies AAL type 2 traffic parameters, an AAL type 2 conformance definition
    and defines AAL type 2 QoS commitments. Additionally, it describes the concepts
    of the AAL type 2 traffic contract.
