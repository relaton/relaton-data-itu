abstract:
- language: en
  script: Latn
  content: |
    Telecommunication poles and overhead facilities such as closures, wires, cables, and accessories are deteriorating. For example, breakage and cracks occur and these phenomena degrade the safety and serviceability of poles and overhead facilities. If the deterioration is unnoticed, large-scale repair and reinforcement measures will probably be required, which will further increase the cost in the future. Therefore, it is highly recommended that periodic inspection and timely maintenance should be performed.
    Safety management of telecommunication infrastructure facilities is generally described in Recommendation ITU-T L.330. This Recommendation describes the inspection procedures, technologies and countermeasures for maintenance of poles and overhead facilities as defined in Recommendation ITU-T L.330. Previous editions dealt with inspection methods for wooden poles. In this revision, the inspection method and the appropriate countermeasures for the inspection result have described including poles made of concrete, steel, and GRP, which are mainly used at present.
