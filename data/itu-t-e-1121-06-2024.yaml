abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T E.1121 specifies the roles, responsibilities and
    mechanisms by which audits will be carried out on assigned international naming,
    numbering, addressing and identification (NNAI) resources. Undertaking audits
    is an additional and complimentary mechanism to the principles associated with
    identifiers and reporting of misuse as specified in the ITU-T E series of Recommendations.\r\nThis
    Recommendation does not apply to international resources administered by Member
    States.\r\n"
