abstract:
- language: en
  script: Latn
  content: "Information and communication technologies (ICT)provide crucial services
    and systems for our daily lives as well as in emergencyand disaster situations.
    Disaster relief systems that are used during andafter disasters provide people
    with timely and useful information that isused for rescue, evacuation, safety
    confirmation and even for lifesustainability.\r\n\r\nSupplement 1to ITU-T E.100-series
    Recommendations provides the high-level category ofdisaster relief (DR) systems
    including early warning systems as well as identifiesthe services and systems
    that need common specifications or requirements. Italso describes new study area
    of disaster relief systems, which includesnewly produced ITU-T Recommendations,
    and its requirements.\r\n"
