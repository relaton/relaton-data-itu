abstract:
- language: en
  script: Latn
  content: This Recommendation specifies a mechanism that allows a PSTN - H.323 Gateway
    to report circuit service and usage status to a Gatekeeper using the circuit status
    map parameter. Individual PSTN circuits on the Gateway may be taken out-of-service
    by a provisioning command from service personnel or when an ISUP out-of-service
    or blocking message is received from the adjacent PSTN switch. In this case, the
    Gateway will be able to report the current circuit status to the Gatekeeper so
    that it may select only from available circuits for outgoing calls through that
    Gateway.
