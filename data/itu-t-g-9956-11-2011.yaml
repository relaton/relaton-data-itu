abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T G.9956 contains the data link layer specification
    for narrowband power line communications transceivers using Orthogonal frequency-division
    multiplexing (OFDM) for communications via alternating current and direct current
    electric power lines over frequencies below 500 kHz. This Recommendation supports
    indoor and outdoor communications over low voltage lines, medium voltage lines,
    through transformer low-voltage to medium-voltage power lines and through transformer
    medium-voltage to low-voltage power lines in both urban and long distance rural
    communications. This Recommendation addresses grid-to-utility meter applications,
    advanced metering infrastructure (AMI), and other Smart Grid applications such
    as charging of electric vehicles, home automation, and home area networking (HAN)
    communications scenarios.
