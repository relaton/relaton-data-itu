abstract:
- language: en
  script: Latn
  content: 'This amendment addresses a series of reported problems and clarifications,
    namely: addition of new references, clarifications on audio and video muting and
    on usage of multiple video channels, plus clarifications and changes to the call
    reset procedure. Additionally, a new Annex J is provided which summarizes the
    OIDs defined in H.324 and defines H.324 generic capabilities which are used in
    H.245-signalling based systems. Annex J also introduces a SessionResetCapability
    capability identifier, which is defined in 7.7.1/H.324.'
