abstract:
- language: en
  script: Latn
  content: "As services and technology involving digital humans continue to advance,
    demands for digital human customization arise from use cases of various digital
    human communication services. To satisfy these demands, Recommendation ITU-T F.748.54
    specifies a framework for customizing digital humans, by creating and controlling
    digital humans to fit the needs of service users. Since digital humans share the
    similar characteristics as real humans, digital human features are described on
    the basis of human characteristics. Modules in the framework, including extractors
    and generators, utilize the digital human features as outputs and inputs, respectively.\r\n"
