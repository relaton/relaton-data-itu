abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.748.14 specifies requirements and evaluation methods
    for non-interactive two-dimensional (2D) real-person digital human application
    systems, in terms of image, voice, movement, display, etc. It can be used to guide
    relevant parties to test, select or evaluate a non-interactive 2D real-person
    digital human application system. The evaluation methodology can reflect the current
    state of a non-interactive 2D real-person digital human application system by
    providing meaningful comparison dimensions.
