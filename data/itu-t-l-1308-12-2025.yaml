abstract:
- language: en
  script: Latn
  content: "Low-carbon data centres can effectively reduce energy consumption, reduce
    dependence on fossil energy, promote sustainable energy use, and reduce carbon
    emissions, which contribute to the global response to climate change, and reduce
    the negative impact on the environment. Low-carbon data centres can reduce operating
    costs, enhance the competitiveness of enterprises, and promote the data centre
    industry to be green and efficient.\r\nRecommendation ITU-T L.1308 identifies
    the guidelines for the implementation of low-carbon data centres throughout their
    whole life cycle for climate change mitigation and adaptation, including:\r\n1)Site
    selection stage: choose a suitable construction site, including the abundance
    of renewable resources, the suitability of the natural environment, sufficient
    natural energy sources, and accessibility to transport;\r\n2)Design stage: including
    guidelines on architecture and environment, clean energy supply, cooling, power
    equipment, information technology (IT) equipment and water sources;\r\n3)Procurement
    stage: including guidelines on building materials and electrical and mechanical
    equipment;\r\n4)Construction stage: including guidelines on the on-site environment,
    construction vehicles and equipment, etc.;\r\n5)Operational stage: including guidelines
    on renewable energy usage, monitoring and intelligent management system;\r\n6)Decommissioning
    and recycling stage: including guidelines on demolition and recycling.\r\n"
