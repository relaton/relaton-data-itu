  content: Recommendation ITU-T D.1040 provides a collaborative framework that can
    be applied in order to promote optimal cable utilization across multiple countries
    and boost regional and international connectivity. The framework is based on a
    proportional allocation model, which allocates circuits based on the length of
    fibre contributed to the terrestrial multi-country end-to-end cable network.
