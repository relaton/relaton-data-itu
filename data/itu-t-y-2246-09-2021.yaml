abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.2246 provides a reference architecture and service
    requirements for smart farming education. It focuses on the farming education
    service about farming knowledge which includes farming technology, farming skills,
    farmers' experiences and their know-how, etc. The information related to farming
    knowledge will reflect current activities, farming products and the experience
    of farmers in the field. The core component of the automation process is the creation
    of a data store that will be a repository for this information. The farming sector
    will benefit immensely from the implementation of farming data in a farming contents
    repository which will serve as a knowledge base for the automation process. This
    Recommendation also discusses how this service may be used to develop a knowledge
    base intended to benefit those involved in the farming sector.
