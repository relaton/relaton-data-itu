abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T L.87 describes the characteristics, construction and
    test methods of optical fibre cables for drop applications. Optical fibre drop
    cables are used to connect customer and optical access networks. Access points
    may be located both outdoors or indoors, depending on the access network configuration.
    When access points are located outdoors, optical drop cables are exposed to both
    outdoor and indoor environments. In this case the optical drop cable should be
    designed for both environments. This Recommendation also describes the characteristics
    that a cable requires for an optical fibre to perform appropriately. Moreover,
    a method is described for determining whether or not the cable has the required
    characteristics. The required conditions may differ according to the installation
    environment; detailed test conditions must be agreed upon between the user and
    manufacturer as regards the environment in which the cable is to be used (in case
    of applying small bends during and after installation, especially).
