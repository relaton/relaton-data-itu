abstract:
- language: en
  script: Latn
  content: "In today’s network environment, computer networks are vulnerable to threats
    from both inside and outside the organization. The firewall systems log session
    information about selected incoming and outgoing transmission control protocol/Internet
    protocol (TCP/IP) connections.\r\n\r\nHowever, those systems that are currently
    available are not generally interoperable because each system has its own special
    functionality, control mechanisms and session log formats.\r\n\r\nThe need most
    security administrators face today is the maintaining of consistent session information
    exchange format across diverse firewall systems and even varied infrastructures.\r\n\r\nRecommendation
    ITU-T X.1542 describes the information model for the session information message
    exchange format (SIMEF) and provides an associated data model specified with extensible
    markup language (XML) schema. The SIMEF defines a data model representation for
    sharing the transport layer session log information regarding the centralized
    network security management and security information exchange system. The specification
    of any transport protocol is beyond the scope of this Recommendation\r\n"
