abstract:
- language: en
  script: Latn
  content: "Based on cloud computing capabilities and massive data collaborative processing,
    cloud-based augmented reality systems can effectively support large-scale physical
    scene recognition and digital processing, provide more flexible virtual-scene
    integration and support multiperson interactive scenarios. Recommendation ITU-T
    F.740.11 does not change cloud computing's functions, but rather presents a basic
    concept of cloud-based augmented reality and specifies requirements and a framework
    of cloud-based augmented reality systems.\r\n"
