abstract:
- language: en
  script: Latn
  content: "The content of this Supplement was prepared by the Focus Group on Smart
    Sustainable Cities (FG-SSC) . \r\n\r\nWireless networks provide vital infrastructure
    and connection of ICTs that underpin smart sustainable cities. The effective design
    and careful deployment of wireless networks and short range devices (SRDs) are
    vital to ensuring electromagnetic field (EMF) compliance and maximum efficiency
    for ICTs. \r\n\r\nKey features of this Supplement are:\r\n\r\na)          It details
    the EMF considerations in smart sustainable cities.\r\n\r\nb)          It provides
    guidance on implementation, and promotes efficient deployment of wireless networks
    in smart sustainable cities.  \r\n\r\nc)          It features a ‘Smart Sustainability
    City EMF Check-list’ designed to provide an easy to use reference for city officials
    and planners to ensure smart city policies operate most efficiently and comply
    with EMF exposure standards.\r\n\r\nd)          It references WHO materials, ICNIRP
    Guidelines, ITU-T Recommendations and IEC Standards. It is not intended to replicate
    the material in all references.\r\n\r\n \r\n"
