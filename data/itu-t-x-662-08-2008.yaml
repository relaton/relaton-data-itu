abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation X.662 | ISO/IEC 9834-3 specifies the procedures for
    operating the International Registration Authority for assignment of values to
    object identifier arcs beneath the top-level arc with primary integer value 2,
    Unicode label Joint-ISO-ITU-T and secondary identifier joint-iso-itu-t. Assignment
    of the authority to allocate arcs beneath such arcs is either given to a specific
    area of work approved jointly by ISO/IEC and ITU-T (and is normally recorded in
    Recommendations | International Standards) or is given to an international organization.
