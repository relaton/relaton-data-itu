abstract:
- language: en
  script: Latn
  content: This Recommendation covers Physical Layer characteristics for transporting
    Asynchronous Transfer Mode (ATM) cells at a nominal bit rate of 51 840 kbit/s
    over Category 3 Unshielded Twisted Pair (UTP) cabling at the SB reference point
    of the B-ISDN User Network Interface (UNI). The maximum distance is approximately
    100 m. This specification may be used to take advantage of existing building wiring.Functionality
    is presented in terms of Physical Media Dependent (PMD) and Transmission Convergence
    (TC) sublayers, and both Synchronous Digital Hierarchy (SDH)-based and cell-based
    formats are included.This Recommendation is part of the I.432-series Recommendations,
    and includes references to Recommendation I.432.1 on general characteristics,
    and Recommendation I.432.2 on Transmission Convergence sublayer aspects.
