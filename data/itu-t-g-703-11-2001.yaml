abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the recommended physical and electrical characteristics
    of the interfaces at hierarchical bit rates as described in ITU-T Recs. G.702
    (PDH) and G.707 (SDH). The interfaces are defined in terms of general characteristics,
    specifications at the output ports and input ports and/or cross-connect points,
    earthing of outer conductor or screen and coding rules.
