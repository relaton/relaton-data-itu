abstract:
- language: en
  script: Latn
  content: This Recommendation provides mechanisms for user-plane OAM (Operation and
    Maintenance) functionalityin MPLS networks according to the requirements and principles
    given in ITU-T Rec. Y.1710. This Recommendation is designed primarily to support
    point-to-point and multipoint-to-point explicit routed LSPs (ER-LSPs) with limited
    applicability to LSPs that employ penultimate hop popping (PHP).The OAM mechanisms
    defined in this Recommendation assume common forwarding of the LSP payload and
    Y.1711 PDUs. In some situations this may not be true, such as when the LSP payload
    is load balanced across a plurality of parallel paths while still appearing as
    a single trail to the ingress and egress. LSRs introducing variations in connectivity
    are responsible for ensuring that the availability behaviour of Y.1711 per ingress-egress
    pair is preserved.
