abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard specifies an Access Control
    Security Model and the management information necessary for creating and administering
    access control associated with OSI Systems Management. Security policy adopted
    for any instance of use is not specified and is left as an implementation choice.
    This Specification is of generic application and is applicable to the security
    management of many types of application. It is expected to be adopted for TMN
    use.
