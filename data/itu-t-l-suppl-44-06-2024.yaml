abstract:
- language: en
  script: Latn
  content: "In accordance with the instructions and directives of WTSA-16 on Resolution
    73, \"Study Group 5 is to develop an appropriate Recommendation on ICTs, the environment
    and climate change issues within the mandate and competency of ITU-T, including
    telecommunication networks used for monitoring and adapting to climate change\",
    Supplement 44 to ITU-T L-series Recommendations identifies best practices and
    opportunities for new applications using information and communication technologies
    (ICTs) to foster environmental sustainability, identify appropriate actions and
    promote best practices towards implementing environmental friendly policies and
    practices.\r\nSupplement 44 to ITU-T L-series Recommendation also includes a questionnaire
    that has been developed to gather relative information from stakeholders for use
    cases and key success factors, including exemplary collection of green best practices
    to ultimately formulate guidelines on best practices and environment friendly
    policies for effective ICT deployment methods.\r\n"
