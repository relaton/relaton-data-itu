abstract:
- language: en
  script: Latn
  content: This amendment covers the introduction of the following features:? definition
    of new values of the K factor to reflect the introduction of higher resolutions;?
    a new bit in DIS/DCS to indicate connection to a 3rd Generation Mobile Network;?
    a new bit in DIS/DCS to indicate Internet aware capabilities associated with the
    use of ITU-T 38;? flow control capabilities;? use of ANSam with phase reversals;?
    new Annex K on extended negotiations.
