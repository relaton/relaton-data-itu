abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.603.1 | International Standard ISO/IEC 16512-2
    describes the functions and procedures of the relayed multicast protocol part
    2 (RMCP-2), which is an application-layer protocol constructing a one-to-many
    overlay multicast tree for multicast data delivery from one sender to multiple
    receivers over an IP-based network. The RMCP-2 consists of a multicast agent (MA)
    and a session manager (SM). The MA constructs the one-to-many relayed data path
    to provide multicast-based services. The SM controls and manages the RMCP-2 sessions.
    RMCP-2 can be used for applications that require one-to-many data delivery services,
    such as multimedia streaming services, file distribution services, e-learning,
    etc.\r\nThis Recommendation | International Standard also describes the security
    functionalities of RMCP-2. It provides various security facilities to fulfil general,
    as well as, specific security requirements. Some detailed functions that can operate
    with a variety of standardized security mechanisms are provided.\r\n"
