abstract:
- language: en
  script: Latn
  content: This Recommendation provides performance objectives, allocations and limits,
    and measurement procedures for bringing-into-service and maintenance of international
    end-to-end permanent and semi-permanent ATM Virtual Path Connections (VPCs), Virtual
    Channel Connections (VCCs), and connection portions that form part of an international
    ATM VPC or VCC. Error, delay and availability performance aspects are addressed.
    Some of the performance objectives depend on the user's selection of Quality of
    Service (QoS) class, definitions of which are given in ITU-T I.356 and ITU-T I.371.
