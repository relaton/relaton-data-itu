abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3109 specifies quality of service (QoS) assurance-related
    requirements and a framework for virtual reality (VR) delivery using mobile edge
    computing (MEC) in International Mobile Telecommunications-2020 (IMT-2020). Recommendation
    ITU-T Y.3109 first provides an introduction to VR delivery using MEC supported
    by IMT-2020. It then specifies QoS assurance-related function and mechanism requirements
    and a framework. The QoS planning for VR services, typical VR user cases and guidelines
    for deployments of VR services are described in appendices. \r\n"
