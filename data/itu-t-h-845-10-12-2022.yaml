abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.845.10 provides a test suite structure (TSS) and
    the test purposes (TP) for the insulin pump agent in the Personal Health Devices
    (PHD) interface, based on the requirements defined in the Recommendations of the
    ITU-T H.810 sub-series, of which Recommendation ITU T H.810 (2019) is the base
    Recommendation. The objective of this test specification is to provide a high
    probability of interoperability at this interface.\r\nRecommendation ITU-T H.845.10
    is a transposition of Continua Test Tool DG2019, Test Suite Structure & Test Purposes,
    Personal Health Devices Interface, Part 5J: Device Specializations, Personal Health
    Device, Insulin Pump (IP-), Version 1.2 (2017-07-18). This edition includes the
    corrections approved in ITU-T H.845.10 (2017) Corrigendum 1 (11/2017), and the
    maintenance contents from ISO/IEEE 11073-20601:2022 and ISO/IEEE 11073-10419:2019
    (Insulin Pump) versions.\r\nThis Recommendation includes an electronic attachment
    with the protocol implementation conformance statements (PICS) and the protocol
    implementation extra information for testing (PIXIT) required for the implementation
    of Annex A.\r\n"
