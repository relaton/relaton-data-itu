abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T D.265 covers principles for the tariff regulation
    of data services. Member States and national regulatory authorities (NRAs) should
    consider the use of these principles to ensure equitable access to the Internet
    and transparent pricing practices, which benefit both consumers and operators
    of data services. These guidelines serve as a starting point for telecommunication
    and information and communication technology (ICT) regulators. Member States and
    NRAs should consider their specific national or regional conditions when applying
    this Recommendation.\r\n"
