abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T K.123 describes the requirements for radiated and
    conducted emissions from electrical systems installed in telecommunication facilities.
    Electrical systems in the scope of this Recommendation include rectifiers that
    supply direct current (DC) voltages of up to 400 V, power conditioning systems
    (PCSs) including grid connected power converters (GCPCs), uninterruptible power
    supplies (UPSs) and inverter driven electrical equipment including the air conditioners
    needed for the operation of telecommunication systems. Their electrical systems
    include power conversion devices and may generate conducted and radiated electromagnetic
    disturbances and cause degradation of the performance of telecommunication systems.
