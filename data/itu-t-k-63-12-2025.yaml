abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.63 suggests some electromagnetic compatibility
    tests that may be used by both telecommunication operators and equipment manufacturers
    to determine the suitability of a batch of telecommunication equipment to its
    intended electromagnetic environment.\r\nIt is recognized that variation will
    occur between the electromagnetic compatibility performance of the telecommunication
    equipment item tested to demonstrate compliance with market entry requirements
    and the electromagnetic compatibility performance of telecommunication equipment
    items manufactured subsequently. Hence variation in the electromagnetic compatibility
    performance will be seen within a batch of telecommunication equipment either
    received by the telecommunication operator or manufactured by the equipment manufacturer.\r\nMethods
    to allow both telecommunication operators and equipment manufacturers to demonstrate
    the compliance of a batch of telecommunication equipment are therefore needed.
    As it is not economically feasible to test the electromagnetic compatibility performance
    of every item within the batch, this Recommendation suggests that just three tests
    be performed on a small number of equipment items selected at random from the
    batch.\r\nThe recommended tests are radiated emissions, electrostatic discharge
    and electrical fast transient. It is the past experience of telecommunication
    operators that the largest variation in performance occurs for these three tests.\r\nTelecommunication
    operators may therefore use this Recommendation to assure the suitability of a
    batch of equipment received from a manufacturer. Equipment manufacturers may use
    this Recommendation to monitor the variation in electromagnetic compatibility
    performance from their manufacture line.\r\n"
