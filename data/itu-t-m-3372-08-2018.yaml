abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T M.3372 introduces a functional framework and functional
    requirements for resource management in cloud-aware telecommunication management
    system. It provides the composition of the functional framework, and the functions
    of each component in the framework. In this Recommendation, the general background
    and the current status of the cloud computing management are also analysed. And
    the benefit of introducing functional framework and functional requirements of
    resource management in cloud-aware telecommunication management system is explained.
