abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3601 provides a framework for data exchange in
    a big data ecosystem. Big data exchange covers multiple processes for data import
    and data export within a big data ecosystem. Big data exchange is used for exchanging
    data of multiple types and multiple formats from a data source to a data target.
    In this Recommendation, direct and intermediary exchange patterns are introduced.
    In addition, this Recommendation provides a description of the big data activities
    for the support of big data exchange by extending the activities defined in Recommendation
    ITU-T Y.3600. Finally, this Recommendation identifies functional requirements
    that are derived from relevant use cases.\r\n"
