abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3173.2 specifies the interface analysis for synergy
    management of cloud and software defined networking (SDN) based networks. This
    Recommendation provides the interface analysis model (information model) for the
    synergy management of cloud and SDN-based networks and specifies the managed entities
    and their relationships for the synergy management interface at a technology-independent
    level (protocol-neutral). Recommendation ITU-T M.3173.2 also provides detailed
    attribute definitions of each managed entity, and the interactive control information
    exchanged through this synergy management interface.\r\n"
