abstract:
- language: en
  script: Latn
  content: "This supplement describes how a flexible G.989.3 TC layer implementation
    can be used to support a G.987.3 or G.9807.1 PON.  \r\n\r\nG.989.3 was largely
    derived from G.987.3.  The G.9807.1 Appendix C TC layer specification was derived
    from G.989.3, with G.9807.1 Appendix II describing this derivation in detail.
    \    G.9807.1 also specifies that a G.9807.1 compliant OLT will interwork with
    a G.987.3 compliant ONT.   \r\n\r\nIt should be evident from this chain of derivation
    that a flexible TC layer implementation that supports G.989.3 can support G.9807.1
    or G.987.3 operation.  This supplement describes the implementation flexibility
    required.\r\n"
