abstract:
- language: en
  script: Latn
  content: 'This is Recommendation Q.1219-Supplement - Intelligent Network User''s
    Guide: Supplement for IN CS-1. This Recommendation is a supplement to Recommendation
    Q.1219 - Intelligent Network User''s Guide for Capability Set 1 (1994). As a supplement,
    this Recommendation does not replace Recommendation Q.1219 (1994). Rather, this
    Recommendation contains supplementary information to be used in conjunction with
    Recommendation Q.1219 (1994). The intent of this Supplement is to present information
    to the user which focuses on the refinements which have been made to IN Capability
    Set 1 (IN CS-1).The IN CS-1 Recommendations were significantly enhanced and refined
    during the period from 1993 to 1995. A new set of IN CS-1 Recommendations (1995)
    was created to replace the original IN CS-1 Recommendations (1993). The scope
    of IN CS-1 (1995) is the same as for IN CS-1 (1993). No additional capabilities
    have been added to IN CS-1. However, as a result of the refinement work, IN CS-1
    (1995) is a mature set of implementable Recommendations.This Recommendation Q.1219-Supplement
    should be used as a supplement to Recommendation Q.1219 (1994) Intelligent Network
    User''s Guide. This Supplement describes the refinements made to the IN CS-1(1993)
    Recommendations and included in the ITU-T IN CS-1 (1995) Recommendations.'
