abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T H.781 defines a detailed functional architecture to
    provide digital signage (DS) services. The functional architecture consists of
    DS server, DS client, content delivery server and content delivery client. This
    Recommendation describes how functions in the architecture interact with each
    other to provide the services according to general information flows and defines
    reference points that can be considered in specifying detailed protocols.
