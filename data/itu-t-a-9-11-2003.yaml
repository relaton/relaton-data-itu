abstract:
- language: en
  script: Latn
  content: This Recommendation describes the specific working procedures for the Special
    Study Group (SSG) on IMT-2000 and Beyond that are modifications or enhancements
    to the working procedures applicable to all study groups including the SSG. These
    modifications and enhancements include regular reporting to TSAG, more specific
    requirements on supporting Questions, and reduced process requirements for physical
    meetings. One clause provides detailed procedures in support of organizing and
    conducting electronic meetings, and two appendices address practical aspects for
    optimizing the preparation and exchange of documents for electronic meetings.
