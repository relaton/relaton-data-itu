abstract:
- language: en
  script: Latn
  content: The session protocol specification defined in ITU-T Rec. X.225 | ISO/IEC
    8327-1 is enhanced to support the establishment of additional, independent, nested
    session connections within an existing session connection. This enhancement will
    support the reusability of existing application layer standards (each making full,
    and possibly incompatible, use of the session synchronization services) as components
    of new application layer standards.
