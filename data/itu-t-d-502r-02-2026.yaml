abstract:
- language: en
  script: Latn
  content: "Regional Recommendation ITU-T D.502R seeks to promote a transparent, competitive
    and consumer-friendly international mobile roaming (IMR) market in Asia and Oceania.
    It sets out principles for Member States and national regulatory authorities (NRAs)
    on regulatory harmonization, transparency, consumer protection and fair competition,
    with the objective of reducing economic barriers, improving the IMR environment
    and enhancing regional connectivity for the benefit of consumers and businesses.\r\n"
