abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T P.852 describes methods and procedures for conducting
    subjective evaluation experiments for services that are based on text-based chatbots.
    Such chatbots enable a natural language-based dialogic interaction via text, and
    are used to offer customer care self-services, service selling, etc. The set-up
    and running of appropriate interaction experiments is described, and questionnaires
    for quantifying the relevant quality dimensions perceived by the user are given.
