abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.44 seeks to establish fundamental test methods
    and criteria for the resistibility of telecommunication equipment to overvoltages
    and overcurrents.\r\n\r\nOvervoltages or overcurrents covered by this Recommendation
    include surges due to lightning on or near the line plant, short-term induction
    of alternating voltages from adjacent electric power lines or electrified railway
    systems, earth potential rise due to power faults, and direct contacts between
    telecommunication lines and power lines.\r\n\r\nMajor changes compared with the
    2008 version of this Recommendation include:\r\n\r\n–           updating the references;\r\n\r\n–
    \          amended Criterion A;\r\n\r\n–           revision of the test schematics
    to improve clarity;\r\n\r\n–           adding test schematics for external coaxial
    cable ports;\r\n\r\n–           adding multi-conductor test schematics for internal
    unshielded cables;\r\n\r\n–           adding tolerances for waveform generation;\r\n\r\n–
    \         addition of ports that rely on insulation coordination for surge protection.
    \r\n"
