abstract:
- language: en
  script: Latn
  content: CCITT Rec. X.722 | ISO/IEC 10165-4 provides developers of Recommendations
    | International Standards, that contain managed object definitions, with guidance
    that will:a) encourage consistency between managed object definitions;b) ensure
    the developement of such definitions in a manner compatible with the OSI management
    of Recommendations | International Standards;c) reduce duplication of effort in
    other working groups by identifying commonly useful documentation layouts, procedures
    and definitions.This technical corrigendum revises the text to include ASN.1:1997
    in clauses 2.1 and 2.2.
