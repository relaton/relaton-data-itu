abstract:
- language: en
  script: Latn
  content: The provisions of this Recommendation apply to intermediate storage devices
    connected to a national telex network identified by individual telex addresses
    which are part of the national telex numbering plan. This Recommendation recognizes
    that currently implemented intermediate storage devices may not conform to these
    provisions. However, there would be advantages if existing equipment complied
    with the requirements of this Recommendation where possible, but that in any case
    new equipment should comply in order to maintain the quality of the international
    telex service. The provisions of this Recommendation have particular application
    within the interworking scenarios described in the F.80- and U.200-Series Recommendations
