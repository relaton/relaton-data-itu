abstract:
- language: en
  script: Latn
  content: "Supplement 17 to the ITU-T Series of Recommendations provides guidance
    to standards developers on addressing accessibility requirements, and recommendations
    in standards that focus, directly or indirectly, on systems (i.e., products, services
    and built environments) used by people. To assist standards developers to define
    accessibility requirements and recommendations, the Supplement presents:\r\n\r\n–
    \          a summary of current terminology relating to accessibility;\r\n\r\n–
    \          issues to consider in support of accessibility in the standards development
    process;\r\n\r\n–           a set of accessibility goals (used to identify user
    accessibility needs);\r\n\r\n–           descriptions of (and design considerations
    for) human abilities and characteristics;\r\n\r\n–           strategies for addressing
    user accessibility needs and design considerations in standards.\r\n\r\nThis supplement
    is technically aligned with ISO/IEC Guide 71 (2014). It includes the following
    modifications: Deletion of terminological entry 2.19 \"accessible design\", deletion
    of Note 2 in entry 2.18 \"universal design\", and amended paragraph 7 of the Introduction.\r\n"
