abstract:
- language: en
  script: Latn
  content: This Supplement to Recommendation ITU-T X.1205 provides a framework for
    negotiating agreement on security information sharing between cybersecurity entities
    such as information requester and information provider. This Supplement defines
    functional capabilities and a reference model for security information sharing
    negotiation, conceptual data modelling of security information sharing agreement
    (SSA), security information sharing policy (SSP) and the SSA negotiation process.
