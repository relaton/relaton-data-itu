abstract:
- language: en
  script: Latn
  content: "This Recommendation defines four levels of entity authentication assurance
    (i.e., LoA 1 – LoA 4), and the criteria and threats for each of the four levels
    of entity authentication assurance. Additionally, it:\r\n•\tspecifies a framework
    for managing the assurance levels;\r\n•\tprovides guidance concerning control
    technologies that are to be used to mitigate authentication threats, based on
    a risk assessment;\r\n•\tprovides guidance for mapping the four levels of assurance
    to other authentication assurance schemas; and \r\n•\tprovides guidance for exchanging
    the results of authentication that are based on the four levels of assurance.\r\n"
