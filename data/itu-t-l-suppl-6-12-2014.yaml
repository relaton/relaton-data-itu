  content: "Supplement 6 to the ITU-T L series refers to the best practices defined
    in Recommendation ITU\x1ET L.1300. More precisely, the Supplement first provides
    a background, purpose and overview of the validation test of a data centre cooling
    method using renewable energy. Then, test results of such a cooling method are
    reported together with predictions of future yearly energy consumption."
