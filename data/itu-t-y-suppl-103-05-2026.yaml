abstract:
- language: en
  script: Latn
  content: "Smart cities and communities (SC&C) share the goal of achieving urban
    sustainability without sacrificing the quality of life of their citizens. Artificial
    intelligence (AI) offers a powerful tool to address these issues, enabling cities
    to use vast amounts of data generated from SC&C. AI can analyse and process this
    data in real-time, providing actionable insights that help city planners and administrators
    make more informed decisions. Supplement 103 to ITU-T Y-series Recommendations
    specifies the use cases of smart cities and communities supported by AI.\r\n"
