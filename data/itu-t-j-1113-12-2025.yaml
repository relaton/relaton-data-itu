abstract:
- language: en
  script: Latn
  content: "As digital broadcasting services are being rapidly deployed, many service
    operators are considering more effective transmission of these services. Recently,
    digital broadcasting services have evolved and are using resources more efficiently
    to more easily accommodate the varying needs and environments of subscribers.
    Therefore, it is necessary to redefine Internet protocol (IP)-based digital video
    convergence service (DVCS) for maintaining quality of service (QoS) and using
    bandwidth effectively for transmission on broadband network environments.\r\nIP-based
    DVCS is a service system for distributing digital video via IP-based broadband
    networks. It is the service system for providing interfaces and functionalities
    to enable service operators to offer QoS-guaranteed broadcasting to subscribers
    via IP-based converged broadband networks.\r\nRecommendation ITU-T J.1113 defines
    the specification of IP-based DVCS, considering the convergence environment. It
    defines the specification of IP-based DVCS including IP-based switched d4gital
    video (SDV) technologies considering the convergence environment. It is based
    on Recommendation ITU-T J.1111 \"Requirements for the advanced IP-based digital
    video convergence service\" and Recommendation ITU-T J.1112 \"Functional requirements
    for IP-based digital video convergence service\".\r\n"
