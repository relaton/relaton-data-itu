abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard defines the set of capabilities,
    in terms of abstract service definition, provided by the Physical Layer to the
    Data Link Layer. For designers of Data Link Layer protocols, it provides a definition
    of the Physical service to allow design and implementation independent of details
    of the Physical Layer protocol. For designers of Physical Layer protocols, it
    defines the set of capabilities to be made available through the action of the
    protocol over the underlying physical media.
