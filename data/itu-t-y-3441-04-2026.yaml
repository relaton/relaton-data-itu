abstract:
- language: en
  script: Latn
  content: "Communication services are usually transmitted across heterogeneous networks
    with different access technologies, which makes quality of service (QoS) assurance
    for end-to-end (E2E) deterministic communication services more complex. Machine
    learning (ML)-based joint resource scheduling could reduce algorithm complexity
    because it can optimize online scheduling and resource allocation among multiple
    networks, based on the services and networks states.  \r\nRecommendation ITUT
    Y.3441 specifies the QoS requirements, framework and operational procedures to
    support deterministic communication services across heterogeneous networks, including
    IMT-2020 and beyond, enabled by ML-based joint resource scheduling.\r\n"
