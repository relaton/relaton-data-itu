abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3368 specifies the optical distribution frame (ODF)
    on-site smart maintenance architecture and functional requirements for ODF smart
    maintenance, including the functional requirements of a smart handover unit (SHU),
    ODF smart maintenance system (OSMS) and the interface between the SHU and OSMS.
    It reduces the workload of ODF on-site maintenance for manual operation and a
    maintenance mode, and saves a lot of maintenance costs and time. Quick and accurate
    changing of optical fibre connections and then flexibly changing the network connection
    and data relationship according to the business requirements can be achieved.
    Consequently, the capability of smart maintenance and smart services for optical
    communication networks and data centres can be improved.\r\n"
