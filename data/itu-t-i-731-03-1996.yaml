abstract:
- language: en
  script: Latn
  content: This Recommendation describes the general functional architecture and characteristics
    of ATM Network Elements (NE) in terms of specific functional blocks derived from
    the B-ISDN Protocol Reference Model (PRM) described in Recommendation I.321 and
    the modelling methodology in Recommendations G.805 and I.326.The intent of this
    Recommendation is to enable interoperability between ATM equipment based on the
    specific requirements described for the functional blocks. The more detailed description
    of the individual functional elements is given in the companion Recommendation
    I.732.Clause 5 provides an overview description of the ATM NE functional blocks
    in terms of the User Plane, Layer Management and Plane Management functions. The
    Transfer Functions common to both User and Control Planes are described. The Physical
    Interfaces required for interoperability between the ATM NEs are defined, with
    references to the appropriate Recommendations which describe these interfaces
    in detail.Clause 6 defines the criteria for the classification of the ATM Equipment
    Types. Examples of ATM equipment network applications are illustrated in Annex
    A.Clause 7 describes the generic performance requirements and Quality of Service
    (QOS) aspects applicable to ATM Equipment, with reference to the relevant I-Series
    Recommendations.Clause 8 outlines timing and synchronization requirements for
    ATM equipment.
