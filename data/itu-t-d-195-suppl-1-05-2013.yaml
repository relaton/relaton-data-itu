abstract:
- language: en
  script: Latn
  content: 'Supplement 1 to Recommendation ITU-T D.195 is intended to help interested
    telecommunication operators to develop credit management guidelines to promote
    efficiency in managing accounts receivable and internal information sharing on
    companies that pose credit risks. The objective of these voluntary guidelines
    is to help operators to formulate new (or update existing) credit management guidelines
    according to their own needs and in line with the latest credit management policies. '
