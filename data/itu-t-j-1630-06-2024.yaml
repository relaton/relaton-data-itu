abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.1630, describes the scope of key performance indicators
    (KPIs) for network performance and key quality indicators (KQIs) for user experience
    with traditional and advanced video services. This Recommendation also defines
    the measurement and monitoring methods. Such key performance indicators (KPI)
    as well as their monitoring and management can be used for multi-QoS optimization
    thus enabling artificial intelligence (AI) functions over integrated broadband
    cable network.\r\nThis Recommendation belongs to the series of AI assisted cable
    network Recommendations intended to provide more flexible and effective usage
    of network resources by applying intellectual functions.\r\nAt the time of drafting
    of this Recommendation this series additionally includes the following Recommendations:\r\n–Recommendation
    ITU-T J.1600: This document specifies the framework of the premium cable network
    platform (PCNP) for cable TV and broadband network that exploit cloud based artificial
    intelligence (AI) and network data to optimize network and TV services, thus enabling
    the high satisfaction of user's experience of perceptual aspects of services.\r\n–Recommendation
    ITU-T J.1611: This document specifies functional requirements for a smart home
    gateway from both the hardware and software point of view to ensure secure interoperability
    among consumers, businesses and industries by delivering a standardized communications
    platform and allowing devices to communicate across operating systems, service
    providers, transport technologies or ecosystems. In a smart home solution, a gateway
    is incorporated to connect various appliances. In addition, a connection management
    platform based on the Internet of things (IoT) is required to enable various applications.
    These applicable solutions include home health, entertainment, security and home
    automation, which promote a safer, happier, as well as a more comfortable and
    convenient lifestyle.\r\n–Recommendation ITU-T J.1612 aims to define the architecture
    for a smart home gateway (SHGW) which addresses the functional requirements found
    in Recommendation ITUT J.1611. This Recommendation consists of concepts of a virtual
    device model, dynamic device profile and other important software modules. With
    the introduction of these important modules, the architecture can dynamically
    support existing smart home devices and devices in the future. Smart home is one
    example of a home automation system in which a wide range of IoT devices in a
    home cooperate to provide intelligent controlling and monitoring functions for
    home users. Smart home gateway connects various smart home devices, provides hardware
    interfaces of various smart home communication protocols, runs communication protocols,
    performs protocol conversion and bridging, and realizes the interaction between
    the user control terminal and cloud server.\r\n–Recommendation ITU-T J.1631 describes
    functional requirements of the end-to-end (E2E) network platform to deliver 360°/virtual
    reality (VR) video services from the video cloud to terminal devices over integrated
    broadband cable networks. Cloud VR is a new cloud computing technology for VR
    services. With fast and stable transport networks, VR contents are stored and
    rendered in the cloud. Audiovisual contents are encoded, compressed and transmitted
    to user terminals. This Recommendation specifies the network requirements of cloud
    VR services.\r\n"
