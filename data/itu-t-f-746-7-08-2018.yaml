abstract:
- language: en
  script: Latn
  content: This Recommendation describes metadata for intelligent question answering
    service framework [ITU-T F.746.3]. This Recommendation defines metadata and service
    flow for different functions to support the intelligent question answering service,
    which provides advanced functions to generate answers for the user's question
    in a natural language. The scope of this Recommendation is focused on describing
    metadata for natural language processing function, question analysis function,
    candidate answer generation function, answer inference/generation function, and
    input and output function. This Recommendation also describes the general information
    flows to describe how the metadata are used in the intelligent QA service.
