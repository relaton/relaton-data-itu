abstract:
- language: en
  script: Latn
  content: This Recommendation establishes the base for negotiation of accounting
    rates which apply to countries in the TAL Group.The TAL Group had decided to revise
    the maximum level of accounting rates stipulated in Recommendation D.500R on the
    basis of the results of the 1999 accounting rate survey in the region. The cost
    model/methodology developed by this Group is also annexed as an appendix to this
    Recommendation.
