abstract:
- language: en
  script: Latn
  content: "Physical city assets continue to evolve with technology and city development.
    With the support of Internet of things (IoT), safeguarding, maintenance and management
    of city assets can enable new service experience for a diversity of users including,
    but not limited to, citizen and city asset operators. The physical city asset
    monitoring collects data of the physical city assets and provides a set of services
    to smart city applications and other smart city systems.\r\nPhysical city assets
    monitoring may face security threats, such as tampering with physical city asset
    information, unauthorized sharing of city asset data, attack on open interface,
    attack on data visualization platform, etc. Sending illegal instructions or malicious
    codes to city physical asset equipment through asset management system has seriously
    affected the safety of city physical assets and city operation.\r\nRecommendation
    ITU-T X.2050 identifies security threats specific to the physical city asset monitoring,
    analyses its security requirements and thus offers a reference of the physical
    city asset monitoring for the smart city key stakeholders to safeguard and improve
    services based on the physical city asset monitoring.\r\n"
