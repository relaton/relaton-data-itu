abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4211 specifies accessibility requirements for smart
    public transport services. The concept of accessibility in public transport services
    has been mainly concerned with eliminating physical barriers such as adopting
    accessible trains and buses that allow wheelchair accessibility by mechanical
    lowering-entrance floors. In smart public transport services, the use of Internet
    of things (IoT), when properly designed, may increase accessibility of public
    transport services by providing access of information and physical accessibility.
    The IoT can be used to create tools for persons with many types of disability
    and specific needs, including physical, visual, hearing and cognitive disabilities.
    In order for the smart transport services to appropriately provide accessible
    services, information about accessibility profiles must be agreed upon in advance.
    Such accessibility profiles should basically include information on accessibility
    needs while travelling on public transport services. \r\n"
