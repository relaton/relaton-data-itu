abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T L.1006 describes the general test suites applicable
    to the universal power adapter solution (UPA) designed for ICT devices for stationary
    (non-portable) use defined in Recommendation ITU-T L.1001. It considers the creation
    of specific test suites to assess certain functional aspects of the energy efficiency,
    interworking, safety and electromagnetic compatibility (EMC) of universal power
    adapter solution (UPA) designed for ICT devices for stationary (non portable)
    use. Such testing is required to guarantee a minimum quality level of the universal
    charging solution (UCS) in conformance with the target basic configuration of
    UPA described in Recommendation ITU-T L.1001. With regard to electromagnetic compatibility
    (EMC) and safety aspects, additional requirements to those listed in Recommendation
    ITU-T L.1001 are necessary for a product to be available for use by the general
    public.
