abstract:
- language: en
  script: Latn
  content: "The packages in Recommendation ITU-T H.248.29 provide ITU-T H.248 support
    for channel associated signalling (CAS) compelled register signalling. This can
    be used for R2, although the packages are generic so that they can also be used
    for other non-R2 compelled schemes. This Recommendation proposes methods to support:\r\n•\tstandard
    en bloc compelling;\r\n•\toverlap compelling;\r\n•\tthe ability to enable end-to-end
    compelled signalling.\r\nThis Recommendation provides only the capabilities of
    compelled register signalling and it is expected that a system would need to implement
    the bcas, icas and casblk packages for the line signalling components of any CAS
    protocol.\r\nThree packages are defined in Annex A:\r\n•\ticasc which provides
    standard en bloc compelling;\r\n•\ticasco which extends icasc and provides overlap
    compelling in addition to en bloc;\r\n•\ticasce which extends icasco and provides
    the ability to enable end-to-end signalling in addition to en bloc and overlap.\r\nAnnex
    B defines an alternative package for support of these functions, called icascgen.
    This package defines a generic register signalling, which may be used for national
    variants of Signalling System R2. This kind of interregister signalling is a compelled
    multifrequency code system. The package is suitable for ITU-T Signalling System
    R2, although it is defined in a generic way. Thus it can also be used exclusively,
    or in addition to the packages defined in Annex A. The proposed package comprises
    following compelled address transfer modes:\r\n•\tgeneric standard en bloc compelling;
    and\r\n•\toverlap procedures.\r\nNOTE – The ability to enable end-to-end compelled
    signalling utilizing Annex B is for further study.\r\nAnnex B introduces the concepts
    of Detection Events Map and Generation Signals Map, which are very similar to
    ITU-T H.248 Digit Map usage.\r\nThis revision incorporates a new parameter to
    indicate whether the Generic Digit information Event is generated in the event
    of an unsuccessful events map match.\r\n"
