abstract:
- language: en
  script: Latn
  content: This Recommendation defines the managed entities that are required to support
    the requirements for the management of ATM-PON (Passive Optical Network). These
    definitions are to be used to develop a protocol-neutral information model. A
    network view and a network element view combined with the network view of an ATM-PON
    are modelled according to a protocol-neutral information modelling concept. The
    concept provides a protocol-neutral MIB and thus permits developers to derive
    an implementation-specific MIB from any management protocol. The information model
    described herein is used on an interface between a Network Management Layer and
    an Element Management Layer.
