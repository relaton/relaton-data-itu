abstract:
- language: en
  script: Latn
  content: "Satellite communications is a type of communications using satellite-borne
    equipment as part of or all of the communication network. In developing countries,
    considering the limitations on the capabilities and capacity of land-based networks,
    the use of satellite communications is important. Supplement 81 to ITU-T Y-series
    Recommendations specifies some use cases and the corresponding requirements of
    satellite communication networks in developing countries, in the context of non-radio
    aspects of IMT2020 networks and beyond.\r\n"
