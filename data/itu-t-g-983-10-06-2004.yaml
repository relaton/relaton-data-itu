abstract:
- language: en
  script: Latn
  content: This Recommendation focuses on the OMCI specifications related to support
    for ONUs with ADSL and VDSL interfaces.In the B-PON system defined in ITU-T Rec.
    G.983.1 [1], the ONTs are located at the customer site and the ONUs are generally
    located at the curb or cabinet. The B-PON element management system will only
    manage ONTs/ONUs as part of the B-PON system through the OLT using the ONT management
    and control interface (OMCI).The OMCI specifications are based on ITU-T Rec. G.983.2
    [2]. Some enhancements are needed for the support of ADSL and VDSL interfaces.
    This Recommendation covers configuration, fault and performance management enhancements
    to ITU-T Rec. G.983.2. Attributes are taken from the G.99x series of Recommendations
    which relate to DSL technology. This Recommendation uses the approach described
    in ITU-T Rec. G.983.8 which focuses on other interfaces.
