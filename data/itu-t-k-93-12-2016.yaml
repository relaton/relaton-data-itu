abstract:
- language: en
  script: Latn
  content: The introduction of high-speed data services to customer premises that
    rapidly adopt new technologies allows the distribution of such data within customer
    premises. This is leading to a number of different wireless (e.g., wireless local
    area network, LAN, and digital enhanced cordless telecommunications, DECT) and
    wireline technologies (e.g., LAN and technologies designed to exploit existing
    telephone extension and power distribution wiring) to interconnect a variety of
    in-home electronic and electrical equipment (such as set top box, STB), and PCs.
    Many types of broadband services are provided on IP networks, such as voice over
    Internet protocol (VoIP), video on demand (VoD) and broadcasting. Moreover, the
    electromagnetic environment in the home will change due to this situation. Therefore,
    new electromagnetic compatibility issues may occur in a home network environment.
    Recommendation ITU-T K.93 aims to ensure normal operation of home networking devices
    and to provide a new additional immunity test method for broadband services, especially
    for devices that are sensitive to broadband interferences.
