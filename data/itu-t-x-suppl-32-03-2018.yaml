abstract:
- language: en
  script: Latn
  content: "upplement 32 to X-series Recommendations aims to complement the information
    provided in ITU-T X.1058 by providing additional implementation guidance for Personally
    Identifiable Information (PII) protection, which are not described in ITU-T X.1058,
    but should further be applicable to telecommunications organizations to address
    PII protection.\r\n\r\nThe number of telecommunications organizations processing
    PII is on the rise. Accordingly, expectations for the protection of PII are also
    increasing.\r\n\r\nThe protection of PII is driving the need for a set of additional
    controls and implementation guidance for PII protection, which are applicable
    to telecommunications organizations. The guidance presented in this Supplement
    are additions to those described in ITU-T X.1058.\r\n"
