abstract:
- language: en
  script: Latn
  content: This Recommendation describes the technical characteristics of data transmission
    services, including leased circuit, circuit switched, packet switched (including
    ISDN), and frame relay. Technical characteristics include access attributes, interfaces
    and quality of service parameters. This Recommendation also contains definitions
    of particular optional user facilities and terminology. This revision includes
    access to frame relay data transmission service via B-ISDN and some optional user
    facilities for frame relay.
