abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.114 specifies the electromagnetic compatibility
    common requirements and test methods for digital cellular mobile communication
    base station (BS) equipment, repeaters and associated ancillary equipment that
    are independent of any kind of wireless access technologies, such as second, third,
    fourth or fifth generation.\r\nTest conditions for BSs used in variety modality
    are described, e.g., macro BS, distributed BS, micro BS, pico BS, integral antenna
    BS, active antenna BS and over the air active antenna BS. Performance criteria
    for immunity tests are also specified.\r\nRecommendation ITU-T K.114 describes
    the specific testing levels to be applied to radio communication BSs in various
    environments, e.g., telecommunication centres, customer premises and outside plants.\r\n"
