abstract:
- language: en
  script: Latn
  content: This Recommendation specifies document communication services to be provided
    on top of existing base standards or profiles, giving constraints on them and
    rules on how to use and combine them.Recommendation T.190 specifies basic services,
    such as storing, retrieval, manipulation, pointing or token-interchange. Some
    of these basic services can be used as stand-alone services, but all of them are
    candidates to build more complex services, such as joint synchronous editing and
    joint document presentation/viewing.This Recommendation specifies complex document
    communication services that are built on top of the basic ones.
