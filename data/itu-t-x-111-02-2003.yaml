abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation is to provide network operators with
    the information necessary to ensure that Frame Relay data traffic can be routed
    effectively and efficiently across the International Public Data Network. Guidelines
    and general principles for the planning of Public Frame Relay Data networks and
    the routing of International Frame Relay Traffic are provided. In particular guidance
    on the incorporation of service requirements into the network routing process
    is provided. Principles for routing in the case of Frame Relay/ATM interworking
    are also provided.
