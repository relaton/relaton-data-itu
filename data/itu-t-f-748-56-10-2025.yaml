abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.748.56 defines a general three-layer framework
    for the artificial intelligence generated content (AIGC) system. The application
    layer is divided into unimodal/multi-modal tasks from the perspective of content
    generation modalities. The model layer covers generative artificial intelligence
    (AI) technologies and multimodal foundational models related to AIGC. The infrastructure
    layer includes big data, cloud platforms, and computational modules. It forms
    an overall framework for the AIGC system, along with the functionality requirements,
    model capability benchmark testing scenarios, evaluation methods, evaluation metrics,
    and workflows. This Recommendation is intended to guide enterprises in building
    relevant AIGC capabilities for text, audio, image, video, 3D, and other modalities,
    and to provide a reference for testing, selecting, or evaluating AIGC technological
    capabilities.\r\n"
