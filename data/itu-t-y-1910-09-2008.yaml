abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.1910 describes the IPTV functional architecture
    intended to support IPTV services based on the IPTV service requirements and definitions.
    Starting from a basic description of IPTV roles and services, a high level IPTV
    functional model is outlined. This model is then developed into a set of functional
    architectures which support NGN and non-NGN transport networks, as well as operation
    modes with or without IMS.
