abstract:
- language: en
  script: Latn
  content: One of the essential benefits of the NGN is a supporting of convergences
    such as a fixed mobile convergence (called FMC), telecom-broadcasting converged
    service like IPTV. ITU-T produced several Recommendations on FMC and IPTV, especially
    in the ITU-T Y.2000 series of Recommendations. ITU-T is developing more detailed
    aspects of supporting the FMC, taking consideration of the fact that various services
    are waiting to utilize the FMC as their service infrastructure, which will extend
    their service coverage as well as give more benefits to the user.This Supplement
    to the ITU-T Y.2000-series Recommendations on the scope of service scenarios over
    the FMC provides service scenarios which are used over FMC. This Supplement uses
    the features of involved key elements of FMC to guide how services can be provided
    in detail. This Supplement also introduces overall configurations and scenario
    models to identify service scenarios over the FMC.
