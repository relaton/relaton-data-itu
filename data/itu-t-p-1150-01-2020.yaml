abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.1150 describes communication requirements for an
    in-car communication (ICC) system that utilizes integrated microphones and speakers
    in the motor vehicle cabin to amplify conversation and which is aimed at providing
    an improved communication between all occupants in a motor vehicle.\r\n\r\nThis
    Recommendation sets base levels of function and quality to ensure that the ICC
    operates to a quality such that the motor vehicle driver does not feel it necessary
    to turn their head to amplify their voice when talking to other passengers. This
    can, for example, aid in preventing driver distraction.\r\n\r\nTo meet these requirements,
    the use of audio zones within a motor vehicle cabin for speech communications
    between audio zones, and tests to ensure good speech intelligibility and quality
    between those zones are defined. This Recommendation covers requirements and test
    methods for:\r\n\r\n1)          system stability;\r\n\r\n2)          speech intelligibility;\r\n\r\n3)
    \         speech quality;\r\n\r\n4)          talker localization accuracy.\r\n\r\nThe
    use of wearable headphones (audiophones) by the driver or passengers is outside
    the scope of this Recommendation.\r\n"
