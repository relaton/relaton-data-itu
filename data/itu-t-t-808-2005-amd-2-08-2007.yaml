abstract:
- language: en
  script: Latn
  content: This amendment adds a multi-component transformation resolution level flag
    to JPIP. This is useful for remote browsing of an image that was compressed with
    a wavelet based multiple-component transform at a sub-resolution in the component
    direction.As of the approval of this Amendment, ISO/IEC JTC 1/SC 29 was also preparing
    ITU-T Rec. T.808 (2005) | ISO/IEC 15444-9:2005 Amd.2, which had not progressed
    to FDAM stage; therefore, it could not be considered for AAP. Since this Amendment
    on "JPIP extensions" to ITU-T Rec. T.808 | ISO/IEC 15444-9 was balloted by ISO/IEC
    JTC 1/SC 29 as PDAM 3, FPDAM 3, FDAM 3, it was kept as for the ITU-T approval
    process purposes also numbered as Amendment 3, even though Amendment 2 was neither
    approved or yet available for consideration under AAP. After approval, in order
    to keep the temporal numbering approach of the approved Recommendations | International
    Standards, this Amendment was renumbered as Amendment 2 for publication purpose.
