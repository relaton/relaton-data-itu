abstract:
- language: en
  script: Latn
  content: "Supplement 53 to ITU-T L-series Recommendations provides guidelines to
    policy-makers, technologists, innovators, environmentalists and other stakeholders
    from the technology industry, environmental sciences and policy arena on the topic
    of environmental efficiency criteria to assess the environmental impacts of artificial
    intelligence and other emerging technologies. These guidelines aim to serve as
    common factors for the above-mentioned stakeholders to consider while developing,
    deploying and promoting any piece of technology into the market and society, rather
    providing than a comprehensive list of criteria.\r\nWhile \"emerging technologies\"
    is a broad term, this Supplement identifies a few sample technologies through
    their accordant applications and areas of work in 16 applicable industry domains,
    which stakeholders can use as references to improve the environmental efficiency
    of their own technological products and/or services. When discussing environmental
    efficiency, this Supplement approaches environmental efficiency criteria from
    an adjusted model of life-cycle assessment of a product, within which three stages
    of environmental impacts – materials, use and end of life – are examined. The
    Supplement provides both long-term and short-term strategies, which include not
    only specific examples for certain technologies addressing the three stages of
    environmental efficiency, but also an instrument to be used to localize such guidelines
    as well as to allow global benchmarking.\r\n"
