abstract:
- language: en
  script: Latn
  content: This Recommendation deals with dimensioning methods for a set of circuit
    groups handling multi-slot bearer services which consist of first-choice groups
    and an overflow group to which overflow traffic from the first-choice groups are
    offered. For this purpose, this Recommendation provides example methods for calculating
    peakedness of the overflow traffic and example methods for calculating individual
    call blocking probabilities of the overflow group.
