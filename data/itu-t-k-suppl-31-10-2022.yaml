abstract:
- language: en
  script: Latn
  content: "Since the publication of Recommendation ITU-T K.118 (2016), Requirements
    for lightning protection of fibre to the distribution point equipment, the system,
    often called G.fast (fast access to subscriber terminals) with reverse power feed
    (RPF), has had extensive deployment. This Supplement provides an assessment of
    earth potential rise (EPR) levels at the cabling link ends to the distribution
    point unit (DPU) and the customer premises equipment (CPE).\r\nElectrical lightning
    stresses on the connected equipment at the link ends are considered to arise from
    the lightning disturbances on the CPE powering source, differential EPR of the
    link ends and possibly magnetic induction to the link cable. This Supplement mainly
    concerns itself with the link end EPR values.\r\n"
