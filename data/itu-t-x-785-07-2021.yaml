abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T X.785 defines a set of guidelines for managed object
    modelling and a management interface for representational state transfer (REST)-based
    network management. It is part of a framework for REST based network management
    interfaces. It specifies how REST-based management interfaces should be defined.
    It covers the generic accessing methods of REST-based managed objects, accessing
    methods for specific managed object (Mos), information modelling in REST / hypertext
    transfer protocol (HTTP) and YAML ain''t markup language (YAML) / JavaScript object
    notation (JSON) schemas. Some HTTP requests/responses and YAML/JSON schemas are
    provided for defining some basic data types: generic managed object (MO) and generic
    MO accessing methods.'
