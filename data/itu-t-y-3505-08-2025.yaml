abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3505 provides an overview and functional requirements
    of data storage federation. Data storage federation provides a single virtual
    volume from multiple data sources in heterogeneous storages. In this Recommendation,
    configuration for logical components, and ecosystem of data storage federation
    as well as cloud computing based data storage federation are introduced for data
    storage federation. Functional requirements are derived from use cases.\r\n"
