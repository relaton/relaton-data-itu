abstract:
- language: en
  script: Latn
  content: "The objective of Supplement X to the ITU-T K-series Recommendations, Additional
    criteria to protect telecommunication cabling in the event of a power cross event,
    is enable the implementation of power cross protection for telecommunications
    cabling connected to [b-ITU-T K.20], [b-ITU-T K.21] and [b-ITU-T K.45] compliant
    equipment.\r\n\r\nThis Additional criteria to protect telecommunication cabling
    in the event of a power cross event supplement aims to:\r\n\r\n•            Provide
    current-time limitations to protect telecommunication cabling from fusing and
    wire insulation damage.\r\n\r\n•            Explain the evolution of physical
    wiring simulators and their drawbacks\r\n\r\n•            Provide designers with
    the tools to extrapolate the supplement current-time limitations data to larger
    and smaller conductor sizes.\r\n\r\n \r\n"
