abstract:
- language: en
  script: Latn
  content: "Augmented Reality (AR) technology is a kind of mixed reality which 2D/3D
    graphics are integrated into the real world in order to enhance user experience
    and enrich information. Augmented Reality Smart Television (AR-STV) is TV broadcasting
    using AR technology  to blend augmented content (2D/3D graphic object) with broadcasting
    content in real-time on receiving terminals. The augmented content overlaid in
    the augmentation region is fixed statically or moves along the trajectory as if
    AR-based location application shows path information on the real location from
    a smart-phone’s camera. AR-STV provides that TV viewers can choose whether user
    turn on the augmented content or watch the original TV content only (without the
    augmented content).\r\n\r\nThis Recommendation ITU-T J.302 specifies the related
    technologies that should be implemented for augmented reality smart television
    system.\r\n"
