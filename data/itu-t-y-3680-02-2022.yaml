abstract:
- language: en
  script: Latn
  content: "Artificial intelligence technologies, network awareness technologies,
    network self-restructuring technologies and other technologies applied into a
    network area can bring about network innovation and a new network architecture.
    Introducing human-like features into a network can help the network make full
    use of human advantages and create a new network architecture called human-like
    networking.\r\nRecommendation ITU-T Y.3680 specifies a framework for human-like
    networking. This Recommendation specifies aspects of human-like networking. The
    scope of this Recommendation includes an overview of human-like networking, a
    framework of human-like networking, a generic architecture model for human-like
    networking based on function and capability, the relationship between layers,
    sub-networks and networks for human-like networking, an interface aspect of human-like
    networking and security considerations.\r\n"
