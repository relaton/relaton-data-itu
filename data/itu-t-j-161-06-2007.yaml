abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation J.161 specifies the media aspects of the interfaces
    between IPCablecom client devices for audio and video communication. Specifically,
    it identifies the audio and video codecs necessary to provide the highest quality
    and the most resource-efficient service delivery to the customer. This Recommendation
    also specifies the performance required in client devices to support future IPCablecom
    codecs. Additionally, this Recommendation describes a suggested methodology for
    optimal network support for codecs.
