abstract:
- language: en
  script: Latn
  content: This Recommendation specifies an application profile to apply the JBIG
    coding scheme, defined by Recommendation T.82, for facsimile apparatus. The main
    specifications in this Recommendation are:1) Application profile of "single-progressive
    sequential coding" is defined. Other profiles (progressive coding) are for further
    study.2) Data format consists of header information and coded information. The
    parameter ranges in the header are specified.
