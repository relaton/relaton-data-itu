abstract:
- language: en
  script: Latn
  content: "Mobile terminals, especially smartphones, are changing people's work and
    lifestyle. For example, mobile payments are experiencing rapid growth as consumers
    use mobile terminals as part of their modern dynamic lifestyles, more enterprises
    support employees accessing enterprise services with personal mobile terminals,
    etc. However, mobile terminal security is a big challenge for mobile application
    services as such. For example, users may unknowingly expose their terminals to
    malware and put sensitive data at risk of data breaches. \r\nRecommendation ITU-T
    X.1128 provides security features to assess mobile terminal security and information
    on how relevant entities could use the security features in this Recommendation.\r\n"
