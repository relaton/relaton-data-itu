abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T H.751 defines the common semantics and core elements
    of rights information interoperability (RII) for Internet Protocol television
    (IPTV) systems and/or equipment that allow multimedia content to be legally used
    across different platforms. The rights information includes rights- and security-related
    metadata that is described in Recommendation ITU-T H.750. This Recommendation
    describes rights-related information such as content ID, permission issuer ID
    and permission receiver ID, which are used to bridge between rights-related metadata.
    It should be noted, however, that rights management and content protection technology
    are beyond the scope of this Recommendation. This Recommendation is technically
    aligned with the specification in IEC 62698, Multimedia home server systems –
    Rights information interoperability for IPTV.
