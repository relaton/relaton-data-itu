abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.734 provides definitions, use cases and functional
    requirements for telepresence systems. Telepresence is an interactive audio-visual
    communications experience between remote locations, where the users enjoy a strong
    sense of realism and presence between participants by optimizing a variety of
    attributes. A telepresence system is a set of functions, devices and network elements
    which are able to capture, deliver, manage and render multiple high quality interactive
    audio and video signals in a telepresence conference to deliver a telepresence
    experience.\r\n\a"
