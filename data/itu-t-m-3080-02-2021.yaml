abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3080 provides a framework of artificial intelligence
    enhanced telecom operation and management (AITOM). It describes the functional
    framework of AITOM to support telecom operation management for efficiency improvement,
    quality assurance, cost management, and security assurance. It also describes
    artificial intelligence (AI) pipelines that combine some components to enable
    AI based applications. \r\n\r\nThis Recommendation also describes the relationship
    of the functional framework of AITOM with smart operations, management and maintenance
    (SOMM) presented in Recommendation ITU-T M.3041. General requirements of security
    are also described. \r\n"
