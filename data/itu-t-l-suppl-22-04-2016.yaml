abstract:
- language: en
  script: Latn
  content: "This Supplement identifies a low cost sustainable optical cable solution
    for potential users of broadband digital services in remote or rural areas who
    are unlikely to gain such services. The solution would quickly and inclusively
    close the digital divide which is the key target of ITU Connect 2020 Agenda.\r\n\r\nMatured
    and proven technologies are best integrated into affordable and reliable solutions
    suitable for non-skilled local people to install, operate, maintain and repair
    so that the system will become part of the community thus leading to better system
    maintenance and quicker damage recovery.\r\n\r\nBest practice examples use lightweight,
    thin and robust optical cables and commodity-type media converters. The results
    of field trials are presented. The cost of such cables with their simple construction
    are estimated to be down to one tenth of the solution using conventional optical
    cables.\r\n"
