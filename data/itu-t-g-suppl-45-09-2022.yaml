abstract:
- language: en
  script: Latn
  content: Supplement 45 to ITU-T G-series Recommendations consolidates power-saving
    proposals for various optical access systems in order to facilitate their consideration
    and comparative analysis for the satisfaction of requirements, on one hand, and
    overall system impact, on the other. This Supplement takes the form of a white
    paper summarizing efforts to gather requirements, specifying a wide spectrum of
    potential solutions, as well as their comparative analysis.
