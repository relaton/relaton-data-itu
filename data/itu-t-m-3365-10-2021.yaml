abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T M.3365, for video used for surveillance, specifies
    requirements for quality of experience (QoE) management, including that of resources,
    indicators, the evaluation activity configuration and evaluation records. Recommendation
    ITU-T M.3365 provides a scenario for a video quality evaluation system, which
    is a tool that implements its requirements. Recommendation ITU-T M.3365 also gives
    examples of video quality evaluation records for reference.
