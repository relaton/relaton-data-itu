abstract:
- language: en
  script: Latn
  content: This Recommendation describes transmission systems that are consistent
    with those described in ITU-T Recommendation J.112. Its purpose is to provide
    a technology through which the demand for symmetrical services on cable networks
    can be met. This second-generation technology, while using the same RF channel,
    is backward compatible with that of ITU-T Recommendation J.112. It provides a
    significant increase in upstream channel capacity with wider channels, higher
    symbol rate and increased spectral efficiency. It provides for both Synchronous-CDMA
    and Advanced-TDMA coding and also adds higher order modulation capabilities. It
    is more robust with regard to noise immunity and provides greater multipath protection
    than the technology used in ITU-T Recommendation J.112.
