abstract:
- language: en
  script: Latn
  content: "Supplement 91 to ITU-T Y-series Recommendations provides a service model
    of risk mitigation on livestock pandemic based on networks. The scope of this
    Supplement includes a reference architecture and identifies services required
    to support risk mitigation on livestock pandemics.\r\nFor the prevention of such
    smart livestock barn infectious diseases, it is more problematic because it is
    handled manually and there is no standardization procedure until now. It is required
    to effectively prevent infectious diseases occurring in wild birds, wild animals,
    and smart livestock barns by utilizing the network, and to effectively treat the
    future, current, and post situation. \r\n"
