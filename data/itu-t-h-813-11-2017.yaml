abstract:
- language: en
  script: Latn
  content: "The Continua Design Guidelines (CDG) defines a framework of underlying
    standards and criteria that ensure the interoperability of devices and data used
    for personal connected health services. It also contains design guidelines (DGs)
    that further clarify underlying standards or specifications by reducing options
    or by adding missing features to improve interoperability. These guidelines focus
    on the following interface:\r\n\r\n–           HIS-IF – Interface between health
    and fitness services (HFS) and the healthcare information system (HIS)\r\n\r\nRecommendation
    ITU-T H.813 is part of the \"ITU-T H.810 interoperability design guidelines for
    personal connected health systems\" sub-series that covers the following areas:\r\n\r\n–
    \          ITU-T H.810 – Interoperability design guidelines for personal connected
    health systems: System overview\r\n\r\n–           ITU-T H.811 – Interoperability
    design guidelines for personal connected health systems: Personal health devices
    interface design guidelines\r\n\r\n–           ITU-T H.812 – Interoperability
    design guidelines for personal connected health systems: Services interface design
    guidelines\r\n\r\n–           ITU-T H.812.1 – Interoperability design guidelines
    for personal connected health systems: Services interface: Observation upload
    capability\r\n\r\n–           ITU-T H.812.2 – Interoperability design guidelines
    for personal connected health systems: Services interface: Questionnaires capability\r\n\r\n–
    \          ITU-T H.812.3 – Interoperability design guidelines for personal connected
    health systems: Services interface: Capability exchange capability\r\n\r\n–           ITU-T
    H.812.4 – Interoperability design guidelines for personal connected health systems:
    Services interface: Authenticated persistent session capability\r\n\r\n–           ITU-T
    H.813 – Interoperability design guidelines for personal connected health systems:
    Healthcare information system interface design guidelines\r\n"
