abstract:
- language: en
  script: Latn
  content: "There are many demands of industry visual computing service requirements
    from industry video surveillance, smart grid, industrial automation, intelligent
    traffic and remote medical, etc. In the ecosystem of visual computing service
    provision and consumption, visual service consumers need to quickly find service
    providers and choose suitable services in order to save cost and complete tasks
    conveniently and quickly. On the other hand, many visual service providers wait
    for consumers to find and select their services to share their service resources
    and achieve the maximization of resource utilization. Therefore, it is necessary
    to establish a service platform to meet the communication needs between visual
    service providers and consumers and to manage them.\r\nRecommendation ITU-T F.743.34
    focuses on visual computing services and provides the requirements and reference
    framework of a service platform to support industry visual services.\r\n"
