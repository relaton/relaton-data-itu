  content: This Recommendation details the assignment procedures for Universal Personal
    Telecommunications (UPT) numbers, in the provisioning of the International UPT
    service as defined in ITU-T Rec. E.168. The assignment procedures in this Recommendation
    are applicable only to UPT Scenario 3 as defined in ITU-T Rec. E.168. The assignment
    of numbering resources to applicants under E.168.1 is the function/responsibility
    of the centralized ITU Numbering Administration Group (ITU-NAG) within the ITU-TSB.
