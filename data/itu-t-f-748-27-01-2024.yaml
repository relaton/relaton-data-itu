abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.748.27 outlines the framework and requirements
    for the construction of three dimensional (3D) intelligent driven digital human
    application systems. With the advancement of modelling, driving, rendering and
    interactive technologies, an increasing number of new services and applications
    involving 3D intelligent driven digital humans are emerging. It defines the concept,
    related terms, and fundamental functions of 3D intelligent driven digital human
    to specify the framework of 3D intelligent driven digital human application systems,
    including image generation, speech generation, animation generation, interaction
    processing, multimodal input and output modules with its specified functions and
    construction requirements. In addition, the Appendix presents some use cases of
    the workflow of 3D intelligent driven digital human.\r\n"
