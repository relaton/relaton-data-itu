abstract:
- language: en
  script: Latn
  content: "Supplement 7 to ITU-T A-series Recommendations provides guidelines for
    ITU-T members on the principles of streamlining Resolutions, as well as guidance
    on how to propose new draft Resolutions and revisions to existing World Telecommunication
    Standardization Assembly (WTSA) Resolutions in the preparation for WTSA.\r\nThe
    review process for WTSA Resolutions encompasses editorial updates, identifying
    overlap, identifying candidates for merging or suppression, simplifying or shortening
    Resolutions, preparing consolidated draft texts, and actively involving the regional
    telecommunication organizations (RTOs) in discussions leading up to a WTSA.\r\n"
