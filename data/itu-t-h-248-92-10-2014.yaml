abstract:
- language: en
  script: Latn
  content: The interlinkage of stream endpoints (SEP) relates to the empowerment of
    the MG by the MGC to perform the interconnection of two protocol endpoints. The
    interlinkage relates to abstracted bearer control protocol procedures as mainly
    part of the bearer establishment and release. The pair of protocol endpoints might
    be located in a single SEP or in different SEPs, leading to so-called intra-SEP
    and inter-SEP interlinkage configurations. Recommendation ITU-T H.248.92 defines
    an ITU-T H.248 package that allows the MGC to signal such interlinkage configurations
    to the MG. The discussion of use cases, models and examples complements the description
    of the ITU-T H.248 protocol extensions.
