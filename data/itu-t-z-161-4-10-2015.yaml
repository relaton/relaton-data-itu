abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Z.161.4 defines the behaviour types package of TTCN‑3.
    TTCN‑3 can be used for the specification of all types of reactive system tests
    over a variety of communication ports. Typical areas of application are protocol
    testing (including mobile and Internet protocols), service testing (including
    supplementary services), module testing, testing of CORBA based platforms, APIs,
    etc. TTCN‑3 is not restricted to conformance testing and can be used for many
    other kinds of testing including interoperability, robustness, regression, system
    and integration testing. The specification of test suites for physical layer protocols
    is outside the scope of this Recommendation.\r\n"
