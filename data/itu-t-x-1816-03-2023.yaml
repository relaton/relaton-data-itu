abstract:
- language: en
  script: Latn
  content: 'The definition of basic network slicing technology functions and processes
    has laid a solid foundation for the first wave of IMT-2020 deployment and commercial
    use of network slicing services. As an end-to-end logical network that is customized
    on demand, slicing can provide differentiation security capabilities: First, the
    IMT-2020 network slicing provides the supporting security measures for the differentiated
    network implementation. Second, the IMT-2020 network supports some optional security
    measures at the slice level. Some security measures can also provide multiple
    security options and operators may own different security resources. These may
    bring different degrees of security guarantee or non-security performance. Slice
    customers also have specific security requirements and may request customized
    network slices with different security protection levels from slice operators.
    There exist some challenges for the slice customers or the slice operators choosing
    the security capabilities of their slices such as management cost and definition
    inconsistency, etc. The objective of Recommendation ITU-T X.1816 is to provide
    a description of differentiated IMT-2020 network slice security capabilities and
    guidelines for classifying the IMT-2020 network slice security capabilities and
    IMT 2020 network slice security to help the ecosystem more clearly understand
    and choose the slicing security capabilities.'
