abstract:
- language: en
  script: Latn
  content: "ITU-T has approved a series of quantum key distribution network (QKDN)-related
    Recommendations, which focus on maximizing the service provision capability of
    QKDN. But in certain scenarios, the key provisioning capability of QKDN may still
    fail to meet the key supply demands of cryptographic applications. In particular,
    it can be exceedingly challenging for a single QKD node to handle highly concurrent
    key supply requests while maintaining an acceptable service level.\r\nTo address
    this challenge, QKDN multi-point coordination (QKDNmc) is introduced in this Supplement
    100 to ITU-T Y series Recommendations. QKDNmc is an enhancement of the QKDN functionality
    whereby two or more QKD nodes are coordinated by the QKDN, typically within the
    same trusted boundary, to collaboratively provide enhanced key provisioning services
    to one application node, thereby significantly improving key provisioning capabilities.\r\nFocusing
    on QKDNmc, this Supplement presents an overview and relevant use cases, intended
    to facilitate a deeper understanding of the technical benefits of QKDNmc and to
    guide the development of related standardization work.\r\n"
