abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4501 describes the functional architecture for
    the smart door lock (SDL) service framework. With the development of mobile communication
    technology and smart hardware, various technologies have been introduced to the
    door lock to form the smart door lock. Multiple unlocking methods can be realized,
    and abnormal alarm reporting and flexible door lock management can be performed.
    In order to promote the deployment of the smart door lock (SDL) service around
    the world, a unified standard is needed, and functions should be realized for
    the SDL service framework.\r\nThe scope of this Recommendation includes the introduction
    of the SDL service framework, requirements of the SDL service framework and functional
    architecture of the SDL service framework.\r\n"
