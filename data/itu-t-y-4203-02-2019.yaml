abstract:
- language: en
  script: Latn
  content: "The things description is a tool to realise the representation of physical
    things as virtual things of the information world to facilitate automatization,
    interoperability and composability for IoT applications. Things description specifies
    a general way for how to map physical things in the physical world to virtual
    things in the information world in order to enable things of the IoT to be effectively
    discovered, interpreted and used. \r\n\r\nThe goal of this Recommendation is to
    specify requirements for an effective way of representing things as far as possible
    in a homogeneous way.\r\n\r\nThe focus of the document is on the following two
    concerns of things description.\r\n\r\n·         Representing physical things
    as virtual things to map the physical things into information world;\r\n\r\n·
    \        Representing the relationship of virtual things to reflect the relationship
    of the represented physical things\r\n\r\nThe corresponding requirements of things
    description in the IoT are specified, including:\r\n\r\n·         High level requirements
    of things description in IoT\r\n\r\n·         Requirements on the characterization
    aspects of things description in IoT\r\n\r\nThis Recommendation may be relevant
    for the matters addressed by ITU-T Y.4114 “Specific requirements and capabilities
    of the Internet of things for big data”, e.g. semantic related data processing.
    \r\n"
