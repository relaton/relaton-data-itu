abstract:
- language: en
  script: Latn
  content: This amendment includes tables, which document the mandatory and optional
    management information specific to the Attributes for Representing Relationships
    Recommendation. This amendment will be used by Profile specifiers, for example,
    those developing International Standardized Profiles (ISPs), to specify an explicit
    subset of capability, which will afford interoperability between implementations.
    The tables also include a column for equipment vendors to state the capability
    of their products in terms of the Profiles or base specification. The table structures
    comply with the Guidelines for Implementation Conformance Statement Proformas
    specified in ITU-T Rec. X.724 | ISO/IEC 10165-6.
