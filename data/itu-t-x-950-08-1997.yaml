abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard specifies the ODP trading
    function. The trading function is one of the components of the architecture of
    the ODP reference model defined in ITU-T Rec. 903 | ISO/IEC 10746-3. The trading
    function provides the means to offer services and to discover services that have
    been offered in an ODP system. The field of application of the trading function
    is any ODP system in which it is required to introduce and discover services incrementally,
    dynamically and openly.
