abstract:
- language: en
  script: Latn
  content: "Edge-computing-based Internet of Things (IoT) is crucial for navigating
    the evolving global digital economy and advancing digital transformation across
    sectors. Edge-computing-based Internet of Things refers to an architectural paradigm
    in which data processing, analysis, and decision-making are performed at or near
    the data source rather than relying primarily on centralized cloud computing,
    thereby reducing latency, optimizing bandwidth usage, improving efficiency, and
    enhancing data privacy and security.\r\nSupplement 102 to ITU-T Y-series Recommendations
    defines the types of edge-computing-based Internet of Things, recommended templates,
    and classification schemes of use cases. Several use cases are illustrated in
    detail. It also identifies observations on the development of edge-computing-based
    Internet of Things, along with considerations on its standardization.\r\n"
