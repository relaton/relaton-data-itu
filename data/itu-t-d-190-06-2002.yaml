abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation is to promote a set of common data standards
    which can be used by Administrations to exchange traffic accounting and settlement
    data with each other using Electronic Data Interchange (EDI) techniques.The use
    of EDI techniques is expected to provide a faster and more secure means of exchanging
    data, and to reduce costs by automating the process for entering data received
    from other Administrations to computer systems.SourceITU-T Recommendation D.190
    was prepared by ITU-T Study Group 3 (2001-2004) and approved under the WTSA Resolution
    1 procedure on 14 June 2002.
