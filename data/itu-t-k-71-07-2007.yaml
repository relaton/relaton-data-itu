abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation K.71 provides information to network operators on
    when antennas may be installed in, or on, a customer building without performing
    a building-specific risk assessment. When a risk assessment is required, it provides
    guidance on the application of IEC 62305-2. It also provides information on the
    responsibilities of the network operator and the building owner.
