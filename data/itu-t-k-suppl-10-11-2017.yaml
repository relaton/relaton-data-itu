  script: Latn
  content: This Supplement provides guidance on the EMC compliance assessment considerations
    for 5G systems.  Given the 5G Radio Access Network (RAN) technical standards are
    still being finalised, the first version of this Supplement focuses on possible
    emission and immunity requirements for 5G systems. This Supplement will be revised,
    if needed, to address the more specific EMC requirements when technical standards
    of 5G systems will be published.
