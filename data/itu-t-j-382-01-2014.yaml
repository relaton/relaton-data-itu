abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.382 provides specifications that should be considered
    for advanced digital cable downstream transmission technologies to provide high
    spectral efficiency schemes saving transmission resources for downstream in hybrid
    fibre coax (HFC) based networks.\r\nThis Recommendation covers the common definition
    of framing structure, channel coding and modulation for television, sound and
    data services including high quality broadcast and multicast services distributed
    through HFC based networks."
