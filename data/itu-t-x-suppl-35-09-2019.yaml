abstract:
- language: en
  script: Latn
  content: "Supplement 35 to ITU-T X-series Recommendations on Recommendation ITU-T
    X.1254 contains three use cases of applying the entity authentication assurance
    framework in security implementation, including detailed security considerations
    in risk assessment, choice of appropriate assurance level and selection of authentication
    technologies.\r\n\r\nThe use cases described in this Supplement can assist the
    deployment of enhanced authentication solutions in various environments, including
    telecommunication and Internet transactions.\r\n"
