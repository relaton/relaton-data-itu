abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3381 provides requirements for energy saving management
    of a 5G radio access network (RAN) system with artificial intelligence (AI). Recommendation
    ITU-T M.3381 explains the requirements of using AI technology to achieve energy
    saving management for communication units and virtualized hardware resources of
    a 5G RAN system, via an element management system (EMS) and open interfaces provided
    by vendors, from the operation support system (OSS) level. In addition, this Recommendation
    includes process recommendations for sending intelligent energy saving strategies
    from OSS to EMS and then to wireless equipment.\r\nThis Recommendation describes
    functional requirements for energy saving management of 5G RAN system with AI,
    and use cases of energy saving management of 5G RAN system with AI.\r\n"
