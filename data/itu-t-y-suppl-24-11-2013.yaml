abstract:
- language: en
  script: Latn
  content: "One of the essential benefits of networks is their support for convergences
    such as the fixed mobile convergence (FMC) and telecom-broadcasting converged
    services like the Internet Protocol TV (IPTV), as highlighted in the ITU-T Y.2000\x1Eseries
    supplements\x02. Supplement 24 to the ITU\x1ET Y\x1Eseries of Recommendations
    describes various N-screen service case scenarios for FMC. This supplement uses
    the features defined in Supplement 14 to the ITU-T Y-series of Recommendations
    (2011), ITU-T Y.2000-series – Supplementary service scenarios for fixed-mobile
    convergence."
