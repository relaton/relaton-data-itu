abstract:
- language: en
  script: Latn
  content: "Supplement 34 to the ITU-T Y-series Recommendations is addressed to a
    broad audience of city decision makers and practitioners involved in the design
    and implementation of smart sustainable cities (SSCs). It is intended to be as
    general and inclusive as possible, applicable, and relevant to any city, regardless
    of its size or location, in both developed and developing countries. The concepts
    and definitions presented in this Supplement are in alignment with the series
    of Supplements to the Y.4000 series. \r\n"
