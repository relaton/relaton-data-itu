abstract:
- language: en
  script: Latn
  content: Network Management (NM) for B-ISDN traffic requires real-time monitoring
    of current network status and network performance. This Recommendation is intended
    to support and define the role of network management in the B-ISDN and broadband
    services. It explains the network management principles and functions. The major
    part of this Recommendation suggests the way traffic must be monitored and provides
    some indication of parameters for promptly detecting abnormal network traffic
    conditions. After the detection of the abnormal condition, automatic and possibly
    manual controls will be temporarily applied to the network to alleviate the problem
    until the problem is resolved. It is also necessary to frequently check the effects
    of the NM controls to note whether the control is actually helping with the problem
    and to determine when to modify or remove it from the network.
