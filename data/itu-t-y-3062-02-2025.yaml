abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3062 specifies trustworthiness evaluation for IMT-2020
    and beyond with autonomous network (AN) functions. It includes the overview of
    trustworthiness, evaluation process for trustworthiness, evaluation metrics and
    related submetrics for trustworthiness, quantitative methods of establishing trustworthiness
    for trust in AN (TiAN). In the appendices, the details of submetrics are described
    in general; at the same time, the evaluation methodologies are described for each
    submetric and there are a series of detailed typical scenario descriptions to
    make them more understandable and acceptable for trustworthiness evaluation for
    IMT-2020 and beyond with AN functions.\r\n"
