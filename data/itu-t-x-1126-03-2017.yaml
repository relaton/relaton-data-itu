abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1126 provides guidelines to mobile operators to
    restrain the infected terminals by utilizing technologies in the mobile network
    to protect both subscribers and mobile operators. This Recommendation describes
    the characteristics and effects of malicious software caused by unhealthy ecosystems
    in the mobile environment. Based on network-side technologies, this Recommendation
    focuses on mitigating the vicious effects caused by infected terminals. This Recommendation
    defines and organizes the mitigating measures and corresponding technologies.
