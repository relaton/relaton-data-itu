abstract:
- language: en
  script: Latn
  content: This Recommendation defines the management information which may be provided
    to a customer and collectively described as Customer Network Management (CNM)
    via the CNMe (EDI/MHS) interface. CNM is a service which provides customers with
    the ability to access (and in some cases modify) management information relating
    to the services provided to them by the network.This Recommendation is, in particular,
    concerned with the definition of information for CNM such as EDI message format.
