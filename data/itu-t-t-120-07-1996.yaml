abstract:
- language: en
  script: Latn
  content: The T.120-Series of Recommendations collectively define a multipoint data
    communication service for use in multimedia conferencing environments.The purpose
    of this Recommendation is to provide an introduction and guide to the T.120-Series.
    This Recommendation defines the T.120 architectural model and shows the interrelationships
    between the constituent Recommendations. Each Recommendation in the Series is
    outlined and the requirements for T.120 compliance are specified.
