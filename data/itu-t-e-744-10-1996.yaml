abstract:
- language: en
  script: Latn
  content: This Recommendation has four main purposes:1) Provide guidelines for implementing
    standardized traffic and congestion control procedures in SS No. 7 and IN-structured
    networks.2) Provide general guidelines on requirements that should be placed on
    network elements so that networks can be made robust to unforeseen problems.3)
    Provide general principles and guidelines on how network level and network element
    level control should be structured to maximize effectiveness and avoid network
    problems.4) Provide high-level requirements for traffic and congestion controls
    for consideration in developing specific procedures in other ITU-T Recommendations.Requirements
    and implementation considerations are covered for MTP, SCCP and IN traffic and
    congestion control procedures, and requirements are provided for adequate overload
    controls in network elements. In addition, considerations for making networks
    robust against failure propagation are discussed.
