abstract:
- language: en
  script: Latn
  content: This Amendment to CCITT Rec. X.722 | ISO/IEC 10165-4, the Guidelines for
    Definition of Managed Objects, covers two topics.One topic of the amendment is
    the specification of a NO-MODIFY syntax element to the GDMO Package Templates.The
    other topic of the amendment is a guidelines extension which describes rules for
    specifications of management information based on the X.700-Series to evolve to
    the use of ASN.1:1994 from ASN.1:1990. The guidelines extension provides a common
    and consistent means to do this, so that product developers are provided with
    a single way to specify use of ASN.1:1994 in the Recommendations they implement.
