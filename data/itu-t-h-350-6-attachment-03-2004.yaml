abstract:
- language: en
  script: Latn
  content: This Recommendation describes a simple LDAP and X.500 schemas to represent
    call forwarding and call preference information in an H.350 directory. It is intended
    to represent addresses to which calls should be forwarded in the case that an
    endpoint does not answer a call. It can direct calls to simple H.320, H.323 or
    SIP addresses, or complex forwarding schemes such as time of day preferences,
    web pages, electronic mail or other applications. Implementers should review ITU-T
    Rec. H.350 in detail before proceeding with this Recommendation.
