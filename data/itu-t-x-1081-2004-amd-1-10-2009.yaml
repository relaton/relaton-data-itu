abstract:
- language: en
  script: Latn
  content: Amendment 1 to Recommendation ITU-T X.1081 allocates eight arcs under the
    object identifier arc {joint-iso-itu-t(2) telebiometrics(42)} allocated for the
    work on telebiometrics, with top level OID-IRI value "/Telebiometrics". Under
    the arc allocated to Recommendation ITU-T X.1081, new arcs are allocated to measures
    (quantity, units, symbols), fields of study (physics, chemistry, biology, culturology,
    psychology) and modalities (tango, video, audio, chemo, radio, calor).
