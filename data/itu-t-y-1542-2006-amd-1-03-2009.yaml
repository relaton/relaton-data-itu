abstract:
- language: en
  script: Latn
  content: Amendment 1 to Recommendation ITU-T Y.1542 introduces Appendix V, which
    provides some considerations needed when the NGN environment is used. Even though
    NGN is based on the same IP technology as that of non-NGN IP networks, there are
    some technologicaldifferences compared with generic IP networks. In particular,
    with respect to QoS aspects of the NGN, each segment is appropriately managed,
    and the capability of providing QoS services is supplied as one of the key features
    of NGN. With regard to services, session-based services such as IP telephony are
    particularly important in the NGN because they are often considered to be fundamental
    services to be provided in a public network.
