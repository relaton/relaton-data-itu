abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T H.626.5 defines an architecture of intelligent visual
    surveillance systems, including the functional requirements, functional architecture,
    entities, service flows and reference points. The intelligent visual surveillance
    system provides intelligent analysis capabilities and services for users based
    on the images and video streams from surveillance cameras through the network.
    This Recommendation is based on Recommendation ITU-T F.743.1, "Requirements for
    intelligent visual surveillance".
