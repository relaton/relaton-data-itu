abstract:
- language: en
  script: Latn
  content: This Recommendation describes how to initiate a communication process between
    ITU-T and a forum/consortium. It lists the A.4-qualifying criteria for forums/consortia,
    and it describes the document exchange between A.4-qualified forums/consortia
    and the ITU-T.This amendment provides procedures for preparation of liaison statements
    between scheduled meetings.
