abstract:
- language: en
  script: Latn
  content: "Supplement 63 to ITU-T Y-series Recommendations examines how artificial
    intelligence could step in to bolster the intent of urban stakeholders to deploy
    Internet of things (IoT) technologies and eventually transition to smart cities.\r\nThe
    main elements examined in this Supplement are:\r\n– The various technological
    implementations of artificial intelligence (AI) that may facilitate smart city
    transformations;\r\n– The role played by AI in managing the data generated within
    the IoT realm and urban spaces;\r\n– The main benefits of adopting AI and delving
    into how this technology could be leveraged to attain the Sustainable Development
    Goals (SDGs)."
