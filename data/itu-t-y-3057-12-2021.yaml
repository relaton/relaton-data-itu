abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T Y.3057 describes a trust index model for information
    and communication technology (ICT) infrastructures and services. In order to provide
    a commonly applicable way for evaluating trust that covers different characteristics,
    trust index is a key concept for trust provisioning by considering the trust value
    chain in the ICT environment. A trust index, which can evaluate and quantify trust
    of stakeholders, is a comprehensive accumulation of trust indicators. This Recommendation
    identifies trust indicators that represent fundamental criteria for evaluating
    trust of entities in ICT environments. To represent characteristics of trust,
    trust indicators are categorized into two parts: objective trust indicators and
    subjective trust indicators. A list of trust indicators and an application of
    a trust index are introduced.'
