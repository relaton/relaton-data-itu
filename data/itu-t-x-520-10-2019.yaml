abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.520 | ISO/IEC 9594-6 defines a number of attribute
    types and matching rules which may be found useful across a range of applications
    of the Directory. One particular use for many of the attributes defined is in
    the formation of names, particularly for the classes of objects defined in Rec.
    ITU-T X.521 | ISO/IEC 9594-7. Other attributes types, called notification attributes,
    provide diagnostic information. This Recommendation | International Standard defines
    context types which supply characteristics associated with attribute values. It
    also includes definitions for LDAP syntaxes relevant for attribute types and matching
    rules.
