abstract:
- language: en
  script: Latn
  content: "This Supplement describes the various infrastructures for a smart sustainable
    city in a new-development area. The designated infrastructure in this document
    includes: common physical infrastructure highlighting ICT, ducted and trenched
    infrastructure below ground, over ground common physical infrastructure, common
    risers in buildings, etc. The following issues are considered: safety, maintenance,
    lifecycle including possible obsolescence, flexibility points, scalability and
    growth. Examples are included of best practices for physical infrastructure including
    opportunities for sharing service paths below and above ground, such as conduits.\r\n\r\nIt
    is not intended to address rehabilitation schemes such as upgrade of existing
    buildings. The focus is on establishing principles with outline rather than detailed
    dimensions.\r\n"
