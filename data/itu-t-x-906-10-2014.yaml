abstract:
- language: en
  script: Latn
  content: "Rec. ITU-T X.906 | ISO/IEC 19793 defines use of the Unified Modelling
    Language (UML 2.4.1 Superstructure Specification, ISO/IEC 19505-2, for expressing
    system specifications in terms of the viewpoint specifications defined by the
    reference model of open distributed processing (RM-ODP, Rec. ITU-T X.901 to X.904
    | ISO/IEC 10746 Parts 1 to 4) and the Enterprise Language (Rec. ITU-T X.911 |
    ISO/IEC 15414). It covers:\r\na)\tthe expression of a system specification in
    terms of RM-ODP viewpoint specifications using defined Unified Modeling Language
    (UML) concepts and extensions (e.g., structuring rules, technology mappings, etc.);\r\nb)\trelationships
    between the resultant RM-ODP viewpoint specifications.\r\nThis Recommendation
    | International Standard refines and extends the definition of how open distributed
    processing (ODP) systems are specified by defining the use of the Unified Modelling
    Language for the expression of ODP system specifications."
