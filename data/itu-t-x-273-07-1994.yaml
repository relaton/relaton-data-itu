  content: This Recommendation | International Standard specifies the protocol to
    support the integrity, confidentiality, authentication and access control services
    identified in the OSI security model as applicable to connection-mode and connectionless-mode
    network layer protocols. The protocol supports these services through the use
    of cryptographic mechanisms, security labelling and assigned security attributes,
    such as cryptographic keys.
