abstract:
- language: en
  script: Latn
  content: The Presentation protocol specification defined in ITU-T Rec. X.226 | ISO/IEC
    8823-1 is enhanced to support the establishment of additional, independent, nested
    presentation connections within an existing presentation connection. This enhancement
    will support the reusability of existing application layer standards (each making
    full, and possibly incompatible, use of the session synchronization services)
    as components of new application layer standards.
