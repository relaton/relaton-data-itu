abstract:
- language: en
  script: Latn
  content: 'The purpose of this Recommendation is to specify the form, size and position
    of a tactile identifier for Machine Readable Cards (MRCs) used in telecommunication
    applications, i.e. prepaid telephone cards. Machine readable card technologies
    can present problems for all users: namely, to orient and turn the card the right
    way so that it may be inserted correctly into the card-reading device. For people
    who are blind or severely visually impaired, the task of orienting the MRC correctly
    can be a substantial obstacle. With at least four different tactile identifier
    designs in concurrent use, people will be confused. There is, therefore, a need
    for a single international standard for a tactile identifier on MRCs to aid all
    users, especially blind and visually-impaired people, in orienting cards quickly
    and correctly. A tactile identifier on MRCs will also substantially aid visually-non-impaired
    people to orient and insert cards more quickly and with fewer errors.'
