abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.3324 specifies the high-level and functional requirements
    and architecture of autonomic management and control (AMC) for IMT-2020 networks.
    It also specifies interworking reference points between AMC and IMT-2020 management
    and orchestration architecture, and legacy NMS/OSS. In Appendix I, it describes
    a use case to realize the AMC architecture through the ETSI GANA reference model.
