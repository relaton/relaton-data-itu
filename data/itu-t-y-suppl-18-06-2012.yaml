abstract:
- language: en
  script: Latn
  content: Supplement 18 to ITU-T Y-series Recommendations provides guidelines for
    managing ITU-T X.509 certificates for NGN security based on the trust model defined
    in ITU-T Y.2701 to supplement the information in ITU-T Y.2704. This Supplement
    is applicable to any next generation network (NGN) using certificates based on
    the framework for public key infrastructure (PKI) and privilege management infrastructure
    (PMI) specified in ITU-T X.509 for identification, authentication, privilege/attribute
    management and/or encryption between network elements and between user end-devices
    and the NGN provider customer premises equipment (CPE) provisioning element.
