abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1207 provides guidelines for telecommunication service
    providers (TSPs) for addressing the risks of spyware and potentially unwanted
    software. This Recommendation promotes best practices around principles of clear
    notices and user's consents and controls for TSP web hosting services. This Recommendation
    develops and promotes best practices to users on personal computer (PC) security,
    including use of anti-spyware, anti-virus, personal firewall and security software
    updates on client systems.
