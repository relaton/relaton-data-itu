abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Z.107 defines the object-oriented data features of
    the Specification and Description Language building on the foundation of the data
    definitions and expressions defined in Recommendation \r\n\r\nITU-T Z.104. Together
    with Recommendations ITU-T Z.100, ITU-T Z.101, ITU-T Z.102, ITU-T Z.103, ITU-T
    Z.104, ITU-T Z.105 and ITU-T Z.106, this Recommendation is part of a reference
    manual for the language. The language defined in this Recommendation partially
    overlaps features of the language included in Basic SDL-2010 in Recommendation
    ITU-T Z.101 and used in Comprehensive SDL-2010 in Recommendation ITU-T Z.102,
    and the features of Recommendations ITU-T Z.103 and ITU-T Z.104. \r\n"
