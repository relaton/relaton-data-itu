abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.751.11 provides a performance test suite for distributed
    ledger technology (DLT) system based on assessment criteria proposed in Recommendations
    ITU-T F.751.1 and ITU-T F.751.6. This Recommendation specifies the basic principles
    and main dimensions of the performance testing for a DLT system and provides a
    suite of test cases that can help users quantitatively and objectively analyse
    the performance of the DLT system in different test environments comprehensively
    and find the most suitable path to improve performance.\r\n"
