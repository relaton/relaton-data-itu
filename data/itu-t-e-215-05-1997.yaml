  content: The purpose of this Recommendation is to specify a telephone/ISDN numbering
    plan for mobile earth stations in systems operated by Inmarsat. Such systems may
    include maritime, land-based and aeronautical satellite systems. In the future,
    the range of mobile satellite systems may also include satellite systems for other
    applications.
