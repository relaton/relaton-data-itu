abstract:
- language: en
  script: Latn
  content: In order to enhance the performance objective of transport-aware carrier
    virtual network services such as joint resource optimization, responsiveness to
    quickly changing demands, enhanced service resilience via cooperative recovery
    techniques between service and transport strata, and quality of application experience
    (QoE) enhancement via better use of existing transport and application resources,
    Recommendation ITU-T Y.3014 specifies high-level and functional requirements,
    architectural framework, and procedures to fulfil the objective.
