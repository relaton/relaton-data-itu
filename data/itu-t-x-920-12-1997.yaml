  content: This Recommendation | International Standard specifies an Interface Definition
    Language (IDL) for specifications that comply with the computational language
    defined in the architecture of the ODP Reference Model (see ITU-T Rec. X.903 |
    ISO/IEC 10746-3). The IDL allows the description of object interfaces, together
    with their operations and associated parameters. It is completely aligned with
    the CORBA IDL developed by the Object Management Group (OMG).
