abstract:
- language: en
  script: Latn
  content: "This Recommendation provides a test suite structure and test purposes
    for the WAN interface (consent management; receiver) based on the requirements
    defined in ITU-T H.810 (2015). The objective of this test specification is to
    provide a high probability of air interface interoperability between different
    devices.\r\n\r\nThis Recommendation is the transposition of Continua Test Tool
    DG2015, Test Suite Structure & Test Procedures, WAN Interface; Part 9: hData Observation
    Upload: Sender (Version 1.0, 2015‑07‑01)."
