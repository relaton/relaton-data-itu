abstract:
- language: en
  script: Latn
  content: "This Recommendation ITU-T H.262| International Standard ISO/IEC 13812-2
    specifies coded representation of video data and the decoding process required
    to reconstruct pictures. It provides a generic video coding scheme which serves
    a wide range of applications, bit rates, picture resolutions and qualities. Its
    basic coding algorithm is a hybrid of motion compensated prediction and DCT. Pictures
    to be coded can be either interlaced or progressive. Necessary algorithmic elements
    are integrated into a single syntax, and a limited number of subsets are defined
    in terms of Profile (functionalities) and Level (parameters) to facilitate practical
    use of this generic video coding standard.\r\nThis third edition of this Recommendation
    | International Standard consists of Rec. ITU-T H.262 (1995) | ISO/IEC 13818 2:1996,
    subsequently altered by four corrigenda and eleven amendments:\r\n1.\tA first
    corrigendum adding a slice picture identifier, allowing an application to define
    default colour description parameters, removing a prohibition of field-structured
    DCT coding in progressive frames, clarifying ambiguity on restricted range of
    reconstructed motion vectors, clarifying ambiguity of VBV at boundaries of sequences,
    and making various minor corrections.\r\n2.\tA second corrigendum altering the
    inverse discrete cosine transform requirements, altering temporal_reference for
    low delay, and making various minor corrections.\r\n3.\tA first amendment providing
    a method of obtaining and registering copyright identifiers.\r\n4.\tA second amendment
    defining a 4:2:2 profile.\r\n5.\tA third amendment adding a camera parameters
    extension and a multi-view profile.\r\n6.\tA fourth amendment adding an ITU-T
    extension.\r\n7.\tA fifth amendment adding a high level to the 4:2:2 profile.\r\n8.\tA
    sixth amendment reducing the upper bound for the number of lines per frame in
    the high level of all profiles from 1152 to 1088.\r\n9.\tA third corrigendum clarifying
    the description of the handling of reserved extension data.\r\n10.\tA seventh
    amendment providing an ability to send supplemental \"content description data\".\r\n11.\tA
    fourth corrigendum clarifying and correcting the specification of aspects relating
    to inverse discrete cosine transform precision.\r\n12.\tAn eighth amendment updating
    and enhancing the specification of support for colour spaces.\r\n13.\tA ninth
    amendment specifying an additional level to support the 1080@50p/60p video format.\r\n14.\tA
    tenth amendment specifying a 'frame packing arrangement' signalling for stereoscopic
    3D content.\r\n15.\tAn eleventh amendment adding the definition of a side-by-side
    frame packing arrangement with quincunx sampling.\r\n"
