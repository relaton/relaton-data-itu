abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.1545.1 is a diagnostic reference for IP network
    quality of service (QoS) \r\n\r\nmonitoring, and is primarily a guide used to
    assist regulators in monitoring the QoS of Internet \r\n\r\nprovided by service
    providers (although subscribers and network service providers may also benefit).
    \r\n\r\nThe Internet, known as the information superhighway, has established a
    worldwide borderless cyber \r\n\r\nsociety. Nowadays, the Internet is acknowledged
    worldwide as an essential component for electronic \r\n\r\ncommunication services.
    The rapid increase in the use of the Internet has changed the way people live,
    \r\n\r\nand has become an important factor in daily life. \r\n\r\nAs reliance
    on Internet networks, in promoting socioeconomic development, increases the QoS
    of \r\n\r\nInternet networks also becomes very critical and important. However,
    occasionally the scenarios under \r\n\r\nwhich Internet is sold to customers is
    not fair and unfortunately Internet subscribers are not well \r\n\r\ninformed
    on the Internet QoS provided to them by Internet service providers (ISPs). \r\n\r\nTherefore,
    this Recommendation highlights the necessity of testing the QoS of network services
    \r\n\r\noffered by ISPs, from a diagnostic and regulatory point of view. This
    Recommendation also addresses \r\n\r\nQoS evaluation scenarios, sampling methodology
    and testing tools for regulators. This \r\n\r\nRecommendation gives guidance to
    regulators about minimum QoS parameters for evaluating the \r\n\r\nquality of
    Internet services. \r\n\r\nRecommendation ITU-T Y.1545.1 gives guidance to regulators
    about QoS parameters for evaluating \r\n\r\nthe quality of internet services,
    QoS evaluation scenarios and sampling methodologies. Amendment 1 \r\n\r\nintroduces
    text for the radio coverage availability parameter, which was previously identified
    for \r\n\r\nfurther study. \r\n"
