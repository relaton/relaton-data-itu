abstract:
- language: en
  script: Latn
  content: "The real-time navigation service (RNS) is composed of satellite navigation
    system-based software which provides real-time information of the optimal route
    to the destination according to traffic conditions throughout the travel as well
    as the available parking spaces nearby. The transport sector is expected to save
    on energy consumption by adopting RNS.\r\nBased on the experiences from a Korean
    study, Supplement 3 to the L-series Recommendations describes how to indirectly
    estimate energy consumption reduction and greenhouse gas (GHG) abatement potential
    related to RNS. Future revisions may look into direct estimation methods. This
    Supplement is bounded to Recommendation ITU-T L.1430, but gives further guidance
    on boundary setting, GHG accounting and baseline scenario development, and on
    measurement, verification and monitoring methods from the information and communication
    technology (ICT) based RNS project perspective.\r\nWhereas Recommendation ITU-T
    L.1430 focuses on the net environmental impact of ICT services from the entire
    life cycle perspective, this Supplement describes only the environmental impact
    of RNS during the use stage compared to one in a baseline scenario."
