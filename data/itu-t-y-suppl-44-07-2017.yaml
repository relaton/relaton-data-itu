abstract:
- language: en
  script: Latn
  content: "ITU-T Focus Group on IMT-2020 intensively discussed network softwarization
    \ between theperiod of 2015 and 2016. The group has characterized the network
    softwarization as an overall transformation trend/approach for designing, implementing,
    deploying, managing and maintaining network equipment and/or network components
    by software programming. This approach has widely been embraced by a lot of research
    projects, open source activities and standardization bodies.\r\nSupplement 44
    to ITU-T Y.3100-series Recommendations summarizes existing and emerging activities
    on network softwarization including standardization and open source activities.
    The Supplement is based on organizations and projects that may have an impact
    on ITU-T's network softwarization standards, which are expected to contribute
    to IMT-2020 (non-radio part). The information is based on the survey during 2015
    to 2016 conducted by ITU-T Focus Group on IMT-2020 and is further updated at the
    time of publication according to the inputs from ITU-T members.\r\n"
