abstract:
- language: en
  script: Latn
  content: This Identical Recommendation | International Standard specifies a file
    format, referred to as the JPEG File Interchange Format (JFIF), for file-based
    interchange of images encoded according to the JPEG image coding standard (Rec.
    ITU-T T.81 | ISO/IEC 10918-1). This Recommendation | International Standard was
    substantially based on the JFIF version 1.02 specification that was produced in
    1992. The JFIF version 1.02 specification was widely and freely circulated, and
    it became widely recognized as a de facto standard. This Recommendation | International
    Standard was developed primarily to formalize the JFIF version 1.02 specification.
