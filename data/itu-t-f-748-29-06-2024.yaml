abstract:
- language: en
  script: Latn
  content: "Building intelligent machinery fault diagnosis systems is essential for
    preventing unexpected breakdowns of machinery, thus enhancing production efficiency
    and ensuring safety during operations. The integration of computer audition into
    machinery fault diagnosis systems can detect subtle faults imperceptible to vision
    through non-destructive ways. Recommendation ITU-T F.748.29 specifies the basic
    concept of computer audition and identifies the framework and requirements of
    computer audition-based machinery fault diagnosis systems.\r\n"
