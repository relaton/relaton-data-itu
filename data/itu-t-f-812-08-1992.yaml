abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the broadband connectionless data bearer
    service. This is a public packet-switched service that provides for the transfer
    of variable-length data units at high speed without the need for call establishment
    procedures between users. These data units can be transferred from a single source
    to a single destination, or from a single source to multiple destinations. Each
    data unit includes a source address validated by the network. One generic feature
    of a B-ISDN connectionless bearer service is that it may include broadcasting
    capabilities. The service uses addresses based on the E.164 ISDN numbering plan
