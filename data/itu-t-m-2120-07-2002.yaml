abstract:
- language: en
  script: Latn
  content: This Recommendation provides procedures for fault detection and localization
    with and without in-service monitoring for international multi-operator paths,
    sections, and transmission systems. Filtering and thresholding of performance
    information are described for reporting to the TMN. Returning into service and
    long-term trend analysis are considered. These procedures are applicable whatever
    the technology used.
