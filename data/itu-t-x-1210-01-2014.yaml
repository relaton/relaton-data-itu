abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1210 provides source-based security troubleshooting
    mechanisms for security issues, as well as selection criteria and basic security
    guidelines of troubleshooting mechanisms.\r\nSource-based troubleshooting security
    issues in Internet protocol-based networks involve techniques used to discover
    technical information concerning the ingress points, paths, partial paths or sources
    of a packet or packets causing a problematic network event, generally for the
    purposes of applying mitigation measures.\r\n"
