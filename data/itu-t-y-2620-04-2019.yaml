abstract:
- language: en
  script: Latn
  content: "Public packet telecommunication data network (PTDN) is one of the hierarchical
    data networks needed to meet the requirements of future packet-based networks
    whose reference interfaces are defined in ITU-T Y.2613.\r\n\r\nRecommendation
    ITU-T Y.2620 identifies the T interface and its functions between PTDN edge devices
    and address translators (ADT). The functions, procedures for the two interface
    types, i.e., T1 interface and T2interface, are described. Appendix I gives an
    example of encapsulation for T interface messages, and Appendix II gives a candidate
    message format for address resolution in the T1 interface\r\n\r\n"
