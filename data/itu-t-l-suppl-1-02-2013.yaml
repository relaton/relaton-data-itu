abstract:
- language: en
  script: Latn
  content: "Telecommunication technologies play a large and increasing role in modern
    society; we depend increasingly on constant streams of information in our work
    and free time for data access and entertainment. Every day, more people access
    high speed networks via wired and wireless channels, and the amount of energy
    to deliver all those new services is also growing rapidly. \r\nWithout an increase
    of energy efficiency, this would lead to a dramatic increase in energy use for
    all new services and customers. Scaling existing technological solutions is not
    enough. Not only do we need to implement changes in energy efficiency but we also
    have to implement them rapidly.\r\nThis Supplement on energy efficiency for telecommunication
    equipment reviews the concepts for energy efficiency in application to networking
    devices; it presents a concept of place in a network as a base for classification,
    describes a process for creating a single metric for energy efficiency which reflects
    the qualities of equipment scalability with traffic levels and provides testing
    topologies and traffic pattern descriptions.\r\n"
