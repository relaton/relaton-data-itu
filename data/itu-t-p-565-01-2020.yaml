abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.565 provides the output of the framework which
    is a machine learning \r\nbased speech quality prediction model that predicts
    the impact on the speech quality from the Internet \r\nprotocol (IP) transport
    and underlying transport, as well as the jitter buffer in the end client; thus
    \r\nproviding a network centric view on the speech quality service delivered on
    mobile packet switched \r\nnetworks. This is expressed in terms of a mean opinion
    score-listening quality objective (MOS-LQO) \r\nunder the assumption of an otherwise
    clean transmission, without background noise, automatic gain \r\ncontrol, voice
    enhancement devices, transcoding, bridging, frequency response, clock drift or
    any \r\nother impairment not caused by the IP transport and underlying transport.
    The models according to \r\nthis framework use information on the temporal structure
    of the reference signal to identify the \r\nimportance of individual sections
    of the bitstream with regard to speech quality. These models do not \r\nperform
    any perceptual analysis of the recorded speech signal.  \r\n\r\nThe framework
    specifies three modules required for the development of these kinds of metrics:
    the \r\ndatabases generator module, the machine learning module, and the validation
    module for the trained \r\nmodel. In addition, the database content and the features
    used by the machine learning algorithm are \r\ndescribed. The framework also provides
    a large set of test vectors, in the form of error (jitter and packet \r\nloss)
    patterns files for learning and validation. This Recommendation specifies the
    minimum required \r\nperformance, as well as conditions and requirements for an
    independent additional validation for \r\nmodels developed based on the framework.
    The Recommendation also specifies implementation \r\nrequirements.  \r\n\r\nThe
    models developed based on the framework enable the assessment of transmission
    network impact \r\non speech quality for mobile packet-switched voice services,
    and therefore benefit operators and \r\nregulators alike with a fast and easy
    speech quality trend monitoring/benchmarking and \r\ntroubleshooting. In addition,
    if predictors according to this framework are used together with \r\nperceptual
    speech quality metrics like [ITU-T P.863], it is possible to identify if the source
    of problems \r\nresides inside or outside the transport network observed by the
    predictor according to this framework. \r\n\r\nConsequently, a more detailed analysis
    of the situation can be achieved and troubleshooting of less \r\nobvious degradations
    such as the ones occurring outside of the transport network (e.g., emerged from
    \r\nautomatic gain control, voice enhancement devices, transcoding or analogue
    processing) is enabled. \r\n\r\nThis Recommendation includes electronic attachments
    containing detailed descriptions of generic jitter files and a reference speech
    sample (see Annex F). "
