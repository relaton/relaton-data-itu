abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T H.460.22 defines a security negotiation mechanism
    for H.225.0 call signalling. The negotiated security mechanism between two entities
    is to be applied for H.225.0 call signalling messages before initiating a call
    establishment procedure. Detailed negotiation procedures, which provide the necessary
    security interoperability among H.323 systems, are specified in this Recommendation.
    The syntax of the security capability parameters in call signalling messages is
    also specified.
