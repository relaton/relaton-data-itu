abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1240 specifies basic concepts, characteristics and
    effects of e-mail spam, and technologies involved in countering e-mail spam. It
    also introduces the current technical solutions and related activities from various
    standards development organizations and relevant organizations on countering e-mail
    spam. It provides guidelines and information to users who want to develop technical
    solutions on countering e-mail spam. This Recommendation will be used as a basis
    for further development of technical Recommendations on countering e-mail spam.
