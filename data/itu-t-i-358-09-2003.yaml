abstract:
- language: en
  script: Latn
  content: This Recommendation defines performance parameters and objectives for call
    processing in B-ISDNs for switched Virtual Channel Connections (VCCs). The B-ISDN
    call processing parameters defined in this Recommendation are applicable to point-to-point
    (Type 1) and point-to-multipoint (Type 2) connection topologies. The QoS relevant
    network performance objectives provided in this Recommendation are based on the
    general principles and generic performance parameters of ITU-T Rec. I.350. New
    performance-related aspects, associated with B-ISDN call processing functions
    providing access or disengagement, include the addition or release of a party
    to an existing B-ISDN connection. In a B-ISDN, a virtual connection can generally
    be either a Virtual Channel Connection (VCC) or a Virtual Path Connection (VPC).
    Since call processing capabilities are currently defined only for VCCs, a virtual
    connection within the context of this Recommendation is a VCC.
