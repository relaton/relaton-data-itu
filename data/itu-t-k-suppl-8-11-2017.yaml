abstract:
- language: en
  script: Latn
  content: This Supplement analyses 5G system resistibility requirements for lightning
    and power fault events. The electrical threats posed by lightning and power fault
    events are discussed and the appropriate resistibility tests identified. Installation
    practice can have a big influence on the reliability of service and the equipment.
    Earthing, location and craftmanship are discussed.
