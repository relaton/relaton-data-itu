abstract:
- language: en
  script: Latn
  content: 'This Recommendation defines several H.248.1 packages that are intended
    for Media Gateways designed to support interworking between H.323 terminals and
    H.324 terminals. More specifically, this Recommendation contains: package "h324"
    for creating terminations supporting H.324, package "h245" for creating terminations
    supporting H.245 channels for H.324 calls, package "h323bc" for creating terminations
    supporting H.245 channels for H.323 calls, package "h245com" for the communication
    of H.245 commands between a MGC and MG, and package "h245ind" for the communication
    of H.245 indications. NOTE ? This Recommendation has been renumbered. It was formerly
    known as ITU-T Rec. H.248, Annex M4.'
