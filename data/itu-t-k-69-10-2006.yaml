abstract:
- language: en
  script: Latn
  content: This Recommendation gives guidance on the maintenance of protective measures
    (protective devices and assemblies and their earthing) in telecommunication installations.
    It deals with the maintenance of the protection of telecommunication equipment,
    installations and cable plants exposed to the results of external sources of interference
    such as overvoltages and overcurrents due to lightning discharges or power induction.
    The maintenance activity is achieved with visual and complete inspections during
    periodical controls defined by this Recommendation. The complete inspection includes
    the visual inspection and additional measurements or investigations.The purpose
    of the maintenance activity is to control the effectiveness of the protective
    measures against overvoltages and overcurrents - to avoid or reduce hazard to
    people, damage to installations and disturbances to systems - taking into account
    the corrosion effects. The effectiveness of the protective measures against corrosion
    is also considered.
