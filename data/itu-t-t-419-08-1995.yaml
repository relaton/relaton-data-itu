abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard describes an additional content
    architecture to support the addition of audio content to documents conforming
    to the Recommendation T.410-Series (ODA). The audio content may be processable
    or formatted and consist of speech as well as other types of audio. Provision
    is made for the support of all ITU-standardized audio and speech coding formats
    as well as those standardized by other international organizations.
