abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.751.6 is an extension to Recommendation ITU-T F.751.1,
    and focuses on distributed ledger technology (DLT) performance assessment methods.
    Based on the performance assessment criteria defined in Recommendation ITU-T F.751.1,
    this Recommendation defines specific performance metrics and relevant workflow
    for the quantitative performance assessment for the DLT platform. This Recommendation
    can be used as a guideline of DLT platform performance assessment for developers,
    users, third party testers and researchers.
