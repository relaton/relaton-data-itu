abstract:
- language: en
  script: Latn
  content: This Recommendation deals with the characterization of user demand as manifested
    at the User-Network Interface (UNI). This Recommendation focuses on those aspects
    of user demand modelling that are specific to Broadband ISDN using Asynchronous
    Transfer Mode (ATM), and summarizes Recommendation E.711 (which covers user demand
    modelling in ISDN), in those aspects that are common for narrow-band and Broadband
    ISDN.
