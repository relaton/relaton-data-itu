abstract:
- language: en
  script: Latn
  content: "Connected Internet of things (IoT) devices and mobile applications require
    wireless network access that is resilient, secure and able to protect individuals'
    privacy. IMT-2020 communication systems should be designed to meet these high-level
    requirements. There is a need to define a security framework for IMT-2020 communication
    systems which could act as a foundation for developing further detailed technical
    Recommendations on IMT-2020 security topics.\r\nRecommendation ITU-T X.1814 identifies
    all components related to the security of IMT-2020 communication systems and defines
    security guidelines for the IMT-2020 communication system. It describes a generic
    IMT-2020 architecture and its domains. It also identifies threats to and specifies
    requirements for security capabilities for each component, taking into account
    unique network features. This Recommendation is based on the 3GPP 5G security
    architecture.\r\n"
