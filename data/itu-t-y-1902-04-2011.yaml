abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.1902 describes a framework for multicast-based IPTV
    content delivery based upon different content delivery functional models and their
    associated requirements. The content delivery functional models are defined according
    to different methods of multicast-based IPTV content delivery in terms of IPTV
    functional architecture described in Recommendation ITU-T Y.1910. Requirements
    for multicast capabilities specified in this Recommendation are based on the requirements
    provided in Recommendation ITU-T Y.1901.
