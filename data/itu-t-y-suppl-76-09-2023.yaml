abstract:
- language: en
  script: Latn
  content: "Supplement 76 to ITU-T Y-series Recommendations surveys use cases related
    to smart agriculture from the perspective of, but not limited to: 1) smart greenhouse;
    2) smart open field; 3) smart hydroponics; 4) smart livestock barn; and 5) smart
    agriculture data service.\r\nGlobally, difficulties in food supply and demand
    are expected due to problems such as climate change, water shortage, rapid urbanization,
    reduction of agricultural land and an aging population. \r\nSmart agriculture
    is based on accurate data on the growth and environmental information of crops
    and livestock, and monitors the growth environment of crops and livestock anytime,
    anywhere, and prescribes them in a timely manner, even if less labour, energy
    and nutrients are introduced than before. It means agriculture that can greatly
    improve the quality and quantity of products.\r\nIn general, smart agriculture
    can remotely or automatically perform the maintenance and management of the growth
    environment of crops and livestock by using Internet of things (IoT), big-data,
    artificial intelligence, automation systems and robot technologies in greenhouses,
    vertical plant farms, open field farms or livestock barns.\r\nBecause there are
    a number of IoT devices applied to smart agriculture, it is very important to
    know their interaction for interoperability. For this reason, it is necessary
    to survey existing as well as forthcoming smart agriculture technologies and then
    based on the results, develop meaningful standardization work items."
