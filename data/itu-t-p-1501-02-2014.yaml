abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T P.1501 describes subjective testing methods for assessing
    the user perceived quality for web browsing in browser-based applications of different
    device classes. It gives guidance on the selection of a test environment, equipment
    and content, and how test procedures should be properly planned in order to facilitate
    realistic web browsing behaviour by the subjects. The methods described can be
    used to identify the impact of several different factors that influence the user
    perceived quality of web browsing, e.g., identifying the influence of the browsing
    device on user perceived quality for identical technical access network settings.
