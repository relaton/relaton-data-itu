abstract:
- language: en
  script: Latn
  content: "Supplement 71 to ITU-T G-series Recommendations describes the passive
    optical network optical line termination or PON OLT capabilities needed for applying
    cooperative dynamic bandwidth assignment (CO DBA) both in a generic sense and
    for specific use cases. It explains the interactions of the optical line termination
    (OLT) with the external entity sending information for CO DBA, the way to interpret
    such information, and the needs for coordination on choosing values for configurable
    parameters. The specific use case described in this version of the Supplement
    is mobile fronthaul (MFH) over PON by using O-RAN's cooperative transport interface
    (CTI) for the interaction between the PON OLT and mobile distributed units (DUs).
    \r\n"
