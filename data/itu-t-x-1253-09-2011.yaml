abstract:
- language: en
  script: Latn
  content: This Recommendation proposes security guidelines for identity management
    (IdM) systems. The security guidelines provide how an IdM system should be deployed
    and operated for secure identity services in NGN (Next Generation Network) or
    cyberspace environment. The security guidelines focus on providing official advice
    how to employ various security mechanisms to protect a general IdM system and
    it also provides proper security procedures required when two IdM systems are
    interoperated.
