abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1053 establishes guidelines and general principles
    for initiating, implementing, maintaining, and improving information security
    controls in small and medium-sized telecommunication organizations (SMTOs) based
    on ITU-T X.1051. This Recommendation also provides an implementation baseline
    of information security controls for SMTOs to ensure the confidentiality, integrity
    and availability of telecommunication facilities and services and information
    handled, processed or stored by the facilities and services.\r\n\r\nThe objectives
    of this Recommendation are to provide practical guidance suited for SMTOs on commonly
    accepted goals of information security specifically suited for these organizations.\r\n\r\nAs
    a result of implementing this Recommendation, SMTOs, both within and between jurisdictions,
    will:\r\n\r\na) be able to ensure the confidentiality, integrity and availability
    of the specific SMTO facilities and services and the information handled, processed
    or stored within the facilities and services;\r\n\r\nb) have adopted secure collaborative
    processes and controls ensuring the lowering of risks in the delivery of telecommunication
    services;\r\n\r\nc) be able to deliver information security in an effective and
    efficient manner;\r\n\r\nd) have adopted a consistent holistic approach to information
    security; and\r\n\r\ne) be able to improve the security culture of organizations,
    raise staff awareness and increase public trust.\r\n"
