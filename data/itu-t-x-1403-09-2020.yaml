  content: "Distributed ledger technology (DLT) and its specific implementations such
    as blockchain offer a unique opportunity for utilizing a trust infrastructure
    and a platform that could be useful in enabling trusted federation for exchanging
    identity attributes and identity information. Recommendation ITU-T X.1403 provides
