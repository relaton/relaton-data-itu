abstract:
- language: en
  script: Latn
  content: "There are many possible methods of exposure assessment and each of them
    has its own advantages and disadvantages. Recommendation ITU-T K.91 gives guidance
    on how to assess and monitor human exposure to radio frequency (RF) electromagnetic
    fields (EMFs) in areas with surrounding radiocommunication installations based
    on existing exposure and compliance standards in the 9 kHz to 300 GHz range. This
    includes procedures for evaluating exposure and how to show compliance with exposure
    limits with reference to existing standards.\r\n\r\nRecommendation ITU-T K.91
    is oriented to the examination of the area accessible to people in the real environment
    of currently operated services with many different sources of RF EMF, but also
    gives references to standards and Recommendations related to EMF compliance of
    products.\r\n\r\nRecommendation ITU-T K.91 includes an electronic attachment containing
    an uncertainty calculator and the Watt guard modules.\r\n"
