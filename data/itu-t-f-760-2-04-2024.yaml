abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.760.2 provides guidelines for the user interface
    for first responders in emergency response support systems, which facilitates
    the use of information and devices supporting the activities of first responders
    at the scene of an emergency. This Recommendation identifies the human factors
    in emergency response services and the user interface guidelines in emergency
    response support systems based on the characteristics of first-response activities.
    These user interface guidelines are specified to support the functional modules
    and usability of emergency response support systems for first responders. By meeting
    these guidelines, developers can create user interfaces that are optimized to
    support the needs and tasks of first responders, resulting in more effective and
    efficient use of the system.\r\n"
