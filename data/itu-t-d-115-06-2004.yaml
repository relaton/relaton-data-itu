abstract:
- language: en
  script: Latn
  content: This Recommendation sets out the general principles for charging and international
    accounting to be applied by Administrations for the provision of the international
    freephone service which is described in ITU-T Rec. E.152.With regard to tariff
    and accounting principles, the International Freephone Service (IFS) is a service
    where the subscriber can be allocated a special (freephone) number and the charges
    for all calls to this number are paid by the respective subscriber instead of
    by the originating caller.
