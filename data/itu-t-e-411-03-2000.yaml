abstract:
- language: en
  script: Latn
  content: Network management requires real-time monitoring of current network status
    and performance and the ability to take prompt action to control the flow of traffic
    when necessary (see Recommendation E.410). Operational guidance to meet these
    requirements, including a description of status and performance parameters, traffic
    controls and the criteria for their application are included in this Recommendation.
    It should be noted that the complete range of parameters and traffic controls
    are not necessary for the introduction of a limited network management capability;
    however, a comprehensive selection will bring substantial benefit (see clause
    5/E.410). In addition, some guidance on beginning network management is provided,
    along with information on developing a network management centre and the use of
    common channel signalling for network management purposes.
