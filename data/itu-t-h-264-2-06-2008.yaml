abstract:
- language: en
  script: Latn
  content: "ITU-T Recommendation H.264.2 provides accompanying reference software
    for ITU T Rec. H.264 | ISO/IEC 14496-10 as an electronic attachment. The software
    is an integral part of ITU-T Rec. H.264.2.\r\nThe purpose of this Recommendation
    is to provide the following.\r\n•\tReference decoder software capable of decoding
    bitstreams that conform to ITU T Rec. H.264 | ISO/IEC 14496 10 in a manner that
    conforms to the decoding process specified in ITU T Rec. H.264 | ISO/IEC 14496
    10.\r\n•\tReference encoder software capable of producing bitstreams that conform
    to ITU T Rec. H.264 | ISO/IEC 14496 10.\r\nThe use of this reference software
    is not required for making an implementation of an encoder or decoder in conformance
    to ITU T Rec. H.264 | ISO/IEC 14496 10. Requirements established in ITU T Rec.
    H.264 | ISO/IEC 14496 10 take precedence over the behaviour of the reference software.\r\nThis
    edition incorporates changes made to the reference software for ITU T Rec. H.264
    | ISO/IEC 14496-10 advanced video coding. The changes contain improvements of
    encoder compression capability, bug fixes, speed and memory resource usage improvements,
    restructuring of the software for readability and ease of software maintenance,
    and the addition of support for new profiles of H.264. The new profiles are from
    the set of profiles targeting professional applications that were added to ITU-T
    Rec. H.264 | ISO/IEC 14496-10 in 2007. No changes were made to the text of the
    Recommendation.\r\nThis Recommendation was developed jointly with ISO/IEC JTC
    1/SC 29/WG 11 (MPEG) and corresponds to part of ISO/IEC 14496-5."
