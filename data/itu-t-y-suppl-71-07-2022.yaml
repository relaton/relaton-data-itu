abstract:
- language: en
  script: Latn
  content: "Supplement 71 to ITU-T Y-series Recommendations discusses use cases for
    autonomous networks. The use cases are divided into two categories, and possible
    requirements, interactions among actors and possible key components are also discussed.
    \r\nVarious use cases are derived according to the key concepts behind autonomous
    networks of exploratory evolution, real-time responsive experimentation and dynamic
    adaptation to enable handling of hitherto unseen changes in network scenarios
    or inputs to reduce the human effort involved in managing the network.\r\n"
