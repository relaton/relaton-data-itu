abstract:
- language: en
  script: Latn
  content: This Recommendation provides the methods for monitoring GOS parameters
    in fixed and mobile telecommunications networks. GOS monitoring is considered
    for all traffic related GOS parameters defined in ITU-T Recommendations.The GOS
    monitoring methodology is based on the principle that the measurements that are
    available are those that a network operator can obtain on a continuous basis using
    measurements taken at network elements. All measurements are defined so that a
    network element can provide the data without requiring coordination or communication
    with any other network element. An implication of this principle is that for all
    GOS parameters that involve multiple networks, each network's contribution to
    the GOS parameter is monitored and the overall GOS parameter is monitored only
    if it is possible from measurements taken within a single network.
