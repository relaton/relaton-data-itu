abstract:
- language: en
  script: Latn
  content: "Supplement 56 to ITU-T Y-series Recommendations provides a set of use
    cases related to smart cities and communities (SC&C). The SC&C use cases described
    in this Supplement are in pilot or commercial phase. \r\n\r\nThe use case collection
    is expected to provide useful information for the definition of common requirements
    of SC&C and for other future studies on SC&C. It is also expected that this information
    will benefit the study of the relationship between city scales and SC&C solutions,
    and will provide examples of the social and economic benefits. The use cases in
    this Supplement may also help to plan the deployment of similar smart city solutions
    in other cities.\r\n"
