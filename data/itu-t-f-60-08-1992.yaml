abstract:
- language: en
  script: Latn
  content: This Recommendation contains provisions that fix the rules to be followed
    in the international telex service. The International telex service is a telegraph
    service for subscribers whereby they can communicate directly and temporarily
    between themselves using equipment operating at a modulation rate of 50 bauds
    and presenting a start-stop telegraph interface to the international telex network
    and employing International Telegraph Alphabet No. 2.The general characteristics
    of the international telex service are described in Recommendation F.59 which
    provides a convenient guide to the various Recommendations dealing with the international
    telex service, including the R-, S- and U-Series Recommendations which deal with
    matters of an essentially technical nature.
