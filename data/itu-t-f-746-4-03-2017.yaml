abstract:
- language: en
  script: Latn
  content: This Recommendation describes the scenarios and requirements for deployment
    of information centric networks (ICN). The deployment supports flexible methods
    for deploying various ICN instances on a single network service provider (NSP)
    network, deploying an ICN instance over multiple NSP networks, and interoperating
    between different ICN instances. The framework requires decoupling the data plane
    and the control plane, and it is required to have one or more switches and controllers
    supporting such deployment. The software and hardware resources in the switches
    and controllers are required to be virtualized and to be used to create ICN instances.
    There exist appropriate inter-ICN service providers interfaces to facilitate interoperations
    between two ICN instances.
