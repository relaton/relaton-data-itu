abstract:
- language: en
  script: Latn
  content: "Supplement 80 to ITU-T Y-series Recommendations consolidates quantum key
    distribution network (QKDN) use cases in the context of networking technologies
    as the mandate of ITU-T SG13. \r\nThrough a comprehensive analysis, the QKDN uses
    cases are classified into several classes and this Supplement highlights the competitive
    advantage of the QKDN use cases and provides suggestions for future standardization
    efforts in ITU-T SG13.\r\n"
