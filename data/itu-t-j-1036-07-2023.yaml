abstract:
- language: en
  script: Latn
  content: "The objective of Recommendation ITU-T J.1036 is to address two major concerns
    related to conditional access system (CAS), namely underreporting of subscriber
    numbers and content piracy leading to revenue loss to broadcasters, content providers
    and the governments.\nMost countries have implemented digital addressable systems
    (DAS) for distribution platforms such as cable TV, direct to home (DTH), Internet
    protocol television (IPTV), and headend in the sky (HITS), DAS enables subscribers
    to have a choice and option to select their channels and packages. Conditional
    access system (CAS) and subscriber management system (SMS) are integral parts
    of a DAS environment. While CAS is responsible for encrypting the content and
    its delivery in a secure and encrypted manner only to authorised subscribers,
    SMS handles the subscriber management functions. The quality of service depends
    on the CAS and SMS systems deployed by the distribution platform owner (DPO).
    \nSince content providers and broadcasters have no control over the CAS and SMS,
    as these are deployed at the DPO end, they often complain about the loss of revenue
    due to various malpractices such as under-reporting of subscriber-base, distribution
    of channels to unauthorised users, and content piracy.\nTherefore, it is necessary
    to frame benchmarks for the CAS systems prescribing technical specifications focusing
    on functional requirements to ensure factual reporting of the subscriber-base
    and protected delivery of content to authorised subscribers. Creating a framework
    that prevents the deployment of sub-standard CAS will bring preventive control
    from potential threats and revenue losses arising due to the vulnerability of
    such systems, bring economic efficiency, improve quality of service, and improve
    the end-consumer experience.\nThis Recommendation thus elaborates the various
    functional requirements of the CAS such as log requirements, reports requirements,
    database requirements, security requirements, service requirements and more. Compliance
    with these requirements in CAS performance will address the concerns mentioned
    above.\n"
