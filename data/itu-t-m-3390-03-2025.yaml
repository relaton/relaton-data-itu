abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3390 proposes the requirements for smart comprehensive
    analysis within artificial intelligence enhanced telecom operation and management
    (AITOM), which includes network resource assurance analysis, network service quality
    analysis, End-to-End (E2E) service quality analysis, strategy generation of service
    quality assurance and other requirements. The goal of the Recommendation is to
    specify the requirements of using AI technology to achieve smart comprehensive
    analysis, focusing on service quality assurance, from the operation support system
    (OSS) level.\r\n"
