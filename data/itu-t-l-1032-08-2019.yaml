abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T L.1032 is part of a series of ITU-T Recommendations
    that considers requirements for recyclers of waste information and communication
    technology (ICT). This Recommendation addresses, in particular, the informal sector
    that is involved in waste electrical and electronic equipment (WEEE) collection
    and dismantling.\r\n\r\nThis Recommendations must be read in conjunction with
    national legislation and technical requirements for WEEE recyclers at the national
    level. A number of standards on WEEE, related to the present series of Recommendations,
    are published on the ITU-T website at: https://www.itu.int/en/ITU-T/Pages/default.aspx
    .\r\n\r\nUpdates on the regional and international conventions and legislation
    presented can be found at: www.Basel.int (for the Basel Convention), also at:
    http://ec.europa.eu/environment/waste/shipments/legis.htm (for the EU waste shipment
    regulations), and at: http://ec.europa.eu/environment/waste/weee/index_en.htm
    (for the EU WEEE directive).\r\n\r\nIn addition, there are a number of mandatory
    and voluntary standards on the treatment conditions for workers and the environment
    that can be used as guidelines to improve national legislation and the quality
    of recycling where such standards are yet to be implemented."
