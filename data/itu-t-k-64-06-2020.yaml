abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.64 describes working practices for service personnel
    to help them work safely in telecommunication installations in three specific
    environments.\r\nThe specific environments covered in this Recommendation are
    characterized by wet conditions or close proximity to exposed metallic parts.\r\nThe
    working practices apply to telecommunication plants with voltage levels higher
    than the limits defined for analogue PSTN circuits, such as remote feeding telecommunication
    current or voltage (RFT-C or RFT-V) circuits.\r\nThis version of Recommendation
    ITU-T K.64 includes a warning regarding contact with terminals carrying RFT circuits
    with small parts of the body, e.g., back of the hand. The references have been
    updated to include the IEC 62368 series."
