abstract:
- language: en
  script: Latn
  content: La présente Recommandation décrit les services de conférence multimédia
    offerts sur un RNIS. S'appuyant sur la Recommandation F.702 pour le corps de la
    description, elle ne donne que les compléments particuliers concernant le RNIS,
    qui découlent des capacités et des limites de ce réseau. Lors de la lecture de
    la présente Recommandation, il est donc nécessaire de se reporter à la Recommandation
    F.702. Les numéros des paragraphes correspondent à ceux de la Recommandation F.702
    et ne forment donc pas une séquence continue car seuls quelques paragraphes nécessitent
    un complément particulier pour le RNIS. Par ailleurs, le paragraphe 9, traitant
    des attributs pour les divers profils, est nouveau.
