abstract:
- language: en
  script: Latn
  content: 'This Recommendation specifies the requirements and capabilities of data
    aware networking (DAN) to realize the use cases and scenarios described in ITU-T
    Supplement 35 to Recommendation Y.3033, Data aware networking – Scenarios and
    use cases, which are expected to be major applications/services provided on DAN.
    One of the objectives reflecting emerging requirements for future networks (FNs)
    is data awareness as specified in ITU-T Recommendation Y.3001 – Future networks:
    Objectives and design goals. DAN is expected to have capabilities optimized to
    handle enormous amount of data and to enable users to access desired data safely,
    easily, quickly, and accurately, regardless of their location by making information
    the destination of request delivery. DAN can be rephrased as the networking whose
    central concern is retrieving information, i.e., information centric networking
    (ICN). '
