  content: This Supplement to ITU-T Q-series Recommendations is a technical report
    on the signalling transport requirements needed for support narrowband services
    via broadband transport technologies. Its scope is limited to the signalling transport
    of the associated protocols at the call control, bearer control and call bearer
    control needed to provide this capability across an ATM/IP backbone network for
    Capability Set 2.
