abstract:
- language: en
  script: Latn
  content: This Recommendation defines network performance objectives for describing
    end-to-end availability performance of international constant bit-rate digital
    paths at or above the primary rate. The parameters to which these objectives apply
    are defined in ITU-T G.827.The objectives given are independent of the physical
    network supporting the path. Guidance on determining expected end-to-end performance
    using the objectives for path elements is provided in Annex A, and depends on
    the actual path topology.
