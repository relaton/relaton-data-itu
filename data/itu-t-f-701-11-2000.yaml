abstract:
- language: en
  script: Latn
  content: This Recommendation provides guidelines for describing user requirements
    that are to be used as the basis for constructing new multimedia services. These
    guidelines are primarily intended to support the Multimedia service development
    methodology described in ITU-T Recommendation F.700. However, they can also be
    used as the basis for a structured dialogue between End-Users and Service Providers
    in order to arrive at a responsive service solution when applicable ITU-T service
    Recommendations are not yet available.
