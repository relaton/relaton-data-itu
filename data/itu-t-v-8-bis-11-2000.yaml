abstract:
- language: en
  script: Latn
  content: 'This Recommendation defines signals, messages and the procedures for exchanging
    these over the PSTN and on leased point-to-point telephone-type circuits, for
    the identification and selection of common modes of operation between Data Circuit-terminating
    Equipments (DCEs)[P1] and Data Terminal Equipments (DTEs)[P2]. These are used
    when the modes of operation of DCEs and DTEs communicating over the connection
    need to be automatically established and selected, but before signals are exchanged
    which are specific to a particular Recommendation. Considerations are included
    for the standard analogue telephony mode of operation.Revision 2 of this Recommendation
    adds support for PCM Modems, as described in ITU-T V.90, V.91 and V.92.       Page:
    1  [P1]A: Data Circuit-terminating Equipments (DCEs)Page: 1  [P2]A: Data Terminal
    Equipments (DTEs)'
