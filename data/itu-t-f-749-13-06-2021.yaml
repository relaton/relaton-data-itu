abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.749.13 provides a framework of civilian unmanned
    aerial vehicle flight control using artificial intelligence, including the flight
    navigation control of a civilian unmanned aerial vehicle (CUAV) itself and the
    specific flight control based on the vertical industry application requirements.
    Although CUAVs have been widely used in industry and consumption areas, there
    are also problems in the development of CUAVs. In addition to the policy and legal
    supervision, the other problem is how CUAVs avoid obstacles during the flight,
    and how the CUAVs applied in the vertical industry can automatically navigate,
    track or fly along a specific area according to the mission requirements, to achieve
    partial or complete autonomous flight and control.  This Recommendation also provides
    a flight control framework and functional requirements for each specific implementation.
    This way the product and system integrators can design and produce specific products
    and systems according to this framework. \r\n"
