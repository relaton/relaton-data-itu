abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation M.3020 describes the management interface specification
    methodology (MISM). It describes the process to derive interface specifications
    based on user requirements, analysis and design (RAD). Guidelines are given on
    RAD using unified modelling language (UML) notation; however, other interface
    specification techniques are not precluded. The guidelines for using UML are described
    at a high level in this ITU-T Recommendation.
