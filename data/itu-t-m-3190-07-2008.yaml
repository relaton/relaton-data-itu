abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T M.3190 is an introduction to the TM Forum SID analysis
    model and a specification through reference of the ITU-T subset of SID (the product
    and service business entities). The SID analysis model scope covers the information
    required to implement use cases based on the eTOM processes. The SID analysis
    model is implementation independent, focusing on what the information is and what
    its relationships are, not on how these are to be implemented.The SID applies
    primarily to service providers' businesses and engaged stakeholders, e.g., system
    integrators, independent software vendors and network equipment providers.
