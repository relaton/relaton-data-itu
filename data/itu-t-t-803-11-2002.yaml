abstract:
- language: en
  script: Latn
  content: ITU-T Rec. T.800 | ISO/IEC 15444-1 is a specification that describes an
    image compression system that allows great flexibility, not only for the compression
    of images but also for access into the codestream. The codestream provides a number
    of mechanisms for locating and extracting portions of the compressed image data
    for the purpose of retransmission, storage, display, or editing. This access allows
    storage and retrieval of compressed image data appropriate for a given application
    without decoding.This Recommendation | International Standard provides the framework,
    concepts, and methodology for testing and the criteria to be achieved to claim
    compliance to ITU-T Rec. T.800 | ISO/IEC 15444-1. The objective of standardization
    in this field is to promote interoperability between JPEG 2000 encoders and decoders
    and to test these systems for compliance to this Specification. Compliance testing
    is the testing of a candidate product for the existence of specific characteristics
    required by a standard. It involves testing the capabilities of an implementation
    against both the compliance requirements in the relevant standard and the statement
    of the implementation's capability.The purpose of this Recommendation | International
    Standard is to define a common test methodology, to provide a framework for specifying
    abstract test suites (ATS), and to define the procedures to be followed during
    compliance testing.Any organization contemplating the use of test methods defined
    in this Recommendation | International Standard should carefully consider the
    constraints on their applicability. Compliance testing does not include robustness
    testing, acceptance testing, and performance testing.
