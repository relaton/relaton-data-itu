abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.1543 specifies a set of IP performance parameters
    and methods of measurement applicable when assessing the quality of packet transfer
    on inter-domain paths. The methods anticipate that there will be multiple measurement
    systems, each conducting measurements of a segment of the customer-to-customer
    path, and recommend configurations that should produce useful results in this
    cooperative scenario. The methods rely on existing parameter definitions and encompass
    both active and passive measurement techniques.
