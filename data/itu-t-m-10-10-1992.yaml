abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation is to describe, from a maintenance viewpoint,
    the relationships between the quality level at which telecommunication services
    are provided and the performance of telecommunication networks that carry them.
    This Recommendation also provides general guidance to Administrations on maintenance
    processes by directing them to the relevant and specific Recommendations dealing
    with maintenance of network and services. Keywords- Maintenance;- network;- service.
