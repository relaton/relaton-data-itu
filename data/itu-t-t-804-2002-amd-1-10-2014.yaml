abstract:
- language: en
  script: Latn
  content: "Rec. ITU-T T.804 (2002) | ISO/IEC 15444-5 provides two independently created
    software reference implementations of Rec. ITU-T T.800 | ISO/IEC 15444-1, in order
    to assist implementers of Rec. ITU-T T.800 | ISO/IEC 15444-1 in testing and understanding
    its content.\r\nAmendment 1 introduces a number of updates into the text of Rec.
    ITU-T T.804 (2002) | ISO/IEC 15444-5 (2003), including an updated set of reference
    software for the JP2 file format.\r\nNOTE – This amendment contains two electronic
    attachments with source code:\r\n1.\tJASPER.ZIP\r\n2.\tJJ2000-v5.1.ZIP"
