abstract:
- language: en
  script: Latn
  content: Recommendation T.432 currently defines the document bulk transfer of Group
    4 Telefax documents as the DTAM transparent mode and of arbitrary documents and
    binary files in the DTAM normal mode. Amendment 1 provides for the transfer of
    binary files (based upon Recommendation T.434), and other formats, such as DTM,
    JPEG, EDIFACT and also Colour facsimile documents in the DTAM transparent mode.
    This amendment mainly concentrates on the amendments for the association establishment,
    where the relevant formats need to be recognized, and on the transfer phase, where
    segmenting must be extended to information that is not structured page by page.
