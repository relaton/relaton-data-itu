abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.862.3 describes requirements of the voice management
    interface for human-care services. This Recommendation focuses on the classification
    of users and services for the voice user interface (UI) in.\r\nHuman-care services
    are related to the improvement of the quality of life by providing what is necessary
    for the health, welfare and protection of people. Various voice-based services
    are being developed to have nursing robots take care of patients and be able to
    identify problems based on conversations with the patients. This includes the
    development of technology for voice-based early diagnosis of dementia. Recent
    research and the use of speech recognition systems have improved the basic keyboard-based
    user interface with a natural dialogue user interface. In addition, it has become
    possible to manage the customer's health by, for example, checking and improving
    the customer's health status.\r\nThis Recommendation proposes a service model
    through the speech recognition interface in human-care services using several
    scenarios to apply speech recognition technology."
