abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.47 gives a procedure in order to protect telecommunication
    lines using metallic components (symmetric pair, coaxial or optical fibre cables)
    against direct lightning flashes to the line itself or to structures that the
    line enters.\r\nThe procedure is based on the representation of the line by a
    sequence of sections and the evaluation of the annual number of damages due to
    direct flashes for each section and for the structures connected to the line.
    This number shall be multiplied by the relevant loss in order to obtain the risk
    of failure due to direct lightning flashes. The sum of the risk of each line section
    and also the risk associated with the structures connected to the line gives the
    total risk of the line. \r\nThe risk of damage due to direct lightning flashes
    can be used in the risk assessment of a larger system to which the telecommunication
    line is a part, according to IEC 62305-2. The calculated risk can also be used
    by the line owner (e.g., telecommunication operator) in order to evaluate the
    need of implementing additional protection measures on the line. In this case,
    the calculated risk (Rd) shall be compared with the tolerable risk due to direct
    flashes (RTd), the latter calculated based on Recommendation ITU T K.72. If the
    calculated risk is lower than the tolerable limit, the line is adequately protected.
    Otherwise, it is necessary to implement additional protection measures until the
    risk of damage is lower than or equal to the tolerable limit.\r\nSeveral parts
    of this Recommendation make reference to the cable sheath breakdown current (Is)
    and test current (It), so that the assessment of these parameters are given in
    Annex A and Annex B, respectively. The appendices are organized as follows: Appendix
    I provides some guidance for the evaluation of the expected loss per damage (L),
    and Appendix II presents a rationale for the protective effect of guard-wires.\r\n"
