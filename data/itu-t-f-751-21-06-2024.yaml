- language: en
  script: Latn
  content: "In order for data exchanging and sharing in different distributed ledger
    technology (DLT) systems, this Recommendation specifies general flows of the inter-chain
    interoperability between different DLT systems, functional requirements of the
    inter-chain interoperability and general requirements of the inter-chain interoperability
    for the DLT systems.\r\nRecommendation ITU-T F.751.21 may be used for guiding
    the design and implementation of inter-chain interoperability for DLT systems.\r\n"
