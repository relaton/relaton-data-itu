abstract:
- language: en
  script: Latn
  content: "Supplement 58 to ITU-T G-series Recommendations describes several interoperable
    component to component multilane interfaces (across different vendors) to connect
    an optical module (with or without digital signal processor (DSP)) to a framer
    device in a vendor's equipment supporting 25G, 40G, 50G, 100G or beyond 100G optical
    transport network (OTN) interfaces.\r\nOnly the structure of the 11G, 28G or 56G
    physical lanes of the different OTN module framer interface (MFI) examples is
    provided in this Supplement. Electrical parameters for these interfaces can use
    specifications provided in the relevant clauses of OIF-CEI implementation agreement
    (IA) specifications. For their electrical characteristics, the OIF-CEI IA specifications
    can be used.\r\nThis Supplement relates to ITU-T Recommendation ITU-T G.709/Y.1331."
