  content: This Recommendation defines the grade-of-service parameters for B-ISDN
    signalling for the Network Node-Interface. It considers both link-by-link and
    edge-to-edge B-ISDN protocol functions. Reference connections for these protocol
    functions are provided, and grade-of-service target values are given based on
    these reference connections.
