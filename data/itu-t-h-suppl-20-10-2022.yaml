abstract:
- language: en
  script: Latn
  content: 'To support an ITS in order to obtain a comprehensive and effective perception
    data, this Supplement 20 to ITU-T H-series gives the practice references for roadside
    sensing devices'' deployment in the ITS. The detection and analysis of traffic
    elements based on roadside sensing devices is an important foundation for intelligent
    transportation. Sensing devices used on the roadside to build an intelligent transport
    system (ITS) generally include cameras, light detection and ranging (lidars),
    millimetre wave radio detection and ranging (radars), etc. The requirements for
    sensing devices, such as the deployment and the function characteristics will
    affect the quality of data for intelligent transportation systems. Supplement
    20 to ITU-T H-series Recommendations applies to ITU-T H.550-H.599 series: Vehicular
    gateways and intelligent transportation systems (ITS).'
