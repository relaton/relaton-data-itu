abstract:
- language: en
  script: Latn
  content: The purpose of Recommendation J.67 is to give the tools of the transmission
    methodology of the MAC packet family signals. Section 1 is devoted to the traditional
    MAC packet signals (D/D2), while Section 2 deals with the high-definition television
    systems HD-MAC.Each part of this Recommendation begins with the definition of
    the test signals and the test lines that are the basis of the transmission methodology.
    To have the best compatibility with the MAC signals, test lines for HD-MAC are
    as close as possible to the test signals previously defined in Section 1, but
    nevertheless slightly different, due to the different nature of HD-MAC. Furthermore,
    the main quality measurement parameters are defined, as well as the corresponding
    application methods.Section 2 of this new version of the Recommendation replaces
    the previous part B, the contents of which were only subclause titles with text
    "to be defined".
