abstract:
- language: en
  script: Latn
  content: "This Recommendation provides accounting and charging requirements for
    IoT as well as an IoT accounting and charging technical capability framework,
    in order to assist in the standardization of accounting and charging technical
    mechanisms for IoT and to facilitate the development of the IoT market. The Recommendation
    focuses on the network layer capabilities and service support and application
    support layer capabilities, as well as business use cases applied to IoT. \r\n\r\nThe
    use cases, requirements and technical capability framework provided in this Recommendation
    are from a technical point of view.\r\n"
