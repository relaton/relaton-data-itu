abstract:
- language: en
  script: Latn
  content: This Recommendation provides requirements and mechanisms for 1+1 and 1:1
    protection switching functionality for the user-plane in MPLS networks. The mechanism
    defined herein is designed to support end-to-end point-to-point LSPs. Protection
    switching functionality for multipoint-to-point and point-to-multipoint LSP are
    for further study. m:n protection switching is for further study. Hitless protection
    switching is outside the scope of this version of the Recommendation.
