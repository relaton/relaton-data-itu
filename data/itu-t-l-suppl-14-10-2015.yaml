abstract:
- language: en
  script: Latn
  content: "Supplement 14 to the ITU-T L-series Recommendations identifies gaps on
    standardization for smart water management (SWM), taking into consideration related
    information and communication technology (ICT) standardization activities currently
    undertaken by the various standards development organizations (SDOs) and forums.\r\nThe
    final objective of this Supplement is to suggest potential strategic SWM related
    standardization activities based on the investigation of the gaps, and to encourage
    other ITU Study Groups and other SDOs to get involved in the work for a wider
    standardization roadmap."
