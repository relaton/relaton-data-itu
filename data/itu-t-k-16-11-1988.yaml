abstract:
- language: en
  script: Latn
  content: The article mentioned in reference [1] contains a general treatise covering
    all possible cases of magnetic induction and permitting calculation of the location-dependent
    variation of the induced voltages and currents for full or partial exposure to
    induction of a route. This Recommendation gives general information on how to
    find an equivalent circuit which permits rapid estimation of the maxima of the
    voltages and currents in cable conductors for any length and location of exposure.
    The lumped capacitances and the transfer impedance of the equivalent circuit must
    be appropriately chosen. Only two groups of parameters are required here, depending
    upon whether the length of the exposed section is shorter than, or equal to, or
    greater than half the length of the power-feeding section. The manner of switching
    from the complex formulae given in [1] to the simplified calculation is explained
    in Annex A.To check the usefulness of this universally applicable equivalent circuit,
    the maxima of the voltages and currents induced on the conductors of a cable when
    the outer conductors are at floating potential are calculated in Annex B for some
    of the exposure values evaluated numerically in the article mentioned above. They
    are also entered in the diagrams. It will be seen that the calculation procedure
    shown in this Annex B gives sufficiently accurate results for practical purposes.Annex
    C shows how the equivalent circuit must be modified in cases where the outer conductors
    of the coaxial pairs are earthed at the terminals and at the repeater points.A
    similar calculation method for the effects of magnetic induction of power lines
    on telecommunication systems installed on coaxial pair cables whose outer conductor
    is insulated is described in the article mentioned in reference [2].
