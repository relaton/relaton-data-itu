abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.196.2 specifies the physical (PHY) layer specification
    for second-generation high-performance networks over coax (HiNoC) which provides
    1 Gbit/s data transmission over coaxial networks in the cable industry. The HiNoC
    architecture consists of a HiNoC bridge (HB) and HiNoC modems (HMs) and the HiNoC
    protocol stack includes the medium access control (MAC) layer and PHY layer. This
    Recommendation contains descriptions for the signal transmission mode of the PHY
    layer, including frame structure, channel coding and modulation techniques.\r\nEdition
    2.0 only updates the title of this and other HiNoC Recommendations without introducing
    any technical changes.\r\n"
