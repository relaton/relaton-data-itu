abstract:
- language: en
  script: Latn
  content: This Recommendation describes the application of INAP CS-1 (Refined) for
    UPT Service Set 1. It explains how to use INAP as defined in CS-1 Refinements
    to provide the UPT service. Clauses 1 to 3 contain general information including
    the Chosen architecture. Clause 4 describes the application contexts used for
    UPT. Clause 5 describes both the UPT information model and the UPT security model
    as used in SDF. In clause 6 the UPT specific behaviour of the SCF is described
    for every UPT procedures, using both a textual and an SDL description. Clause
    5 constitutes the core part of the UPT Recommendation. The other clauses are included
    in this Recommendation because clause 5 is not in itself self-explanatory. The
    definition of the data model specifies (with some flexibility) the internetwork
    interface and as such should be considered as the main part of this Recommendation.
