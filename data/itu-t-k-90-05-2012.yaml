abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.90 provides evaluation techniques and guidelines
    for compliance with safety limits for human exposure to electromagnetic fields
    (EMFs) of telecommunication network personnel (e.g., outside plant craft) at power
    frequencies (DC, 50 Hz and 60 Hz). This Recommendation does not set safety limits;
    it seeks to provide techniques and procedures for determining the need for any
    precautions at the work site. \r\nThis Recommendation includes an electronic attachment
    containing the EMFACDC program.\r\n"
