abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation | International Standard is to provide
    a syntax that allows security services to be applied to JPEG 2000 coded image
    data. Security services include confidentiality, integrity verification, source
    authentication, conditional access, and secure scalable streaming and secure transcoding.
    The syntax allows these security services to be applied to coded and uncoded image
    data in part or in its entirety. This maintains the inherent features of JPEG
    2000 such as scalability and access to various spatial areas, resolution levels,
    colour components, and quality layers, while providing security services on these
    elements.
