abstract:
- language: en
  script: Latn
  content: "Supplement 57 to ITU-T G-series Recommendations addresses Internet protocol
    version 6 (IPv6) adaptation layers for smart home systems, where embedded devices
    communicate with each other over low power and lossy networks (LLNs) for the purpose
    of sensor data collection and equipment control by using IPv6 over low power wireless
    personal area network (6LoWPAN) technology. Devices in smart home systems include
    home appliances, home energy equipment and various sensors within and around the
    home. Assumed applications for the communication include energy management, healthcare,
    home security and smart metering, while excluding broadband applications or mobile
    applications.\r\n\r\nThis Supplement addresses both IP-based wired and wireless
    low-power communications for smart home, and provides supplemental information
    to Recommendations ITU-T G.9903 and ITU‑T G.9959. Additional information on other
    ITU-T G-Series Recommendations may be provided in future revisions of this Supplement.\r\n
    \r\n\r\n \r\n"
