abstract:
- language: en
  script: Latn
  content: This Recommendation defines the guidelines for the support of the communication
    of documents using Group 3 facsimile between user terminals via public networks
    and is intended to apply in those cases where an ROA or service provider does
    not wish to offer a Telefax 3 service as defined in Recommendation F.182. This
    Recommendation is based upon existing Recommendation F.182 but has been developed
    to reflect the changing telecommunications environment with regard to the provision
    of regulated "end-to-end" services.
