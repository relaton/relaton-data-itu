abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1080.0, Access control for telebiometrics data
    protection, is a specification for how to protect telebiometrics information against
    unauthorized access. It does so by taking a service-oriented view, where only
    information necessary for a particular purpose is provided, i.e., access is given
    not only on a right-to-know basis, but also on a need-to-know basis.\r\n\r\nThe
    heart of this Recommendation is an attribute specification included in an attribute
    certificate or public-key certificate that specifies in details what privileges
    a particular entity has for one or more service types.\r\n\r\nSecurity is provided
    by using a profile of the cryptographic message syntax (CMS). The CMS profile
    provides authentication, integrity and, when required, confidentiality (encryption).\r\n\r\nThis
    profile is intended to provide security support for telebiometrics specifications
    in general. The profile assumes and is dependent upon a correct deployment of
    a public-key infrastructure (PKI).\r\n\r\nRecommendation ITU-T X.1080.0 is also
    dependent on a deployment of a privilege management infrastructure (PMI).\r\n"
