abstract:
- language: en
  script: Latn
  content: "Mobile messaging spam is proliferating dramatically along with the fast
    development of mobile messaging services. Unfortunately, no single measure has
    proved to be the silver bullet against mobile messaging spam. Therefore, it is
    necessary to establish a practical framework for countering mobile messaging spam.
    Recommendation ITU-T X.1247 gives an overview of mobile messaging anti-spam processes,
    and proposes a technical framework for countering mobile messaging spam. Entity
    functions and processing procedures are specified in this framework. In addition,
    this Recommendation provides information sharing mechanisms against mobile messaging
    spam within the anti-spam domain and among anti-spam domains.\r\nAmendment 1 introduces
    the feedback mechanism from the client, receiving possible spam call (with voice,
    short message service (SMS) or multimedia messaging service (MMS)) to its operator.
    It provides technical requirements for telecommunication management systems and/or
    client support services to receive notifications of income spam calls, voice or
    messages (SMS/MMS). Scenarios of interactive interaction of clients with operators/service
    providers of telephone communication networks about incoming spam calls and the
    necessary technical measures to maintain such interaction are presented. Such
    interaction is based on making a call to the anti-spam number provided by the
    telecom operator in advance by the recipient of the spam call immediately after
    it is completed.\r\n"
