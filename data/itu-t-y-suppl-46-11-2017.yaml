abstract:
- language: en
  script: Latn
  content: "Supplement 46 to ITU-T Y series Recommendations applies to Recommendations
    ITU-T Y.3500-series.  Cloud computing has the potential to alleviate some of the
    socio-economic challenges being faced in developing countries such as lack of
    resilient electrical power, lack of Information and Communications Technology
    (ICT) infrastructure and can also improve service delivery to mention but a few.
    \r\n\r\nEmanating from a survey conducted on cloud computing status in developing
    countries, this supplement highlights the requirements and challenges of cloud
    computing provision and consumption in developing countries with regards but not
    limited to standards implementation, data connectivity and infrastructure deployment.\r\n"
