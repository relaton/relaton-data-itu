abstract:
- language: en
  script: Latn
  content: "Radio frequency electromagnetic field (RF-EMF) exposure limits have become
    a critical concern for further deployment of wireless networks, especially in
    countries, regions and even specific cities where RF-EMF limits are significantly
    stricter than the International Commission for Non-Ionizing Radiation Protection
    (ICNIRP) or Institute of Electrical and Electronics Engineers (IEEE) guidelines.\r\n\r\nThis
    problem currently affects several countries, such as China, India, Poland, Russia,
    Italy and\r\nSwitzerland, regions of Belgium or cities such as Paris.\r\n\r\nSupplement
    14 to the ITU-T K-series of Recommendations provides an overview of some of the
    challenges faced by countries, regions and cities that are about to deploy 4G
    or 5G infrastructures. It provides information on a simulation carried out in
    Poland of the impact of RF‑EMF limits as an example of a wider phenomenon, applicable
    to several other countries that have set limits stricter than those contained
    in the ICNIRP or IEEE guidelines.\r\n\r\nThe results of the simulation indicate
    that, where RF-EMF limits are stricter than ICNIRP or IEEE guidelines, the network
    capacity buildout (both 4G and 5G) might be severely constrained and prevent growing
    data traffic demand and the launching of new services on existing mobile networks
    being addressed."
