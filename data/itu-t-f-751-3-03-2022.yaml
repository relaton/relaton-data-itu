abstract:
- language: en
  script: Latn
  content: "The development of applications using distributed ledger technology (DLT)
    enables the creation of new business models in various sectors of the economy
    and it has the potential to tackle, on a large scale, important challenges for
    our society, due to its ability to increase trust in the relationship between
    stakeholders. Technical immutability is key to building trust between stakeholders.
    On the other hand, real life introduces practical needs to update applications
    with smart contracts. This document defines some recommendations to tackle changes
    in applications using smart contracts.\r\nThe discussion of whether DLT networks
    provide different levels of technical immutability is out of the scope of this
    Recommendation.\r\n"
