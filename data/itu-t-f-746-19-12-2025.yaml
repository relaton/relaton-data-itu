abstract:
- language: en
  script: Latn
  content: "Hybrid work environments refer to a method of collaboration among users
    in different physical locations. With the recent spread of epidemics such as COVID-19,
    non-face-to-face meetings and remote work are becoming more popular, and it is
    expected that they will continue in a hybrid way even though the epidemic has
    decreased or dissipated in the future.\r\nHowever, hybrid work environment can
    lead to a lack of mutual understanding when conducting a conversation, and a discussion
    based on false facts can lead to inappropriate conclusions. In addition, there
    are cases where it is difficult to prepare minutes because the other party's exact
    intention is not understood.\r\nThe purpose of Recommendation ITU-T F.746.19 is
    to improve hybrid work methods through artificial intelligence technology to improve
    the efficiency and accuracy of conversation in a hybrid environment.\r\n"
