abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.1502 is based on the end-to-end quality of service
    (QoS) key performance indicator (KPI) definitions first published in the ITU-T
    Focus Group Digital Financial Services Technical Report \"QoS and QoE Aspects
    of Digital Financial Services\" (see [b-DFS TR] in the bibliography). It details
    the methodology and connects to a field test using this methodology which has
    been conducted in Ghana in the first half of 2018. \r\n\r\nMoney transfer from
    end user devices to other devices or to other entities has become an important
    element of everyday life in many countries. This service, however, relies on the
    functionality of mobile networks. Therefore, a connection exists between the functioning,
    QoS and quality of experience (QoE) of money transfer services, and the QoS and
    proper functioning of those mobile networks, and respective quality metrics and
    testing methodologies need to be defined. \r\n\r\nThe main part of the present
    Recommendation describes the testing methodology.\r\n"
