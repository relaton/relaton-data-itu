abstract:
- language: en
  script: Latn
  content: "Supplement 81 to the ITU-T G-series Recommendations gives an overview
    of passive optical network (PON) security, collects use cases for PON security
    with associated expectations, and reviews security aspects and methods applicable
    to PON systems, including a general PON threat model, unicast data encryption
    key exchange, SN duplication mitigation, and security-enhancement Recommendations
    in ONU management and control interface (OMCI)-based authentication, which may
    be considered in future PON Recommendations to support security-enhancement features.\r\n"
