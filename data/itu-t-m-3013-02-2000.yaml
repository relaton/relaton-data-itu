abstract:
- language: en
  script: Latn
  content: The Telecommunications Management Network (TMN) is implemented to support
    management activities associated with telecommunication networks. This Recommendation
    introduces essential considerations needed to support installation and operation
    of a TMN based on the TMN principles, concepts and architecture, which are described
    in Recommendation M.3010. Issues associated with evolution of new technologies
    for TMN applications are also identified. BackgroundThis Recommendation is based
    upon material extracted from Recommendation M.3010 (1996). In this Recommendation
    the material has been updated, refined, and expanded to assist in the planning,
    design, implementation and operation of a TMN.
