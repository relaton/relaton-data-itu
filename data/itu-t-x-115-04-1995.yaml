abstract:
- language: en
  script: Latn
  content: This Recommendation provides definition of the address translation service,
    the service provided to its customers, the functions at the network interface
    and functions within the network when providing this service. The address translation
    service provides customers the ability to use addresses in formats other than
    X.121 or E.164 (e.g. user friends addresses like mnemonic addresses, etc.). The
    addresses can be any of the alternative addresses defined in Recommendation X.25.
    The network will translate the address in the Call Request packet to the desired
    address to complete the call.
