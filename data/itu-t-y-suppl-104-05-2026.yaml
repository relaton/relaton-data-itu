abstract:
- language: en
  script: Latn
  content: "Things in the Internet of things (IoT) domain, such as transportation,
    homes and factories, are equipped with many devices. These devices have software-like
    agents with the ability to receive and transmit IoT data such as sensor data,
    state data and event data. These agents can be defined as IoT things. These agent-based
    things collect different types of IoT data related to IoT services in real time.
    The collected IoT data can not only improve intelligent IoT services but also
    develop various intelligent IoT convergence services by interacting with existing
    IoT services. Therefore, agent-based things can help optimize intelligent IoT
    services and integrate intelligent IoT services by providing various IoT data
    collected from things to intelligent IoT services. \r\nSupplement 104 to ITU-T
    Y-series Recommendations describes use cases of linking with agent-based things
    for intelligent IoT services. It also identifies the challenges and opportunities
    of connecting with intelligent IoT services.\r\n"
