abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.918 presents guidelines for undertaking subjective
    experiments for the quality of experience (QoE) assessment of perceptual video
    quality dimensions. In addition to scores for the overall video quality, the methodology
    yields scores for five perceptual dimensions. Each perceptual dimension scores
    are based on the ratings of the amount of degradation present in one system/test
    condition. The method is designed to be used with naïve subjects. The dimension
    scores can be used to provide diagnostic information on what may cause the degradation.\r\n\r\nThe
    perceptual dimensions are described in this Recommendation as well as the method
    to conduct a subjective experiment. Furthermore, information is provided about
    possible test environment and setup, participant instructions, and test material.\r\n"
