abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3325 describes the requirements for a reference
    model of such interactions including interface and metadata. After the IMT-2020
    technology and network virtualization technology spread, the appearance of emerging
    services such as multimedia services (high resolution, AR, VR, etc.) and IoT is
    expected. Since huge amount of traffic of these new coming services will be incurred
    to the network, the importance of network flexibility and stability will increase.
    Network operators intend to improve network operations such as provisioning, resource
    control, failure detection and recovery, and so on. Automatic network management
    supported by recent AI technologies called AI-based networks will play an essential
    role in such an era. \r\nOn the other hand, a service provider needs to manage
    service dynamically based on service and network status for better quality of
    service (QoS). In order for service providers to use the information managed by
    AI-based networks effectively, a common interface between a system of service
    providers over AI-based networks and AI-based networks is required.\r\n"
