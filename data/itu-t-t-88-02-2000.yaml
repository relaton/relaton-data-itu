abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard, commonly known as JBIG2,
    defines a coding method for bi-level images (e.g. black and white printed matter).
    These are images consisting of a single rectangular bit plane, with each pixel
    taking on one of just two possible colours. This Recommendation | International
    Standard has been explicitly prepared for a lossy, lossless, and lossy-to-lossless
    image compression.
