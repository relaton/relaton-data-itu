abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1241 provides a technical framework for countering
    email spam. The framework describes one recommended structure of an anti-spam
    processing domain and defined function of major modules in it. The key point of
    the framework is that it establishes a mechanism to share information about email
    spam between different email servers. Systems following the framework would improve
    efficiency through interconnection.
