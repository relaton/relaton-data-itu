abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3373 introduces the management function set and
    requirements for synergy management of cloud and SDN-based networks. It describes
    the synergy management structure and the composition of the function set, explains
    the functions of each component in the function set. The requirements for the
    synergy management of cloud and SDN-based networks are also described. In this
    Recommendation, the general background of the synergy service of cloud and SDN-based
    networks are also analysed. The benefit of introducing synergy management of cloud
    and SDN-based networks is explained. \r\n"
