abstract:
- language: en
  script: Latn
  content: This Recommendation describes service requirements and architecture for
    transport of Voice Services over MPLS networks.Voice Services over MPLS networks
    include a family of protocols that may be supported over MPLS, including Voice
    over IP (as specified by IETF), Voice over MPLS (as specified by MPLS Forum) and
    I.366.2 Voice Trunking Format (based on ITU-T Rec. I.366.2 adapted for MPLS).Possible
    approaches for transporting Voice Services over MPLS are provided in Appendix
    II.Detailed protocol specifications are subject of other Recommendations.
