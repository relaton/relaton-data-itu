abstract:
- language: en
  script: Latn
  content: This Recommendation "Universal Personal Telecommunication (UPT) - Service
    Description (Service Set 2)" provides the service description and operational
    provisions for Universal Personal Telecommunication (UPT) - Basic UPT service
    scenario.It describes the main principles of UPT, for example personal mobility,
    authentication and service profile management. It defines the UPT service aspects
    from the user's perspective (e.g. numbering and charging aspects). It also describes
    the essential features necessary to provide the UPT service, and the optional
    features, which may be used to support additional enhancements.UPT Service Set
    1 was a restricted scenario providing UPT service that supported provision of
    telephone service over PSTN, ISDN and PLMN networks. UPT Service Set 1 is incorporated
    in this Recommendation for UPT Service Set 2.UPT Service Set 2 - The Basic UPT
    service scenario - incorporates more services and networks, moving towards full
    universal service availability, terminal independence and operation across multiple
    networks. In this scenario, for example, various data services may be provided
    in addition to telephone service as in Service Set 1.
