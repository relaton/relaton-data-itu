abstract:
- language: en
  script: Latn
  content: Focus groups may be established to help advance the work of ITU-T study
    groups in a timely manner. This Recommendation provides procedures for the establishment
    of focus groups and working methods to facilitate the completion of work on a
    well-defined topic in a short time period, typically 9-12 months.Annex A provides
    a checklist of criteria to be used as a guide by the parent study group when determining
    whether or not to form a focus group.
