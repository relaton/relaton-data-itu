abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation is to define the cloud storage service
    requirements in visual surveillance. Cloud storage enables the service users to
    have ubiquitous, convenient and on-demand network access to a shared pool of configurable
    storage resources, which can be rapidly provisioned and released with minimal
    management effort or service-provider interaction. Cloud storage can realize flexible
    and reliable data storage for large scale visual surveillance, and its component
    is modularized and allocated dynamically based on the real usage. This Recommendation
    provides the application scenarios and the requirements for cloud storage in visual
    surveillance.
