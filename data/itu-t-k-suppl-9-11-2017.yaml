abstract:
- language: en
  script: Latn
  content: 'The deployment of 5G will see the evolution and expansion of existing
    4G networks and the introduction of new radio access networks in the millimetre
    wave bands. Because of the use of much higher frequency ranges the number of base
    stations will substantially increase. These networks will include a range of installations
    including more small cell deployments and advanced antenna technologies. Massive
    MIMO antennas will allow to use very narrow beams that will follow the user with
    impact for the surrounding exposure level different than this from current systems.
    The number of wireless devices will dramatically increase. New technology allows
    for use more efficient systems that require lower level of the signals for communication. '
