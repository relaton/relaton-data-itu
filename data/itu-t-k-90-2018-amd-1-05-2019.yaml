abstract:
- language: en
  script: Latn
  content: "The software ''EMFACDC'' in Appendix II of Recommendation ITU-T K.90 was
    developed in 2012. As the software environment is constantly under development,
    there was a requirement for software adjustments. These updates were done in the
    new version v 2.0 that is attached to this amendment, and which include the following
    important modifications:\r\n–\tprocedures ''open'' and ''save'' were improved;\r\n–\tthe
    possibility to save numerical data with the results of calculations on the horizontal
    and vertical lines in *.csv format was added;\r\n–\tthe new example of the high
    voltage line with two circuits ''delta'' type was added;\r\n–\tthe main screen
    was reorganized.\r\n"
