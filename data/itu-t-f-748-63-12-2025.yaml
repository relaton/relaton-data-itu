abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.748.63 specifies a framework and general technical
    requirements for foundation model enhanced digital human systems. It introduces
    a framework that integrates foundation model capabilities into digital human systems,
    covering modelling, rendering, driving and interaction processes. The Recommendation
    describes typical application scenarios of foundation models across different
    phases of digital human systems and specifies technical requirements for the modelling,
    driving and interaction phases to ensure enhanced intelligence, safety and reliability.\r\n"
