abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3041 describes the necessity of smart ubiquitous
    networks (SUN) as a short\x1Eterm realization of future networks. It identifies
    SUN objectives and the high-level requirements for providing relevant network
    and service capabilities in terms of the smart and ubiquitous aspects of networks.
    This Recommendation provides an overview of various capabilities to support the
    smart and ubiquitous aspects of networks, such as context awareness, content awareness,
    smart resource management, programmability, autonomic network management and ubiquity.
    Details of each subject area will be described in separate Recommendations."
