abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4900/L.1600 gives a general guidance to cities
    and provides an overview of key performance indicators (KPIs) in the context of
    smart sustainable cities (SSCs).\r\nThis Recommendation is one of series of the
    Recommendations and Supplements that define KPIs. The series of KPI definitions
    documents also include:\r\n• Recommendation ITU-T Y.4901/L.1601 on key performance
    indicators (KPIs) related to the use of information and communication technology
    (ICT) in smart sustainable cities. This Recommendation lists the KPIs focusing
    on ICT use in smart sustainable cities (SSCs).\r\n• Recommendation ITU-T Y.4902/L.1602
    on key performance indicators (KPIs) related to the sustainability impacts of
    information and communication technology (ICT) in smart sustainable cities. This
    Recommendation lists the KPIs used for ICT impact on sustainability.\r\n• Supplement
    ITU-T Y-Suppl. 39 on key performance indicators (KPIs) for smart sustainable cities.
    This document provides information regarding KPIs and evaluation index systems
    of smart cities, KPIs of sustainable cities, etc."
