abstract:
- language: en
  script: Latn
  content: "Supplement 46 to the ITU-T L-series Recommendations aims to provide the
    definition and conceptualization of the circular city, identify the terminology
    that deals with circular city, define these terms and uncover the recent trends
    of circular cities, based on the systematic literature review and bibliometric
    analysis. Circularity in cities appear to be more than the sum of the multiplication
    of urban circular economies and has increasingly become the subject of policy
    innovations, urban strategies, and research and development agendas. However,
    the concept of circular city and the terminology that deals with it remains unclear,
    regardless of the emerging scientific and political attention that it gains.\r\nThe
    main elements examined in this Supplement are:\r\n–\tThe definition of circular
    cities;\r\n–\tThe determination of a conceptual architecture of circular cities;\r\n–\tThe
    identification of recent trends in a circular city.\r\n"
