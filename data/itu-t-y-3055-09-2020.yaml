abstract:
- language: en
  script: Latn
  content: "Data has become more important for various industries, and data stakeholders
    aggregate personal data from various data sources to find new values. To increase
    benefits from personal data utilization with the balance of privacy protection,
    it is important to support trust-based personal data management that considers
    the trust in personal data utilization processes. Thus, Recommendation ITU-T Y.3055
    provides a framework for trust-based personal data management. It introduces the
    necessity of trust-based personal data management based on the analysis of personal
    data management. Then, it identifies various requirements for trust-based personal
    data management. After identifying the requirements, Recommendation ITU-T Y.3055
    provides a framework architecture specifying related functional blocks and reference
    points with relevant information flows. Details of prospective technologies for
    personal data management and a trust evaluation model with a specific use case
    are described in informative appendices.\r\nNOTE – In this Recommendation, some
    capabilities and applications may be related to regulation in some countries.
    In this case, non-functional aspects related to regulation are out of scope."
