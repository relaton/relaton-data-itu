abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3112 describes the concept of network slicing and
    use cases of that a single user equipment (UE) attaches to multiple network slices
    simultaneously in the IMT-2020 network. \r\n\r\nThe use cases introduce the slice
    service type for indicating a specific network slice and the slice user group
    for precisely representing the network slice in terms of performance aspects and
    business aspects. \r\n\r\nThis Recommendation also specifies high-level requirements
    and framework for the support of network slicing in the IMT-2020 network. \r\n"
