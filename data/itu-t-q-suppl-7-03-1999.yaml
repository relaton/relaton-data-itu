abstract:
- language: en
  script: Latn
  content: This supplement specifies the general aspects for the development of unified
    signalling requirements. The general aspects are defined in terms of business
    models, information object models, functional entity models and engineering models.This
    supplement is intended to specify the essential features and models required to
    develop functional entity actions for session control, resource control, call
    control, bearer control and transport control.
