abstract:
- language: en
  script: Latn
  content: In applications and services that use tag-based identification, it is necessary
    to minimize the length of the OID encoding. This Recommendation | International
    Standard provides for the registration of OID arcs which enable identification
    schemes for applications and services that use tag-based identification to be
    identified with an OID that encodes in two octets. Recommendation ITU-T X.668
    | ISO/IEC 9834-9 specifies the information and justification to be provided when
    requesting an OID for such identification schemes, and the procedures for the
    operation of the Registration Authority.
