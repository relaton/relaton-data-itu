abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.77 gives the basic requirements to be met by metal
    oxide varistors (MOVs) for the protection of power circuits and signal circuits
    of telecommunication installations from surges.\r\n\r\nThe purpose of this Recommendation
    is to provide technical guidelines for purchasers and manufacturers of MOVs to
    ensure their satisfactory operation in the applications for which they are intended.\r\n\r\nThis
    Recommendation is intended to be used for the harmonization of existing or future
    specifications issued by MOV manufactures, telecommunication equipment manufactures,
    administrations or network operators."
