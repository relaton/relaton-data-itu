abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3183.1 proposes protocol-neutral requirements for
    the management interface across network elements, the log analysis system in telecommunication
    management with artificial intelligence (AI), the AI engine and the operation
    management system. It specifies the requirements across the interfaces with the
    key functions, including log collection tasks, log storage, log record query,
    alarm management, AI invocation and log analysis result reporting. This series
    of Recommendations are intended to enhance the stability, transparency and interoperability
    of AI log analysis systems in diverse applications. This Recommendation aims to
    standardize the design, development and application of log analysis system management
    interfaces.\r\n"
