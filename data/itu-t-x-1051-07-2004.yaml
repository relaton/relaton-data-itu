abstract:
- language: en
  script: Latn
  content: For telecommunications organizations, information and the supporting processes,
    telecommunications facilities, networks and lines are important business assets.
    In order for telecommunications organizations to appropriately manage these business
    assets and to correctly and successfully continue their business activities, information
    security management is extremely necessary. This Recommendation provides the requirements
    on information security management for telecommunications organizations.This Recommendation
    specifies the requirements for establishing, implementing, operating, monitoring,
    reviewing, maintaining and improving a documented information security management
    system (ISMS) within the context of the telecommunication's overall business risks.
    It specifies requirements for the implementation of security controls customized
    to the needs of individual telecommunications or parts thereof.
