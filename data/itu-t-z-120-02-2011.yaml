abstract:
- language: en
  script: Latn
  content: "Scope/objective\r\n\r\nThe purpose of recommending MSC (Message Sequence
    Chart) is to provide a trace language for the specification and description of
    the communication behaviour of system components and their environment by means
    of message interchange. Since in MSCs the communication behaviour is presented
    in a very intuitive and transparent manner, particularly in the graphical representation,
    the MSC language is easy to learn, use and interpret. In connection with other
    languages it can be used to support methodologies for system specification, design,
    simulation, testing, and documentation.\r\n\r\nCoverage\r\n\r\nThis Recommendation
    presents a syntax definition for Message Sequence Charts in textual and graphical
    representation. An informal semantics description is provided.\r\n\r\nApplication\r\n\r\nMSC
    is widely applicable. It is not tailored for one single application domain. An
    important area of application for MSC is an overview specification of the communication
    behaviour for real time systems, in particular telecommunication switching systems.
    By means of MSCs, selected system traces, primarily \"standard\" cases, may be
    specified. Non-standard cases covering exceptional behaviour may be built on them.
    Thereby, MSCs may be used for requirement specification, interface specification,
    simulation and validation, test case specification and documentation of real time
    systems. MSC may be employed in connection with other specification languages,
    in particular SDL. In this context, MSCs also provide a basis for the design of
    SDL-systems.\r\n\r\nStatus/Stability\r\n\r\nMSC is stable. This Recommendation
    is a maintenance update of the 2004 version correcting a number of errors and
    consolidating Appendix I into the main text. Otherwise it is intended to be the
    same as the 2004 version, which was a natural continuation of its 1999 version,
    refining concepts including:\r\n\r\n• extended data interface, and references
    to default SDL interface, defined in ITU-T Z.121;\r\n\r\n• uni-directional time
    constraints;\r\n\r\n• in-line high level expressions."
