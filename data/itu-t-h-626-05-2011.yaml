abstract:
- language: en
  script: Latn
  content: "The purpose of Recommendation ITU-T H.626 is to define a visual surveillance
    system based on IP networks. The visual surveillance system provides the display
    and storage of the multimedia (such as video, audio and image) captured by multiple
    remote cameras over an IP network for multiple users. It also provides other functionalities,
    such as remote control, alarm and linkage actions, recording and playback.\r\n\r\nThis
    Recommendation defines the functional requirements, model, architecture, entities,
    reference points and service-control flow of the visual surveillance. This document
    also describes the hierarchy model for deployment, the visual surveillance management
    system, and the interworking and service convergence between the visual surveillance
    system and other multimedia systems."
