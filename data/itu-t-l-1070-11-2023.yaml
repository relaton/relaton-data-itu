abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T L.1070 provides an overview of global and common
    opportunities to represent sustainability, mainly environmental related (including
    human health), details about digital technology products, either collective information
    and communication technology (ICT) product models, batches or individual product
    items. These product details are intended for representation in digital format
    instead of on paper. The details can represent design-related information, products
    at the time of manufacturing, including relevant information for product transparency
    and a potential for a circular lifecycle, such as details related to the origin
    of materials composition, design, manufacturing, energy consumption, maintenance,
    repair, preparation for reuse, final recycling and may include links to related
    documentation. Product details can include or relate to information that changes
    over the lifespan of a product as a result of reconfiguration events, including
    repair, upgrade, usage, sale and final recycling. The details should exclude any
    personal or business-sensitive information.\r\nRecommendation ITU-T L.1070 provides
    an overview of sustainability opportunities, environmental related, about product-related
    digital information common to all ICT products, with global scope for harmonization,
    i.e., relevant to any region, that can support the development of the circular
    economy of ICT products. Product-related digital information can be represented
    under digital technology, such as product identifiers, data formats, linked data
    and system architectures. It relates to and can complement regional and global
    standards.\r\n"
