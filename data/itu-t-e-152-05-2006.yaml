abstract:
- language: en
  script: Latn
  content: Experience with the International Freephone Service has shown that carriers
    have developed their own service order forms that are different to Annexes A,
    B, C and D of the existing Recommendation. Consequently, the service order forms
    have been amended to better suit the actual need for information exchange between
    carriers. In addition, a global change has been made to ensure that the use of
    terms and definitions are consistent throughout the Recommendation.
