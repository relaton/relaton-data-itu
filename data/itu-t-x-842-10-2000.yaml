abstract:
- language: en
  script: Latn
  content: This Recommendation | Technical Report provides guidance for the use and
    management of Trusted Third Party (TTP) services, a clear definition of the basic
    duties and services provided, their description and their purpose, and the roles
    and liabilities of TTPs and entities using their services.This Recommendation
    | Technical Report identifies different major categories of TTP services including
    time stamping, non-repudiation, key management, certificate management, and electronic
    notary public.
