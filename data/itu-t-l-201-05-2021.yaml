abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T L.201 refers to passive optical nodes in outdoor
    environments. It deals with the design of the closure housing as well as the fibre
    organizer or fibre management system, taking into account mechanical and environmental
    characteristics as well as the characteristics of the optical fibre organizer.
    \r\nThe following new elements have been added in this revision: \r\n\r\n– A new
    clause 6.3 on closure materials with detailed test requirements for UV-light exposure
    and the fungal resistance of polymer materials and a material test requirement
    for the ageing of polymer materials by humidity; \r\n– A new clause 6.5 on cable
    attachment and termination with recommendations for the electrical grounding of
    the metallic elements of the cables; \r\n– A test programme for the performance
    evaluation of sealed optical closures in the outdoor ground level (OG) environment.
    \r\n\r\nThe following changes were made to harmonize the performance tests with
    [IEC 61753-1]: \r\n– Sealing tests are done with 20 kPa overpressure for OG and
    outdoor above ground (OA) closures. \r\n– Pass-fail criteria of pressure loss
    during test have been added to mechanical sealing tests for OG and OA closures.
    \r\n– Reduced loads for the cable axial tension test for small diameter cables
    and microduct tubes.  \r\n– Reduced loads for the cable axial compression test
    for small diameter cables. \r\n– The duration of the cycles in cable torsion and
    cable bending test have been added. \r\n– The location for impact test has been
    added for rectangular shaped closures. \r\n– The free fall test has been removed
    (it has been replaced by a more reproduceable shock test). \r\n– In the assembly
    and disassembly test the duration is reduced to 5 cycles. \r\n– Resistance to
    solvents and contaminating fluids: immersion in diesel with duration of 1 h and
    24 h drying time and added immersion in petroleum jelly for 5 days has been added.
    Kerosene immersion has been removed. \r\n– The duration of the change of temperature
    has been reduced to 12 cycles. \r\n– Water immersion test at 1 m for 7 days for
    OG closures has been added. "
