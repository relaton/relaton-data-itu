abstract:
- language: en
  script: Latn
  content: The telecommunications industry today is pursuing development of a new
    generation of television services, typically called IPTV, built upon IP networking
    technology to deliver integrated triple-play voice, data and video services across
    a converged network infrastructure. The cable industry has a long history of successfully
    delivering video services over hybrid fibre/coax (HFC) networks while adding support
    for data and voice through the DOCSIS and IPCablecom architectures. Recommendation
    ITU-T J.700 describes the use of the IPTV mechanism, and is intended to support
    IPTV services over existing cable-based secondary distribution networks and/or
    other networks to enhance the existing television distribution services.This revised
    Recommendation provides a clearer relationship of the IPTV architecture between
    this Recommendation and Recommendation ITU-T Y.1910, and the relationship to the
    service provider interface is newly described. In addition, the latest access
    network technologies for secondary distribution such as radio frequency over glass
    (RFoG), wavelength-multiplexed video transport over optical fibre, and hybrid
    use of HFC and optical fibre, are mentioned. This revision is also intended to
    provide a number of editorial corrections.
