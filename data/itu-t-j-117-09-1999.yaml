abstract:
- language: en
  script: Latn
  content: "The need to support cable services for High Definition TV (HDTV) sets,
    which are starting to emerge in the retail market, is converging with a general
    movement to interconnect multiple audio/visual (A/V) devices on a common bus or
    network. The IEEE 1394 interface has emerged as the preferred tool to accomplish
    this goal. Although the applications\r\nand their standards are still emerging,
    this Recommendation defines requirements and options for a 1394 digital interface
    between a Home Digital Network Device (HDND), which is a type of Set-Top Box (STB),
    and a Digital Television (DTV) receiver, with the Recommendation later extended
    to include a full set of networked devices in the home. Clause 5 covers the interface
    from the HDND point of view. Clause 6 covers the interface from the DTV point
    of view.\r\nIn the event of apparent conflict, the requirements in Clause 5 take
    precedence over Clause 6."
