abstract:
- language: en
  script: Latn
  content: "This Recommendation | International Standard defines rules for mapping
    an XSD Schema (a schema conforming to the W3C XML Schema specification) to an
    ASN.1 schema in order to use ASN.1 encoding rules such as the Basic Encoding Rules
    (BER), the Distinguished Encoding Rules (DER), the Packed Encoding Rules (PER)
    or the XML Encoding Rules (XER) for the transfer of information defined by the
    XSD Schema. \r\n\r\nThe use of this Recommendation | International Standard with
    the ASN.1 Extended XML Encoding Rules (EXTENDED-XER) provides the same XML representation
    of values as that defined by the original XSD Schema, but also provides the ability
    to encode the specified XML with an efficient binary representation (binary XML).
    \ An XML document can be converted to binary XML (for storage or transfer) using
    the ASN.1 generated by this mapping, and the resulting binary can be converted
    back to the same XML document for further XML processing.  \r\n\r\nTwo versions
    of the mapping are defined.  Version 1 of the mapping was published in 2004, and
    a Corrigendum was issued to this Version renaming the types DATE-TIME and DURATION
    in Annex A (in order to avoid conflict with the application of ITU-T Rec. X.680/Amd.
    3 | ISO/IEC 8824-1/Amd. 3 (known as the time types amendment)).  The Version 2
    mapping is more efficient in two areas: the ASN.1 time types are used rather than
    VisibleString for mappings of dates and times; the FastInfoset specification (ITU-T
    Rec. X.891 | ISO/IEC 24824-1) is used for the mapping of XSD wild-cards.  Both
    these changes to the mapping provide much more compact binary encodings for the
    XML specified by the XSD.\r\n\r\nNOTE − The specification of the Version 1 mapping
    (with applicable corrections) will be maintained in the next edition of this Recommendation
    | International Standard, but it is expected that subsequent editions will document
    only the Version 2 mapping.\r\n\r\nApplication of the ASN.1 extended XML Encoding
    Rules to both versions of the mapping will produce the same XML (which is the
    same as that specified by the XSD).  However, application of other ASN.1 encoding
    rules to the Version 1 mapping results in a verbose character-based encoding of
    date and time types and of XSD wild-cards, whilst application to the Version 2
    mapping results in a more compact binary encoding using ASN.1 time types and the
    FastInfoset specification."
