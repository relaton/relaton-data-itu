abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3207 specifies an integrated network control architecture
    framework for fixed, mobile and satellite convergence in the control plane for
    IMT-2020 networks and beyond. Recommendation ITU-T Y.3207 describes the scenarios
    and architecture frameworks of control systems for integrated networks and individual
    network domains. Recommendation ITU-T Y.3207 describes procedures for the design
    and orchestration of end-to-end network services, and performance monitoring and
    resource control in a unified manner of both terrestrial and non-terrestrial network
    domains.\r\n"
