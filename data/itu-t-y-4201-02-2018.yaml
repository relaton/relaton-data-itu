abstract:
- language: en
  script: Latn
  content: "This draft Recommendation presents the high-level requirements and reference
    framework of Smart City Platform (SCP).\r\n\r\nThe SCP is a fundamental platform
    supporting all the services and applications of a smart city, with the objective
    to improve quality of life, provide urban operation and services for the benefit
    of the citizens while ensuring city sustainability.\r\n\r\nThese high-level requirements
    include comprehensive and updated repositories of city information, infrastructure
    life-cycle management, inter-system communication, security support, maintenance
    support, controls of processer, decision making support, real-time dissemination
    of public information, resiliency, and interoperability.\r\n\r\nThis Recommendation
    benefits the plan, design, construction, deployment, operation and maintenance
    of smart cities and communities.\r\n"
