abstract:
- language: en
  script: Latn
  content: "This Recommendation specifies the electromagnetic compatibility common
    requirements and the test methods for digital cellular mobile communication base
    station equipment, repeaters and associated ancillary equipment which are independent
    of any kind of wireless access technologies, such as 2G, 3G ,4G or others.\r\n\r\nTest
    conditions for base stations used in variety modality are described, e.g. macro-base
    station, distributed-base station, micro-base station, pico base station, integral
    antenna base station and active antenna base station; performance criteria for
    immunity tests are also specified.\r\n\r\nThis Recommendation describes the specific
    testing levels to be applied to radio communication base stations in different
    environments, such as telecommunication centres, customer premises and outside
    plants.\r\n"
