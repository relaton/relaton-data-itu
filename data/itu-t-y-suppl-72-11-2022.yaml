abstract:
- language: en
  script: Latn
  content: Supplement 72 to ITU-T Y-series Recommendations provides the standardization
    roadmap for artificial intelligence (AI) in the field of information and communication
    technology (ICT). This AI standardization roadmap has been developed to assist
    in the development of AI related standards in the ICT field by providing information
    on existing standards and standards under development in key standards development
    organizations (SDOs). In addition, it provides overviews of AI and AI related
    technical areas from the standards perspective, AI related activities in SDOs,
    and gap analysis.
