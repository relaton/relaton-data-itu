abstract:
- language: en
  script: Latn
  content: This amendment provides a new generic capability for controlling alarm
    reporting. This amendment has been cast in the ITU-T M.3020 (2000), TMN interface
    specification methodology format. This amendment includes the requirements, analysis,
    and applicable designs for this feature. These generic managed object definitions
    defined in both the analysis and design sections are intended to be applicable
    across different technologies, architectures and services. The managed object
    classes in this amendment may be specialized to support the management of various
    telecommunications networks.
