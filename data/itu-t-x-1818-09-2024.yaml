abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1818 provides comprehensive guidance on securing
    the international mobile telecommunications (IMT-2020)/5G system during operation
    and maintenance phases in practice. The described security threats and recommended
    security controls are the result of a threat analysis.\r\nThe focus of this Recommendation
    is the IMT-2020/5G Standalone (5G SA) system as well as the virtual infrastructure
    and associated management systems that are expected to form the foundation for
    IMT-2020/5G deployments. Furthermore, consideration has been given not only to
    technology, but also people and process aspects affecting the security of IMT-2020/5G
    services. Recommended security controls are described at a high-level and reference
    established standards and best practices where relevant.\r\n"
