abstract:
- language: en
  script: Latn
  content: "Supplement ITU-T L.Suppeco-rating outlines a baseline assessment framework
    and defines a minimum set of criteria to be considered when assessing the environmental
    performance of mobile phones.\r\n\r\nThis Supplement is designed to enable manufacturers
    to assess mobile phones in order to demonstrate a minimum level of environmental
    performance and also to achieve enhanced environmental performance.\r\n\r\n–          clause
    7 lists the criteria to consider when seeking compliance to the minimum level
    of environmental performance described in this Supplement;\r\n\r\n–          clause
    8 addresses how products can achieve higher levels of environmental performance.\r\n\r\nThis
    Supplement does not promote any form of labelling and the methods by which ratings
    are displayed to consumers remain at the discretion of manufacturer or the sales
    entity.\r\n"
