abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation L.77 describes methods to install optical cables inside
    sewer ducts, which applies to both the cable installation and the pre-installation
    of an infrastructure, if requested. This Recommendation covers both man- and non-man-accessible
    sewer ducts.This Recommendation is not intended to address all of the safety concerns,
    if any, associated with its use. Therefore, it shall be the responsibility of
    the user of this Recommendation to establish appropriate health and safety practices
    and determine the applicability of regulatory limitations, if any, prior to its
    use.
