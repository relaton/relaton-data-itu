abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T H.625 defines the system architecture for network-based
    speech-to-speech translation (S2ST) on the basis of Recommendation ITU-T F.745
    and serves as a technical introduction to the subsequent definitions of detailed
    system components and protocols. The scope of this Recommendation is to describe
    the functional architecture and mechanisms of network-based S2ST, interface protocols
    between S2ST modules, and a workflow of the network-based S2ST system.
