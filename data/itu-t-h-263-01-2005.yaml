abstract:
- language: en
  script: Latn
  content: "This Recommendation specifies a coded representation that can be used
    for compressing the moving picture component of audio-visual services at low bit
    rates. The basic configuration of the video source coding algorithm is based on
    ITU-T Rec. H.261 and is a hybrid of inter-picture prediction to utilize temporal
    redundancy and transform coding of the remaining signal to reduce spatial redundancy.
    The source coder can operate on five standardized video source formats: sub-QCIF,
    QCIF, CIF, 4CIF and 16CIF, and can also operate using a broad range of custom
    video formats.The decoder has motion compensation capability, allowing optional
    incorporation of this technique in the coder. Half pixel precision is used for
    the motion compensation, as opposed to ITU-T Rec. H.261 where full pixel precision
    and a loopfilter are used. Variable length coding is used for the symbols to be
    transmitted.In addition to the basic video source coding algorithm, eighteen negotiable
    coding options are included for improved compression performance and the support
    of additional capabilities. Additional supplemental information may also be included
    in the bitstream for enhanced display capability and for external usage.This third
    edition of H.263 integrates Annexes U, V, W and X, which were approved and published
    separately before, with a number of corrections and clarifications:\r\n• correction
    of Figure 8;\r\n• clarification in Table 1 regarding BPPmaxKb table and Picture
    Padding;\r\n• clarification in clause 5.3.2 regarding macroblock stuffing preceding
    a start code;\r\n• clarification regarding interaction between H.263 Annex J and
    IDCT rounding error;\r\n• clarification in Annex N regarding parsability of the
    GN/MBA field in BCM;\r\n• clarification in Annex O regarding direct bi-dir predicted
    MBs and picture extrapolation;\r\n• clarification on the use of B pictures with
    intra reference pictures in Annex O;\r\n• clarification on the use of Annex P
    with Annex N;\r\n• correction of Figure U.7 in Annex U."
