abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.748.16 presents the overview and requirements for
    applications and services in smart manufacturing based on machine vision (MV).
    It describes the basic concept, scenario and ecosystem of machine vision, and
    identifies several typical requirements, such as data acquisition, data preprocessing
    and data processing. This Recommendation also gives a reference model for MV-based
    applications and services in smart manufacturing. The general goals of standardization
    for the MV service are:\r\n–\tDefining the requirements of MV-based services and
    applications;\r\n–\tHelping end users and providers to specify the MV tasks and
    solutions;\r\n–\tEnhancing confidence in the MV ecosystem and opening new applications
    for MV systems.\r\n"
