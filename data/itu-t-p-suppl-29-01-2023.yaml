abstract:
- language: en
  script: Latn
  content: "Supplement 29 to ITU-T P-series Recommendations describes ITU-T P.800
    use case examples that include narrowband (NB), wideband (WB), super wideband
    (SWB) and fullband (FB) audio bandwidth, speech, music and mixed speech and music
    content, stereo and spatial quality evaluations. \r\nThis Supplement also provides
    guidance for using subjective listening methodology in Recommendation ITU-T P.800
    for stereo and spatial speech and general audio. Anchor conditions, level normalization
    for stereo and multichannel signals, and listener screening methods are presented.\r\n"
