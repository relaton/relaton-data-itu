abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the operation of a digital modem and analogue
    modem pair for use on the Public Switched Telephone Network (PSTN) at data signalling
    rates of up to 56 000 bit/s in the downstream direction and up to 33 600 bit/s
    in the upstream direction. The two modems are specified herein in terms of coding,
    start-up signals and sequences, operating procedures and DTE-DCE interface functionalities.
    The network interface of the digital modem and the signalling rate that is used
    to connect the digital modem locally to a digital switched network are considered
    to be national matters and are hence not specified herein.
