abstract:
- language: en
  script: Latn
  content: This Recommendation describes a core architecture functionality of next-generation
    STB that operators and equipment vendors MAY elect to follow in making network
    and product investment decisions. This architecture defines a cost-efficient platform
    with capacity and flexibility to support growth of on-demand video, high definition
    digital TV, managed in-home networks connecting a wide range of consumer-provided
    devices, and future IP multimedia services including IP voice, video telephony,
    and multiplayer gaming. The goal of this Recommendation is to provide core functionalities
    and can serve as foundations for network specific environments. It SHOULD be noted
    that home networking portion of this architecture is based upon ITU-T Rec. J.190.
    In actual implementation of NG-STB-A functionalities, this Recommendation MUST
    be used with either ITU-T Rec. J.292 or ITU-T Rec. J.291 based on access network
    availability
