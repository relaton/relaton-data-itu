abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation K.44 defines DC power interface ports, which are connected
    by cables that are internal to the building. There are two types of DC powering
    system considered; floating and earth bonded. Floating DC supplies will inherently
    develop a common-mode surge on both conductors. Earth bonded DC supplies will
    inherently develop differential-mode surges on the unbonded polarity connection.
    Earth bonding can be single point at either the supply powering source or the
    powered equipment or multipoint. If the internal cable connecting the power source
    and the powered load runs for any distance the series inductance of the cable
    needs to be considered. Ports with electronic control could either go high or
    low impedance during a surge producing either a voltage stress test or a current
    stress test. The interaction of these factors is considered in this Supplement
    to make K.20 and K.21 equipment designers and testers aware of the surge stress
    levels.
