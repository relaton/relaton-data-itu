abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard (1993) documents management
    information that is applicable to more than one open system resource by documenting
    those common structures as generic definitions. These generic definitions may
    be used in the specification of managed objects for technology-specific use such
    as OSI layers.This Technical Corrigendum 2 revises the text to include ASN.1:1997
    in clause 13.
