abstract:
- language: en
  script: Latn
  content: Supplement 6 to ITU-T X-series Recommendations states that in order to
    deal effectively with spam, governments need to employ a variety of approaches,
    including effective laws, technological tools, and consumer and business education.
    This supplement reviews the international forums where the issue of spam is being
    addressed. As a case study, for illustrative purposes, it provides some information
    about the way the U.S. and Japan have approached the spam problem.
