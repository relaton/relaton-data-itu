abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.746.1 describes the major functions and their interactions
    for low-latency interactive multimedia streaming (LIMS). The scenarios and requirements
    are also identified in this Recommendation.\r\nDesktop and client-server applications
    can be provided to users through LIMS. The desktop application software and client
    software of client-server applications are deployed in the LIMS platform (server)
    and the outputs of the applications are delivered back to users as media streams.\r\nIn
    such a way, the traditional data storing, computing and graphic processing tasks
    are offloaded from user devices to LIMS servers. Provided the interaction delay
    is kept low, LIMS can provide the same experience to end users with less powerful
    devices.\r\nThe output of one instance of the application can be encoded into
    different audio and video formats, which can be sent to one or more user devices
    simultaneously. That means the application can be used continuously when the user
    switches from a powerful device such as a high-end computer to a less powerful
    device such as a mobile phone or vice versa.\r\nSince the software is no longer
    installed in the user device, easier deployment, maintenance and upgrade of the
    software is possible in the centrally-managed LIMS servers are much easier than
    before. If needed, it is easy to provide centralized management capability to
    fulfil the requirements of enterprises, such as single sign-on and access control.\r\nIt
    is very difficult to hack an application provided through LIMS. Furthermore, software
    reverse engineering is no longer possible, which is useful for the protection
    of intellectual property rights.\r\nSince the delay of interaction with the application
    has a major impact on the user experience, it is critical for LIMS to keep the
    interaction delay in a range that the end user is willing to tolerate."
