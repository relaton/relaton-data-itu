abstract:
- language: en
  script: Latn
  content: The purpose of a voice on ATM circuit multiplication equipment (VACME)
    is to provide a bandwidth efficient means of connecting TDM-based international
    switching centres (ISCs) and an ATM network. In addition to providing traditional
    CME functions, the equipment will have additional capabilities such as ATM multiplexing
    to optimize bandwidth utilization.VACME is a general switched telephone network
    (GSTN) trunking equipment using pulse code modulation (PCM) and low rate encoding
    technique together with digital speech interpolation (DSI) and facsimile demodulation/remodulation.
    Recommendation ITU-T I.733 addresses key issues, such as interfaces, signal processing
    functions, ATM adaptation layer mappings, and OAM functions, to be used in VACME
    in order to ensure the interworking of this equipment.
