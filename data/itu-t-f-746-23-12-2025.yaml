abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.746.23 specifies the requirements and framework
    for advanced call services with media enhancements. The typical application scenarios
    of advanced call services with media enhancements are provided in Appendix I.\r\nAdvanced
    call services with media enhancements are an extension of the existing audio and
    video call services, allowing the transmission of enhanced media content during
    a call. The enhanced media content is transmitted through a newly established
    logical pipe. Enhanced media content includes audio, video, text and other content.
    Advanced call services with media enhancements enable a lively visual, rich multimedia,
    highly perceptible, and fully interactive experience for users, providing users
    with more interactive experiences.\r\n"
