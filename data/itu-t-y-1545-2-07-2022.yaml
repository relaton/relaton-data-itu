abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.1545.2 specifies spatially resolved metrics for
    packet data-based services and a methodology for their computation, using the
    same conceptual framework as Recommendation ITU-T G.1034. The metrics cover the
    quality of service (QoS) and quality of experience (QoE) aspects of a wide range
    of applications used in motion, i.e., during travel. A taxonomy of application
    categories is provided, taking into account their absolute data rate (DR) requirements
    and, in particular, their sensitivity against temporary drops in available DRs,
    which are caused by motion through an environment that is characterized by spatial
    variation of network performance, i.e., available DR or latency. The methodology
    establishes ways to create a description of such spatial distributions of performance,
    termed route profiles and use route profiles to create predictions of QoS and
    QoE of application usage. It also establishes a new entity to describe local network
    performance that provides an abstraction and thereby a versatile way to express
    performance requirements.
