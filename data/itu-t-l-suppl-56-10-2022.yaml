abstract:
- language: en
  script: Latn
  content: Cities around the world are looking to make meaningful progress and, following
    the COVID-19 global pandemic, resume their course to achieve the Sustainable Development
    Goals. At the same time, digital technologies and information and communication
    technologies (ICTs) continue to transform the urban ecosystem, providing new sustainability
    opportunities across all sectors. The case studies contained in this Supplement
    capture some of the most successful measures and initiatives adopted by cities
    around world in their journey to become more sustainable using ICTs. This Supplement
    propels these case studies into the global spotlight for adoption.
