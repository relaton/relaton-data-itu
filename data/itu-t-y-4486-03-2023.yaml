abstract:
- language: en
  script: Latn
  content: "Decentralized services such as distributed ledger technology (DLT) service
    for Internet of things (IoT) devices are usually deployed in local area networks
    (LANs) or in core clouds. When only deployed in LANs, the decentralized services
    may be affected by the limited capabilities of storage, computation and communication
    of IoT devices. When only deployed in core clouds, the decentralized services
    may be affected by the communication capabilities between the IoT devices in LANs
    and the peers in core clouds. With the popularization of the use of edge computing,
    parts or all of functionalities of the decentralized services can be deployed
    in edge clouds.\r\nRecommendation ITU-T Y.4486 introduces a cross edge decentralized
    service (CEDS) by using DLT and edge computing technologies, which supports seamless
    cross edge DLT services for IoT devices (fixed and mobile) by using DLT and edge
    computing technologies. The CEDS can take the advantages of edge computing to
    speed up the service efficiency of DLT services for IoT devices. In addition,
    the CEDS provides adaptive service management to match the dynamic changes of
    IoT devices.\r\nThis Recommendation provides relevant general characteristics
    and requirements of the decentralized service by using DLT and edge computing
    technologies, and also provides its functional framework, common capabilities
    and general procedures.\r\n"
