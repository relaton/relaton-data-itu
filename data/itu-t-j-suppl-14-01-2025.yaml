abstract:
- language: en
  script: Latn
  content: "To improve the ease of use of Recommendations ITU-T J.1305 and ITU-T J.1306,
    various applications of media microservice architectures (MMAs) in different domains
    have been explained by way of use cases of audiovisual media systems. This Supplement
    14 to ITU-T J-series Recommendations describes use cases of microservices architecture
    for audiovisual media in the converged media cloud. This Supplement is beneficial
    to help users better understand how to apply MMA in different domains.\r\n"
