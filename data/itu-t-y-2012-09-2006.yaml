abstract:
- language: en
  script: Latn
  content: The objective of ITU-T Recommendation Y.2012 is to describe the functional
    requirements and architecture of the next generation network (NGN) for release
    1, as described in ITU-T Rec. Y.2201 (NGN release 1 requirements) and Supplement
    1 to ITU-T Y.2000-series Recommendations (NGN release 1 scope). The functional
    architecture provided in this Recommendation allows a clear distinction between
    the definition and specification aspects of the services provided by the NGN and
    the actual specification of the network technologies used to support those services.
    In line with Y.2011 principles, an implementation-independent approach is adopted
