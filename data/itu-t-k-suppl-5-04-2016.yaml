abstract:
- language: en
  script: Latn
  content: "When information security is managed, it is necessary to evaluate and
    mitigate the threat to either the equipment or the site. This threat is related
    to \"vulnerability\" and \"confidentiality\" in Information Security Management
    System (ISMS).\r\n\r\nSupplement 5 to ITU-T K-series Recommendations (ITU-T K.81)
    presents evaluation and calculation examples for the threat of an intentional
    HPEM attack. The HPEM sources considered are those presented in IEC 61000-2-13,
    as well as some additional sources that have emerged more recently.\r\n\r\nThis
    document also provides information on the vulnerability of telecom equipment.
    And the example of vulnerability is provided. The equipment is desirable to meet
    the immunity requirements presented in Recommendation ITU-T K.48 and relevant
    resistibility requirements, such as those described in Recommendations ITU-T K.20,
    ITU-T K.21 and ITU-T K.45.\r\n"
