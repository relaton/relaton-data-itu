abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard belongs to a series of Recommendations
    on Generic Upper Layers Security (GULS). It is the Protocol Implementation Conformance
    Statement (PICS) proforma for the Protecting Transfer Syntax Specification specified
    in ITU-T Rec. X.833 | ISO/IEC 11586-4 and the Security Transformation described
    in ITU-T Rec. X.830 | ISO/IEC 11586-1, Annex D. This Recommendation | International
    Standard provides a description of the standardized capabilities and options in
    a form that supports conformance evaluation of a particular implementation.
