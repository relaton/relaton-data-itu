abstract:
- language: en
  script: Latn
  content: This Supplement to ITU-T Q-series Recommendations is a technical report
    on the procedures, information flows and information elements needed for supporting
    CS-2 signalling requirement flows for the support of narrowband services via broadband
    transport technologies. Its scope is limited to functionality of the Serving Node
    and Call Mediation Node, and the associated protocols at the call control, bearer
    control, and call-bearer control levels needed for Capability Set 2.
