abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard:- defines a document architecture,
    in order to allow presentation and processing of tabular material, that can be
    used in conjunction with the document architecture defined in Recommendation T.412
    (1993);- defines two types of components, the grid logical component and the grid
    frame component, which are characterized by association with grids;- defines the
    layout attributes and layout directive attributes, in order to allow representation
    of tabular layout, applicable to this document architecture;- defines the presentation
    attributes, in order to allow presentation of tabular layout, applicable to the
    content architectures defined in Recommendation T.416 (1993), Recommendation T.417
    (1993) and Recommendation T.418 (1993);- describes reference models of the document
    layout process and the document imaging process which, together with the document
    processing model described in Recommendation T.412 (1993), determine representation
    and presentation of tabular layout.
