abstract:
- language: en
  script: Latn
  content: "This recommendation is a diagnostic reference for IP network quality of
    service monitoring, and primarily as a guide to assist regulators monitor the
    quality of service of internet that is provided by service providers (although
    subscribers and network service providers may also derive benefit).\r\n\r\nThe
    Internet known as the information superhighway, has indeed established a worldwide
    borderless cyber society. Nowadays, internet is acknowledged worldwide as an essential
    component for electronic communication services. The rapid increase in the use
    of the Internet has changed the way we live, the Internet has become an important
    factor in people’s daily life. \r\n\r\nThus as the take up and reliance of internet
    networks in promoting socio-economic development, the quality of service of internet
    networks becomes also very critical and important. However, occasionally the scenario
    under which internet is sold to customers is not fair and unfortunately internet
    subscribers are not well informed on the internet quality of service provided
    to them by ISPs.   \r\n\r\nTherefore, this recommendation highlights the necessity
    of testing the QoS of network services offered by ISPs, from the diagnostic and
    regulatory points of view. The recommendation also addresses quality of service
    evaluation scenarios, sampling methodology and testing tools for regulators. This
    recommendation gives a guidance to regulators about minimum QoS parameters for
    evaluating the quality of internet services. \r\n"
