  content: ITU-T Rec. X.234 | ISO/IEC 8602 specifies the protocol for providing the
    OSI connectionless-mode Transport protocol. This amendment provides the capability
    for the connectionless-mode Transport protocol to support multicast PDU transfer
    when used in conjunction with the multicast services of the connectionless-mode
    Network service.
