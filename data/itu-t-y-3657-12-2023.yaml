abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3657 specifies requirements and capabilities of
    network visibility for big-data-driven networking (bDDN). It focuses on the scenario
    where network infrastructure layer of bDDN corresponds to Internet protocol (IP)
    bearer network.\r\nThe scope of this Recommendation includes the following aspects
    of network visibility of bDDN: overview for network visibility of big-data-driven
    networking, requirements and capabilities for network visibility of the control
    aspect, requirements and capabilities for network visibility of the forwarding
    aspect, requirements and capabilities for network visibility of the management
    aspect, interface requirements for network visibility and security considerations."
