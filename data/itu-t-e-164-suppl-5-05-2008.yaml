abstract:
- language: en
  script: Latn
  content: Supplement 5 to Recommendation ITU-T E.164 reviews and examines the idea
    of harmonizing an approach to the selection of national numbers on a global basis.
    National Administrations are invited to consider such global harmonization of
    numbers associated with helplines, specifically those helplines that are aimed
    at providing assistance for children.Statement by Nigeria:Nigeria stated that
    there is a need for Administrations to note that, while it is feasible that if
    a user were to dial 116 111 the system would be capable of accepting this as a
    call to 116, the reverse is not applicable since it is not feasible that if a
    user dials 116, the system would be capable of accepting this as a call to 116
    111 and therefore will not direct the call accordingly as desired. Based on the
    above, the ITU should call for a better harmonizable global number, for the Study
    Period 2009-2012.
