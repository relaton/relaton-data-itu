abstract:
- language: en
  script: Latn
  content: Amendment 1 to Recommendation ITU-T X.603.1 | ISO/IEC 16512-2 describes
    the security functionalities of an application-level relayed multicast protocol
    for one-to-many group applications. The protocol provides various security facilities
    to fulfil general as well as specific security requirements. Some detailed functions
    that can operate with a variety of standardized security mechanisms are provided.
    This amendment enforces the existing RMCP protocol security.
