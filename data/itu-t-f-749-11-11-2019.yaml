abstract:
- language: en
  script: Latn
  content: "Civilian unmanned aerial vehicle (CUAV) enabled mobile edge computing
    (MEC) utilizes CUAV as an MEC platform to realize a flexible, efficient and on-demand
    computing service that can be rapidly deployed and move according to the practical
    service needs of devices. Recommendation ITU-T F.749.11 describes the framework
    and specifies requirements for a CUAV-MEC system, including functional, service
    and security requirements.\r\n\r\n "
