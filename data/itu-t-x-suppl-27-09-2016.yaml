abstract:
- language: en
  script: Latn
  content: "To create value, the information should be governed within the organization
    so as to have a strategic alignment between the objectives of information security
    and those of the organization. Governance and management of information security
    should be conducted in complete synergy. The management should be responsible
    for the operation of information and reporting (idea of responsibility) to the
    governing body.\r\n\r\nTo achieve this, the organization can use standards, recommendations
    and other frameworks whose implementation will encourage its success.\r\n\r\nIt
    is in this spirit that the Recommendation ITU-T X.1054 | ISO /IEC 27014 is implemented
    to the governance of information security of e-Council of Ministers in Burkina
    Faso.\r\n\r\nThis approach aims to be a case of best practice in the implementation
    of Recommendation ITU-T X.1054 | ISO /IEC 27014. Here it is used as part of a
    unifying project gathering all members of the Government of Burkina Faso (Presidency,
    Prime Ministry, General Secretariat of Government and the Council of Ministers,
    all ministries). However, this recommendation could be applied to any type of
    organization.\r\n"
