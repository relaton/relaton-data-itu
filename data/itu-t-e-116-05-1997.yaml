abstract:
- language: en
  script: Latn
  content: The international telecommunication charge card service, and particularly
    its automated use throughout the world, will provide benefits to both users and
    Recognized Operating Agencies (ROAs). This is based on a recognition of:1) the
    ROAs' need for security against fraudulent use, simplified billing procedures
    and a reduction in the requirement for operator assistance when telephone calls
    are made other than on a direct payment basis;2) the current and anticipated charge
    card technology which could provide increased security and enhanced service to
    users;3) the growing requirement for charge cards to pay for a variety of telecommunications
    services.As a result, ROAs (with appropriate authorization and coordination of
    their Administrations) are encouraged to prepare for, and introduce, the international
    telecommunication charge card service using the guidance of this Recommendation.
