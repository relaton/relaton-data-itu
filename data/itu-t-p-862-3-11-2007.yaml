abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation P.862.3 provides some important remarks that should
    be taken into account in the objective quality evaluation of speech conforming
    to ITU-T Recommendations P.862, P.862.1 and P.862.2. Users of ITU-T Recommendation
    P.862 should understand and follow the guidance given in this Recommendation.
    This Recommendation forms a supplementary guide for users of ITU-T Recommendation
    P.862, which recommends a means of estimating listening speech quality by using
    reference and degraded speech samples. The scope of ITU-T Recommendation P.862
    is clearly defined in itself. This Recommendation does not extend or narrow the
    scope, but provides necessary and important information for obtaining stable,
    reliable and meaningful objective measurement results in practice.
