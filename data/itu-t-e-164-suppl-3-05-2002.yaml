abstract:
- language: en
  script: Latn
  content: This Supplement provides an overview of the ENUM concept, as defined by
    the IETF in RFC 2916, that maps telephone numbers into a set of universal resource
    identifiers for use on IP-based networks. It describes various issues that are
    national matters and that need to be addressed by Administrations as they consider
    the inclusion of the portion of the E.164 numbering plan under their jurisdiction
    within the Domain Name System (DNS; see RFC 1591) as part of the one such envisaged
    implementation described by RFC 2916. This Supplement also describes various issues
    that are of interest to, and that need to be addressed by, assignees of E.164
    Country Codes for geographic areas (also CCs for trials).NOTE - As of the date
    of publication of this Supplement, the insertion of E.164 numbers in a particular
    Top Level Domain (TLD) (e.g., in .e164.arpa as described in RFC 2916) and the
    designation of an ENUM Tier 0 Registry (presently RIPE-NCC) remained open issues
    within the ITU-T. The approach followed in this Supplement is to refer to the
    domain in which is the ENUM Root Level as ".e164.TLD", and to refer generically
    to the entity that is the Registry at this level.
