abstract:
- language: en
  script: Latn
  content: "With the rapid development of industrial automation and logistics technology
    in accordance with the market demand for high-tech, machine vision technology
    has begun to enable the automation transformation of logistics warehouse systems.
    The application of machine vision technology in the field of logistics warehouse
    has enabled the rapid evolution of goods sorting, goods palletizing and de-palletizing,
    goods handling and shelf inventory from intensive manual work to intelligence
    and automation, improving the operational efficiency and management capabilities
    of logistics warehouse. \r\nRecommendation ITU-T F.747.12 specifies the requirements
    and framework for artificial intelligence based machine vision system in smart
    logistics warehouse, and provides use cases. This Recommendation is intended to
    guide the design and development of machine vision systems in smart logistics
    warehouse.\r\n"
