abstract:
- language: en
  script: Latn
  content: This Recommendation provides an extended multiplexing format based on ITU-T
    Rec. J.123, which is appropriate for audio and video transmission by download-based
    protocol over TCP/IP without any session control protocols between server and
    client, a.k.a. "Progressive Download". Fragmented structure is newly introduced
    into this Recommendation. In the fragment structure, media data is divided into
    media fragments, and a movie header is also divided into movie fragment headers
    according to the fragmented media data. Each movie fragment header corresponds
    to each media fragment, and these elements constitute a movie fragment. By adapting
    the fragment structure to long duration content, a huge header, which causes initial
    delay of the progressive streaming, can be avoided. In addition, formatted text
    information is stored in the media data so that these can be interleaved with
    one another in a file. This format also carries metadata, digital rights management
    (DRM) information as well as audio, video and text bitstreams.Examples of use
    of this Recommendation are given in Appendices I, II and III.
