abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T E.102 applies to disaster relief systems, network
    resilience and recovery. This Recommendation provides definitions of terms relevant
    to disaster relief systems, network resilience and recovery, including terms relevant
    to network architecture, functional elements and interfaces, application level
    aspects and power supply. Appendix I contains excerpts of the terminology defined
    by the United Nations International Strategy for Disaster Reduction (UNISDR).
    Appendix II shows the category classification of terms defined in this Recommendation.
