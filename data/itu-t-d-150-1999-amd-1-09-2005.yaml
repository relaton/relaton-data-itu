abstract:
- language: en
  script: Latn
  content: This Recommendation sets out various procedures for remuneration destination
    and transit Administrations for international telephone communications.In this
    amendment, an optional transit share arrangement is proposed. There is now a possibility
    that the Administration of the country of origin pays (all) the transit share(s)
    for its outgoing traffic.
