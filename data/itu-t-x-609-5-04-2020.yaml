abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.609.5 specifies an overlay management protocol (OMP)that
    runs on the interface among entities of managed peer-to-peer (P2P) communications.
    The management functionalities covered in this Recommendation include overlay
    network management including creation, modification, and termination and peer
    management including membership control and information maintenance. The protocol
    is applicable to various services such as multimedia streaming service and content
    distribution service over managed P2P communications. This Recommendation provides
    protocol operations and message formats.
