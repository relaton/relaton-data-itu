abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the ITU Object Definition Language (ITU-ODL).
    ITU-ODL is used for the specification of systems from the perspective of the Open
    Distributed Processing (ODP) computational viewpoint [3]. It defines templates
    for operational interfaces, stream interfaces, multiple-interface objects, and
    object groups. ITU-ODL is an extension of the ODP Interface Definition Language
    (ODP-IDL, [8]) with additions to support the specification of ODP computational
    viewpoint concepts on a syntactic level. ITU-ODL is a superset of ODP-IDL. This
    relationship between ITU-ODL and ODP-IDL supports the construction of systems
    via OMG specified Object Request Broker (ORB) implementations [1]. The readers
    of this Recommendation are expected to be familiar with ODP-IDL.
