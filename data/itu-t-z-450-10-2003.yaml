abstract:
- language: en
  script: Latn
  content: 'This Recommendation provides guidelines on the quality aspects of protocol-related
    ITU-T Recommendations with the objective of:1) improving the quality of protocol-related
    Recommendations; and2) helping to improve the interoperability of products based
    on these Recommendations.In order to encourage the widest possible use of ITU-T
    protocol-related Recommendations, it is important that these Recommendations are
    of the highest possible quality. Several aspects of Quality that play an important
    role for the users of these ITU-T Recommendations have been selected for this
    purpose. These are: readability, completeness, correctness, consistency, unambiguity,
    implementability and testability.Annex A contains a quality checklist to identify
    the level of compliance of a Recommendation with the quality aspects.'
