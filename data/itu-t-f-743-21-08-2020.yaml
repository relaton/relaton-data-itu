abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.743.21 defines a data asset management framework
    with its corresponding objects, activities and supports. Objects of data asset
    management are data assets, which include master data, metadata, and other data
    assets. Activities include data standards management, data model management, data
    quality management, data security management, data valuation management, and data
    sharing management. To ensure the proper level of management, the corresponding
    people in charge, rules and regulations, and technology tools are needed.
