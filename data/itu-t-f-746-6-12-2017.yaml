abstract:
- language: en
  script: Latn
  content: This Recommendation describes the requirements for a flexible name resolution
    service in information-centric networks (ICN). It also describes the functional
    modules, i.e., name resolution service access control module, namespace management
    module, interoperation module and resolution engine module, of name resolution
    service in ICN. The name resolution service can support name resolution for any
    particular ICN instance independently. It also can facilitate interoperation between
    ICN instances with their own namespaces.
