abstract:
- language: en
  script: Latn
  content: The concept of "intelligent buildings" has been around for a number of
    years and has relied on the ability of individual systems within the buildings
    to communicate, to integrate and to perform in a manner allowing for numerous,
    complex, controls to generate a much-enhanced response to many kinds of stimuli.
    Thus, the argument of intelligence can reasonably be associated with the ability
    of these buildings to function in an enhanced manner yielding many benefits for
    the occupants, the operators and the owners. This Supplement provides a number
    of examples of "intelligent buildings", while describing the benefits and efficiencies
    generated by such integration.
