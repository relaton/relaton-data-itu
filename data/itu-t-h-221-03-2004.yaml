abstract:
- language: en
  script: Latn
  content: "The purpose of this Recommendation is to define a frame structure for
    audiovisual teleservices in single or multiple B or H0 channels or a single H11
    or H12 channel which makes the best use of the characteristics and properties
    of the audio and video encoding algorithms, of the transmission frame structure
    and of the existing Recommendations. It offers several advantages:\r\n–\tIt takes
    into account Recommendations such as G.704, X.30/I.461, etc. It may allow the
    use of existing hardware or software.\r\n–\tIt is simple, economic and flexible.
    It may be implemented on a simple microprocessor using well-known hardware principles.\r\n–\tIt
    is a synchronous procedure. The exact time of a configuration change is the same
    in the transmitter and the receiver. Configurations can be changed at 20 ms intervals.\r\n–\tIt
    needs no return link for audiovisual signal transmission, since a configuration
    is signalled by repeatedly transmitted codewords.\r\n–\tIt is very secure in case
    of transmission errors, since the code controlling the multiplex is protected
    by a double-error correcting code.\r\n–\tIt allows the synchronization of multiple
    64 kbit/s or 384 kbit/s connections and the control of the multiplexing of audio,
    video, data and other signals within the synchronized multiconnection structure
    in the case of multimedia services such as videoconference.\r\n–\tIt can be used
    to derive octet synchronization in networks where this is not provided by other
    means.\r\n–\tIt can be used in multipoint configurations, where no dialogue is
    needed to negotiate the use of a data channel.\r\n–\tIt provides a variety of
    data bit rates (from 300 bit/s up to almost 2 Mbit/s) to the user.\r\nThis revised
    version of H.221 introduces a number of enhancements and clarifications to the
    previous version, primarily the description on the usage of G.722.1, H.264, and
    ISO/IEC 14496-3 in H.320 systems.\r\n"
