abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.751.26 specifies framework and requirements for
    distributed ledger technology (DLT)-based energy storage sharing (ESS) which aims
    at optimizing electricity demand management, improving renewable energy integration
    and increasing grid flexibility while ensuring trust and accountability. It includes
    the stakeholders, the framework and the functional requirements of DLT-based ESS.
    The business process of DLT-based ESS is also provided in the appendix. \r\nThis
    Recommendation can be used as guidance for the development and application of
    the DLT-based ESS for smart grid.\r\n"
