abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1385 provides security threats, security requirements,
    and implementation guidelines for telecommunications in an urban air mobility
    (UAM) environment. UAM or advanced air mobility (AAM) is an air transportation
    system for on-demand passenger transport or cargo-carrying services, typically
    flown within or to/from urban areas. This new type of transportation system is
    expected to resolve various problems including the utmost traffic jams, environmental
    pollution and a dense population in a big city. To provide air mobility service
    with safe and exact aviation in an urban area, various communication systems should
    be used. Thus, those communication systems make it highly probable that some communication
    channels can be targets of an attacker to access connected aerial vehicle's internal
    systems and might cause heavy casualties.\r\nThis Recommendation may be utilized
    by UAM/AAM manufacturers and related industries for commercial implementation
    as telecommunication security requirements and guidelines only after approval
    by national and/or international aviation authorities.\r\n"
