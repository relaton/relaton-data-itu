abstract:
- language: en
  script: Latn
  content: This Recommendation provides procedures for fault detection and localization
    with and without in-service monitoring for PDH paths, sections, and transmission
    systems and for SDH paths and multiplex sections. Filtering and thresholding of
    performance information are described for reporting to the TMN. Returning into
    service and long-term trend analysis are considered.SDH systems designed according
    to Recommendation G.826 (i.e. prior to the approval of Recommendation G.828) are
    not required to support the BBE and SEP event counters.Maintenance of systems
    designed to Recommendation G.826 should use the limits given in Recommendation
    M.2101.1.
