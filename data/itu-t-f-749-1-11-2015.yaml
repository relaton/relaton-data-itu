abstract:
- language: en
  script: Latn
  content: "Vehicle gateway (VG) is a device in a vehicle that enables communications
    between a device in the vehicle and another device which may be physically located
    either inside the vehicle or outside the vehicle.\r\n\r\nThis Recommendation describes
    functional requirements for vehicle gateway, including transport functional requirements,
    networking functional requirements, network access functional requirements, communication-with-in-vehicle
    devices functional requirements, and network access management & security functional
    requirements. It also describes the network protocols and communications interfaces
    to support the seamless wired and wireless connectivity in the heterogeneous access
    network environments. \r\n\r\nThis Recommendation specifies functional requirements
    for VG supporting a variety of existing and new access technologies. VG is to
    a large extent independent from specific communication technologies and specific
    ITS applications. The VG architecture is intended to be an open architecture,
    which is easy for a manufacturer to implement, test, and select an appropriate
    communications type according to its own requirements and network conditions. "
