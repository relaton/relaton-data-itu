abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.743.8 specifies the requirements for a cloud computing
    platform supporting visual surveillance. Cloud computing is an emerging technology
    aimed at providing various computing services over the Internet. Using virtualization
    technology, a cloud computing platform realizes a ubiquitous and flexible shared
    resources pool that can be rapidly provisioned and released with minimal management
    effort or service-provider interaction based on the needs of users. By using the
    cloud computing technology, the visual surveillance system can conveniently manage
    various functional components and services, such as video distribution, video
    transcoding and intelligent video processing. This Recommendation provides the
    application scenarios and requirements for a cloud computing platform supporting
    a visual surveillance system.
