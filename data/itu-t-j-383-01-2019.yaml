abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.383 describes the conversion schemes of the data
    structures defined in Recommendation ITU‑R BO.2098-0 for cable television systems
    on the basis of Recommendation ITU-T J.382.\r\n\r\nRecommendation ITU-R BO.2098-0
    specifies two data structures, MPEG-2 TS and TLV. MPEG-2 TS data packets are directly
    transmitted while any transmission control signals and service information are
    transmitted using a descriptor specified in ETSI TS 102 991. TLV packets are not
    directly transmitted in a TLV format but converted to the GSE 6 packet format
    specified in Recommendation ITU-T J.382.\r\n\r\nThe emergency warning system control
    signal specified in Recommendation ITU-R BO.2098-0 is also converted into physical
    layer signalling specified in Recommendation ITU-T J.382, to wake up the receiver
    when the emergency warning system is activated.\r\n"
