abstract:
- language: en
  script: Latn
  content: This Recommendation is mainly concerned with electro-acoustical measurements
    required for supplying sensitivity/frequency characteristics suitable for use
    in calculating loudness ratings, or estimating other subjectivity-determined quantities.
    For this purpose, measurements under real conditions must form the basis. Artificial
    mouths and artificial ears must be used with due regard to obtaining good agreement
    between these measurements and those from real mouth and ear determinations. Measurements
    under real conditions are complicated, time-consuming and not reproducible with
    great precision, especially when carbon microphones are involved.This Recommendation
    describes measurement methods using recommended forms of artificial mouths and
    artificial ears (see Recommendations P.51 and P.57).This Recommendation applies
    mainly to Local Telephone Systems (LTSs) with handset telephones; however the
    principles also apply to other types of telephones.Annexes D and E define handset
    positions to be used with HATS according to P.58 and P.57 type 3.2, 3.3 and 3.4
    artificial ears. Annex F describes correspondence between measurements using the
    LRGP and the HATS position.
