abstract:
- language: en
  script: Latn
  content: Encoding of SDL data enables communication of data values between pieces
    of SDL in an implementation independent way.Data values can be encoded in a text
    format defined by this Recommendation. Alternatively, when the data is defined
    in ASN.1, sets of standardized ASN.1 encoding rules can be invoked. The results
    of encoding can be used internally in the SDL model or to communicate between
    SDL models or between SDL and other non-SDL elements such as test environments.
