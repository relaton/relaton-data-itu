abstract:
- language: en
  script: Latn
  content: "Currently, due to the boom in over-the-top (OTT) services in the information
    communication technology (ICT) domain, operators need to explore innovative ways
    to cooperate with third party service providers and especially with information
    technology (IT) service providers in order to avoid the traffic growth associated
    with such services without the commensurate income increases. Open capabilities
    of telecommunication services can bridge the operators' telecommunication services
    capabilities and the third party service providers' customized service requirements,
    thus becoming a win-win cooperation paradigm.\r\n\r\nAs the core asset for operators,
    capabilities of telecommunication services should be opened in a secure way and
    be fully protected, as both operators' business security and users' information
    security are implicated. Without a comprehensive security mechanism, an unsecure/spiteful
    application/service from a third party service provider using the capabilities
    of telecommunication services may harm the operators' transmission network, business
    system and even users' personally identifiable information (PII). Consequently,
    in order to offer secure telecommunication service capabilities to cooperative
    service providers, the security requirements for open capabilities of telecommunication
    services need to be analysed exhaustively and an overall security framework needs
    to be established.\r\n\r\nRecommendation ITU-T X.1145 focuses on an analysis of
    the security requirements of open capabilities of telecommunication services and
    provides a security framework.\r\n"
