abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T T.809 | ISO/IEC 15444-10 is a work item subdivision
    of ISO/IEC 15444 that provides extensions of Recommendation ITU-T T.800 | ISO/IEC
    15444-1 and Recommendation ITU-T T.801 | ISO/IEC 15444-2 for logically cuboidal
    data sets. In particular, it respects all existing capabilities and syntax of
    Recommendation ITU-T T.800 | ISO/IEC 15444-1 and part of the existing capabilities
    of Recommendation ITU-T T.801 | ISO/IEC 15444-2 for multi-component images, while
    providing alternatives and extensions to some of those capabilities. Within these
    constraints, it provides an isotropic specification for three-dimensional data
    sets, i.e., the project provides identical processing capabilities in all three
    dimensions even though Recommendation ITU-T T.800 | ISO/IEC 15444-1 and Recommendation
    ITU-T T.801 | ISO/IEC 15444-2 codestream syntax differentiates between the two
    spatial axes and the cross-component axis. The context models currently used in
    this Recommendation | International Standard are as in Recommendation ITU-T T.800
    | ISO/IEC 15444-1 and Recommendation ITU-T T.801 | ISO/IEC 15444-2. Improved context
    models will be introduced through an amendment.\r\n\r\nCorrigendum 1 (05/2011,
    integrated in this new edition) corrects a number of minor mistakes that were
    present in various formulae of Annex B. It also provides a more formal and unambiguous
    description on the mandatory use of the CAP marker segment in the codestream,
    in order to enhance interoperability with the other parts of the JPEG 2000 standard.
    Furthermore, it introduces a new annex on how quantization should be handled for
    JP3D images."
