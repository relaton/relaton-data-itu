abstract:
- language: en
  script: Latn
  content: This Recommendation describes the core services and protocol for performing
    configuration and control of a remote device during a multimedia conference. A
    number of standard devices are defined allowing a node to model a peripheral device
    such as for example a camera, microphone, VCR or slide projector. This Recommendation
    also allows the modelling of non-standard devices. This model is presented to
    the other nodes in the conference to allow these nodes to perform remote control.
    This Recommendation does not specify the use of a particular transport protocol.Recommendation
    T.136 describes its application using T.120 as the transport protocol.Recommendation
    H.283 describes its application using the RDC logical channel transport established
    using H.245.Future Recommendations may describe its application using other protocols.
