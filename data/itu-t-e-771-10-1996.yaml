abstract:
- language: en
  script: Latn
  content: This Recommendation proposes network Grade of Service (GOS) parameters
    for current and evolving land mobile services. These parameters are defined, and
    their target values specified, assuming that the network and the network components
    are operating in their normal mode (i.e. are fully operational). Further, the
    parameters and their target values assume normal (as opposed to distress or emergency)
    traffic.
