abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.1203.3 specifies the quality integration module
    for Recommendation ITU-T P.1203. The ITU-T P.1203 series of ITU-T Recommendations
    specify modules for monitoring the audio, video and audiovisual quality of video
    services such as adaptive bitrate video streaming. The respective ITU-T work item
    has formerly been referred to as P.NATS (parametric non-intrusive assessment of
    TCP-based multimedia streaming quality). The ITU-T P.1203.3 part of Recommendation
    ITU-T P.1203 can be applied to the monitoring of performance and quality of experience
    (QoE) of video services such as adaptive bitrate video streaming.\r\nThis Recommendation
    includes an electronic attachment containing the full 20 trees described in clause
    8.4. \r\n"
