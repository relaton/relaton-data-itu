abstract:
- language: en
  script: Latn
  content: Alongside the wide deployment of home network services and the increasing
    development of a variety of technologies for telecommunication, contents provision,
    remote control, etc., concerns over the security of the home network are increasing.
    As a basic security function for protecting the home network, authorization ensures
    that only an authorized entity (including user, device) can access the home network
    resources. Recommendation ITU-T X.1114 describes the security threats and authorization
    requirements for the home network, identifies the authorization entities and methods,
    and develops authorization models and authorization modes for guaranteeing the
    security of the home network.
