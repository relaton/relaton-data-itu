abstract:
- language: en
  script: Latn
  content: 'This Supplement analyses the major aspects of smart sustainable cities
    and eco-cities from: (i) the perspective of academics, (ii) the business initiative
    approach, and (iii) the international organization collaborations with the final
    aim of establishing a concrete definition for smart sustainable cities which can
    be used worldwide. This would also provide a basis for understanding the most
    common features of smart sustainable cities. '
