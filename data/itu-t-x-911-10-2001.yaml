abstract:
- language: en
  script: Latn
  content: "This Recommendation | International Standard provides:\r\na) a language
    (the enterprise language) comprising concepts, structures, and rules for developing,
    representing, and reasoning about a specification of an Open Distributed Processing
    (ODP) system from the enterprise viewpoint (as defined in ITU-T Rec. X.903 | ISO/IEC
    10746-3);\r\nb) rules which establish correspondences between the enterprise language
    and the other viewpoint languages (defined in ITU-T Rec. X.903 | ISO/IEC 10746-3)
    to ensure the overall consistency of a specification."
