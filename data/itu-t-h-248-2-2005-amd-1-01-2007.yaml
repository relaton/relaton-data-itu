abstract:
- language: en
  script: Latn
  content: "This Recommendation defines packages that extend the applicability of
    the H.248.1 Gateway Control Protocol Recommendation. Specifically, this Recommendation
    describes packages for fax, text telephone, call type discrimination, and data
    call detection for use with the H.248.1 Gateway Control Protocol. As defined in
    ITU-T Rec. H.248.1, a \"package\" is an extension to H.248.1 that supports specific
    behaviour.The packages are intended for control over gateway functions for transport
    of facsimile or text conversation between different network environments. Extensions
    can be made for other kinds of data transport.\r• The Call Type Discrimination
    package defines control and monitoring of a line for the signalling protocols
    used in the beginning of a session of data transmission for fax, text telephony
    or data. This package has been revised to enable the MG to autonomously determine
    the call type to be supported.\r• The Text Telephone package defines control of
    a text telephone session in any of the modes supported by the automoding text
    telephone Recommendation, ITU-T Rec. V.18. \r• The Fax package defines control
    of a fax transmission.\r• The Fax/Textphone/Modem Tones Detection package defines
    control over a termination for detection of any signals from a fax, text telephone
    or data modem during a connection in voice mode.\r• The Text Conversation package
    defines control over a real-time interactive text conversation session using a
    universal presentation format and transferred with a transport method from a multimedia
    protocol in any network environment.\r• The IP Fax package defines control over
    facsimile transmission in a packet network.All the packages have been editorially
    modified to align with the H.248.1 Packages Template.Amendment 1 provides an enhancement
    to the types of call that may be discriminated through in-band signalling. It
    groups existing call types into like types. It provides an explanation of when
    those types are used. Several new call types are added to the Discriminated Call
    Type event. The Call discrimination flows have been corrected with the correct
    events.NOTE ? This Recommendation has been renumbered. It was previously known
    as ITU-T Rec. H.248, Annex F."
