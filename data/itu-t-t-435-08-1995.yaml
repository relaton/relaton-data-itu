abstract:
- language: en
  script: Latn
  content: This Recommendation defines the abstract services for document remote access,
    presentation, editing, and transfer. It contains two new application service elements
    for interactive confirmed document manipulation, aligned with, and provided for,
    the integrated use with applications defined under the Distributed Office Application
    Model (DOAM). The two application service elements are the DTAM-TM and DTAM-TK.DTAM-DM
    provides the facilities to allow all type of remote document manipulation of full
    documents and document fragments. It is especially designed to be combined with
    the ODA Abstract Interface for Document manipulation (Recommendation T.413). If
    document storage and access is requested, provision is made in DTAM-DM that full
    use of the document filing and retrieval functions defined in ISO/IEC 10166 (DFR)
    can be made within the DTAM based association. DTAM-TK provides an application
    token function so that two or more users can communicate in conferences.
