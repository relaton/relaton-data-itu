abstract:
- language: en
  script: Latn
  content: In order to support the development of IP-related standards, this Recommendation
    identifies a framework to position the telecommunications aspects with respect
    to IP networks. This framework serves to identify and assist understanding the
    IP network issues, from the telecommunications point of view, with respect to
    the provision of seamless services to the user between IP networks and telecommunications
    networks in a convergence context.This Recommendation outlines a number of general
    architectures involving a mix of Telecommunication Network and Internet Protocol
    (IP) Network technologies. In this Recommendation, IP, the Internet Protocol,
    is considered in its role as a protocol purely associated with transporting connectionless
    packets.
