abstract:
- language: en
  script: Latn
  content: "This document describes a methodology for assessing the energy consumption
    of an ICT service. This assessment is based upon the traffic generated by the
    service and the equipment through which that traffic propagates.\r\n\r\nMethods
    for assessing the power consumption/efficiency of ICT networks have been studied
    since some time. In many cases the assessment is focused on equipment and networks
    rather than on the services that are conveyed by that equipment. Examples include
    ECR and TEER. In addition to methods dealing primarily with power consumption,
    The Recommendation ITU-T L.1410 provides a methodology for evaluating the environmental
    impact of ICT equipment, networks and services objectively and transparently,
    and is based upon the life cycle assessment (LCA) methodology. The Recommendation
    ITU-T L.1410 gives general principles for service level assessments and allocation
    of network power consumption between services  \r\n\r\nThis Supplement proposes
    a more detailed methodology for an assessment of the power consumption of a specific
    ICT service that is sharing infrastructure with other services. This enables companies
    to allocate power consumption of all segments of the network (i.e. the allocation
    can be made in the CPE, access, metro and core networks) to specific services
    based on throughput.\r\n\r\nThis document provides an overview of the method and
    a “step-by-step” description of the process. "
