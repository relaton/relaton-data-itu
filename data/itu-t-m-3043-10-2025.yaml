abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3043 provides the framework of intent driven management
    in telecommunication network and services operation and management, including
    the function requirements and workflows. It also describes its relationship with
    artificial intelligence enhanced telecommunication operation and management (AITOM).
    This Recommendation aims to support autonomous operation and management in a way
    of intent driven close-loop mechanism for improving customer experience, operation
    efficiency, service quality assurance and other applications.\r\n"
