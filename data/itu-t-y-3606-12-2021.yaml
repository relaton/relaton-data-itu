abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3606 specifies a mechanism for deep packet inspection
    (DPI) applied to big data in the network context. The scope of Recommendation
    ITU-T Y.3606 includes: an introduction to the differences between generic DPI
    and big data DPI; an overview of big data processing procedures; the relationship
    between DPI and big data-related technologies; a data classification mechanism
    using DPI for big data in networks; a data pre-processing mechanism using DPI
    for big data in networks; a coordination processing mechanism for DPI in the context
    of big data in networks; and the interfaces between DPI and upper-layer big data-related
    methods. \r\n"
