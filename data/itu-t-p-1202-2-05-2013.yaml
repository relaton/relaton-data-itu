abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T P.1202.2 specifies the algorithmic model for the
    higher resolution (HR) application area of ITU-T P.1202. The ITU-T P.1202 series
    of Recommendations specifies models for monitoring the video quality of IP-based
    video services based on packet-header and bitstream information. The higher resolution
    application area of Rec. ITU-T P.1202.2 part of ITU-T P.1202 series of Recommendations
    can be applied to the monitoring of performance and quality of experience (QoE)
    of video services such as Internet Protocol Television (IPTV), and has two modes:
    Mode 1, where the video bitstream are parsed and not decoded into pixels, and
    mode 2, where the video bitstream are fully decoded into pixels for analyzing.'
