abstract:
- language: en
  script: Latn
  content: This Recommendation covers the technical requirements for the systems and
    terminals of broadband audiovisual communication services defined in H.200/AV.100-series
    Recommendations. Both H.310 unidirectional and bidirectional broadband audiovisual
    terminals are defined. The classification of H.310 terminals into different terminal
    types is based on a set of audiovisual, network adaptation, and signalling capabilities.
    With these capabilities, H.310 terminals support a wide range of conversational
    and distributive applications and services. This revision enhances the interworking
    between different type of H.310 terminals.
