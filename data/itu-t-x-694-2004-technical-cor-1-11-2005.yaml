abstract:
- language: en
  script: Latn
  content: This technical corrigendum corrects three defects found in the ASN.1 module
    defined in Annex A. It renames two ASN.1 types in order to avoid their possible
    confusion with an ASN.1 reserved word. It adds a version arc to the OID of that
    ASN.1 module to facilitate the handling of other versions of the specification.
    It also corrects errors in the application of XER encoding instructions in the
    ASN.1 module specified in ITU-T Rec. X.694 | ISO/IEC 8825-5. This technical corrigendum
    does not change the "bits-on-the-line".
