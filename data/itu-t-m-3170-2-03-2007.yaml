abstract:
- language: en
  script: Latn
  content: The multi-technology network management (MTNM) solution suite realizes
    a TMN interface between the NML and EML according to ITU-T Recommendation M.3010
    for the FCAPS management of multi-technology fixed transport, access and aggregation
    networks.This Recommendation explains the structure of the MTNM information agreement
    (TMF608) and relates its components to the M.3020 methodology for TMN interface
    specification. It wraps TMF608 and associated supporting documents by referencing
    them normatively and relating them to identified Recommendations on TMN functionality
    (FCAPS-based) and TMN interface specification methodology but not to Recommendations
    on TMN interface analysis models. This Recommendation can also be used as a first
    lead-in to the MTNM information agreement.
