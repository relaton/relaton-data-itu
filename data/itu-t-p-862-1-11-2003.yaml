abstract:
- language: en
  script: Latn
  content: ITU-T Rec. P.862 provides raw scores in the range -0.5 to 4.5. It is desired
    to provide a MOS-LQO (P.800.1) score from P.862 to allow a linear comparison with
    MOS. This Recommendation presents the mapping function and its performance for
    a single mapping from raw P.862 scores to the MOS-LQO (P.800.1).This will allow
    MOS-LQO scores from ITU-T Rec. P.862 to be comparable independent of the implementation
    of ITU-T Rec. P.862. The given function for transformation presented in this Recommendation
    has been optimized on a large corpus of subjective data representing different
    applications and languages.
