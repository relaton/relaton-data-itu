  content: This Supplement describes the additions required to support Service Provider
    Portability in a Signalling System Number No. 7 network for Number Portability
    Capability Set 1 (NPCS-1).The Portability Number Call Control for Service Provider
    Portability (PNCC-SPP) in a Signalling System Number No. 7 network provides the
    core function to support portability for geographic numbers using the "onward
    routing" and "all call query" methods.
