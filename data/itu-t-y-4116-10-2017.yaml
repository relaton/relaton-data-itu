abstract:
- language: en
  script: Latn
  content: "Accidents and disasters caused by the transportation means affect much
    lives and properties. The transportation safety can be influenced by the fault
    of transportation means (i.e., cars, trains, ships, etc.), environmental status
    (i.e., wind, snow, freezing status, etc.), abnormal status of transportation infrastructure
    (i.e., bridge, tunnel, road, etc.) and some other human errors. The transportation
    safety services based on the IoT technologies can reduce the occurrence of accidents
    and disasters and save the lives and loss of properties in case of disaster.\r\n\r\nThis
    Recommendation describes requirements for providing transportation safety services.
    The use cases and related service scenarios which are used to extract requirements
    for various IoT services and applications are also described in this Recommendation.
    \r\n"
