abstract:
- language: en
  script: Latn
  content: As network service providers seek to take advantage of the scale, flexible
    deployment and cost reductions first realized in cloud computing, they have begun
    to define new architectures for their infrastructure in order to realize network
    function virtualization (NFV). At the same time, measurement functions will be
    implemented for deployment as virtual functions. Recommendation ITU-T Y.1550 makes
    recommendations in key areas such as on-demand deployment and accuracy considerations.
    Development of virtualized measurement systems in areas highly relevant to SG
    12 work are in the early stages, so this Recommendation is timely.
