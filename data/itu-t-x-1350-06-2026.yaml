abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1350 identifies potential security threats that
    can occur in the intelligence dimension of industrial Internet of things (IIoT)
    based smart manufacturing specified in Recommendation ITU-T Y.4003 and specifies
    corresponding security requirements. Specifically, in this Recommendation, potential
    security threats that can occur at each layer of the intelligence dimension of
    IIoT-based smart manufacturing are identified. The security requirements to respond
    to the identified security threats are specified for securing the intelligence
    dimension of IIoT-based smart manufacturing.\r\n"
