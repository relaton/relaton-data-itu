abstract:
- language: en
  script: Latn
  content: This Recommendation defines the rules applicable to the international interworking
    between videotex services. Two classes of interworking are specified:- interworking
    between gateways (see Recommendations T.504, T.523, T.541 and T.564);- interworking
    between a terminal and a host (X.29 based protocols).Moreover the different Data
    Syntaxes are defined in the following annexes:- Interworking Data Syntax (Annex
    A);- Data Syntax I (CAPTAIN) (Annex B);- Data Syntax II (former CEPT data syntax)
    (Annex C);- Data Syntax III (NAPLPS) (Annex D).In addition, common extensions
    to the various data syntaxes are defined:- Audio Data Syntax (Annex E);- Photographic
    Data Syntax (Annex F),as well as the ISO 9281 based switching mechanism between
    all syntaxes.- Annex A - Interworking Data Syntax (IDS);- Annex B - Data Syntax
    I (CAPTAIN);- Annex C - Data Syntax II (former CEPT data syntax);- Annex D - Data
    Syntax III (NAPLPS);- Annex E - Audio Data Syntax;- Annex F - Photographic Data
    Syntax.
