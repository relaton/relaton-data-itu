abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.508 | ISO/IEC 9594-12 is intended to fill the gap
    between Recommendation ITU-T X.509 | ISO/IEC 9594-8 and Recommendation ITU-T X.510
    | ISO/IEC 9594-11 by giving a description of selected cryptographic algorithms
    with references to more detailed specifications. To establish the theory behind
    the cryptographic algorithm, an informative annex gives in introduction to the
    supporting mathematics. Also, some considerations on migration to post quantum
    algorithm are included.\r\nSection 3 provides a best practice guideline for establishing
    and maintaining a public-key infrastructure (PKI) with emphasis on environments
    outside the traditional PKI environments, such as guidance for establishing a
    PKI for networks of Internet of things (IoT) and smart grid.\r\n"
