abstract:
- language: en
  script: Latn
  content: "This Recommendation | International Standard:\r\na)establishes guidelines
    and general principles for initiating, implementing, maintaining and improving
    information security controls in telecommunications organizations based on ISO/IEC
    27002;\r\nb)provides an implementation baseline of information security controls
    within telecommunications organizations to ensure the confidentiality, integrity
    and availability of telecommunications facilities, services and information handled,
    processed or stored by the facilities and services.\r\nAs a result of implementing
    this Recommendation | International Standard, telecommunications organizations,
    both within and between jurisdictions, will:\r\na)be able to ensure the confidentiality,
    integrity and availability of global telecommunications facilities, services and
    the information handled, processed or stored within global facilities and services;\r\nb)have
    adopted secure collaborative processes and controls ensuring the lowering of risks
    in the delivery of telecommunications services;\r\nc)be able to deliver information
    security in an effective and efficient manner;\r\nd)have adopted a consistent
    holistic approach to information security;\r\ne)be able to improve the security
    culture of organizations, raise staff awareness and increase public trust.\r\n"
