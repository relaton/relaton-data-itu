  content: Supplement 66 to ITU-T G-series Recommendations enumerates the various
    requirements arising from 5G wireless systems, concentrating on the fronthaul
    portion of the network and considers how they compare with current and future
    optical access transport systems. Practical passive optical network (PON) solutions
    to serve the 5G fronthaul application are hypothesized.
