abstract:
- language: en
  script: Latn
  content: Supplement 61 to ITU-T Q-series Recommendations provides guidance on how
    existing signalling protocol extensions can be used to designate the admission
    control priority classifications for incoming calls/sessions into next generation
    networks. Specifically, this supplement defines the relationship between the designated
    values of these protocol extensions and the admission control priority levels/categories
    defined in Recommendation ITU-T Y.2171.
