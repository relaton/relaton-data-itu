abstract:
- language: en
  script: Latn
  content: Recommendation E.164 describes the international public telecommunication
    numbering plan. Recommendation E.190 describes the general principles to be utilized
    in the assignment of ITU-T E-Series international numbering resources. This Recommendation
    describes the procedures and criteria for the reservation, assignment, and reclamation
    of E.164 country codes and associated Identification Code (IC) assignments. The
    criteria and procedures are provided as a basis for the effective and efficient
    utilization of the available E.164 numbering resources. Such assignments require
    a collaborative effort between the ITU-TSB and the appropriate ITU-T Study Group
    to endeavour to ensure that the assignments meet the needs of the telecommunication
    community. The development of these criteria and procedures are in accordance
    with the principles contained in Recommendation E.190 and the numbering plan formats
    detailed in Recommendation E.164.
