abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T L.1007 considers the creation of specific test suites
    to assess certain functional aspects of the: energy efficiency, interworking,
    safety and electromagnetic compatibility (EMC) of the universal power adapter
    (UPA) solution designed for information and communication technology (ICT) devices
    for portable use. Such testing is required to guarantee a minimum quality level
    of the UPA in conformance with the target basic configuration of the UPA described
    in Recommendation ITU-T L.1002.\r\n"
