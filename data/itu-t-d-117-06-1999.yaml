abstract:
- language: en
  script: Latn
  content: This Recommendation sets out the general principles for charging and international
    accounting to be applied by recognized operating agencies (ROAs) for the provision
    of the International Premium Rate Service which is described in Recommendation
    E.155.Although this Recommendation covers premium rate services provided using
    the international telephone service (Recommendation E.105), it does not preclude
    the same principles being applied or adapted in the future for services based
    on other transport mechanisms, networks or systems.
