  content: This ITU-T Recommendation defines a protocol for inverse multiplexing of
    an ATM cell stream over multiple physical links, and to retrieve the original
    stream at the far-end from these links. Multiplexing of the ATM cell stream is
    performed on a cell-by-cell basis across the multiple links.
