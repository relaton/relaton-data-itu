abstract:
- language: en
  script: Latn
  content: The new Appendix VIII provides an overview of the RF EMF exposure levels
    in the vicinity of the manhole type base stations. Such base stations are for
    small cells of 4G and 5G network installed in the ground, and have been developed
    to secure the communication area mainly in places where there are no suitable
    places for installation of antennas such as tourist spots and scenic spots.
