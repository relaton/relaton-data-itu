abstract:
- language: en
  script: Latn
  content: "Exclusion zones are described by the compliance boundaries around radio
    base stations and transmitting stations in which the electromagnetic fields may
    exceed the radio frequency electromagnetic field (RF-EMF) exposure limits. The
    general public shall not have access to those areas. Exclusion zones are also
    defined for occupational exposure. Those areas are generally positioned on rooftops
    in urban or suburban locations. Their shape and dimensions may differ depending
    on the regulations.\r\nRecommendation ITU-T K.153 includes information on how
    the exclusion zones should be determined based on the data concerning operating
    frequencies and equivalent isotropically radiated power (EIRP) on each of the
    operating frequencies. It also includes information on cases in which there are
    no exclusion zones. For example, on masts, especially in rural areas, there is
    no need for any materialization as the general public does not have access to
    this zone and access for workers is also limited and usually exists only in the
    front of the transmitting antennas. Furthermore, some other transmitters do not
    need any compliance boundary as the installed power level is so low that they
    are compliant even when touching the transmitter.\r\n"
