- language: en
  script: Latn
  content: Recommendation ITU-T X.1149 describes an open platform architecture for
    financial technology (FinTech) services. It also specifies threats and vulnerabilities
    of open platform, open application programming interface (API) usage procedure
    for FinTech services, and detailed security requirements to open platform of FinTech
    services from both financial company and FinTech company sides. The appendix to
    this Recommendation includes some use cases of the proposed open platform.
