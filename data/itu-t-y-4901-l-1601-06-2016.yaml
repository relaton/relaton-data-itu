abstract:
- language: en
  script: Latn
  content: "This Recommendation ITU-T L.1601 gives a general guidance to cities and
    provides the definitions of key performance indicators (KPIs) related to the use
    of information and communication technology (ICT) in the context of Smart Sustainable
    Cities (SSCs).\r\n\r\nThis Recommendation is one of series of the Recommendations
    and Supplements which define KPIs. The series of KPI definitions documents also
    include:\r\n\r\n§  Recommendation on overview of key performance indicators (KPIs)
    in smart sustainable cities [ITU-T L.KPIs-SSC-overview].\r\n\r\n§  Recommendation
    on key performance indicators (KPIs) related to the sustainability impacts of
    information and communication technology (ICT) in smart sustainable cities [ITU-T
    L.KPIs-SSC-impact]. This Recommendation lists the KPIs used for ICT impact on
    sustainability.\r\n\r\n§  Supplement on key performance indicators (KPIs) for
    smart sustainable cities [ITU-T L.KPIs-SSC-Supp]. This document provides information
    regarding KPIs and evaluation index systems of smart cities, KPIs of sustainable
    cities, etc.\r\n"
