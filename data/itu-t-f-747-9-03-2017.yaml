abstract:
- language: en
  script: Latn
  content: 'This Recommendation describes requirements, scenarios and functional architecture
    for user-side Energy Management Service (EMS) where energy consumption equipment
    with heterogeneous metering and control capacities coexist. In user-side EMS systems,
    energy consumption data for both single device and device group are needed to
    be collected and these devices can be controlled by coarse-grained (on-off state)
    and fine-grained instructions. Furthermore, such operations are executed manually
    or automatically. The user-side EMS system makes energy-saving decisions based
    on multiple factors, such as the demands and optimization policies from the users,
    the pricing strategies from the suppliers, government subsidies, device status
    et al. '
