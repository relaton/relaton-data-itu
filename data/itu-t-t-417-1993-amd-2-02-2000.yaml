abstract:
- language: en
  script: Latn
  content: This amendment to ITU-T Rec. T.417 | ISO/IEC 8613-7 introduces the optional
    colour/grey-scale resolutions of 12 BMU (100 pels/25.4 mm), 6 BMU (200 pels/25.4
    mm), 4 BMU (300 pels/25.4 mm), 3 BMU (400 pels/25.4 mm), 2 BMU (600 pels/25.4
    mm), 1 BMU (1200 pels/25.4 mm) to the G4 facsimile. This amendment enables the
    G4 colour facsimile terminal to handle the black and white optional resolution
    and colour/grey-scale optional resolutions independently.
