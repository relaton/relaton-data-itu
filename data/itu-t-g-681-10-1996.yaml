abstract:
- language: en
  script: Latn
  content: This Recommendation covers the functional characteristics of interoffice
    and long-haul line systems using optical amplifiers, including optical multiplexing.
    It represents a bridge between reference/physical configurations of SDH interoffice
    systems described in Recommendations G.782, G.783, G.958 and between functional
    transport network architectures described in Recommendations G.803 and G.805.
    Extended or new "functional blocks, functions and sub-functions" of SDH equipment
    (e.g. line termination, optical/electrical/optical regenerator and optical non-regenerative
    repeater) are mapped on "compound functions, atomic functions and processes" of
    transport networks. Optical channel layer, optical multiplex section layer and
    optical amplifier section layer are identified for optical transport systems.
    In addition optical safety considerations, including Automatic Power Shutdown
    (APSD) and Optical Surge Prevention (OSP), and the Optical Supervisory Channel
    (OSC) are topics of this Recommendation.In future Recommendations on "optical
    media-based transport network architectures", there will be standardized "optical
    path layer with optical add and drop multiplexers and optical cross-connects"
    and "optical circuit layer with optical switches" which are not in the scope of
    this Recommendation.
