abstract:
- language: en
  script: Latn
  content: "The purpose of Recommendation ITU-T F.743 is to define a video surveillance
    system based on IP networks. The video surveillance system provides the display
    and storage of the video captured by multiple remote cameras over an IP network
    for multiple users. It also provides other functionalities such as remote control
    and alarming. This Recommendation provides the service description, a brief system
    model, service scenarios and requirements for the video surveillance service.
    The requirements for the video surveillance service are derived from the scenarios
    of different applications that a video surveillance service can support. Therefore,
    the service requirements meet the needs of different kinds of users and enables
    interoperability among video surveillance systems of different telecom operators
    and units of different vendors.\r\n\r\nThis revision updates the title of this
    Recommendation, some technical content descriptions, and video surveillance system
    requirements in clause 8."
