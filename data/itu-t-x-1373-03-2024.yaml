abstract:
- language: en
  script: Latn
  content: "As intelligent transportation system (ITS) technologies improve, it has
    become common for vehicles to communicate with other entities such as other vehicles,
    vehicle-to-vehicle (V2V) and vehicle-to infrastructure (V2I) communications. Electric
    devices inside a vehicle such as electronic control units (ECUs), electronic toll
    collections (ETCs) and car navigation systems are becoming more sophisticated.
    As a result, software modules inside these electric devices need to be appropriately
    updated for the purposes of bug fixing and performance and security improvements,
    to avoid accidents.\r\nIn order to fulfil the above requirements, Recommendation
    ITU-T X.1373 provides secure software update procedures between a software update
    server and vehicles with appropriate security controls including in-vehicle communication
    messages. This Recommendation can be utilized by car manufacturers and ITS-related
    industries as a set of standard capabilities for best practice.\r\n"
