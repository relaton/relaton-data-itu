abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1127 focuses on the functional security requirements
    and functional architecture for smartphone anti-theft mechanisms based on the
    general requirements described by the GSMA.\r\nSmartphones are rapidly proliferating
    and have become a nearly indispensable part of daily life. Unfortunately, many
    smartphone users have had their phones stolen. A smartphone anti-theft measure,
    i.e., a kill switch tool, for use in the event it is lost or stolen, should provide
    the capability to:\r\n–\tremotely delete the authorized user's data that is on
    the smartphone;\r\n–\trender the smartphone inoperable to an unauthorized user;\r\n–\tprevent
    reactivation without the authorized user's permission to the extent technologically
    feasible; and\r\n–\treverse the inoperability if the smartphone is recovered by
    the authorized user, and restore user data on the smartphone to the extent feasible.\r\n"
