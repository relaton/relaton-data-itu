abstract:
- language: en
  script: Latn
  content: This Recommendation describes an international preference scheme for the
    use of public telecommunications by national authorities for emergency and disaster
    relief operations. The International Emergency Preference Scheme for Disaster
    Relief Operations (IEPS) is needed when there is a crisis situation causing an
    increased demand for telecommunications when use of the International Telephone
    Service may be restricted due to damage, reduced capacity, congestion or faults.
    In crisis situations there is a requirement for IEPS users of public telecommunications
    to have preferential treatment.
