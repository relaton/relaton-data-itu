abstract:
- language: en
  script: Latn
  content: This Recommendation describes an approach for the performance description
    of AAL processes. It is motivated by the need, based on field experiences, to
    examine more carefully the performance aspects of some specific applications of
    ATM network technology. The approach presented here provides a unified framework
    for describing the performance of processes that depend upon AAL Type 1 (AAL-1),
    AAL Type 2 (AAL-2), AAL Type 3/4 (AAL-3/4), AAL Type 5 (AAL-5), or potentially
    other types of AAL. For each AAL, parameters that describe loss and delay performance
    are for further study. These parameters are related to relevant ATM cell transfer
    performance parameters from ITU-T I.356.
