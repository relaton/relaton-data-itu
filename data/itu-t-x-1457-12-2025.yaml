abstract:
- language: en
  script: Latn
  content: "The information recommendation service is widely used in different websites
    and applications. For example, an educational information recommendation service
    is an important factor in sharing educational information. In the massive educational
    information, users can quickly find the educational information resources they
    need, meet users' learning needs and bring users a good learning experience. However,
    the security issues involved in information recommendation services cannot be
    ignored, e.g., data integrity threats, data poisoning, evasion attacks, etc.\r\nRecommendation
    ITU-T X.1457 provides an analysis of security threats and requirements for information
    recommendation services. It identifies security threats involved in information
    recommendation services and specifies security requirements that address these
    security threats.\r\n"
