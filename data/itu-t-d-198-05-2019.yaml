abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T D.198 recognizes the right of any operator to present
    price/tariffs/rates charged for telecommunication services in any form deemed
    convenient for the operator. It recommends that telecommunication companies offering
    international connections/exchange of traffic make use, as far as possible, of
    the same templates/forms/format of data to represent traffic destinations and
    offered price/tariffs/rates including if required optional clarifying information
    or quality of service criteria.
