abstract:
- language: en
  script: Latn
  content: This technical corrigendum to ITU-T Rec. X.681 | ISO/IEC 8824-2:a) clarifies
    what is meant by a "recursive definition" when information objects are being discussed;b)
    changes the production for "ObjectSetSpec" so that it corresponds to the corrected
    definition of "ElementSetSpecs" in ITU-T Rec. X.680 | ISO/IEC 8824-1 Corrigendum
    1;c) clarifies the effect of the extension marker when used in defining information
    object sets;d) clarifies that value sets that contain no values are invalid;e)
    makes a few editorial corrections.
