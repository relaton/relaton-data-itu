abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard contains an improved version
    of the P3 Register operation which introduces support for the Restricted Delivery
    element of service and adds general extensibility to the Register operation. The
    ASN.1 has been fully revised to use the new Recommendations X.680 and X.880, while
    retaining complete compatibility with the 1988 and 1992 P1 and P3 protocols. Numerous
    defect corrections are incorporated.
