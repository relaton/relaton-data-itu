abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.2111 specifies the functional architecture and
    requirements for the \r\nresource and admission control functions (RACF) in next
    generation networks (NGN), which may \r\ninvolve a variety of access and core
    transport technologies and multiple domains. The RACF \r\nprovides real-time application-driven
    and policy-based transport resource management in support of \r\nend-to-end quality
    of service (QoS), gate control, network address translation, and traversal of
    \r\nremote network address translators. The RACF is not service-specific. Services
    can make use of \r\nRACF whether the IP multimedia subsystem is involved or not.\r\nIn
    particular, this edition of Recommendation ITU-T Y.2111 includes extensions to
    the 2008 edition \r\nto address issues related to the interaction with 3GPP policy
    control functionalities, resource and \r\nadmission control between NGNs and RACF-unaware
    IP networks, wholesale, time-shifted TV \r\nservices, QoS downgrading, mobility,
    resource and admission control based on user subscription \r\nprofile, support
    of deep packet inspection (DPI), communication between RACF and management of
    \r\nperformance measurement (MPM), policy-based charging control, and IPTV service
    by invitation.\r\n \r\n \r\n"
