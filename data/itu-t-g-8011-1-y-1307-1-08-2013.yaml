abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T G.8011.1/Y.1307.1 defines the service attributes and
    parameters for carrying Ethernet characteristic information over dedicated bandwidth,
    point-to-point connections, provided by SDH, PDH, ETY, ETH, ATM, MPLS or OTH server
    layer networks. This type of service is referred to as Ethernet private line (EPL)
    service. This Recommendation is based on the Ethernet service framework as defined
    in Recommendation ITU-T G.8011/Y.1307.
