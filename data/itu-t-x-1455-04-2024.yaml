abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1455 analyses specific threats of a smart residential
    community service, identifies security requirements, and proposes security measures
    for stakeholders to safeguard and improve smart residential community services.\r\nSmart
    residential community is a system based on the information and communication technologies
    (ICTs) for residents to acquire safe, comfortable and convenient living conditions
    in a residential community. It includes residential community ICT infrastructure,
    smart residential community service platform, and smart applications inside of
    the residential community. The smart residential community services combine multiple
    community management services (e.g., public facilities management, safety control,
    environment management, etc.) and smart applications (e.g., smart house service,
    smart building, smart parking, e-heath, smart retail store, etc.) to provide safe,
    comfortable and convenient living conditions for the residents.\r\n\r\n"
