abstract:
- language: en
  script: Latn
  content: This Recommendation describes the Multimedia Conference Services supported
    by an ISDN. It relies on Recommendation F.702 for the main body of the description,
    and only gives the specific complements relevant to the ISDN, which derive from
    its capabilities and its limitations. Thus when reading this Recommendation, it
    is necessary to refer back to Recommendation ITU-T F.702. The numbers of the clauses
    are those of Recommendation ITU-T F.702, and thus they do not form a continuous
    sequence because only a few clauses need a specific complement for the ISDN. In
    addition there is a new clause 9 on the attributes for the various profiles.
