abstract:
- language: en
  script: Latn
  content: "Mobile Internet services harvest data in their big data infrastructure
    from multiple sources and multiple data dimensions with characteristics including
    scale, diversity, speed and possibly others like credibility or business value.
    Big data analysis drives nearly every aspect of mobile Internet services to improve
    service quality and user experience. According to big data aggregation and analysis,
    service providers can analyse users’ interests more effectively and predict user’s
    expectation more accurately, thus, they can significantly improve and add value
    to their services. Consequently, big data analysis becomes a valuable business
    trend in the telecommunication domain. \r\n\r\nAs the new technology develops,
    big data analytics will bring new security issues comparing to previous data analytics
    in mobile Internet services domain. Without comprehensive security mechanism,
    the unsecure and spiteful big data analysis will do harm to mobile Internet service
    provider’s business security, and user’s data security. To ensure secure big data
    analysis in mobile Internet services, consequently, the security requirements
    need to be analyzed exhaustively and the overall security framework need to be
    established.\r\n\r\nThis Recommendation will analyse the security requirements
    of big data analytics in mobile Internet services and provide security framework.\r\n"
