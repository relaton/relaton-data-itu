abstract:
- language: en
  script: Latn
  content: This Recommendation specifies network requirements for one type of multimedia
    retrieval services, namely the Video-on-demand service. The Network capabilities
    to support the service are described by means of reference configurations and
    corresponding network architectures. Functional blocks in the architecture are
    identified and the physical and logical relationships among these blocks are described.
    Although assumptions must necessarily be made regarding the functionality of Customer
    Premises Equipment (CPE), specific requirements for CPE are outside the scope
    of this Recommendation.This Recommendation focuses on IN-based solutions. Non-IN-based
    solutions are also included, but in much less detail.General aspects of network
    capabilities to support multimedia services covering all service classes are provided
    in a separate Recommendation, I.375.1.
