abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.609.6 specifies signalling requirements for content
    distribution services over a managed peer-to-peer (P2P) overlay network that is
    specified in Recommendation ITU-T X.609. Content distribution over a managed P2P
    network provides flexible content management over existing overlay networks and
    also enables contents providers to control accessing of the overlay network. That
    is, the content provider can update the content to be distributed over an overlay
    network anytime and every update will be applied to all peers in the overlay network.
    This Recommendation lists requirements for the related reference points that are
    defined in Recommendation ITU-T X.609 for providing content distribution services
    and it also describes high-level procedures for a content distribution service
    over managed P2P architecture and roles of the managed P2P components for the
    service.
