abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4464 introduces a decentralized IoT service platform,
    blockchain of things (BoT), which is enabled by blockchain-related technologies.
    This Recommendation analyses the concept, common characteristics and high-level
    requirements of BoT, and provides common capabilities and functionalities, general
    procedures and relevant use cases for BoT.\r\n\r\nBoT works in a decentralized
    service mode and is capable of enhancing many aspects of IoT. It has the advantages
    of blockchain-related technologies, especially for building decentralized data
    storage and management, crowding decision-making and automatic interactions.\r\n"
