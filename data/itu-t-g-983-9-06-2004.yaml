abstract:
- language: en
  script: Latn
  content: This Recommendation provides the Optical Network Termination (ONT) management
    and control interface (OMCI) specification for the support of wireless Local Area
    Network interfaces on Broadband Passive Optical Network (B-PON) systems as defined
    in ITU-T Rec. G.983.1.The OMCI specification is based on ITU-T Recs G.983.2 and
    G.983.8, but provides the necessary enhancements to these Recommendations which
    are needed to support the management of IEEE 802.11 interfaces.
