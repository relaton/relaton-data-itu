abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T J.128 introduces additional requirements on a DOCSIS
    cable modem termination system and DOCSIS cable modem (Annex B of Recommendation
    ITU-T J.112 and Recommendation ITU-T J.122) to support the configuration and transport
    of a class of service known as "Out-Of-Band (OOB) messaging" between a set-top
    controller (or application server) and the customer premises equipment (CPE).
    In general, the CPE is intended to be a digital set-top device, but may include
    other CPE devices, such as residential gateways or other electronic equipment.
