abstract:
- language: en
  script: Latn
  content: This Recommendation describes the optical network terminal management and
    control interface (OMCI) specifications for broadband passive optical networks
    (B-PONs). In order to provide support for protected B-PON systems specified in
    ITU-T Rec. G.983.5 "A broadband optical access system with enhanced survivability,"
    additional OMCI specifications are required. This Recommendation describes the
    enhanced OMCI specifications for a B-PON system with protection features. The
    enhancements described include the addition of protection-related attributes to
    existing managed entities, managed entity relations diagrams for protected systems,
    and detailed scenarios for OMCI start-up/tear-down/switch-over and for virtual
    path (VP) configuration/removal in protected B-PON systems.
