abstract:
- language: en
  script: Latn
  content: "Cultural data sharing has multiple participants in multiple links such
    as collection and processing, transaction and distribution, transmission and storage,
    as well as data governance, and they are all in a multiparty co-governance environment.
    How to solve the problem of cultural data sharing in such an environment has become
    a common concern of all participants in the field of cultural digitization. \r\nRecommendation
    ITU-T F.740.15 specifies the framework and functional requirements of a cultural
    data sharing system (CDSS). The CDSS realizes cultural data sharing based on data
    identification and addressing technologies, where cultural identifiers and metadata
    of cultural data are transmitted through the CDSS, while the original cultural
    data does not need to be uploaded to the system. It supports the agile transmission
    of cultural data as assets, achieving the goal of cultural data sharing.\r\n"
