abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation J.163 addresses requirements for a client device to
    obtain access to network resources. In particular, it specifies a comprehensive
    mechanism for a client device to request a specific quality of service from the
    DOCSIS network. Extensive examples illustrate the use of this Recommendation.
    The scope of this Recommendation is to define the QoS architecture for the "Access"
    portion of the IPCablecom network, provided to requesting applications on a per-flow
    basis. The access portion of the network is defined to be between the multimedia
    terminal adapter (MTA) and the cable modem termination system (CMTS), including
    the DOCSIS network. The method of QoS allocation over the backbone is unspecified
    in this Recommendation. Interface to the managed IP backbone and issues related
    to IP multicast are not within the scope of this Recommendation. This Recommendation
    also recognizes that per-flow reservations may be required within the customer
    premises, and the protocol developed addresses this potential need.
