abstract:
- language: en
  script: Latn
  content: This Recommendation defines terminal adaptor (TA) functions for the connection
    of terminals having interfaces conforming to current V-series Recommendations
    to the ISDN for both circuit switched and leased circuit services. This includes
    the following functions:- conversion of electrical and mechanical interface characteristics;-
    bit rate adaption;? end-to-end synchronization of entry to and exit from the data
    transfer phase;? call establishment and disestablishment based on either manual
    or automatic calling and/or automatic answering;? local and end-to-end flow control
    to support DTEs of differing rates.
