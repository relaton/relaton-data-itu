  content: Supplement 17 to the ITU-T X-series Recommendations describes threats to,
    and security objectives for, enhanced web-based telecommunication services using
    technologies such as Web 2.0 and mashups. Threats to enhanced web-based applications
    are identified, as are threats to traditional web-based applications. Moreover,
    security objectives for enhanced web-based application services are provided.
