abstract:
- language: en
  script: Latn
  content: Supplement 45 to ITU-T G-series Recommendations consolidates the various
    GPON power-saving proposals in order to facilitate their consideration and comparative
    analysis from the perspective of the requirements satisfiability, on the one hand,
    and the overall system impact, on the other hand. This Supplement is formatted
    as a white paper encompassing the summary of the requirements gathering effort,
    the specification of the wide spectrum of potential solutions as well as their
    comparative analysis.
