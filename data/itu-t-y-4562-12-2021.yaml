abstract:
- language: en
  script: Latn
  content: "In a city, there are the basic elements like people, things and events.
    Their mobility and positioning are increasingly dependent upon information related
    to location and/or time, supported by a spatiotemporal information service (STIS).
    Although related services have already emerged and been provided, the lack of
    standards may affect their sharing, service capabilities, and interoperability.
    Therefore, a standard is needed to specify what kinds of STIS should be provided
    for people, things and events in smart cities, including the functions and metadata
    of STIS. \r\nRecommendation ITU-T Y.4562 introduces the concepts of STIS for smart
    cities, and specifies the functions and metadata of STIS. The functions and metadata
    of STIS can support the applications of STIS for smart cities, so as to better
    meet the needs of people, things and events. The functions and metadata are universal
    and can be applied to any cities in the world.\r\n"
