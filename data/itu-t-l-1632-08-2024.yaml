abstract:
- language: en
  script: Latn
  content: "Buildings are one of the major key city assets and it is important to
    effectively and easily manage building infrastructure in order to realize a sustainable
    city. A number of pieces of equipment exist at building infrastructures, and building
    infrastructure management systems are separately utilized for dedicated infrastructure
    management services in terms of efficiency, safety and sustainability. Buildings
    may have different management systems depending on the type of facility, such
    as firefighting management systems, energy management systems, electrical safety
    management systems and building automation systems. The different management systems
    use the separate identification method, so the different methods may cause inefficiency
    and inconvenience for managing the many pieces of equipment at the building. In
    order to realize a sustainable city, it is important to efficiently manage a number
    of pieces of equipment within a city. By allocating identifiers to the equipment
    in buildings, the city asset management system in a sustainable city can improve
    their manageability. \r\nRecommendation ITUT L.1632 defines the identification
    method for equipment at the building infrastructure which improves the manageability
    and interworking between facilities at the building. The identification method
    includes the identifier structure and identifier management procedure which are
    easily recognizable, understandable mapping between identifier and device, and
    consistency in the equipment category. The identification method defined in this
    Recommendation is used within a building infrastructure and can be operated in
    conjunction with the city-level identification system that uniquely identifies
    the city assets such as buildings, energy resources, etc. Therefore, it can help
    realize a sustainable city.\r\n"
