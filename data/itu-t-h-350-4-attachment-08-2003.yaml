abstract:
- language: en
  script: Latn
  content: This Recommendation describes an LDAP directory services architecture for
    multimedia conferencing using SIP. In particular, it defines an LDAP schema to
    represent SIP User Agents (UAs) on the network and associate those endpoints with
    users. This Recommendation is intended to supplement the CommObject directory
    architecture as discussed in ITU-T Rec. H.350, and not intended to be used as
    a stand-alone architecture. The implementation of this LDAP schema, together with
    the use of the H.350 CommObject architecture, facilitates the integration of SIP
    User Agents and conferencing devices into existing Enterprise Directories, thus
    allowing the user to perform white page lookups and access clickable dialling
    supported by SIP devices. The primary reasons for implementing this schema are
    identical to those listed in ITU-T Rec. H.350 (the CommObject class definition)
    as they apply specifically to the use of SIP UAs.
