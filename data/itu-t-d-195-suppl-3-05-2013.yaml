abstract:
- language: en
  script: Latn
  content: 'Supplement 3 to Recommendation ITU-T D.195 is intended to assist interested
    telecommunication operators in developing prepayment guidelines. Since an operator''s
    decision to establish prepayment mechanisms is an internal commercial matter,
    the guidelines in the present supplement are voluntary and meant to be illustrative
    in nature. Their objective is to help operators formulate new (or update existing)
    prepayment guidelines according to their needs and to promote efficiency in account
    management. '
