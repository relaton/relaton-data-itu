abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.746.12 describes the scenarios, general framework
    and requirements for a real-time interactive multimedia service (RIMS) under poor
    network conditions. The RIMS system plays an important role in many scenarios
    and situations, e.g., emergency relief, remote education and emergency communication.
    The RIMS requires provision of measures for dynamic adjustment of coding parameters,
    including those for video and audio coding, and it requires setting maximal priority
    of audio communication under low-speed network conditions and configuring usage
    attributes to ensure the appropriate priority from high to low of service uses.
