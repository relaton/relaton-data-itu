abstract:
- language: en
  script: Latn
  content: "Supplement 53 to ITU-T G-series Recommendations provides an overview of
    Ethernet operations, administration, maintenance (OAM) performance monitoring.
    It describes how Ethernet OAM performance measurements are processed, configured
    and managed as described in Recommendations ITU-T G.8013, ITU-T G.8021 and ITU-T
    G.8051. It also introduces the modelling for Ethernet OAM performance monitoring
    as described in Recommendation ITU-T G.8052.\r\nThis Supplement is of an informative
    nature and does not imply any specific requirements.\r\n"
