abstract:
- language: en
  script: Latn
  content: The Transport Fast Byte Protocol eliminates the round trip delay associated
    with the establishment and release of a transport connection, and requires very
    low PCI overhead. The Transport Fast Byte Protocol is intended for use in situations
    in which enhancements to the network QOS are not required, and efficiency of operation
    (e.g. reduction of round trip delays on establishment and release) is of primary
    concern.
