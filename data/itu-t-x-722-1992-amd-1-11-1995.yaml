abstract:
- language: en
  script: Latn
  content: This amendment to Rec. X.722 | ISO/IEC 10165-4 modifies the GDMO Package
    template to allow for the explicit specification of the Set By Create property.
    This amendment will ensure that Recommendation X.722 is consistent with Recommendation
    X.721, which states the Create request is permitted to specify an explicit value
    for individual attributes. This change will permit the automatic generation of
    MOCS because currently the "behaviour" definitions need to be studied to determine
    the Create capability specified. In addition, this amendment extends the Registration
    clause (6.4) to include the application context for Transaction Processing with
    Systems Management and extends the Registration arc for the General Relationship
    Model.
