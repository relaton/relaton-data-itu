abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Z.168 defines the mapping rules for CORBA IDL (as
    defined in chapter 3 in Draft Approved Specification ptc/06-05-01 (2006)) to TTCN-3
    (as defined in Recommendation ITU-T Z.161) to enable testing of CORBA-based systems.
    The principles of mapping CORBA IDL to TTCN-3 can be also used for the mapping
    of interface specification languages of other object-/component-based technologies.
    The specification of other mappings is outside the scope of this Recommendation.
