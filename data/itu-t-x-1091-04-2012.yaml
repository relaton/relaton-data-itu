abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1091 describes a general guideline for testing and
    reporting the performance of biometric template protection techniques based on
    biometric cryptosystem or cancellable biometrics. This guideline specifies two
    reference models for evaluation, which use biometric template protection techniques
    in telebiometric systems. It then defines the metrics, procedures and requirements
    for testing and evaluating the performance of the biometric template protection
    techniques.
