  script: Latn
  content: "Recommendation ITU-T Y.3558 describes the functional architecture of container
    management in intercloud based on the framework and functional requirements of
    container management in intercloud defined in Recommendation ITU-T Y.3528. This
    Recommendation also provides the reference points among functions of container
    management in inter-cloud, and the relationship between function groups of container
    management in inter-cloud and the functional components of intercloud in Recommendation ITU-T
    Y.3516.\r\n"
