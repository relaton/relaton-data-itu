abstract:
- language: en
  script: Latn
  content: With the rapid growth of IP-based networks and applications in both private
    and public networks, it is necessary to consider arrangements to transport IP
    services over ATM in the public network environment.For the private network environment,
    the ATM Forum has specified Multi-Protocol Over ATM (MPOA) [ATM_MPOA]. The Internet
    Engineering Task Force (IETF) has specified Classical IP Over ATM (C-IPOA) [CIP_ATM]
    and Next Hop Resolution Protocol (NHRP) [NHRP] and Multi-Protocol Label Switching
    (MPLS) [MPLS_ARCH]. To ensure that public networks will interwork with each other
    supporting a set of services defined in this Recommendation, and to ensure the
    interworking of public and private networks, it is necessary to recommend the
    preferred approach for transporting IP over ATM in public networks.The approach
    adopted in this Recommendation is to identify generic requirements, key IP services
    and determine which IP over ATM approach is preferred for each service. It is
    preferable that the same approach is used for all services considered. This approach
    is recommended for all identified services using IP over ATM transport in public
    networks.
