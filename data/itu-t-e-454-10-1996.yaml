abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation is to define transmission performance
    metrics based on Error Correction Mode (ECM) facsimile. Performance parameters
    defined in Recommendations E.451, E.452 and E.453 have been modified to accommodate
    the error correction and partial page characteristics of ECM facsimile. Performance
    parameters for ECM that will help infer the image quality for non-ECM transmissions
    have also been defined.The parameters defined in this Recommendation are intended
    for use when intrusive text techniques are employed.
