abstract:
- language: en
  script: Latn
  content: This document provides a method for the application of P.863 on speech
    signals processed by blind bandwidth extension (BBE), in complement to existing
    procedures given in P.863.1. When bandwidth extension techniques are used, not
    only need the Reference Bandwidth be set but P.863 also has limited ability to
    discriminate small bit rate and bandwidth improvements. These quality differences
    are clearly distinguishable in Subjective tests. For P.863 tests, a complementing
    bandwidth requirement check is needed and detailed.
