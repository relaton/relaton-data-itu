abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.20 specifies resistibility requirements and test
    procedures for telecommunication equipment that is attached to or installed within
    a telecommunication centre.\r\n\r\nOvervoltages or overcurrents covered by this
    Recommendation include surges due to lightning on or near the line plant, short‑term
    induction from adjacent a.c. power lines or railway systems, earth potential rise
    due to power faults, direct contact between telecommunication lines and power
    lines and electrostatic discharges. The sources for overvoltages in internal lines,
    between equipment/racks, are mainly inductive coupling caused by lightning currents
    being conducted in nearby lightning strokes or lightning currents being conducted
    in nearby conductors.\r\n\r\nMajor changes compared with the 2008 version of this
    Recommendation include:\r\n\r\n•            updated references;\r\n\r\n•            added
    information on which universal serial bus (USB) ports should be tested;\r\n\r\n•
    \           added information on when to add protection to untested ports;\r\n\r\n•
    \           added test requirements for external coaxial cable ports;\r\n\r\n•
    \           added test requirements for multiple conductor internal unshielded
    cable ports.\r\n\r\nMajor changes compared with the 2011 version of this Recommendation
    include:\r\n\r\n•            added test requirements for unshielded twisted pair
    (UTP) Ethernet;\r\n\r\n•            added test requirements for shielded twisted
    pair STP Ethernet;\r\n\r\n•            added test requirements for power over
    Ethernet (PoE);\r\n\r\n•           added STP shield testing.\r\n"
