abstract:
- language: en
  script: Latn
  content: "This Recommendation | International Standard is one of the set of Recommendations
    | International Standards for the OSI Management Information Service (MIS). It
    defines the Information Model of managed objects and their attributes that corresponds
    to the Information aspects of the systems management model introduced in the Systems
    Management Overview Rec. ITU-T X.701 | ISO/IEC 10040, thus providing the modelling
    concepts necessary for the development of the other systems management Recommendations
    | International Standards. It also defines the principles of naming managed objects
    and attributes.\r\nThis Recommendation | International Standard defines the logical
    structure of systems management information. In accordance with Rec. ITU-T X.700
    | ISO 7498-4 and ITU-T X.701 | ISO/IEC 10040 management information is structured
    in terms of managed objects, their attributes, the management operations that
    can be performed upon them, and the notifications that they can emit. The set
    of managed objects in an open system, together with their attributes, constitutes
    that open system’s management information base (MIB).\r\nThis Recommendation |
    International Standard defines the concepts of managed objects in the Information
    Model, and prescribes the principles for naming the managed objects and their
    attributes so that they may be identified in and accessed by management protocols.
    This Recommendation | International Standard also describes the concept of managed
    object classes and the relationships into which managed objects and managed object
    classes can enter, including: inheritance, specialization, allomorphism and containment.\r\nThis
    Recommendation | International Standard applies to all definitions of managed
    objects and their attributes for the purposes of systems management. \r\nNOTE
    – Although this Recommendation | International Standard applies to systems management,
    layer management, when defined, can also use this Recommendation | International
    Standard\r\n"
