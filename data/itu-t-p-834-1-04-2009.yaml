abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T P.834.1 describes an extension of the methodology
    for deriving equipment impairment factors from instrumental models of Recommendation
    ITU-T P.834. It is intended that it primarily be applied to determine wideband
    equipment impairment factors Ie,wb, capturing the degradation introduced by wideband
    speech codecs. The resulting wideband equipment impairment factors derived by
    this methodology are intended to be used on the extended transmission rating scale
    underlying the E-model (see Appendix II of Recommendation ITU-T G.107). They will
    reflect the auditory impairments of the corresponding equipment in a listening-only
    mode.The present methodology makes use of instrumental models (so-called "objective
    methods"), e.g., of the model defined in Recommendation ITU-T P.862.2. It is to
    be considered as supplementary to the methodology based on auditory listening-only
    tests, described in Recommendation ITU-T P.833.1. It will provide valid Ie,wb
    values only for those codecs for which the used instrumental model produces meaningful
    estimations.Speech material associated to this Recommendation is freely available
    on ITU-T test signal database at www.itu.int/net/ITU-T/sigdb. It is also available
    on a CD-ROM attached to the paper version of this Recommendation.
