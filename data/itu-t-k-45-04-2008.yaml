abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.45 specifies resistibility requirements and test
    procedures for telecommunication equipment installed between telecommunication
    centres and between a telecommunication centre and customer's premises building.Overvoltages
    or overcurrents covered by this Recommendation include surges due to lightning
    on or near the line plant, short-term induction from adjacent a.c. power lines
    or railway systems, earth potential rise due to power faults, direct contact between
    telecommunication lines and power lines and electrostatic discharges.Major changes
    compared with the 2003 version of this Recommendation include:\r• removing the
    power induction test requirement for antenna ports where the installation is within
    the scope of Recommendation ITU-T K.71."
