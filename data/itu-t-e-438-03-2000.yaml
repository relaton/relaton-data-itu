abstract:
- language: en
  script: Latn
  content: This Recommendation presents an overview of performance parameters for
    the measurement and assessment of N-ISDN 64 kbit/s circuit switched UDI bearer
    services in operation. Guidelines and considerations for measurement methods are
    also provided. These parameters can be used for N-ISDN monitoring and improvement
    in operations. Their achieved values can be used both to establish guaranteed
    performance levels in Service Level Agreement with the customers and Service Quality
    Agreement with other administrations, and to verify, analyse and improve the performance
    level currently offered.
