abstract:
- language: en
  script: Latn
  content: "Big-data-driven networking (bDDN) is a type of future network framework
    that collects big data from networks and applications, and generates big data
    intelligence based on the big data; it then provides big data intelligence to
    facilitate smarter and autonomous network management, operation, control, optimization
    and security, etc.\r\n\r\nSupplement 50 to ITU-T Y-series Recommendations presents
    a set of use cases and several scenarios supported by bDDN including: 1) network
    management; 2) network active maintenance; 3) network optimization; 4) network
    operation; 5) network attack prevention; 6) root cause tracking of quality of
    service (QoS); 7) quality of experience (QoE) improvement; 8) resource management;
    9) network planning and design; 10) traffic engineering; 11) cross-layer design;
    12) content delivery network (CDN); 13) network address translation (NAT) device
    detection; 14) bDDN in future networks; 15) bDDN in data centre networks; and
    16) bDDN in industrial Internet.\r\n"
