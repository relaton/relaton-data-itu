abstract:
- language: en
  script: Latn
  content: 'As cable TV network is migrating to deep fiber or fiber to the home (FTTH)
    architecture, it is now easier to provide bidirectional high quality media services
    that requires very high speed digital transmission of various high quality contents.
    As Cable TV network provides services by transmitting RF signal between headend
    and cable modem (CM), the configuration and devices of the cable TV network are
    optimized for RF signal transmission. For the migration to all-fiber access, the
    existing cable TV network devices of the service operators (SO), which provide
    broadcasting services and various data services through the HFC-based cable TV
    network, are recommended to be changed by new network devices. Therefore, a cost-effective
    solution for deployable and acceptable migration towards optic-based cable TV
    network is required. This Recommendation provides a cost-effective solution to
    adapt the HFC-based cable TV network devices into optic-based cable TV network
    devices.  '
