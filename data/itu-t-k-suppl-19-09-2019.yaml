abstract:
- language: en
  script: Latn
  content: The electromagnetic field (EMF) environment surrounding underground railway
    trains is among those most frequently met by the general public in daily life.
    When an underground railway train passes through a tunnel, especially, passengers
    are exposed to the EMF radiated by several repeaters installed on the wall. EMF
    sources are close to passengers under these conditions. Supplement 19 to ITU-T
    K‑series Recommendations reports evaluations of EMF exposure levels in underground
    railway trains from mobile communication base stations installed in tunnels.
