  content: This Recommendation | International Standard defines how interactions between
    objects in different ODP systems can be supported using different communication
    protocols. In particular it:· defines a General Interworking Framework (GIF);·
    within the GIF, defines a family of functionally-related service primitives;·
    specifies the mapping og the GIF service primitives and their parameters to the
    messages and field of particular protocols, including OMG CORBA GIOP.
