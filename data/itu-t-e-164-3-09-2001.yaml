abstract:
- language: en
  script: Latn
  content: This Recommendation describes the principles, criteria and procedures for
    the assignment and reclamation of resources within a shared E.164 Country Code
    for Groups of Countries. These shared Country Codes coexist with all other E.164-based
    Country Codes assigned by ITU-T. The resource of the shared Country Code consists
    of a Country Code and a Group Identification Code (CC + GIC) and provides the
    capability for a Group of Countries to provide telecommunication services within
    the Group of Countries. TSB is responsible for the assignment of the CC + GIC.
