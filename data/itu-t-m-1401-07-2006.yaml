abstract:
- language: en
  script: Latn
  content: "This Recommendation defines designations and additional information intended
    primarily for human-to-human communication between various Operators, i.e., network
    operators or service providers.\r\nThis Recommendation contains data definitions
    for designations of interconnections and other information about network resources
    that are required to be communicated between operators.\r\nThis Recommendation
    is developed in order to facilitate computerized interoperation between telecommunication
    operators. For this use a more formal approach than M.1400 is required. See Appendix
    III.\r\nNote that since ITU-T Rec. M.1400 does not formally specify data structures,
    backward compatibility with existing implementations may not be ensured, but this
    Recommendation is based on ITU-T Rec. M.1400. For further details, see Appendix
    II.\r\n"
