abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.265 | International Standard ISO/IEC 23008-2 represents
    an evolution of the existing video coding Recommendations (ITU-T H.261, ITU-T
    H.262, ITU-T H.263 and ITU-T H.264) and was developed in response to the growing
    need for higher compression of moving pictures for various applications such as
    Internet streaming, communication, videoconferencing, digital storage media and
    television broadcasting. It is also designed to enable the use of the coded video
    representation in a flexible manner for a wide variety of network environments.
    \ The use of this Recommendation | International Standard allows motion video
    to be manipulated as a form of computer data and to be stored on various storage
    media, transmitted and received over existing and future networks and distributed
    on existing and future broadcasting channels.\r\nThis Recommendation | International
    Standard was developed jointly with ISO/IEC JTC 1/SC 29/WG 11 (MPEG) and corresponds
    in a technically aligned manner to ISO/IEC 23008-2."
