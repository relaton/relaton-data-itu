abstract:
- language: en
  script: Latn
  content: "The complexity of telecom operation and management for networks and services
    is increasing significantly. To realise advanced intelligence, even full intelligence,
    in telecom operation and management, it is necessary to utilize knowledge to fulfil
    the complex requirements in different scenarios. The knowledge required for telecom
    operation and management for network and service is characterized as highly fragmented
    and difficult to reuse.\r\nKnowledge management in telecom operation and management
    aims to construct, integrate, store, validate, refine, provide and share knowledge
    of telecom operation and management in specified forms. It is required to provide
    the clear functions and mechanisms so that given tasks can be accomplished with
    better operational efficiencies and, ultimately, to achieve precise application
    of knowledge.\r\nThe contents of Recommendation ITU-T M.3351 include the following:\r\n–Background
    and overview of knowledge management\r\n–Knowledge classification in telecom operation
    and management\r\n–Framework of knowledge management for telecom operation and
    management.\r\n"
