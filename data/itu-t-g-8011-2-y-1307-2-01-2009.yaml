- language: en
  script: Latn
  content: Recommendation ITU-T G.8011.2/Y.1307.2 defines the service attributes and
    parameters for carrying Ethernet characteristic information over shared bandwidth,
    point-to-point connections provided by SDH, PDH, ATM, MPLS, OTH, or ETY server
    layer networks. This type of service is referred to as Ethernet virtual private
    line (EVPL) service. This Recommendation is based on the Ethernet service framework
    as defined in Recommendation ITU-T G.8011/Y.1307.
