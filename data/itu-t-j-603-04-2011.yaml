abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T J.603 specifies the function components required to
    configure a real-time expanded hierarchy of large screen digital imagery (exLSDI)
    transmission system using spatial image segmentation for parallel processing.
    The transmission system is designed to maintain conformance with the network service
    operator's requirements specified in Recommendation ITU-T J.602. The system comprises
    of multiple video codec function units of any coding standards. The transmission
    system also enables flexible adaptation to arbitrary image resolution.
