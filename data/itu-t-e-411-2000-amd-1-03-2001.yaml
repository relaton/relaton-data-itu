abstract:
- language: en
  script: Latn
  content: This amendment aims to make adjustments to ABR (answer bid ratio) and ASR
    (answer seizure ratio) parameters when introducing number portability. ASR and
    ABR parameters calculated downstream the rerouting exchange/network and towards
    the donor exchange/network should be adjusted in order not to consider as failed
    calls the ones to ported number, resulting in release messages.It is also proposed
    to add references at the end of ITU-T E.411.
