abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4233 specifies the information and communication
    technology (ICT) implementation framework of smart public health management in
    smart and sustainable cities (SSCs).\r\nSSCs are capable of fostering data-driven
    smart applications to manage limited resources and implement them to thwart the
    advent of future pandemics of a similar magnitude to the COVID-19 pandemic. Linking
    SSCs with public health frameworks to manage future pandemics and epidemics and
    to the attainment of the Sustainable Development Goals (SDGs) (SDG 3: Global health,
    SDG 1: Poverty eradication and SDG 11: Make cities inclusive, safe, resilient,
    and sustainable), and to the Sendai Framework for Disaster Risk Reduction is a
    challenge and serves a dual purpose. With the utilization of appropriate emergency
    communication and public health frameworks, it will become easier to develop models
    to predict the spread of diseases, ascertain the source of illnesses, coordinate
    lockdowns, detect and report symptoms, identify viral strains and provide remote
    assistance as required with limited human interaction, through an infrastructure
    based on the Internet of things.\r\nThis Recommendation is based on the U4SSC
    report entitled \"Smart public health emergency management and ICT implementations\"
    (listed as U4SSC-2 in the bibliography) and its structure is as follows: it starts
    with an analysis of the public health context and of corresponding frameworks
    and returns a generic public health framework, which specifies a pandemic's lifecycle.
    This generic framework is then interconnected with the SSC and with city resilience.
    Further, it depicts with unified modelling language (UML) diagrams how this framework
    can be executed within the SSC environment and highlights the SSC components that
    play a role in this execution.\r\n"
