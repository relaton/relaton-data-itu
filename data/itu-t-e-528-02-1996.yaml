abstract:
- language: en
  script: Latn
  content: Digital Circuit Multiplication Equipment (DCME) allows a high degree of
    utilization of digital circuits in Public Switched Telephone Networks (PSTN) and
    Integrated Services Digital Networks (ISDN) providing integration of traffic containing
    voice, Voice Band Data (VBD) and the facsimile portion of Voice Band Data (VBD)
    traffic.Dimensioning method for DCME system, described in this Recommendation,
    deals with a group of trunks (circuit group, as defined in Recommendation E.600)
    between two switches, where DCMEs are used to achieve a statistical multiplexing
    gain.This Recommendation also describes the GOS parameters that play a part in
    the DCME gain calculation.This Recommendation deals with a point-to-point DCME
    single clique operation configuration. Dimensioning of complex multiclique/multidestination
    types of DCME systems is for further study.
