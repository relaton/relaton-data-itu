abstract:
- language: en
  script: Latn
  content: This Recommendation defines the functional profile for base standards ISO/IEC
    7776, 8208 and 8885 to provide the lower layers of the telematic services stack
    when operating on the ISDN. Attention is also paid to the terminal selection procedure
    related to telematic services using protocols other than the above e.g. group
    3 document facsimile transmission over the ISDN.Parameter values are recommended
    to ensure good throughput when operating via long delay connections such as satellite
    routes. Backward compatibility with the Blue Book version has been maintained.Three
    methods of negotiating the lower layer parameter values have been included to
    satisfy various connection scenarios, e.g. completely within the ISDN or between
    the ISDN and other digital networks.This Recommendation supplies the network layer
    definition in Recommendation T.70 for telematic terminals but not the transport
    layer definition which is still retained as the telematic transport layer definition.
