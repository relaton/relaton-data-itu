abstract:
- language: en
  script: Latn
  content: This Recommendation defines the communication protocol for document remote
    access, presentation, editing and transfer. It defines the protocol of two new
    applications service elements for interactive confirmed document manipulation,
    aligned with, and provided for, the integrated use with applications defined under
    the Distributed Office Application Model (DOAM). The two application service elements
    are the DTAM-TM and DTAM-TK. The use of the DTAM-DM application service element
    is mandatory for document manipulation applications and is used in conjunction
    with the ACSE and ROSE services elements. Optionally, it may be combined with
    the DFR-SE (for filing and retrieval purposes) and with the DTAM-TK service element
    for exchange of an application token in multi-user conferences.
