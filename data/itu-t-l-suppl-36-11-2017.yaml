abstract:
- language: en
  script: Latn
  content: This Supplement analyses the energy efficiency issues for future 5G systems.
    5G systems are the object of standardization in 3GPP and ITU and is planned to
    be available from 2018 in various countries. The focus of this Supplement is on
    methods and metrics to measure energy efficiency in 5G systems, with consideration
    of the degree of stability of the systems known so far and the experience of the
    legacy systems as well as related measurement procedures for evaluating future
    standardization evolutions.
