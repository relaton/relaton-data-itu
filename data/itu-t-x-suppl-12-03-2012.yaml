abstract:
- language: en
  script: Latn
  content: Supplement 12 to ITU-T X-series Recommendations, in particular to Recommendation
    ITU-T X.1240, describes the basic concept and characteristics of mobile messaging
    spam. It also introduces and analyses current technologies on countering mobile
    messaging spam. In addition, this supplement proposes a general implementation
    framework for countering mobile messaging spam. The relative activities in different
    organizations are introduced in Appendix I.
