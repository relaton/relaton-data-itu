abstract:
- language: en
  script: Latn
  content: This Supplement highlights and shares the implementationof a code of practice
    for information and network security management by the Malaysianinformation and
    communication industry, based on Recommendation ITU-T X.1051.The sets of requirements
    have been identified and documented in the "Requirementsfor Information and Network
    Security (INS)" developed by MTSFB(Malaysian Technical Standards Forum Bhd) and
    approved by MCMC (MalaysianCommunications and Multimedia Commission) on 5 October
    2016. The requirementsare based on Recommendation ITU‑T X.1051 for establishing,implementing,
    maintaining and continually improving information and networksecurity management
    within the context of an organization. The code ofpractice for information security
    controls based on Recommendation ITU-TX.1051 for Malaysian telecommunication organizations
    provides four (4)families of control focusing on organization, infrastructure,
    people and environment.
