abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1770 establishes technical guidelines for multi-party
    computation (MPC) and provides a technical standard basis for information and
    communication technology (ICT) stakeholders to use MPC to protect data in data
    collaboration and big data analysis scenarios. It also describes applications
    for which MPC can be used and how it can serve as a reference for ICT stakeholders
    to develop MPC applications.\r\nData has become one of the most important assets
    in ICT. Secure MPC can build trust and security in data collaboration and big
    data analysis-related areas by balancing usage and protection of data.\r\nRecommendation
    ITU-T X.1770 includes:\r\n–\ta technical framework for MPC, in which its elements
    and the workflow between them is determined;\r\n–\tsecurity levels of MPC protocols,
    used in the analysis and determination of the security model and threshold;\r\n–\tapplications
    of MPC, illustrated by use cases, including an application scenario description
    and processes, with appropriate security requirement recommendations.\r\nBased
    on the framework and security levels established in Recommendation ITU-T X.1770,
    standards for MPC applications in different fields can be determined.\r\n"
