abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation M.1403 defines orders and additional information intended
    primarily for human-to-human communication between various operators, i.e., network
    operators or service providers.The orders contain data for designations of interconnections
    and other information about services and network resources that are required to
    be communicated between operators.This Recommendation provides a skeleton that
    can be extended with any contents and allow for any use of the orders. This Recommendation
    is developed in order to facilitate computerized interoperation between telecommunication
    operators. As the data defined in this Recommendation are designed for human usage,
    they are independent of the functions in which they are used. Hence, the data
    may be applied in any functions, e.g., in customer requests, call centres, billing,
    service platforms, etc.
