abstract:
- language: en
  script: Latn
  content: The multi-technology network management (MTNM) solution suite realizes
    a TMN interface between the NML and EML according to ITU-T Recommendation M.3010
    for the FCAPS management of multi-technology fixed transport, access and aggregation
    networks.This Recommendation first explains the structure of the MTNM CORBA IDL
    solution set (TMF814) and associated implementation statement templates and guidelines
    (TMF814A), then refers to ITU-T Recommendation X.780.2, ITU-T Recommendation Q.816.2
    and MTNM supporting documents for relating the TMF814 and TMF814A components to
    key Recommendations on TMN and functional network architectures, and finally points
    out MTNM interoperability in a multi-vendor network.This Recommendation wraps
    TMF814 and TMF814A, and the associated MTNM supporting documents, by referencing
    them normatively and relating them to key ITU-T Recommendations utilized by the
    MTNM approach to CORBA and functional modelling. These relationships imply that
    MTNM operations systems are TMN-compliant and TMN-conformant according to ITU-T
    Recommendation M.3010. This Recommendation can also be used as a first lead-in
    to the MTNM CORBA IDL solution set with implementation statement templates, interoperability
    guidelines and MTNM feature matrices.
