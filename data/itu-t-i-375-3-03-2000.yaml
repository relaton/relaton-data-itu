abstract:
- language: en
  script: Latn
  content: This ITU-T Recommendation specifies the network capabilities required to
    support the switched digital broadcast service (SDB). The service requires a point-to-multipoint
    function that can be provided either by the access network topology or by the
    addition of a specific Replication Unit (RU). Another new functional element,
    the Broadcast Control Unit (BCU) instructs the RU which programs have to be delivered
    to a specific end user. This ITU-T Recommendation provides the service architecture
    and the reference configuration and then specifies the different functional elements
    and their interfaces.
