abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3128 specifies requirements for network function
    communication between public networks (PNs) and public network integrated non-public
    networks (NPNs) in IMT2020. These requirements build on the analysis of relevant
    use cases and related network problems.\r\nThere are two types of NPN: public
    network integrated non-public networks (PNI-NPN); and stand-alone non-public networks
    (SNPN). The requirements specified in this Recommendation concern the first type.\r\n"
