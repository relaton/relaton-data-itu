abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3113 specifies requirements and a framework for
    effective and efficient solutions for latency guarantee and cooperation among
    heterogeneous quality of service (QoS) domains.\r\nFor a latency guarantee in
    multi-domain large-scale networks, it is necessary to clarify how the numerous
    data-plane functional entities should be arranged and operate in conjunction with
    each other. In order for the solution to be both effective and efficient, selecting
    an appropriate traffic granularity for network treatment is essential. The variety
    of granularity of flow aggregates (FAs), between flow and class, should be taken
    into consideration.\r\nOn the Internet or the IMT-2020 network, there are inevitably
    multiple domains with possibly different QoS architectures. Even with multiple
    heterogeneous domains, there should be an underlying unified resource reservation
    and admission control functions, while the data plane functions should be based
    on FAs and appropriate regulations in the middle of an end-to-end path."
