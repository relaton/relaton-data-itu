abstract:
- language: en
  script: Latn
  content: This Recommendation provides an overview of typical considerations which
    are useful in network planning for the initial deployment and subsequent growth
    of networks based on Intelligent Network architectures, including considerations
    of interworking with existing PSTN/ISDN infrastructures.It addresses methods for
    analysing network infrastructure requirements and detailed dimensioning of Intelligent
    Network nodes to accommodate expected traffic loads for services offered by a
    given network.
