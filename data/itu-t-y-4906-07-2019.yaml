abstract:
- language: en
  script: Latn
  content: "The ultimate objective of this Recommendation is to enhance the sustainability
    of identified priority sectors in smart cities, in order to optimise economic,
    environmental and social benefits.\r\n\r\nCities will decide on their digital
    transformation priorities. For example, cities might also want to encourage collaboration
    to deliver desired outcomes.\r\n\r\nThis kind of engagement based on the assessment
    framework can incentivize industry engagement and investment.\r\n\r\nRecommendation
    ITU-T Y.4906 contains the following:\r\n\r\n1)          Introduction of the assessment
    framework and its components\r\n\r\n2)          Identification of indicators –
    Examples of categories of indicators to assist in this objective for the assessment
    frameworks include:\r\n\r\n–     Digital infrastructure;\r\n\r\n–     Digital
    transformation initiatives for sectors;\r\n\r\n–     Collaboration efforts on
    digital transformation;\r\n\r\n–     Economic, environmental and social benefits
    according to sector digital transformation.\r\n\r\n3)          Sector assessment
    and analysis"
