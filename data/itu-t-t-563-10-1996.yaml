abstract:
- language: en
  script: Latn
  content: This Recommendation defines the terminal characteristics for G4 facsimile
    apparatus. The descriptions of the terminal characteristics for colour extension
    are added as an option by this Recommendation. The coding schemes for colour image
    type and optional functions for colour facsimile are mainly defined. The references
    to the teletext service are removed.
