  content: Supplement 10 to the ITU-T X-series of Recommendations provides an overview
    of traceback for responsive measures to certain network issues within a single
    or a more complex array of service providers. Traceback may assist in discovering
    ingress points, paths, partial paths or sources of problematic network events.
    This information may aid service providers in mitigating such events.
