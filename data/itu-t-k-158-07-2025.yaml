abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.158 gives a practical guidance on the earthing
    and bonding for the main configuration type of indoor distribution system in large-scale
    physical buildings to minimize the risk of damage to equipment and possible injury
    considering of lightning protection and safety.\r\nThe indoor distribution system
    for mobile communication is used to improve the performance of mobile communication
    signal coverage in large-scale physical buildings. The installation requirement
    of earthing and bonding for this system still lack clear guidance in the existing
    Recommendations, i.e., Recommendations ITU-T K.56, ITU-T K.97, ITU-T K.112 and
    ITU-T K.120.\r\n\r\n"
