abstract:
- language: en
  script: Latn
  content: "With the current trend of digital transformation, information and communications
    service providers (ICSPs) need to expand their e-commerce ecology to improve customer
    experience and increase opportunities for ICSPs to provide services to customers.
    Recommendation ITU-T M.3111.1 provides the protocol neutral requirements for the
    X-interface between the telecom operation system (TOS) and the Internet e-commerce
    platform (IEP), following the interface specification methodology presented in
    Recommendation ITU-T M.3020.\r\n"
