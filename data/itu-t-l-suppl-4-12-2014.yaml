abstract:
- language: en
  script: Latn
  content: "Supplement 4 to the L series of Recommendations provides a set of guidelines
    that countries can refer to when designing or adjusting their e-waste management
    systems. It provides guidance on policy/legal framework, collection mechanisms,
    financial mechanisms and engagement with all relevant stakeholders.\r\nIt has
    been developed in response to WTSA Resolution 79 (Dubai, 2012), which instructs
    ITU-T Study Group 5 to develop guidelines for developing an adequate e-waste management
    system for telecommunications and ICT equipment as well as to respond to Plenipotentiary
    Resolutions 182 and 200 (Busan, 2014).\r\n"
