abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1162 describes a general security-related architectural
    model which can be applied in various peer-to-peer (P2P) networks. Based on the
    architectural model, this Recommendation identifies primitive operations for generic
    P2P networks. Non-generic and application-dependent operations are not described
    in this Recommendation. For each primitive operation, the relationship between
    the security requirements and operations is described. In addition, the relationship
    between the security functions and operations is described.
