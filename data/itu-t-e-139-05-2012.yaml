abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T E.139 gives guidance on enhancing the usage and usefulness
    of public Internet access points (PIAPs). A PIAP is a public venue where people
    can use computers with Internet access and other technologies that help them to
    collect information and to communicate with other people at the same time as they
    develop and maintain digital skills. A major motivation for public provision of
    PIAPs is the use of technology for social and community development, which reduces
    digital exclusion, creates contacts, promotes health-related topics and creates
    economic opportunities. The wide provision of PIAPs cannot be properly effective
    unless they are readily accessible to all people, including the elderly and people
    who have disabilities.
