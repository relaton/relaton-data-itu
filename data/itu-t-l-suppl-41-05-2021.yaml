abstract:
- language: en
  script: Latn
  content: Several assessment models have been introduced to calculate the urban energy
    system and to demonstrate the variants that calibrate the local energy efficiency.
    Supplement 41 to ITU-T L-series Recommendations focuses on the impact of artificial
    intelligence (AI) and big data on energy efficiency. More specifically, this Supplement
    identifies a model that can calculate the energy efficiency in an urban space
    from an AI and big data perspective. A literature analysis is performed with regard
    to the identification of existing energy efficiency assessment models under the
    lens of AI and big data with a special focus on the urban system, which results
    to an AI taxonomy for energy efficiency and to corresponding jobs (process steps)
    where big data are involved. This Supplement aims to unveil the requirements for
    energy efficiency assessment, and the features that affect the energy demand.
    It attempts to define a unified assessment model for energy efficient cities.
