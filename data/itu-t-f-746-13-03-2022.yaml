abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.746.13 specifies requirements for intelligent multimedia
    communication for various types of smart speaker, including those for the reference
    architecture, smart devices, signalling and platforms, as well as giving a few
    typical scenario examples. Recommendation ITU-T F.746.13 also specifies requirements
    for eliminating differences in multimedia communication and access management
    of heterogeneous devices, to simplify the construction complexity of intelligent
    multimedia communication systems (IMCSs), to improve the security and reliability
    of signalling and multimedia data transmission between smart speakers and IMCSs,
    with a view to finally guaranteeing high-quality multimedia communication service.
