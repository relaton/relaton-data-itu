abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the necessary functions of a 64, 128 and
    144 kbit/s DCE for the provision of digital leased circuits. Interworking with
    DCEs complying with Recommendation V.38 is covered. The recommended functions
    also allow this DCE to be deployed as a remote access to a flexible multiplexer
    as specified in Recommendation G.797.The V.24 and X.24 DTE-DCE interfaces are
    specified in terms of functions and electrical characteristics. The use of additional
    interfaces is not precluded. Core functions include scrambling of data, testing
    facilities, optional aggregation function and optional multiplexing function.
    This type of DCE may be part of a managed network.This Recommendation contains
    three appendices providing information on complementary functions or applications
    for this type of equipment.
