abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T H.621 defines the system architecture for the multimedia
    information access triggered by tag-based identification on the basis of Recommendation
    ITU-T F.771, and serves as a technical introduction to subsequent definition of
    detailed system components and protocols. The services treated by this Recommendation
    provide the users with a new method to refer to the multimedia content without
    typing its address on a keyboard or inputting the name of objects about which
    relevant information is to be retrieved. This is one of the major communication
    services using identification (ID) tags such as radio frequency identifications
    (RFIDs), smart cards and barcodes. International standardization of these services
    will give a big impact to international multimedia information services using
    ID tags. It contains the functional model, its constituent components as well
    as its workflow. An appendix describes how this architecture realizes typical
    services.
