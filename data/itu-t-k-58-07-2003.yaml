abstract:
- language: en
  script: Latn
  content: With the liberalization of telecommunications, many services are provided
    by several Operators on the same cable, and equipment owned by different Operators
    is installed in the same telecommunication facilities and in many cases these
    are interconnected with each other. Therefore, there is a possibility of trouble
    related to EMC, resistibility, and safety occurring. This Recommendation describes
    necessary steps to ensure safe and problem-free operation in multiple Operator
    environments. Co-location arising from telecommunication liberalization should
    be taken into account, and necessary subjects are described fromthe viewpoints
    of EMC, resistibility, and safety.
