abstract:
- language: en
  script: Latn
  content: "At present, propelling in-depth use of information and communication technologies
    (ICTs) and accelerating digital transformation to realize sustainable development
    have become the necessary choice for enterprises in smart sustainable cities.
    Many enterprises face problems and challenges to integrate ICT applications into
    business activities to enhance the digital capability during digital transformation.
    The methodology described in this Supplement can help enterprises to address these
    challenges and achieve the following during their digital transformation:\r\n\r\n–
    \          making full use of ICTs to optimize business processes, improve organizational
    efficiency and strengthen the utilization of data resources;\r\n\r\n–           ensuring
    that ICT applications become consistent and coordinated with enterprises' strategies;\r\n\r\n–
    \          using ICTs to build digital capabilities can increase the enterprises'
    economic benefits.\r\n"
