abstract:
- language: en
  script: Latn
  content: This Recommendation describes techniques for exchanging cybersecurity information.
    These techniques can be used individually or in combinations, as desired or appropriate,
    to enhance cybersecurity through coherent, comprehensive, global, timely and assured
    information exchange. No obligations to exchange information are implied, nor
    are the means of acquisition or ultimate use of the information treated. CYBEX
    is one of the elements providing confidence and security in the use of ICTs.
