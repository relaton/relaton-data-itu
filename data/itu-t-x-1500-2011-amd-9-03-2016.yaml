abstract:
- language: en
  script: Latn
  content: "Amendment 9 to Recommendation ITU-T X.1500 (2011) provides a list of structured
    cybersecurity information techniques that have been created to be continually
    updated as these techniques evolve, expand, are newly identified or are replaced.
    The list follows the outline provided in the body of the Recommendation. This
    amendment reflects the situation of recommended techniques as of March 2016, including
    bibliographical references.\r\n"
