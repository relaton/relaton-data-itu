abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.3148 specifies the functional architecture, functional
    entities, operational procedures, and packet metadata to fulfil the requirements
    and framework specified in Recommendation ITUT Y.3129. It enables deterministic
    networking with a set of work conserving packet schedulers in the data plane,
    which guarantees end-to-end (E2E) latency bounds to flows.\r\nIn particular, the
    procedures for metadata usage, metadata creation and update, priority queue management
    and time difference compensation are specified. The use of first-in first-out
    (FIFO) instead of priority queue, as an approximated implementation of stateless
    fair queuing, is also specified.\r\n"
