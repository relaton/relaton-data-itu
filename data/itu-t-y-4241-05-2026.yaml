abstract:
- language: en
  script: Latn
  content: "A complex or campus refers to a group of buildings and grounds that belong
    to a given institution. Complexes come in various types such as corporate parks,
    industrial zones, sport and event venues, commerce centres, etc. A campus is an
    integrated site dedicated to education or research, such as those of universities
    or schools. Complexes and campuses play an important role in people's work and
    life and have common requirements in terms of smart management. With the development
    of the Internet of things (IoT) and artificial intelligence (AI), the management
    of complexes and campuses has gradually moved towards intelligence, and many smart
    complex and campus systems have emerged to improve the management and operation
    efficiency.\r\nThe digital twin technology enables capabilities such as historical
    data record, operational performance monitoring, and predictive analytics. It
    has been widely used in smart complex and campus systems. By combining the digital
    twin technology with emerging information and communication technology (ICT) technologies,
    such as cloud computing, IoT, big data, and AI, it is possible to access diverse
    terminals for collecting the data of physical complex and campus in real time,
    model humans (without personally identifiable information), devices, things and
    events in the complex and campus. It is also possible to realize intelligent monitoring
    and simulation, and realize remote control of the physical complex and campus.
    A digital twin for smart complex and campus system can address challenges of management
    and operation of complexes and campuses such as low management efficiency, poor
    service experience, serious energy waste, weak comprehensive security, and high
    operational costs. It implements digital transformation of such complexes and
    campuses and enhances service experience.\r\nRecommendation ITU-T Y.4241 provides
    the common requirements and capability framework of digital twin for smart complex
    and campus.\r\n"
