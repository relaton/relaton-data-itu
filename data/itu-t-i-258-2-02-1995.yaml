abstract:
- language: en
  script: Latn
  content: The In-call Modification (IM) supplementary service enables a user to change
    within an established (i.e. active) call from one type of call characterized by
    one set of bearer capability, low layer and/or high layer capabilities to another
    type of call with another set without changing the end-to-end connection from
    a user/network-access point of view.Further in-call modification(s) back to the
    original or to another call type shall be possible.As a network option, the user
    can choose, when invoking the supplementary service, that the network automatically
    modifies the call back to the original call type at the end of the modified part
    of the connection.
