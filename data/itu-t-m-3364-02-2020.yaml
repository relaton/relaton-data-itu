  content: Recommendation ITU-T M.3364 introduces requirements for on-site telecommunication
    smart maintenance management function. In this Recommendation, the requirements
    for telecommunication smart maintenance function are provided, which include on-site
    patrol, on-site overhaul, on-site troubleshooting, evaluation of maintenance work,
    management of maintenance knowledge base, management of service activation function,
    management of network resource, and management of smart maintenance assistant
    toolkit (SMAT). This Recommendation also provides use cases of SMAT in telecommunication
    smart maintenance system (TSMS).
