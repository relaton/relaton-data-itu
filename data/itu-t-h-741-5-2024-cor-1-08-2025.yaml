abstract:
- language: en
  script: Latn
  content: "A personalized Internet Protocol television (IPTV) service is an example
    of application event handling. With the end-users' permission, service providers
    are allowed to provide personalized services such as content recommendations,
    personalized user interfaces, personalized advertisements and some interactive
    services. The application can be realized based on the existing IPTV architecture
    to help in providing various kinds of IPTV personalized services (PS).\r\nRecommendation
    ITU-T H.741.5 studies the requirement of personalized IPTV services and describes
    several use cases.\r\nCorrigendum 1 to ITU-T H.741.5 replaces the terms 'feature
    vector' and 'user feature' that had been defined in this Recommendation, to avoid
    misunderstanding.\r\n"
