abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.3090 describes the requirements and architecture
    of a digital twin network (DTN). A digital twin network is a virtual representation
    of a physical network. It is useful for analysing, diagnosing, emulating, and
    controlling the physical network based on data, model, and interface to achieve
    a real-time interactive mapping between a physical network and a digital twin
    network.
