  content: A Group 3 Facsimile Terminal may include a DTE and a Facsimile DCE. This
    Recommendation describes a Facsimile DCE that includes physical and data layer
    functions. The corresponding DTE must implement the T.30 session protocol, and
    any necessary higher layer functions, such as Recommendations T.4, T.6 or T.434.
