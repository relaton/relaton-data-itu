abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T A.25 addresses the process of incorporating text
    (in whole or in part, with or without modification) of documents from another
    organization into an ITU-T Recommendation (or another ITU-T document). Similarly,
    guidance is provided for other organizations incorporating text (in whole or in
    part, with or without modification) from ITU‑T Recommendations (or other ITU-T
    documents) in their documents.\r\n"
