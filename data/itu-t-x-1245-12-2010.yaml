abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1245 provides the general framework for countering
    spam in IP-based multimedia applications such as IP telephony, instant messaging,
    multimedia conference, etc. The framework consists of four anti-spam functions,
    i.e., core anti-spam functions (CASF), recipient-side anti-spam functions (RASF),
    sender-side anti-spam functions (SASF), and spam recipient functions (SRF). This
    Recommendation describes the functionalities and the interfaces of each function
    for countering IP multimedia spam.
