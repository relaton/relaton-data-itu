abstract:
- language: en
  script: Latn
  content: This Supplement to ITU-T Q-series Recommendations is a technical report
    on the requirements for Capability Set 2 of the Support of Narrowband Services
    using Broadband Bearer Technologies. Its scope is limited to overall functionality
    of the Serving Node (SN) and the requirements common to associated protocols at
    the call control level, the bearer control level, the call-bearer interactions
    and the signalling transport needed to provide this capability across a variety
    of broadband backbone networks for Capability Set 2 (CS-2).
