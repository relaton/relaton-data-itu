abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the network capabilities to support the registration
    and communication of information required for charging and accounting of ATM connections
    in order to support the charging and accounting principles as defined in Recommendation
    D.224. It specifies the events to be registered, for each event the parameters
    to be registered and the requirements related to the communication of this information
    to an external system.
