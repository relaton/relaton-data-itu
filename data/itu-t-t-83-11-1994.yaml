abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard, Digital Compression and Coding
    of Continuous-tone Still Images, is published as two parts:ITU-T Rec. T.81 | ISO/IEC
    10918-1 "Requirements and guidelines" sets out requirements and implementation
    guidelines for continuous-tone still image encoding and decoding processes, and
    for the coded representation of compressed image data. These processes and representations
    are intended to be generic, that is, to be applicable to a broad range of applications
    for colour and grayscale still images within communications and computer systems.This
    part, ITU-T Rec. T.83 | ISO/IEC 10918-2 "Compliance testing" sets out tests for
    determining whether implementations comply with the requirements for the various
    encoding and decoding processes specified in ITU-T Rec. T.81 | ISO/IEC 10918-1.
    ITU-T Rec. T.83 | ISO/IEC 10918-2 also specifies tests for determining whether
    any specific instance of compressed data complies with the ITU-T Rec. T.81 | ISO/IEC
    10918-1 specification for compressed data format.
