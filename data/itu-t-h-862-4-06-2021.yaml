abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.862.4 defines the framework for information and
    communication technology (ICT) olfactory function test systems. The scope of this
    Recommendation is focused on the method of the olfactory function test generated
    by the perception of the user's condition, the mechanically controlled scents
    spray, the evaluation of the user's response, and the olfactory test procedures.
    The olfactory function test can be carried out by considering human factors related
    to the human olfactory. It can be sprayed by mechanically controlling a certain
    amount of fragrance. It is also possible to present a fragrance at intervals optimized
    for olfactory fatigue. In addition, it is possible to prevent the fragrance from
    being perceived completely differently due to the residual fragrance by solving
    the problem of fragrance mixing between olfactory tests through cleaning. The
    ICT olfactory function test system framework is largely composed of three stages.
    The first step is to judge the state of the user and determine whether it is possible
    to perform an olfactory test. The second step is to emit an appropriate fragrance
    and receive a response from the user according to the test procedure. The third
    step is to evaluate the user's olfactory ability by analysing the user's response
    to the test procedure. \r\n"
