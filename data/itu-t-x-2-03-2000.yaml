abstract:
- language: en
  script: Latn
  content: This Recommendation describes international data transmission services
    (leased circuit, circuit switched, packet switched, and frame relay) and optional
    user facilities in public data networks and ISDNs. This revision includes optional
    user facilities for priority and service classes aspects of frame relay data transmission
    service. The revision also takes into account the addressing aspects connected
    with the using of E.164 Escape Code "0".
