abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation Y.1315 describes the characteristics and applicability
    of various QoS (quality of service) service scenarios in the VPN (virtual private
    network) environment. The QoS service scenarios cover various QoS models in single
    or multiple service provider configurations. The QoS models described in this
    Recommendation encompass the pipe model, the hose model, and a combination and/or
    concatenation of both.
