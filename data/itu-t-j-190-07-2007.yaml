abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation J.190 establishes a flexible and forward-looking home-networking
    framework that provides a unifying theme for developing a coherent set of home-network
    interface specifications. The MediaHomeNet infrastructure, initially created for
    cable access networks, is now designed to be complementary to all IP-based access
    networks in order to support applications such as video distribution to STB defined
    in ITU-T Recommendation J.290 (next generation set-top box) and voice over IP
    defined in ITU-T Recommendation J.160 (IPCablecom) or ITU-T Recommendation J.360
    (IPCablecom2), and RF-based broadcast services. MediaHomeNet identifies a set
    of fundamental architectural elements that can be flexibly combined in a set of
    configurations, allowing for the consideration of a wide variety of home-networking
    solutions.
