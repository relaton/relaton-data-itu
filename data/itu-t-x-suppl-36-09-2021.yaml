abstract:
- language: en
  script: Latn
  content: "Supplement 36 to ITU-T X-series Recommendations describes the critical
    security controls (CSCs) to supplement the implementation of Recommendation ITU-T
    X.1051. CSCs are a prioritized set of actions that collectively form a defence-in-depth
    set of best practices that mitigate the most common attacks as part of the information
    and network security management of an organization. These controls are developed
    by a community of information technology (IT) experts who apply their first-hand
    experience as cyber defenders to create globally acceptable security best practices
    and to include multiple sectors such as retail, manufacturing, healthcare, education,
    government and defence. \r\n"
