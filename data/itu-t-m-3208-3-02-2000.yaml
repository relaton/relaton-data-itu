  content: This ITU-T Recommendation is one of the series of M.3200 TMN management
    service Recommendations that provides descriptions of management services, goals
    and context for the Dedicated and Reconfigurable Circuits Network. Its main focus
    is on the Virtual Private Network (VPN) service management. This ITU-T Recommendation
    is based on ITU-T Recommendation M.3208.1 and adds new function sets to support
    the VPN services.
