abstract:
- language: en
  script: Latn
  content: "This recommendation concerns subjective quality assessment of telemeeting
    systems that provide multiparty communication between distant locations, using
    audio-only, video-only, audiovisual, text-based or graphical means as communication
    modes. The term multiparty refers to more than two meeting participants who can
    be located at two or more locations.\r\n\r\nEvaluation of those systems can focus
    on audio-only, video-only or audiovisual quality aspects and non-interactive or
    conversational quality can be assessed. \r\n\r\nThis recommendation gives an overview
    of relevant aspects that need to be considered for subjective quality evaluation
    of multiparty telemeetings and provides guidance to recommendations describing
    the details of applicable methods and procedures. Aspects in this recommendation
    are also applicable to two-party telemeetings.\r\n"
