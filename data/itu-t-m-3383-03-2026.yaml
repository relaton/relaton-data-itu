abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3383 introduces the requirements for log analysis
    in telecommunication management with artificial intelligence (AI) and includes
    a functional framework, functional requirements, and typical scenarios of log
    analysis in telecommunication management with AI. This Recommendation gives examples
    of some log types and characteristics. This Recommendation also describes use
    cases of log analysis in telecommunication management with AI.\r\nEdition 2 introduces
    the positions, connection objects and functional requirements of the three key
    interfaces (I1, I2, I3) of the log analysis system in telecommunication management
    with artificial intelligence (LAS-AI) and revises the terminology throughout the
    text for consistency.\r\n"
