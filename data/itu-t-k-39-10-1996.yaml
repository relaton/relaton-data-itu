abstract:
- language: en
  script: Latn
  content: This Recommendation gives support to protection engineers in evaluating
    the risk for severe damages caused by lightning. It comprises a risk analysis
    that includes the effect from direct and nearby lightning strikes as well as overvoltages
    originating from incoming services, mainly power and communication networks. The
    analysis also indicates the most efficient additional protective measures for
    sites with insufficient basic protection.Part of this Recommendation deals with
    the risk of injuries to people being present at the site during thunderstorms.This
    Recommendation is based on a concept from IEC TC 81 and modified to be applicable
    to practical cases in telecommunication systems.The example in Appendix I applies
    to a telecommunication site with an adjacent antenna mast.
