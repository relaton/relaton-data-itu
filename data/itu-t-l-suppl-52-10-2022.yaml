abstract:
- language: en
  script: Latn
  content: 'Supplement 52 to ITU-T L-series Recommendations proposes a set of good
    practices to improve the energy efficiency of cyber-physical applications – making
    use of Internet of things (IoT), artificial intelligence (AI), and digital twins.
    First, the Supplement introduces the cyber-physical paradigm, engineering reference
    framework, and a couple of system deployments models. Secondly, it defines three
    end-to-end use case typologies to be addressed (i.e., monitoring applications
    using smart IoT systems and AI software; smart applications using Edge computing
    and cloud data centre; and simulation applications using digital twin pattern).
    Energy efficiency practices are discussed adopting a circular value-chain model
    that consists of three main steps: data storage; data transfer/move; and data
    processing/analytics. Finally, this Supplement offers a set of recommended practices
    relating to each component of the three end-to-end use case typologies.'
