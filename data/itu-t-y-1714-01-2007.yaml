abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation Y.1714 covers MPLS user-plane operation, administration
    and maintenance, control plane aspects and TMN aspects of MPLS management. Specifically,
    the mechanisms covered in this Recommendation are being worked on at different
    standard bodies mainly ITU-T and IETF.This Recommendation focuses on MPLS technology
    specific OAM aspects of the TMN model of ITU-T Rec. M.3010. The Recommendation
    scope is limited to those components and interfaces that interface between network
    elements (user and control plane), and between network elements and EMS, NMS systems.
