abstract:
- language: en
  script: Latn
  content: "By deploying Internet of things (IoT) devices, smart home makes use of
    IoT technologies to collect ambient information, detect abnormal events at home
    and report to relevant personnel or institutions. \r\nIn this Recommendation the
    term \"abnormal event\" is intended as meaning a human health injury event at
    home. Examples of abnormal events at home include, but are not limited to, coughing,
    dyspnoea, falls, headache, quiescent behaviour, sleep apnoea, stroke, transient
    ischemic attacks.\r\nSuch a smart home system aims to reduce injuries and casualties
    at home. Various products have emerged in this field. However, the lack of standards
    could limit the abilities of vendors to meet the rising demands across the globe,
    such as lower false alarm rates, more convenient deployment, better handling of
    privacy concerns, etc. In order to ensure the system quality, Recommendation ITU-T
    Y.4220 specifies the requirements and capability framework of the abnormal event
    detection system (AEDS) for smart home.\r\n"
