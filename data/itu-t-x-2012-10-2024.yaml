abstract:
- language: en
  script: Latn
  content: "A digital twin is defined as a pairing of virtual and physical worlds
    that allows analysis of data and monitoring of systems to head off problems before
    they occur, prevent downtime and even plan for the future using simulations. It
    acts as a bridge between the physical and digital worlds by using sensors to collect
    real-time data about a physical item.\r\nA smart city digital twin can be defined
    as a digital twin for smart cities that can increase visibility of human–infrastructure–strategy
    interactions. It allows the simulation of plans before implementing, exposing
    problems before they become a reality, and find the best strategies to achieve
    a specific goal or strategies that have similar effects while minimizing budget
    and resource usage in smart city domain. Therefore, a smart city digital twin
    system is tool for improving urban operations, efficiencies and resilience of
    a city.\r\nTo ensure the security of the smart city digital twin system, the security
    threats and relevant security requirements specific to smart city digital twin
    system need to be analysed and the security measures need to be established.\r\nRecommendation
    ITU-T X.2012 identifies the specific security threats of the smart city digital
    twin system, analyses security requirements specific to the smart city digital
    twin system and thus establishes the security measures of the smart city digital
    twin system for the smart city key stakeholders to safeguard and improve the service
    based on the smart city digital twin system.\r\n"
