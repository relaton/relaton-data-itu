abstract:
- language: en
  script: Latn
  content: Traffic reference period is a time period, relevant in traffic observations
    for quality control or dimensioning. The traffic reference periods are defined
    to detect periods of loads appropriate for monitoring Grade of Service (GOS).
    Normally these are not predictable. This Recommendation discusses aspects related
    to determining these periods. Definitions are provided, also, for normal and high
    load.
