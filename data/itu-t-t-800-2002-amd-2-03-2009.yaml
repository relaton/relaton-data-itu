abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T T.800 | ISO/IEC 15444-1 describes the core elements
    of a flexible image compression system known as "JPEG 2000".Amendment 2 to this
    Recommendation | International Standard adds profiles for the support of post-production
    and archival formats. There are two cinema profiles and one video profile.The
    cinema profiles are intended for use from camera capture through the production
    chain on to the final distribution masters. The cinematic profiles are designed
    such that it could also be used to archive the final distribution masters but
    with higher quality layers. In this way, the content can be retrieved for future
    editing without appreciable quality loss.The video archive is intended for similar
    purposes but is limited to only (5,3) kernel support. The reason for limited support
    is that the current broadcast profiles are limited to (9,7) due to the contribution
    nature of the broadcast market. The lossless kernel is better suited for archival
    applications and therefore is better placed in this amendment.
