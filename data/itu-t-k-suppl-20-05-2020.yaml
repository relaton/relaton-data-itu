abstract:
- language: en
  script: Latn
  content: "Measurement and computation methods of human exposure to electromagnetic
    fields (EMFs) from fixed radio sources like mobile base stations have been standardized
    and published as ITU-T K-series Recommendations and IEC 62232. These also include
    methods prescribed in Japanese regulation and have been basically assumed to be
    applied to radio sources installed above the ground.\r\nUnderground base stations
    for use in small cells of fourth generation (4G) mobile networks are installed
    underground to construct service areas above the ground.\r\nSupplement 20 to ITU-T
    K-series Recommendations contains the measurement results of radio frequency exposure
    from underground base stations, to evaluate the exposure from these base stations."
