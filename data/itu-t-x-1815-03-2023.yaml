abstract:
- language: en
  script: Latn
  content: "The IMT-2020 network will enable a variety of services, including enhanced
    mobile broadband (eMBB) services, massive machine type communications (mMTC) based
    services and ultra-reliable low latency communications (URLLC) based services,
    on an infrastructure of network and computing resources. In line with the key
    features and the requirements identified for the IMT-2020 network, it is required
    to be more efficient, personalized, intelligent, reliable and flexible.\r\nTo
    support the typical services in the IMT-2020 network, especially eMBB services
    and URLLC based services, edge computing is acknowledged to be one of the key
    technologies for meeting the demanding key performance indicators (KPIs) of the
    IMT-2020 network, especially as far as low latency and bandwidth efficiency are
    concerned.\r\nEdge computing enables the operator and the third party service
    provider to deploy the services close to the user's access point, thus achieving
    high-efficiency service delivery through reduced end-to-end latency and load on
    the transport network.\r\nIn order to ensure the security of edge computing service
    deployment and application, the security threats and relevant security requirements
    specific to edge computing service need to be analysed and the overall security
    framework need to be established.\r\nThis draft Recommendation aims to analyses
    the deployment scheme and typical application scenarios of edge computing services,
    specifies the security threats and requirements specific to edge computing services
    in IMT-2020 and thus establishes security capabilities for the operator to safeguard
    its applications.\r\n"
