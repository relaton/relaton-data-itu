abstract:
- language: en
  script: Latn
  content: "Existing quality of service (QoS) class standardization for packet-based
    layer 2 and layer 3 services is largely non binding or missing. Recommendation
    ITU-T Y.1566 intends to simplify technical Ethernet, multiprotocol label switching
    (MPLS) and internet protocol (IP) QoS interconnection negotiations. Four ordinary
    classes and four auxiliary classes have been defined. This set of classes covers
    a wide range of transport service offerings.\r\nThe Recommendation gives guidance
    on how to deal with issues resulting from differences in QoS deployments of interconnecting
    service providers, aiming at the preservation of the original intent of the service.\r\n"
