abstract:
- language: en
  script: Latn
  content: "This Recommendation describes the measurement framework for the statistical
    indicators of website traffic.\r\n\r\nWebsite is one of the largest traffic sources
    of telecommunication network. It is necessary for network operators to understand
    the characteristics of website traffic and measurement methodology to plan and
    optimize their networks for providing better quality of service to websites and
    end users.\r\n\r\nThis Recommendation defines 3 key statistical indicators (KSIs)
    including 8 sub-indicators of website traffic and describes the measurement framework
    including measurement environment and measurement procedure for KSIs of website
    traffic. This Recommendation is aimed at providing network operators with a means
    to benchmark websites for scaling and optimizing network infrastructures. \r\n"
