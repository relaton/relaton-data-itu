abstract:
- language: en
  script: Latn
  content: "Supplement 62 to ITU-T Y-series Recommendations provides an overview of
    blockchain aspects related to data processing and management (DPM) for the Internet
    of things (IoT) and smart cities and communities (SC&C). There are many benefits
    and challenges to addressing blockchain, IoT and sustainable SC&C together.\r\nBlockchain
    presents opportunities for disruptive innovations, which enables global businesses
    to conduct transactions with less friction and more trust and efficiency. Blockchain
    shows great promise across a wide range of business applications in many fields,
    including IoT and SC&C."
