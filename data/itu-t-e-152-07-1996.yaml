abstract:
- language: en
  script: Latn
  content: This Recommendation on the International Freephone Service (Blue Book -
    Melbourne, 1988) has been revised to bring it into alignment with current practice
    in the International Freephone Service, and to provide two additional optional
    ways of accessing the service:1) by dialling foreign domestic freephone numbers;
    and2) by dialling universal international freephone numbers, which use Recommendation
    E.164 country code 800 as a global service code, as defined in Recommendation
    E.169.
