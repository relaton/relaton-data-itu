abstract:
- language: en
  script: Latn
  content: "Supplement 39 to ITU-T G-series Recommendations provides information on
    the background and methodologies used in the development of optical interface
    Recommendations such as ITU-T G.691, ITU-T G.957 and ITU-T G.959.1. This edition
    introduces probabilistic constellation shaping and describes the use of subcarrier
    multiplexing in point-to-point and point-to-multipoint applications in addition
    to other miscellaneous corrections and improvements\r\n"
