abstract:
- language: en
  script: Latn
  content: This Recommendation defines GFT, a graphical presentation format for TTCN-3
    (Testing and Test Control Notation 3) Core Language defined in ITU-T Rec. Z.140.
    GFT is used for the graphical presentation of test behaviour in form of a subset
    of Message Sequence Charts as defined in ITU-T Rec. Z.120 with test-specific extensions.
    GFT provides a number of graphical symbols to enable the graphical presentation
    of TTCN-3 test cases, functions, altsteps and control parts. GFT can be applied
    whenever it is necessary to define or document test behaviour graphically.This
    Recommendation is based on the core TTCN-3 language defined in ITU-T Rec. Z.140.
    It is particularly suited to display tests as GFTs. It is not limited to any particular
    kind of test specification.
