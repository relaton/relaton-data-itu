abstract:
- language: en
  script: Latn
  content: "As mobile phones are widely used nowadays, malicious attackers tend to
    send spam intentionally to mobile application users, which causes financial problems
    and creates privacy issues. This Supplement 25 to Recommendation ITU-T X.1231
    provides guidance to assist in countering spam for mobile phone developers. In
    addition, this Supplement describes the following elements:\r\n\r\n- Security
    threats of mobile phones with application level aspects;\r\n\r\n- Guidance to
    assist in countering spam for mobile phone developers.\r\n"
