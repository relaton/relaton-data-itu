abstract:
- language: en
  script: Latn
  content: "Supplement 20 to ITU-T K-series Recommendations contains the measurement
    and full-wave computation results of radio frequency exposure from underground
    base stations (BSs), to evaluate the exposure from them.\r\nMeasurement and computation
    methods of human exposure to electromagnetic fields (EMFs) from fixed radio sources
    like mobile BSs have been standardized and published as ITU T K series Recommendations
    and IEC 62232. These also include methods prescribed in Japanese regulations and
    have been basically assumed to be applied to radio sources installed above ground.\r\nUnderground
    BSs for use in small cells of fourth generation (4G) mobile networks are installed
    underground to construct service areas above ground and also expected to be used
    for fifth generation (5G) mobile networks.\r\n"
