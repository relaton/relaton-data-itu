abstract:
- language: en
  script: Latn
  content: "Some regional standards offer the ring wave generator as an alternative
    test procedure. Surges in AC mains branch circuits have been found to show a damped
    ring wave. Supplement 27 to ITU-T K series Recommendations looks at the history
    of ring waves, the ring wave generator, and its parameters. \r\nFor most purposes
    the 1.2/50-8/20 generator is sufficiently adequate for surge testing without using
    a 100 kHz ring wave generator.\r\n"
