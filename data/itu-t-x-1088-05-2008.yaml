abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1088 describes a framework for biometric digital
    key generation, protection from a biometric template with public key certificate
    and biometric certificate in order to provide cryptographic secure authentication
    and secure communication on open network environments. This Recommendation also
    describes the security requirements in biometric digital key generation and protection.
    The framework described in this Recommendation can be applied to the biometric
    encryption and digital signature.
