abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T J.1011 specifies an architecture for exchangeable,
    embedded conditional access/digital rights management or CA/DRM solutions, enabling
    consumer premises equipment (CPE), which are capable of receiving broadcast and
    broadband content, to download CA/DRM clients under a trusted environment. By
    utilizing a downloadable multi-CA/DRM service, entitled consumers can consume
    broadcast and broadband content, which is controlled by digital rights management
    (DRM) and/or CA systems, even though a CPE does not have a required content-related
    CA/DRM client available, by downloading it from a trusted source into various
    types of CPEs including set-top boxes (STBs), smart TVs, PCs, smart phones and/or
    smart tablets.
