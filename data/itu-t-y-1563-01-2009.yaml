abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.1563 defines parameters that may be used in specifying
    and assessing the performance of speed, accuracy, dependability and availability
    of Ethernet frame transfer of an Ethernet communication service. The defined parameters
    apply to end-to-end, point-to-point connections and multipoint connectivity in
    the Ethernet layer and to the network portions that provide, or contribute to
    the provision of, such service in accordance with the normative references specified
    in clause 2.
