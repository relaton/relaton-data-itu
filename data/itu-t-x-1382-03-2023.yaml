abstract:
- language: en
  script: Latn
  content: "Connected vehicles are facing increasingly prominent network security
    issues along with their rapid development. Security threat information of connected
    vehicles, which plays an integral role in securing connected vehicles, is any
    information that can help an organization identify, assess, monitor, and respond
    to a connected vehicle. Organizations that share threat information for connected
    vehicles can improve their own security postures and those of other organizations.\r\nRecommendation
    ITU-T X.1382 provides guidance on the principles, rules, methodology and procedures
    of sharing security information for connected vehicles. It also provides a brief
    description of the different scopes, roles and effectiveness of the various organizations
    while they engage in the lifecycle of security threat information sharing. \r\nThis
    Recommendation is intended to help organizations stay in touch with the connected
    vehicles sharing community and to contribute threat information which would support
    the practices of connected vehicles safety protection. Overall, this Recommendation
    aims to enhance security threat information sharing and mitigate the potential
    impact of cybersecurity attacks on connected vehicles.\r\n"
