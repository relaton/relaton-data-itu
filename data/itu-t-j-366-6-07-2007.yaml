abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T J.366.6 defines a transport protocol for use in the
    IP multimedia (IM) core network (CN) subsystem based on Diameter.This Recommendation
    is applicable to: - the Cx interface between the I-CSCF/S-CSCF and the HSS, and-
    the Dx interface between the I-CSCF/S-CSCF and the SLF.The Third Generation Partnership
    Project (3GPP) has developed the specification in a form optimized for the wireless
    environment. This Recommendation references the ETSI version of the 3GPP specification
    and specifies only the modifications necessary to optimize it for the cable environment.'
