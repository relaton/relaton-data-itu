abstract:
- language: en
  script: Latn
  content: This Recommendation sets out the general principles for charging and accounting
    for the provision of Frame Relay Data Transmission Service (FRDTS) via dedicated
    circuits (permanent virtual circuits) and by Switched Virtual Circuits. These
    services are defined in Recommendation ITU-T X.36. The frame relaying bearer service
    in the ISDN (including frame relaying multicast service) is described in Recommendation
    ITU-T I.233.1.
