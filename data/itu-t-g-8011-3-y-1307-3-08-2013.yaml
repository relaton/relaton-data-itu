  content: Recommendation ITU-T G.8011.3/Y.1307.3 defines the service attributes and
    parameters for carrying Ethernet characteristic information over shared bandwidth,
    multipoint-to-multipoint connections provided by synchronous digital hierarchy
    (SDH), plesiochronous digital hierarchy (PDH), asynchronous transfer mode (ATM),
    multi-protocol label switching (MPLS), optical transport hierarchy (OTH), Ethernet
    MAC layer network (ETH) or Ethernet PHY layer network (ETY) server layer networks.
    This type of service is referred to as Ethernet virtual private LAN (EVP-LAN)
    service. This Recommendation is based on the Ethernet service framework as defined
    in Recommendation ITU T G.8011/Y.1307.
