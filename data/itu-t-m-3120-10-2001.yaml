abstract:
- language: en
  script: Latn
  content: 'This Recommendation defines a generic network information model to be
    used in telecommunications network management based on CORBA. It defines in Interface
    Definition Language (IDL) a set of generic interfaces and constants. The intent
    of this Recommendation is to define a generic CORBA/IDL model similar to that
    defined in ITU- T X.721 and M.3100 using CMISE. These generic IDL interfaces could
    be extended by various industries for managing specific network technologies,
    such as ATM and SONET/SDH. This Recommendation includes an electronic attachment
    containing IDL descriptions. '
