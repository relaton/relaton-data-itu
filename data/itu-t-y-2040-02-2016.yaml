abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.2040 describes the flow-based service continuity
    in multi-connection. The recommendation also covers scenarios, requirements, solutions,
    information flows and security.\r\n\r\nIn the multi-connection environment, flow-based
    service continuity is the mechanism that allows the moving of IP flows from one
    access to another (target) access, thus minimising service disruption in case
    of access loss, or when the access is no longer usable. Flow-based Service Continuity
    includes two modes, the MUE-initiated flow-based service continuity mode and the
    Network-initiated flow-based service continuity mode.\r\n"
