abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation Z.162 defines TFT, the Tabular Format for TTCN-3.
    TFT is the tabular presentation format for TTCN-3 (Testing and Test Control Notation
    3) Core Language defined in [ITU-T Z.161]. It is similar in appearance and functionality
    to TTCN-2 defined in ITU-T Rec. X.292 for conformance testing. The tabular format
    provides an alternative way of displaying the core language as well as emphasizing
    those aspects that are particular to the requirements of a standardized conformance
    test suite. While the core language may be used independently of the tabular presentation
    format, the tabular format cannot be used without the core language. Use and implementation
    of the tabular presentation format shall be done on the basis of the core language.
    This Recommendation defines proformas, syntax mappings, additional static semantics,
    operational semantic restrictions, display and other attributes. Together, these
    characteristics form the tabular presentation format.TFT inherits all the essential
    properties of the Core Language and is intended for specification of test suites
    that are independent of platforms, test methods, protocol layers and protocols.
    TTCN-3 can be used for specification of all types of reactive system tests over
    a variety of communication ports. Typical areas of application are protocol testing
    (including mobile and Internet protocols), service testing (including supplementary
    services), module testing, testing of CORBA-based platforms and APIs. The specification
    of test suites for physical layer protocols is outside the scope of this Recommendation.
