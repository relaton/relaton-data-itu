abstract:
- language: en
  script: Latn
  content: 'The present recommendation is the first of a series of recommendations
    covering the work item related to benchmarking of end-to-end network performance.
    It presents a framework for the statistical analysis underlying the performance
    benchmarking of networks and services. The framework describes benchmarking scenarios,
    use cases and procedures and statistical techniques for ranking end to end KPIs/KQIs.
    The recommendation refers to mobile services and benchmarking campaigns performed
    using mobile agents (devices) in drive and/or walk tests, as well as fixed agents,
    respectively devices placed at fixed locations (e.g., within shopping malls, office
    buildings, stadiums). '
