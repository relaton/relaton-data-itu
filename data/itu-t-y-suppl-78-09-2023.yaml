abstract:
- language: en
  script: Latn
  content: "Supplement 78 to ITU-T Y-series Recommendations aims to collect use cases
    from ITU members that have implemented or evaluated smart sustainable cities (SSCs)
    based on the ITU-T Y.4900 Recommendations series.\r\nThe aim of this Supplement
    is to provide information and identify challenges and opportunities on the implementation
    and evaluation of SSC solutions, based on the ITU-T Y.4900 Recommendations series,
    across a wide spectrum of real scenarios (such as varied infrastructure maturity,
    city size, financial conditions, etc.).\r\nIt is expected that the use cases collected
    in this Supplement will allow ITU members to evaluate scenarios similar to their
    own and, therefore, have a higher probability of success by avoiding improper
    practices, enriching their experience, optimizing investments and improving the
    scope and complexity of the solutions adopted.\r\n"
