abstract:
- language: en
  script: Latn
  content: "Supplement 60 to ITU-T Y-series Recommendations provides information on
    interpreting ITU-T Y.1540 maximum IP-layer capacity measurements as described
    in Annex A and Annex B of the Recommendation.\r\nThis Supplement also provides
    useful information for those who measure various technologies. Much has been learned
    as part of the extensive testing campaigns thus far, and there is more to learn.
    Therefore, this Supplement may be updated frequently, and readers are encouraged
    to ensure that they have the most recent version."
