abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T T.813 | ISO/IEC 15444-14 specifies an XML document,
    referred to as JPXML, which is designed primarily for representing JPEG 2000 file
    format and codestream marker segments, and a reference method for embedding internal
    binary data in a JPEG 2000 image.\r\nThis Recommendation | International Standard:\r\n–\tspecifies
    an XML schema for general box file formats;\r\n–\tspecifies an XML schema for
    JPEG 2000 family file formats and codestream segments;\r\n–\tspecifies a complete
    referring location path to address to exact box or codestream data in an image;\r\n–\tprovides
    guidance on processes for converting source image data to an XML structural document;\r\n–\tprovides
    guidance on how to implement these processes in practice.\r\n"
