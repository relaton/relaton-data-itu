abstract:
- language: en
  script: Latn
  content: "Supplement 87 to ITU-T G-series Recommendations provides a framework to
    guide standardization activities for space division multiplexing (SDM) optical
    fibres and cabled optical fibres. The first version of this Supplement considers
    a weakly-coupled multicore fibre (WC-MCF) having both a standard 125 μm cladding
    diameter and optical backward compatibility with G.65x fibres as the first prioritized
    SDM optical fibres.\r\n"
