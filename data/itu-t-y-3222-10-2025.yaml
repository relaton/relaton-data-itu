abstract:
- language: en
  script: Latn
  content: "One of the solutions to the unified control problems is the transformer-model-based
    control entity. When network control functions are implemented with the aid of
    a transformer model, the following advantages can be achieved: unified network
    control of the whole network, high extensibility, lower implementation cost, a
    unified interface and better end-to-end service. Therefore, it is a good solution
    for network control functions to be converged with transformer-model-related technologies;
    and it is beneficial and appropriate to implement network control functions based
    on the transformer model.\r\nFixed, mobile and satellite convergence (FMSC) is
    the capability that provides services and applications to end users regardless
    of the fixed, mobile or satellite access technologies being used. Recommendation
    ITU-T Y.3222 specifies the basic model, functional requirements, functional architecture
    and interfaces of the transformer-model-based unified control entity (TUCE) for
    FMSC networks and other heterogeneous networks.\r\n"
