abstract:
- language: en
  script: Latn
  content: This Recommendation provides an overview of the Recommendations on Traffic
    Engineering, specifically those numbered between E.490 and E.799, which constitute
    the main body of ITU-T Recommendations on traffic engineering.This Recommendation
    presents the four major traffic engineering tasks, classifies the traffic engineering
    Recommendations according to the task to which they are related, provides a brief
    overview of each Recommendation and describes the interrelation between Recommendations.
    It is intended as an introduction for those practitioners who wish to apply ITU-T
    Recommendations on traffic engineering.
