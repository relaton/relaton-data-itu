abstract:
- language: en
  script: Latn
  content: Amendment 1 to ITU-T Rec. T.808 (01/2005) | ISO/IEC 15444-9:2005 adds support
    for JPIP over secure HTTP protocol (HTTPS), for serving JPM (15444-6) files over
    JPIP, and for serving Motion JPEG 2000 (15444-3) over JPIP. Using JPIP over HTTPS
    was a requirement for the DICOM medical imaging community. They are in the process
    of adopting JPIP for image data transfers but often require transfers to be done
    over a secure channel, so HTTPS was a requirement for the inclusion of JPIP in
    the DICOM standard. The other two items simply define additional JPIP syntax and
    parameters for the efficient browsing of Motion JPEG 2000 and JPM files over a
    networked connection.
