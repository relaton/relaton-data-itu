abstract:
- language: en
  script: Latn
  content: "The scope of Recommendation ITU-T D.700 R are over-the-top (OTT) services
    that can be regarded as potentially competing with or substituting for traditional
    telecommunications and audio-visual services such as voice telephony, short message
    service (SMS), and video calling.\r\nThis Recommendation seeks to provide guidance
    to Arab States in relation to the global growth of OTTs in view of ensuring fair
    competition, consumer protection, dynamic innovation, sustainable investment and
    infrastructure development, accessibility and affordability of services to the
    largest part of population.\r\n"
