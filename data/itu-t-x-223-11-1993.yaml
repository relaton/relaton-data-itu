abstract:
- language: en
  script: Latn
  content: Recommendation X.25 is used for many different types of applications. This
    Recommendation, X.223, shows how to use X.25 for OSI purposes by specifying a
    mapping of the appropriate elements of X.25 to/from the OSI Connection-mode Network
    Service defined in Recommendation X.213. This revision of X.223 corrects serveral
    minor errors and achieves complete interworking capability with the corresponding
    ISO/IEC 8878 Standard.
