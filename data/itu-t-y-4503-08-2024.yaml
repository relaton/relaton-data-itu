abstract:
- language: en
  script: Latn
  content: "The Internet of Things (IoT) brings a diverse range of devices to the
    network, which are managed by rule-enabled IoT platforms that react to events
    dynamically and automatically. However, the heterogeneity of the IoT networks
    makes it challenging to deploy consistent rule scenarios across multiple platforms
    due to differences in protocols and data formats. The IoT rule agent is a platform
    that implements the framework of common rule enablement. The agent is deployed
    in the proxy layer to bridge clients and devices in heterogeneous IoT networks.
    Between different IoT networks, the heterogeneity of the platforms is handled
    by the agent to deliver the corresponding format of rule profiles to the destination
    platform through the platform-specific protocol. The agent includes the device
    proxies to enable the heterogeneous rule profiles to be a common format that is
    registered through the rule registry for the deployment process. For deploying
    the rules to the heterogeneous IoT platforms, the device proxies translate the
    common format to platform-specific style and delivers it to the corresponding
    platform. Within the agent, each device proxy only considers the corresponding
    IoT network to perform translation and deployment. Based on the agent, the heterogeneous
    IoT platforms operates the common rule scenario although heterogeneous rules are
    delivered to the environment. Recommendation ITU-T Y.4503 specifies a framework
    of common rule enablement for intelligent IoT services in heterogeneous IoT platform
    environments.\r\n"
