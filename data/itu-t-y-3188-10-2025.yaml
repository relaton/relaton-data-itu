abstract:
- language: en
  script: Latn
  content: "With the continuous cloudification of enterprise information and communication
    technology (ICT) and the continuous deployment of advanced industrial sensors,
    virtual reality (VR) and artificial intelligence (AI) applications, more and more
    data need to be transmitted from enterprise branches and individual users to the
    cloud for processing, and the calculation results need to be provided quickly
    for feedback and collaboration. All these applications require large data transmission
    across end-to-end networks. End-to-end networks are required to provide new functions
    to support applications that demand large data transmissions.\r\nThis Recommendation
    gives an overview of applications demanding large data transmission, analyses
    common application characteristics and identifies related requirements for International
    Mobile Telecommunications-2020 (IMT-2020) networks and beyond. According to the
    requirements, enhanced network functions and new network functions to support
    applications demanding large data transmission are specified with respect to IMT-2020
    networks and beyond functions identified in Recommendation ITU-T Y.3102. \r\nNOTE
    1 – The Recommendation focuses on the specification of requirements and network
    functions from an end-to-end network perspective, and does not intend to address
    specifically how these network functions can be implemented, including via current
    and/or future technologies or protocols. The implementation of these network functions
    is expected to be developed by other appropriate standards development organizations
    (SDOs). \r\nNOTE 2 – The applications that generate large data and the network
    infrastructure over which these applications are carried are responsible for ensuring
    appropriate data privacy. Data privacy aspects are outside the scope of the Recommendation.\r\n"
