abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T L.1620, Guide to circular cities, contains circular
    city implementation framework that is designed to improve circularity in cities
    and support stakeholders in implementing circular actions. The framework consists
    of a four-step methodology that provides a consistent method for assessing, prioritising
    and catalysing different circular actions. The Recommendation is developed in
    response to the growing sustainability challenges that cities are facing and the
    emergence of the circular economy concept and its applicability and extension
    in the city setting. Supplement 50 to ITU-T L-series Recommendations aims to further
    support the circular city implementation framework by providing 17 case studies
    on cities implementing circularity in urban operations.
