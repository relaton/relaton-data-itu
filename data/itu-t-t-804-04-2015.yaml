abstract:
- language: en
  script: Latn
  content: "Rec. ITU-T T.800 | ISO/IEC 15444-1 defines a set of lossless and lossy
    compression methods for coding continuous-tone, bi-level, greyscale or colour
    digital still images. This Recommendation | International Standard provides three
    independently created software reference implementations of Rec. ITU-T T.800 |
    ISO/IEC 15444-1, in order to assist implementers of Rec. ITU-T T.800 | ISO/IEC
    15444-1 in testing and understanding its content:\r\n–\tJASPER\r\n–\tJJ2000\r\n–\tOPENJPEG\r\nThe
    three reference software packages are informative only. This Recommendation |
    International Standard does not define any additional part of the JPEG 2000 image
    coding system.\r\nEach version of the reference software contains source code,
    which may be compiled to provide the following functionality:\r\n–\ttranscoding
    from selected, widely available image formats into a JPEG 2000 codestream;\r\n–\ttranscoding
    from selected, widely available image formats into the JP2 file format;\r\n–\tselection
    of a wide range of JPEG 2000 encoding options (as documented in each reference
    software);\r\n–\tdecoding from a JPEG 2000 codestream to a range of selected widely
    available image formats;\r\n–\tpartial processing of a JP2 file to extract a JPEG
    2000 codestream for decoding to a range of selected widely available image formats
    (not included in the reference software);\r\n–\tsome additional tools to help
    with evaluation and testing.\r\nThe reference software packages are intended for
    use as a testing and validation tool for other implementations of JPEG 2000, and
    to help in the understanding of Rec. ITU-T T.800 | ISO/IEC 15444-1. Although components
    of the reference software may find application in software intended for product
    development, this was not an objective of the development of this software, and
    prospective implementers are cautioned against making any estimations of performance
    or resource usage based on the reference software.\r\nThis new edition integrates
    the contents of Rec. ITU-T T.804 (2002) | ISO/IEC 15444-5:2003, its Amendment
    1 (2014) | Amd.1:2003 and its Amendment 2 (2015) | Amd.2:2015."
