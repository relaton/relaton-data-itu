abstract:
- language: en
  script: Latn
  content: "Supplement 2 to ITU-T L-series Recommendations has been developed to provide
    examples to assess the life cycle environmental impact of ICT goods, networks
    and services (GNS) based on Recommendation ITU-T L.1410. This Supplement focuses
    on illustrating the results of reduced greenhouse gas (GHG) emissions that have
    been achieved through increased efficiency in ICT services. These results represent
    a small number of the many examples that are expected to supplement Recommendation
    ITU-T L.1410 in the future.\r\nThis Supplement is intended for implementers and
    organizations developing ICT services, and persons responsible for the deployment
    of sustainable ICT services, including office workers, policy makers and those
    in academia."
