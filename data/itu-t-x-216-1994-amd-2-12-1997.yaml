abstract:
- language: en
  script: Latn
  content: The Presentation service definition defined in ITU-T Rec. X.216 | ISO/IEC
    8822 is enhanced to define an optional functional unit which permits additional,
    independent, nested presentation connections within an existing presentation connection.
    This enhancement will support the reusability of existing application layer standards
    (each making full, and possibly incompatible, use of the presentation synchronization
    services) as components of new application layer standards.
