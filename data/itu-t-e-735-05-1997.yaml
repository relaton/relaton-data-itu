abstract:
- language: en
  script: Latn
  content: This Recommendation provides a framework for traffic control and dimensioning
    in B-ISDN. This Recommendation gives an overview of the traffic engineering tasks
    required for configuring the network; it describes the network aspects that are
    relevant for traffic engineering; it defines the network resources to be considered
    and explains the relation between cell-level traffic controls (described in Recommendation
    E.736) and call-level traffic controls and dimensioning (described in Recommendation
    E.737). Finally this Recommendation gives guidelines on strategies for configuration
    of network VPCs.
