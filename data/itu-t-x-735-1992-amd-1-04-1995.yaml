abstract:
- language: en
  script: Latn
  content: This amendment includes tables, which document the mandatory and optional
    management information specific to the Log Control Management Function. This amendment
    will be used by Profile specifiers, for example those developing International
    Standardizes Profiles (ISPs), to specify an explicit subset of capability, which
    will afford interoperability between implementatations. The tables also include
    a column for equipment vendors to state the capability of their products in terms
    of the Profiles or base specification. The table structures comply with the Guidelines
    for Implementation Conformance Statement Proformas specified in ITU-T Recommendation
    X.724 | ISO/IEC 10165-6.
