abstract:
- language: en
  script: Latn
  content: 'This Recommendation defines the parameter sets for analogue interface
    specifications for video signals between television set-top boxes and television
    presentation devices in the home, when such signals are provided in analogue component
    video form carried on three parallel channels.This Recommendation has three appendices
    (I, II, and III), that provide specifications for: 525-line (total scan lines)
    TV devices (i.e. with 480 active lines), and 750-line TV devices (720 active lines),
    and 1125-line TV devices (1080 active lines). This reflects the fact that a number
    of TV systems are in use on a worldwide basis and it is necessary to define parameter
    sets for the associated devices.Appendix IV describes the interface between digital
    tuner and television receiver using D-connector selected from EIAJ CP-4120.'
