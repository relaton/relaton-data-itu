abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.748.80 specifies the framework and requirements
    for collaborative three-dimensional (3D) design services, these services provide
    a cloud-based platform where multiple users can jointly create, edit, and manage
    3D models in real time. They integrate core capabilities such as model transformation,
    lightweight optimization, and rendering with collaborative tools like version
    control and multi-user editing. This Recommendation specifies the overview, framework
    and detailed requirements for such services.\r\n"
