abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1376 describes a security-related misbehaviour
    detection mechanism for connected vehicles to help stakeholders to utilize automotive
    data to improve vehicle security. \r\n\r\nAs connectivity of vehicles increases,
    the number of vulnerabilities is rising due to the development of complex technology.
    These vulnerabilities bring more threats to connected vehicles. Analysis of a
    large amount of automotive data is very useful for assessing security of connected
    vehicles. \r\n"
