abstract:
- language: en
  script: Latn
  content: This Recommendation provides a generic network information model. The model
    describes managed object classes and their properties that are generic and useful
    to describe information exchanged across all interfaces defined in M.3010 TMN
    architecture. These generic managed object classes are intended to be applicable
    across different technologies, architecture and services. The managed object classes
    in this Recommendation may be specialized to support the management of various
    telecommunications networks.
