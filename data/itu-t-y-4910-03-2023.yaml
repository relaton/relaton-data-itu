abstract:
- language: en
  script: Latn
  content: "With the rapid development of advanced information technologies such as
    the Internet of things (IoT), big data and cloud computing, the traditional supply
    chain has been transformed into a digital supply chain. Digital supply chains
    may help to maintain high growth by reducing operation costs and improving the
    efficiency of supply chain management with the help of digital methods. As a result,
    digital supply chains can assist with the construction and management of smart
    sustainable cities (SSC). \r\nRecommendation ITU-T Y.4910 provides a maturity
    model of digital supply chain for SSC referring to the key performance indicators
    (KPIs) for SSCs in Recommendation ITU-T Y.4900 and the maturity model for SSC
    in Recommendation ITU T Y.4904. Both of these Recommendations support the maturity
    model for digital supply chains. The use of the maturity model for digital supply
    chains has specific benefits for socioeconomic indicators, such as: environmental
    sustainability, productivity, innovation, and trade. This maturity model helps
    identify the goals, levels, dimensions and assessment methods of digital supply
    chain for SSC. It is designed as a practical tool for city managers and all related
    stakeholders to study the performance and benefits of digital supply chain from
    economic, social and environmental perspectives. Thus, this Recommendation gives
    general guidance for accurately assessing the maturity of digital supply chains
    and help in achieving sustainable development goals for SSC.\r\n"
