abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1124 describes a service layer authentication architecture
    for mobile end-to-end data communication between mobile users and various service
    providers in the network. The generic negotiation mechanisms and authentication
    procedures specified in this Recommendation support both those entities that have
    miscellaneous authentication capabilities and those entities that have differentiated
    security requirements. The authentication addressed in this Recommendation is
    used for service providers and requesters and is independent of network access
    authentication of the mobile users.
