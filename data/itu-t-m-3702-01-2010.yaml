  content: Recommendation ITU-T M.3702 provides the requirements and analysis for
    one of the common management services - notification management. The functional
    requirements for notification management interface include the management functions
    for notification subscription, notification type, notification storage and recovery.
    In the analysis part, the detail information model supporting the above function
    across the management interface is provided.
