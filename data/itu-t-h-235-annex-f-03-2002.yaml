abstract:
- language: en
  script: Latn
  content: The purpose of this annex is to describe an efficient and scalable, PKI-based
    hybrid security profile for Version 2 of H.235. The hybrid security profile contained
    herein takes advantage of the security profiles in H.235 Annex D and in H.235
    Annex E by deploying digital signatures from H.235 Annex E and deploying the baseline
    security profile from H.235 Annex D.
