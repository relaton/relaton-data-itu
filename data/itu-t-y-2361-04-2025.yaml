abstract:
- language: en
  script: Latn
  content: "Service universalization is the process to provide telecommunication services
    to every individual or group of people irrespective of social, geographical and
    economical status. A total of 193 United Nations member states agreed to work
    towards reaching ICT Universalization by 2030 as part of the Sustainable Development
    Goals. Most existing networks are in economically attractive areas and this causes
    a digital divide in developing countries that requires the coordination of private
    and public entities to benefit sectors where investment incentives are not sufficient.
    The adoption of open network principles has the potential to improve the competitive
    environment for manufacturers and operators and altogether with the use of artificial
    intelligence (AI) models, has a strong potential to reduce CAPEX and OPEX. The
    aggregation of both technologies, AI and open networks, has a potential to reduce
    costs and provide affordable services with a higher quality than in traditional
    networks. Recommendation ITU-T Y.2361 identifies requirements of open networks
    and AI models and proposes recommendations for fostering universalization of telecommunications/ICT
    services by network deployment in developing countries.\r\n"
