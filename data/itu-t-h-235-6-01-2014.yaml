abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.235.6 holds the security procedures for the encryption
    profile (formerly in Annex D of Recommendation ITU-T H.235 version 1) including
    the accompanying native ITU\x1ET H.235/H.245 key management. \r\nThis revision
    introduces support for key lengths larger than 2048 bits. In previous versions,
    bit sizes of 3072 and 4096 were defined. However, the field size defined in Recommendation
    ITU-T H.235.0 was limited to 2048 bits.\r\nVersion 4 of Recommendation ITU-T H.235
    broke up Recommendation ITU-T H.235 version 3 into a suite of ITU-T H.235.x sub-series
    Recommendations, and it restructured the sub-series. In earlier versions, prior
    to version 4 of the ITU-T H.235 sub-series, this profile was contained in the
    main body and Annex D of Recommendation ITU-T H.235 version 1. Appendices IV,
    V and VI to Recommendation ITU-T H.235.0 show the complete clause, figure and
    table mapping between Recommendation ITU-T H.235 versions 3 and 4."
