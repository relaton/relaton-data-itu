abstract:
- language: en
  script: Latn
  content: "The number of organizations processing personally identifiable information
    (PII) is increasing, as is the amount of PII that these organizations deal with.
    At the same time, societal expectations for the protection of PII and the security
    of data relating to individuals are also increasing. A number of countries are
    augmenting their laws to address the increased number of high profile data breaches.\r\n\r\nThis
    document establishes control objectives, controls and guidelines for implementing
    controls, to meet the requirements identified by a risk and impact assessment
    related to the protection of Personally Identifiable Information (PII). In particular,
    this document specifies guidelines based on ISO/IEC 27002, taking into consideration
    the requirements for processing PII which may be applicable within the context
    of an organization's information security risk environment(s).\r\n"
