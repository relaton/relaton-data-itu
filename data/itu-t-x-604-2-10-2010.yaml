abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard describes the functions and
    procedures of Mobile Multicast Communications part 3 (MMC-3) protocol which is
    an application-layer multicast protocol constructing an one-to-many overlay multicast
    tree for multicast data delivery from one sender to multiple receivers over fixed
    and mobile converged network environment. The MMC-3 protocol consists of Session
    Manager, Multicast Agent, Mobile Multicast Agent, and Mobile Node. The Session
    Manager manages and controls MMC-3 sessions. The Multicast Agent provides multicast-based
    service over fixed network environment, and Mobile Node provides multicast-based
    service over mobile network environment with the support from Mobile Multicast
    Agent. This Recommendation | International Standard specifies the functions of
    MMC-3 protocol entities and the procedures of the MMC-3 protocol operations. The
    MMC-3 protocol supports applications requiring capability of one-to-many multicast
    data delivery. Examples of such applications are mobile IPTV service, mobile NEWS
    ticker service, file distribution, e-learning, etc.
