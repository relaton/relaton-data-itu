abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1197 provides guidelines on the criteria for selecting
    cryptographic algorithms for IPTV service and content protection (SCP). It also
    provides a list of cryptographic algorithms to provide confidentiality, data origin
    authentication and integrity for IPTV SCP services.\r\n\r\nAmendment 1 updates
    Appendices I and II to reflect the state of the art as of August 2019, including
    bibliographical references."
