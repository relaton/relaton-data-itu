abstract:
- language: en
  script: Latn
  content: "Performing arts is a generic term for artistic acts presented in real
    time on stage for an audience. These performances are rapidly shifting from offline
    to online virtual environments due to the spread of non-face-to-face culture,
    influenced by external factors such as the COVID-19 pandemic and the development
    of digital technologies.\r\nThe interactive virtual performing arts services framework
    is an ICT-based framework that enables stage performances in a virtual environment,
    allowing performers and audiences to interact through their avatars.\r\nRecommendation
    ITU-T F.746.20 specifies a framework for interactive virtual performing arts services.
    The framework establishes common requirements for avatar-based representation,
    real-time interaction, and coordinated management of the stage, auditorium, assets,
    and audiences, supported by seamless connectivity and stakeholders. It defines
    components, data and control architecture, core functional components and an operation
    model to enable interoperability and comparability of interactive virtual performing
    arts services across different platforms and providers.\r\n"
