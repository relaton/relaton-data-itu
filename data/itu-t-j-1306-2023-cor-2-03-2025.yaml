abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T J.1306 specifies the architecture and related components
    of audiovisual media based on microservice technologies. Recommendation ITU-T
    J.1306 fulfils the requirements in Recommendation ITU-T J.1305. This Recommendation
    applies to the design, development, construction, operation and maintenance of
    audiovisual media systems based on microservices. Recommendation ITU-T J.1306
    is based on the characteristics of microservice technology and audiovisual media
    business, combines the requirements of technology and business, and devises an
    audiovisual media microservice architecture (MMA) that meets the needs of rapid
    iteration and diversified services of the audiovisual media business. MMA follows
    the layered architectural methodology specified in Recommendation ITUT J.1302.
    Mainly from the perspective of cloud platform, Recommendation ITU-T J.1302 stipulates
    the system architecture of cloud-based converged media services (CBCMSs) to support
    Internet protocol and broadcast cable television services. From the perspective
    of microservice, Recommendation ITU-T J.1306 specifies the microservices architecture
    of integrated media based on container, virtual machine, cloud and other infrastructures
    to support the audiovisual media business carried out by microservices on a variety
    of infrastructures. From the perspective of microservice governance, Recommendation
    ITU-T J.1306 realizes the compatibility of various current mainstream microservice
    frameworks and stipulates the management capabilities of distributed systems.
    From the media business perspective, it specifies the microservice components
    that support production, broadcasting, transmission, distribution, interaction
    and other audiovisual media business. From the perspective of application integration,
    it stipulates the service orchestration capabilities and the means of application
    assembly.\r\n"
