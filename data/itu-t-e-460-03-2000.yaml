abstract:
- language: en
  script: Latn
  content: This Recommendation describes measurements and metrics for monitoring the
    performance of V.34 group 3 facsimile. There are two options in T.30 for V.34
    fax over the PSTN. These are described in Annexes C and F of T.30. At present
    no known implementations use Annex C/T.30; they use either Annex F/T.30 or some
    other proprietary method. It is possible to map many of the measurements and metrics
    from E.459 onto monitoring of V.34 fax.
