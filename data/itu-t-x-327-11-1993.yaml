abstract:
- language: en
  script: Latn
  content: This Recommendation describes the interworking arrangements between PSPDNs
    and private data networks for the provision of data transmission services. These
    interworking arrangements include the capabilities required to support the network
    service for Open Systems Interconnection for ITU-T applications as described in
    Recommendation X.213. The current Recommendation has taken into account the market
    demand for the PSPDN to provide the gateway function allowing interconnection
    on a peer-to-peer basis between the public and private network.
