abstract:
- language: en
  script: Latn
  content: "The objective of Supplement 1 to the ITU-T K-series Recommendations is
    to answer questions commonly posed by the public on the electromagnetic field
    (EMF) phenomenon and to address related concerns.\r\nThis Guide on electromagnetic
    fields and health aims to:\r\n• Provide electromagnetic field (EMF) information
    and education resources suitable for all communities, stakeholders and governments.\r\n•
    Support clarification of the science by referencing the World Health Organization
    (WHO) and other stakeholders (see NOTE) that provide information that is particularly
    useful in helping to clarify scientific uncertainties e.g., in the areas of radio
    frequency (RF) technology, infrastructure implementation, usage and consequential
    EMF exposure.\r\nNOTE – The primary reference on EMF and health is the World Health
    Organization (WHO). The primary reference on EMF assessment methods is the International
    Telecommunication Union (ITU) and the International Electrotechnical Commission
    (IEC)."
