abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T T.834 has been developed jointly with ISO/IEC JTC
    1 SC 29/WG 1 in a collaborative team that is referred to as the Joint Photographic
    Experts Group (JPEG). It will be published as a technically-aligned twin text
    by both organizations (ITU-T and ISO/IEC).This Recommendation | International
    Standard specifies tests designed to verify whether codestreams, files, encoders,
    and decoders meet the normative requirements specified in Recommendation ITU-T
    T.832 | ISO/IEC 29199-2 (Information technology - JPEG XR image coding system
    - Image coding specification).- A codestream (or file) can be claimed to conform
    to Recommendation ITU-T T.832 | ISO/IEC 29199-2 if it meets the normative requirements
    for such codestreams (or file) specified in Recommendation ITU-T T.832 | ISO/IEC
    29199-2.- An encoder can be claimed to have codestream (or file format) conformance
    to Recommendation ITU-T T.832 | ISO/IEC 29199-2 if the codestreams (or files)
    that it generates are conforming codestreams (or files).- A decoder can be claimed
    to conform to a specified subset of Recommendation ITU-T T.832 | ISO/IEC 29199-2
    capabilities (such as a combination of "profile" and "level" capabilities) if
    it can properly decode all codestreams (or files) obeying the constraints specified
    in Recommendation ITU-T T.832 | ISO/IEC 29199-2 for the specified subset of capabilities.The
    tests specified in this Recommendation | International Standard provide methods
    for (non-exhaustive) testing of whether encoders and decoders meet these requirements.A
    set of data for use in such tests is provided as an electronic attachment to this
    Recommendation | International Standard and is an integral part thereof. This
    data set is also available for download from the ITU-T Test Signal Database at:
    http://itu.int/net/ITU-T/sigdb/speimage/Tseries-s.htm#T.834.'
