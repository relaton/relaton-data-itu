abstract:
- language: en
  script: Latn
  content: This Recommendation explains how audio-based network navigation systems
    can be designed to ensure that they are inclusive and meet the needs of persons
    with visual impairments. The Recommendation adopts a technology neutral approach
    by defining and explaining the functional characteristics of the system. The aim
    is to give designers of audio-based network navigation systems the information
    that they need at the initial stages of development to anticipate and overcome
    any restrictions and barriers that prevent users with visual impairments from
    making full and independent use of the built environment. This Recommendation
    explains how to accommodate users’ experience of audio-based network navigation
    systems and ensure the interoperability of those systems. This Recommendation
    recognizes that by meeting the user needs of persons with visual impairments,
    audio-based network navigation systems may also benefit persons with other disabilities,
    age related disabilities, specific needs and everyone.
