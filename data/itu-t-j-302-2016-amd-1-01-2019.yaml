abstract:
- language: en
  script: Latn
  content: "Augmented reality (AR) technology is a kind of mixed reality in which
    2D/3D graphics are integrated into the real world in order to enhance user experience
    and enrich information. Augmented reality smart television (AR-STV) is TV broadcasting
    using AR technology to blend augmented content (2D/3D graphic object) with broadcasting
    content in real-time on receiving terminals. The augmented content overlaid in
    the augmentation region is fixed statically or moves along the trajectory as if
    an AR‑based location application shows path information on the real location from
    a smart-phone's camera. AR-STV provides that TV viewers can choose whether to
    turn on the augmented content or watch the original TV content only (without the
    augmented content).\r\n\r\nRecommendation ITU-T J.302 specifies the related technologies
    that should be implemented for an augmented reality smart television system.\r\n\r\nAmendment
    1 introduces support for real-time comment sharing services.\r\n"
