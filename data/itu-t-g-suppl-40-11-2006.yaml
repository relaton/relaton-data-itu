abstract:
- language: en
  script: Latn
  content: This Supplement provides information on the background and specifications
    used in the development of optical fibre and cable ITU-T Recommendations such
    as [ITU-T G.651], [ITU-T G.652], [ITU-T G.653], [ITU-T G.654], [ITU-T G.655],
    [ITU-T G.656], [ITU-T G.657] and L series. It also contains information used in
    the development of test method Recommendations such as [ITU-T G.650.1] and [ITU-T
    G.650.2]. Moreover, this Supplement maps ITU-T documents to optical fibre and
    cable standards developed under IEC.
