abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation Z.163 defines the graphical presentation format for
    the TTCN-3 core language as defined in ITU-T Recommendation Z.161. This presentation
    format uses a subset of Message Sequence Charts as defined in ITU-T Recommendation
    Z.120 with test specific extensions.This Recommendation is based on the core TTCN-3
    language defined in ITU-T Recommendation Z.161. It is particularly suited to display
    tests as GFTs. It is not limited to any particular kind of test specification.The
    specification of other formats is outside the scope of this Recommendation.
