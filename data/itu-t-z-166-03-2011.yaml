abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Z.166 specifies the control interfaces for TTCN-3
    test system implementations. The TTCN-3 Control Interfaces provide a standardized
    adaptation for management, test component handling and encoding/decoding of a
    test system to a particular test platform. This Recommendation defines the interfaces
    as a set of operations independent of a target language.The interfaces are defined
    to be compatible with the TTCN-3 standards (see clause 2). The interface definition
    uses the CORBA Interface Definition Language (IDL) to specify the TCI completely.
    Clauses 8 and 9 present language mappings for this abstract specification to the
    target languages Java and ANSI C. A summary of the IDL-based interface specification
    is provided in Annex A.This first revision of the Recommendation contains amendments
    (i.e., C++ and C# language mappings), numerous clarifications, corrigenda and
    editorial corrections.This revision of the Recommendation corrects an error in
    the code specification of ETSI ES 201 387-6 V.4.2.1 TCI-CH provided interface
    in clause 8.5.3.1 in such a way that tciTestComponentRunningReq, tciTestComponentDoneReq,
    tciTestComponentAliveReq, and tciTestComponentKilledReq all return public Boolean
    as result.This Recommendation is technically aligned with ETSI ES 201 873-6 V4.2.1
    (2010-07).
