abstract:
- language: en
  script: Latn
  content: "Distributed ledger technology (DLT) features include immutability, data
    sharing, decentralization, and tamper-resistance. Certain security services can
    benefit from the decentralized nodes of DLT to solve problems such as single point
    of failure, bottleneck performance and tampering.\r\nRecommendation ITU-T X.1409
    identifies aspects to be evaluated before delivering a security service based
    on DLT and provides examples to implement four security services which could be
    delivered based on DLT, namely:\r\n•\tDLT-based public-key certificate management;\r\n•\tDLT-based
    software defined perimeter;\r\n•\tDLT-based threat intelligence sharing; and\r\n•\tDLT-based
    security audit.\r\n"
