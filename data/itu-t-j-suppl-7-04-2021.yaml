abstract:
- language: en
  script: Latn
  content: "Supplement 7 to ITU-T J-series Recommendations serves as a guidance document,
    which contains performance parameters and values as well as use cases for the
    embedded common interface (ECI) for exchangeable CA/DRM solutions and complements
    ECI-related ITU-T Recommendations covering the ECI Ecosystem. This ITU-T Supplement
    is a transposition of ETSI Group Report ETSI GR ECI 004 and is a result of a collaboration
    between ITU-T SG9 and ETSI ISG ECI. A minor amendment was introduced with a new
    clause 6.4. \r\n"
