abstract:
- language: en
  script: Latn
  content: Splices are critical points in the optical fibre network, as they strongly
    affect not only the quality of the links, but also their lifetime. In fact the
    splice shall ensure high quality and stability of performance with time. High
    quality in splicing is usually defined as low splice loss and tensile strength
    near that of the fibre proof-test level. Splices shall be stable over the design
    life of the system under its expected environmental conditions.At present two
    technologies, fusion and mechanical, can be used for splicing glass optical fibres
    and the choice between them depends upon the expected functional performance and
    considerations of installation and maintenance. These splices are designed to
    provide permanent connections.
