abstract:
- language: en
  script: Latn
  content: 'Videophone, videoconferencing and other conversational multimedia services
    on fixed bit-rate networks (such as ISDN) depend on the multiplex structure described
    in Recommendation ITU-T H.221. The control channel within this multiplex is the
    so-called bit-rate allocation signal (BAS) position in each frame. This Recommendation
    describes all the point-to-point procedures involving the BAS codes: initial capability
    exchange and mode initialization, including restricted-network operation; in-session
    mode switching, including audiovisual mode changes and activation of data channels;
    other procedures, including single/multiple channel interconnection, encryption,
    mode-preference indication, conveyance of network addresses and use of BAS extension
    codes.This revised version of Recommendation ITU-T H.242 introduces a number of
    enhancements and clarifications to the previous version, primarily the description
    on the usage of G.719 and Annex C of Recommendation ITU-T G.722.1 (14 kHz audio)
    in H.320 systems.'
