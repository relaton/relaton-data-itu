abstract:
- language: en
  script: Latn
  content: "With evolving network technology, network as a service (NaaS) has emerged
    as an issue for organizations in terms of network infrastructure consumption.
    Consequently, the question of how best to achieve efficient, flexible and automatic
    telecommunication service design (TSD) needs to be addressed. Recommendation ITU-T
    M.3392 provides the requirements for TSD within smart operation, management and
    maintenance (SOMM), which encompasses object design, operation activity design
    and verification.\r\nAmendment 1 revises the definition of the term \" telecommunication
    service design (TSD)\" as requested by the Standardization Committee for Vocabulary/Coordination
    Committee for Terminology\r\n"
