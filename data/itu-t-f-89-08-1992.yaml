abstract:
- language: en
  script: Latn
  content: The provisions of this Recommendation are limited to enquiries concerning
    messages handled by an interworking function (IWF) in accordance with the relevant
    F.80-Series Recommendations. Status enquiry in respect of messages deposited into
    a telex store and forward unit (SFU) for delivery to the international telex service
    are handled in accordance with Recommendation F.72. The provisions of this Recommendation
    should be applied to future implementations and, as far as possible, to existing
    implementations of IWF and SFU, in the latter case as an alternative to the provisions
    of Recommendation F.72 in respect of status enquiry
