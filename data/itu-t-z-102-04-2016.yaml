abstract:
- language: en
  script: Latn
  content: "Recommendation Z.102 defines the comprehensive features of the Specification
    and Description Language. Together with Recommendations ITU-T Z.100, ITU-T Z.101,
    ITU-T Z.103, ITU‑T Z.104, ITU-T Z.105, ITU-T Z.106 and ITU-T Z.107, this Recommendation
    is part of a reference manual for the language. The language defined in this document
    covers features of the language not included in Basic SDL‑2010 in Recommendation
    ITU-T Z.101. These features provide comprehensive coverage of abstract grammar
    of the language except some data features covered in ITU-T Z.104 (and ITU-T Z.107
    for object‑oriented data).\r\n\r\nCoverage\r\n\r\nThe Specification and Description
    Language has concepts for behaviour, data description and (particularly for larger
    systems) structuring. The basis of behaviour description is extended finite state
    machines communicating by messages. Data description is based on data types for
    values and objects. The basis for structuring is hierarchical decomposition and
    type hierarchies. A distinctive feature of the Specification and Description Language
    is the graphical representation. This Recommendation covers additional features
    to Recommendation ITU-T Z.101. The concrete grammar given is the graphical representation.
    The alternative textual programming representation is given in Recommendation
    ITU-T Z.106. The concrete grammar in this Recommendation with Recommendations
    ITU-T Z.101 and ITU-T Z.104 (and ITU-T Z.107 for object‑oriented data) gives a
    canonical syntax, which is extended in ITU-T Z.103 to a syntax that is easier
    to use. The features of the language defined in Recommendation ITU-T Z.102 make
    the language more comprehensive.\r\n\r\nApplications\r\n\r\nThe Specification
    and Description Language is applicable within standard bodies and industry. The
    main application areas for which the Specification and Description Language has
    been designed are stated in ITU-T Z.100, but the language is generally suitable
    for describing reactive systems. The range of applications is from requirement
    description to implementation. The features of the language defined in Recommendation
    ITU-T Z.102 allow more complex models to be defined than is practical with ITU-T
    Z.101, but without the features of Recommendation ITU-T Z.103 that make the language
    more concise and informative. This Recommendation provides a basis for the features
    defined in Recommendation ITU-T Z.103, which (with ITU-T Z.104 for data and ITU-T
    Z.107 for object‑oriented data) completes the main language feature set.\r\n"
