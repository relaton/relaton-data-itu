abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard contains new additional optional
    application contexts for the new versions of P3 and P7 introduced in Recommendations
    X.411 and X.413. The P1 conformance requirement has been revised to achieve common
    text with ISO/IEC. The ASN.1 has been fully revised to use the new Recommendations
    X.680 and X.880, while retaining complete compatibility with the 1988 and 1992
    P1 and P3 protocols. Numerous defect corrections are incorporated.
