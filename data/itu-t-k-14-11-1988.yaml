abstract:
- language: en
  script: Latn
  content: "This Recommendation deals with planning and constructing telecommunication
    cable lines.It gives information about:\r\n- the usefulness of a metallic screen
    in cases where noise interference may arise (e.g. in the vicinity of electrified
    railway lines, especially when thyristor controlled equipment is installed on
    locomotives);\r\n- types of cables that should contain a metallic screen;\r\n-
    properties of such screens;\r\n- calculation of the screening factor;\r\n- parameters
    affecting the screening factor (e.g. insulation of the outer covering, length
    of the cable);\r\n- measuring the cable parameters.Reference is made to the Directives,
    Vol. IX and the manual The Protection of Telecommunication Lines and Equipment
    against Lightning Discharges, 1974, 1978."
