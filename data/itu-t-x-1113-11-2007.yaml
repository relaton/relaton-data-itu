abstract:
- language: en
  script: Latn
  content: Some environments necessitate the authentication of the human user rather
    than a process or a device. In authenticating human users, the authentication
    system requires human users to prove their uniqueness. Such uniqueness is generally
    based on various authentication means such as something known, something possessed
    or some immutable characteristics for each human user. In this Recommendation,
    a guideline on user authentication mechanism for home network services is provided.
    It also considers various security issues according to ITU-T Recommendation X.1111,
    which specifies the framework of security technologies for home network. Finally,
    the security assurance level and authentication model are defined according to
    authentication service scenarios.
