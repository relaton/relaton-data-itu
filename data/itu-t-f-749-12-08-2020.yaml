abstract:
- language: en
  script: Latn
  content: "The civilian unmanned aerial vehicles are widely used in industry and
    consumer areas such as agriculture and plant protection, power line and petroleum
    pipeline inspection, police and traffic security surveillance, disaster monitoring,
    aerial photography and videography, express delivery, forestry and forest fire
    monitoring, meteorological, resource and scientific research, etc.\r\nRecommendation
    ITU-T F.749.12 presents the general framework for communication application of
    civilian unmanned aerial vehicle (CUAV) and its functional entities, reference
    points, etc."
