abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T D.1101 addresses the measures for strengthening the
    commercial cooperation between over the top (OTT) providers and telecom operators.
    Given that network operators and OTTs are part of the international telecommunication/information
    and communication technology (ICT) ecosystem, this Recommendation encourages relevant
    stakeholders to work towards an enabling regulatory environment that supports
    and encourages the development of innovative business models in line with the
    advancement of technology and innovations, which are changing faster than ever.
