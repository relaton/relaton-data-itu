abstract:
- language: en
  script: Latn
  content: "With the rapid growth of IoT platform technology, many sensors and devices
    can be connected. IoT applications require energy efficiency because most IoT
    devices run on constrained battery power. IoT applications involve many smart
    devices, making energy issues more essential for decreasing carbon footprints
    and costs. Moreover, energy efficiency is crucial because IoT platforms comprise
    many interconnected devices and services that require a lot of energy. With the
    strong emergence of AI nowadays, the IoT platform is integrated with AI to enhance
    the decision-making process in the IoT platform, improving the value of the data
    generated by the IoT platform. The integration between the IoT platform and AI
    functionality gave rise to a new paradigm called the intelligent IoT platform.\r\nRecommendation
    ITU-T L.1341 specifies the functional requirements essential for achieving sustainable
    and robust energy efficiency in intelligent Internet of Things (IoT) platforms.
    These platforms, defined as comprehensive technological frameworks integrating
    artificial intelligence (AI) and edge computing, face significant energy challenges
    due to the computational complexity introduced by AI and the collective power
    demand of a massive volume of interconnected devices. Recognizing that the integration
    of artificial intelligence (AI) and the immense scale of IoT deployments introduce
    significant energy consumption challenges, this document mandates a holistic approach
    to energy management across the entire system. This Recommendation first identifies
    considerations for energy management in intelligent IoT platforms in respect of
    hardware specifications, data collection and processing, AI models and operation
    and management. Functional requirements for energy efficiency in intelligent IoT
    platforms are then addressed in regard to intelligent data acquisition and processing,
    energy-efficient communication protocols,  dynamic AI resource management, energy
    monitoring and management, AI-enhanced energy optimization and lifecycle energy
    efficiency management. In addition, best practices to improve energy efficiency
    in intelligent IoT platforms are given in Appendix I, with energy-aware IoT architecture
    design, energy-efficient data management, green networks and communication, AI-based
    energy optimization, energy harvesting and sustainable power solutions and cooperative
    energy saving techniques with the edge and cloud.\r\n"
