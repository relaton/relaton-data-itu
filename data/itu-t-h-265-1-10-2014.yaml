abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.265.1 \"Conformance specification for ITU-T H.265
    high efficiency video coding\" specifies tests for (non-exhaustive) testing to
    verify whether bitstreams and decoders meet the normative requirements specified
    in Rec. ITU\x1ET H.265 | ISO/IEC 23008-2. The bitstreams provided in this Recommendation
    correspond to the 04-2013 version of Rec. ITU-T H.265 | ISO/IEC 23008-2.\r\nThis
    Recommendation was developed jointly with ISO/IEC JTC 1/SC 29/WG 11 (MPEG) and
    corresponds in a technically aligned manner to ISO/IEC 23008-8.\r\nThe conformance
    bitstreams needed for this Recommendation are available at the following link:
    http://handle.itu.int/11.1002/2000/12297."
