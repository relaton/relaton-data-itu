abstract:
- language: en
  script: Latn
  content: "This Supplement gives guidelines for use of the DVB interaction channel
    for Cable TV distribution systems (CATV) specification of Annex A/J.112 [2].\r\nHybrid
    Fibre Coax (HFC) networks are a sub-class of CATV networks in which the subscribers
    are divided into groups by using optical transmission technology in the trunk
    network.\r\nThe CATV infrastructures can support the implementation of the RC
    for interactive services suitable for DVB systems.\r\nCATV can be used to implement
    interactive services in the DVB environment, providing a bidirectional communication
    path between the user terminal and the service provider."
