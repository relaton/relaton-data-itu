abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.2325 aims to standardize an evolved NGN control
    plane architecture that is scalable, simplified and flexible, by decoupling the
    end-user signalling handling functionality and the user plane control functionality
    and also treating the signalling as a user service (data) leading to uniform handling
    of services. This Recommendation includes the description of information flow
    for services such as network attachment, session establishment and registration
    for the recommended architecture.\r\n"
