abstract:
- language: en
  script: Latn
  content: The international CAS package (icas) provides an extension to the basic
    CAS packages, defining additional line signals and events required for international
    signalling protocols.For some international protocols, such as some variants of
    the R2 signalling system, it would typically be necessary to implement the bcas,
    icas and casblk packages to fully support the interface. In addition, register
    signalling will require support of either the bcasaddr package for non-compelled
    signalling, or a package to perform compelled signalling.This version of this
    Recommendation adds new read-only properties containing the current CAS state
    of the termination, to allow the MGC to resynchronize itself in the event that
    it loses track of this state.
