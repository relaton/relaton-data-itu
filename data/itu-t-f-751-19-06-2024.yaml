abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.751.19 specifies the framework and technical requirements
    for distributed ledger technology based on the sharding technique, and it can
    be used as a guideline to perform DLT system scalability.\r\nSharding technique
    helps to improve the scalability of distributed ledger technology (DLT) systems,
    including the transaction processing throughput and ledger storage capacity, without
    compromising the decentralization and security.\r\n\r\n"
