abstract:
- language: en
  script: Latn
  content: "The current foundation model has become an important technological path
    to promote the development of the multimedia industry. In the process of technological
    innovation and application implementation, training and inference cluster system
    need to meet new requirements. In practical applications, the demands placed on
    the cluster system vary depending on the type and scale of the models in use.
    Consequently, developing a comprehensive framework for system capabilities to
    assist stakeholders in selecting appropriate technologies has become a key focus
    within the industry.\r\nRecommendation ITU-T F.748.78 specifies the requirements
    for the cluster system in the context of foundation models, clarifies the capabilities
    required for foundation model training and inference cluster system, and promotes
    the construction of efficient, stable and scalable foundation model training and
    inference cluster system.\r\n"
