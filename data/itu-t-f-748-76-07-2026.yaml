abstract:
- language: en
  script: Latn
  content: "The electrical equipment sound signal contains rich information; it can help to address dual challenges of operational safety and high real-time performance of electrical equipment. The sound signal management and analysis based on artificial intelligence technology is conducive to effectively manage and analyse sound signals of electrical equipment and ensure the operation safety of electrical equipment in real time and accurately.\r\nRecommendation ITU-T F.748.76 specifies the requirements and framework of sound signal management and analysis for electrical equipment, providing a reference framework for benchmarking remote online monitoring, based on sound signals. Also, the requirements described in this Recommendation, such as sound signal acquisition, transmission and an AI-based analysis model, provide guidance for the application of related technologies.\r\n"
