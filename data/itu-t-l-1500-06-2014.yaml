abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T L.1500 describes a framework for information and
    communication technologies (ICTs) and adaptation to the effects of climate change.
    This framework identifies and defines the basis for development of the following
    Recommendations: \r\n•\tRecommendation ITU-T L.1501 on how countries can utilize
    ICTs to adapt to the effects of climate change. It will also provide a framework
    and a checklist for countries to integrate ICTs into their national strategies
    for adaptation to climate change. Examples of checklists, use\x1Ecases, best practices,
    guidelines, consideration points, etc. will be added when appropriate. \r\n•\tA
    future Recommendation on how to adapt the ICT infrastructure to the effects of
    climate change. It will provide a set of guidelines, requirements and best practices
    to be referred to during operation, maintenance, upgrade and improvement of existing
    ICT infrastructure and when planning, designing and constructing ICT projects,
    goods, networks and services to adapt to the effects of climate change.  Examples
    of checklists, use-cases, best practices, guidelines, consideration points, etc.
    will be added when appropriate. \r\n•\tA future Recommendation on how ICTs can
    help cities to adapt to the effects of climate change. It will also provide a
    framework and a checklist to assist municipal authorities in the implementation
    of ICT-based solutions in cities' climate change adaptation strategies. Examples
    of checklists, use-cases, best practices, guidelines, consideration points, etc.
    will be added when appropriate."
