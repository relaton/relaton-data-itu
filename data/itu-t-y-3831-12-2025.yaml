abstract:
- language: en
  script: Latn
  content: "In order to support QKD service to mobile objects (i.e., autonomous cars,
    mobile phones, etc.), it is challenging to establish and maintain a quantum channel
    in a stable manner with them and to support KSA-keys. Such a challenge calls for
    a solution to integrate the QKDN and user networks supporting modern cryptography
    services. \r\nRecommendation ITU-T Y.3826 addresses these challenges and specifies
    several architectural models, requirements, and a framework architecture for the
    integration. This Recommendation specifies a functional architecture for the integration
    of QKDN and UNemc. It defines a functional architecture, associated functions,
    reference points and some example operational procedures.\r\n"
