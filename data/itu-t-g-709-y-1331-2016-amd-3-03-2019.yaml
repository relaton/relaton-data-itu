abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T G.709/Y.1331 defines the requirements for the optical
    transport network (OTN) interface signals of the optical transport network, in
    terms of:\r\n\r\n–           OTN hierarchy\r\n\r\n–           functionality of
    the overhead in support of multi-wavelength optical networks\r\n\r\n–           frame
    structures\r\n\r\n–           bit rates\r\n\r\n–           formats for mapping
    client signals.\r\n\r\nEdition 5.0 of this Recommendation includes the text of
    Amendments 2, 3, 4, Corrigendum 2 and Erratum 1 to Edition 4.0 of this Recommendation,
    support for frequency and time synchronisation, addition of Beyond 100 Gbit/s
    OTU, ODU and OPU frame formats, overhead, ODU multiplexing, client mappings and
    optical layer terminology updates. Edition 5.0 furthermore deleted the OPUk concatenation
    specifications and the ATM mapping into OPUk specification and changed the TCM
    ACT and FTFL overhead bytes into EXP overhead bytes.\r\n\r\nAmendment 1 contains
    extensions to the fifth edition (06/2016) of Recommendation ITU-T G.709/Y.1331,
    related to the:\r\n\r\n–           Addition of paragraph that describes that ITU-T
    G.798 complements ITU-T G.709 (1)\r\n\r\n–           Addition of references to
    Recommendation ITU-T G.8260 (2)\r\n\r\n–           Addition of definitions and
    conventions that have been included in the past in ITU-T G.870 (3, 5)\r\n\r\n–
    \          Deletion and addition of abbreviations (4)\r\n\r\n–           Addition
    of a sentence that describes that 3R regeneration is used on both sides of an
    interface interconnecting user and provider administrations and two provider administrations
    (6)\r\n\r\n–           Corrections to the STU, MOTU, SOTUm and MOTUm descriptions
    (8.1, 8.2, 8.3, 8.4)\r\n\r\n–           Addition of a note describing a vendor
    specific mode in the GCC0 communication channel deployment (15.7.2.2)\r\n\r\n–
    \          Deletion of OTUCn OSMC (15, 15.7.1, 15.7.2.4, 15.7.2.4.1.2)\r\n\r\n–
    \          Deletion of reference to concatenation (15.9.2)\r\n\r\n–           Aligning
    the OPUk/OPUflex clock performance requirement in case of BMP based client mapping
    with ITU‑T G.8251 and ITU-T G.798 (17.2, 17.19, 17.12)\r\n\r\n–           Clarify
    the 2-bit alignment when mapping 66-bit blocks into the OPUflex payload area (17.11,
    17.12)\r\n\r\n–           Changing the minimum number of FlexE signals in a FlexE
    aware mapping into an OPUflex (17.12)\r\n\r\n–           Addition of 25GE client
    signal (2, 15.9.2.1.1, 17.13, 17.13.1)\r\n\r\n–           Deletion of ODUCn HAO
    reference (20.4.3.1).\r\n\r\nCorrigendum 1:\r\n\r\n–           Deletes references
    to virtual concatenation (7, 15.9.1, 15.9.2.1, 15.9.2.2)\r\n\r\n–           Adds
    a note informing that OSC signals designed prior to Edition 5.0 may not support
    the added OTSiA trail and payload overhead (15.1.8)\r\n\r\n–           Changes
    the number of OPU3 Tributary Slots necessary to carry an ODUflex(IB DDR) signal
    from \"4\" to \"5\" in Table 7-9 (7-4)\r\n\r\n–           Changes the second instance
    of \"OCh-FDI-P\" to \"OTSiA-FDI-P\" in the first paragraph of clause 16.3.1\r\n\r\n–
    \          Adds a new paragraph to clause 16.3.2 that defines the OTSiA-FDI-O
    signal\r\n\r\n–           Changes \"ODTUC.ts\" into \"ODTUCn.ts\" in the third
    dash item in clause 20.4.1.1\r\n\r\n–           Changes \"2M-byte word\" to \"16M-byte
    word\" in the last paragraph of clause 20.4.3.1\r\n\r\n–           Changes the
    description of \"Inputs = C14, II, DI, CRC\" in Figure D.8 into \"Inputs = C14,
    II, and DI for the 14 bit count\" plus \"Inputs = C10, II, and DI for the 10-bit
    count\". Deletes the text at the bottom of the figure.\r\n\r\nAmendment 2:\r\n\r\n–
    \          Adds the OTN mappings for the IEEE 802.3 200 Gbit/s and 400 Gbit/s
    Ethernet client signal\r\n\r\n–           Adds the eSSM message type for the OSMC\r\n\r\n–
    \          Specifies OTSiG-O transport over the FlexO-LR SOTUm interface\r\n\r\n–
    \          Adds reference to two FEC options for OTUk signals\r\n\r\n–           It
    also provides clarification regarding interfaces where OTUk and OTUCn section
    monitoring overhead is optional, and elaborates on OCh and OTSiA maintenance signals.\r\n\r\nAmendment
    3 contains extensions to the fifth edition (06/2016) of Recommendation ITU‑T  G.709/Y.1331,
    related to the:\r\n\r\n–           Addition of interconnection of Ethernet UNI
    and FlexE Group UNI in two administrative domains (clause 7.5 of  Appendix XIV).\r\n\r\n–
    \          Addition of 50GBASE-R mapping into ODUflex (clause 17.13.3 of Annex
    J).\r\n\r\n–           Update of FlexE terminology and calendar slot descriptions
    with FlexE 2.0 IA (clauses 17.11 and 17.12).\r\n\r\n–           Redefine the OP
    overhead bit in bit 1 of JC6 as a RES overhead (clauses 20.4, 20.4.3.1 and 20.5).\r\n\r\n–
    \          Replacement of references to IEEE Std. 802.3-2015, 802.3by and 802.3bs
    by a reference to IEEE Std 802.3-2018 (clauses 17.13.1 and 17.13.2, Annex J and
    Annex K).\r\n\r\n–           Addition of ODU4 and ODUflex(25G/50G/200G/400GBASE-R)
    rows to Table 7-9 (clause 7.4).\r\n\r\n–           Addition of 25G, 50G, 200G
    and 400GBASE-R rows to Table IX.1 (Appendix IX).\r\n\r\n–           Addition of
    ODUflex(25G/50GGBASE-R, FC-1600/3200) rows to Table X.1 (Appendix X)."
