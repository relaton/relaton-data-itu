abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Z.161 defines Testing and Test Control Notation 3
    (TTCN-3) intended for specification of test suites that are independent of platforms,
    test methods, protocol layers and protocols. TTCN-3 can be used for specification
    of all types of reactive system tests over a variety of communication ports. Typical
    areas of application are protocol testing (including mobile and Internet protocols),
    service testing (including supplementary services), module testing, testing of
    Common Object Request Broker Architecture (CORBA) based platforms and application
    programming interfaces (APIs). The specification of test suites for physical layer
    protocols is outside the scope of this Recommendation.\r\n\r\nThe core language
    of TTCN-3 can be expressed in a variety of presentation formats. While this Recommendation
    defines the core language, Recommendation ITU-T Z.162 defines the tabular format
    for TTCN (TFT) and Recommendation ITU-T Z.163 defines the graphical format for
    TTCN (GFT). The specification of these formats is outside the scope of this Recommendation.
    The core language serves the following three purposes:\r\n\r\na)          as a
    generalized text-based test language;\r\n\r\nb)          as a standardized interchange
    format of TTCN test suites between TTCN tools;\r\n\r\nc)          as the semantic
    basis (and where relevant, the syntactical basis) for the various presentation
    formats.\r\n\r\nThe core language may be used independently of the presentation
    formats. However, neither the tabular format nor the graphical format can be used
    without the core language. Use and implementation of these presentation formats
    shall be done on the basis of the core language.\r\n\r\nThis revision of the Recommendation
    contains amendments, clarifications, corrigenda and editorial corrections.\r\n"
