abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.743.15 specifies the requirements for multi-operator
    core network (MOCN) enabled multimedia services (MOCN-MS). This Recommendation
    not only defines a high-level functional framework of MOCN enabled multimedia
    services, but also specifies the sharing capability information unit (SCIU) function
    requirements and MOCN-MS system requirements according to this framework. In addition,
    several scenarios for MOCN enabled multimedia services are provided in this Recommendation.\r\nMOCN
    enabled multimedia service defined in this Recommendation can improve the conventional
    multimedia service quality by taking advantage of the network sharing capability
    of the co construction network, without bringing any additional impact on the
    base station. The MOCN enabled multimedia service providers (SP) will benefit
    from the requirements and reference framework defined in this Recommendation.
    This way the extension and optimization of the existing multimedia service can
    be estimated efficiently. In addition, it is possible for the multimedia service
    provider to discover and develop new features while the MOCN-MS is employed.\r\n"
