abstract:
- language: en
  script: Latn
  content: "Distributed ledger technology (DLT) provides a technical mechanism for
    achieving verifiable trust through consensus and collective decision-making. DLT
    also involves maintaining ledgers in a decentralized way and using crypto-mechanisms
    that can deliver some intrinsic security features. However, a distributed ledger
    system still has security limitations, for example, confidentiality must be added
    depending on use case, data sensitivity and applicable data privacy regulations.\r\n\r\nRecommendation
    ITU-T X.1401 provides a structured and systematic threat analysis method to design,
    implement and operate a distributed ledger technology system and to evaluate its
    security.\r\n"
