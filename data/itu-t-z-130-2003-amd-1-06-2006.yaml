abstract:
- language: en
  script: Latn
  content: This amendment provides an example mapping of ITU eODL for technology independent
    component specifications into a technology dependent one, which in this case is
    the CIDL (OMG Component Implementation Definition Language as part of CORBA 3.0).This
    amendment transforms (by means of different mappings) the concept ofcomponents
    from design and implementation (where modules are well known) to binary software.
    The composition of components takes place during execution time.
