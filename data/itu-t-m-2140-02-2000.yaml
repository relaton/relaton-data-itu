abstract:
- language: en
  script: Latn
  content: This ITU-T Recommendation is a functional description of the operations
    functions required to achieve Network Event Correlation in the surveillance of
    international transport networks. The capability described is to correlate notifications
    of faults and impairments from Network Elements and to reveal the nature, location
    and severity of the faults and impairments and their true effect on the network.This
    Recommendation is based on the TMN Functional Architecture as specified in ITU-T
    Recommendation M.3010. This Recommendation identifies the TMN Management Function
    Sets from ITU-T Recommendation M.3400 that are involved in Transport Network Event
    Correlation, provides functional descriptions of each Management Function Set,
    and illustrates how they interact to achieve Transport Network Event Correlation.
