abstract:
- language: en
  script: Latn
  content: This Recommendation provides the motivations and requirements for user-plane
    operation, administration, and maintenance (OAM) functionality for ETH layer in
    Ethernet-based networks and Ethernet services. This Recommendation includes the
    requirements for OAM functions for the point-to-point and multipoint-to-multipoint
    maintenance entities (MEs) including both dedicated and shared access. It is noted
    that this Recommendation does not address the administration aspects of OAM.
