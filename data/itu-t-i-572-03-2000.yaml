abstract:
- language: en
  script: Latn
  content: This ITU-T Recommendation describes the functional technical requirements
    for the incorporation of VSATs into the Access portion of national telephone networks,
    both public and private. Scenarios illustrate some but not all of the ways that
    VSATs might be deployed in this portion of the network. A pre-existing analogue
    network has been assumed for the discussion of transmission planning with digital
    technology included where significant. The annexes contain details of several
    national connection requirements and when considered as a whole provide a good
    overview of connection requirements for all national telephone networks. Additional
    annexes may be added in future to cover other countries
