abstract:
- language: en
  script: Latn
  content: This Recommendation describes a simple extension to the perceptual evaluation
    of listening speech quality (PESQ) algorithm defined in ITU-T Rec. P.862. It allows
    ITU-T Rec. P.862 to be applied to the evaluation of conditions, such as speech
    codecs, where the listener uses wideband headphones. (In contrast, ITU-T Rec.
    P.862 assumes a standard IRS-type narrow-band telephone handset which attenuates
    strongly below 300 Hz and above 3100 Hz.) This Recommendation is mainly intended
    for use with wideband audio systems (50-7000 Hz), although it may also be applied
    to systems with a narrower bandwidth.
