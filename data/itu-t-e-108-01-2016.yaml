abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T E.108 specifies requirements for a disaster relief
    mobile message service. In the aftermath of a disaster, communication facilities
    are often overloaded due to many users attempting to contact friends or relatives
    to determine the safety of people who may have been affected by disasters. As
    a result, communication attempts often fail. The intent of a disaster messaging
    service is to allow an alternate method to communicate safety status information.
    Two approaches are presented. The first is a text-based messaging system, and
    the second is a voice-based messaging system.
