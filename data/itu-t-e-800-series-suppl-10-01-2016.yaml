abstract:
- language: en
  script: Latn
  content: "This supplement intends to provide the basis of the Service Quality Management
    (SQM) & Customer Experience Management (CEM)   and key parameters related to SQM
    & CEM for supporting operations within the Service Operations Centre (SOC). The
    introduction of the two paradigms, for instance SQM and CEM managed via SOC is
    an essential component in order to:\r\n\r\no   Monitor and maintain an acceptable
    level of quality for end-to-end services delivered to an individual or a group
    of customers. \r\n\r\no   Measure not only Quality of Service parameters but also
    the level of consumer satisfaction regarding services delivered by Communication
    Network/Service Provider).  \r\n\r\nThis supplement can be used by Communication
    Network/Service Providers in order to provide a better Quality of Experience and
    Quality of Service to their customers. \r\n"
