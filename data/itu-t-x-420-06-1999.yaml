abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard makes use of the enhanced
    message store defined in ITU-T Rec. X.413 | ISO/IEC 10021-5. It also includes
    body part definitions for voice, reports and notifications. The ASN.1 is aligned
    with new ITU-T Rec. X.680 | ISO/IEC 8824-1 and ITU-T Rec. X.880 | ISO/IEC 13712-1,
    while retaining complete compatibility with the 1988 and 1992 IPM protocols. Numerous
    defect corrections are incorporated. This revision includes definitions for an
    extended set of ASN.1 integer values for IPM security error diagnostic codes.
