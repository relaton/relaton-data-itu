abstract:
- language: en
  script: Latn
  content: "The goal of this case study is to clarify the GHG emission reduction effect
    of some new energy saving technologies in a data centre. \r\n\r\nThe purpose of
    the study is to assess the production and operation of introducing a more energy-efficient
    data centre and compare its impact to a previous setup. This case study is intended
    to be open to the public.\r\n\r\nIn this case study, a hybrid approach was applied.
    The hybrid approach used in this study includes Input-Output Analysis (IOA) for
    production and end-of life, and process-sum analysis for usage. \r\n"
