abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation M.1402 contains definitions of data for service management.
    The data are defined in the way they are presented to the end users at their terminals,
    and conceptual or internal data structures are not defined. Therefore, this Recommendation
    defines an external terminology schema for the given application domain.This Recommendation
    focuses on defining data for products, customers, accounts, contracts, deals,
    addresses, prices, various segments and relationships between all these. Some
    attributes that are essential for identifying objects and associations between
    them are defined, as well.Order data and detailed mappings to network elements
    are not covered. Also, billing, marketing, sales, retailer, distributor, number
    management, device management, location management, logistics and finance are
    not covered. Finally, alarms, trouble tickets, call records and other call centre
    information are missing.As the data defined in this Recommendation are designed
    for human usage, they are independent of the functions in which they are used.
    Hence, the data may be applied in any functions, e.g., in customer requests, call
    centres, billing, service platforms, etc.This Recommendation uses the notation
    and conventions found in ITU-T Recommendation M.1401, "Formalization of interconnection
    designations among operators' telecommunication networks".Appendix I explains
    the creation of product and customer service databases.Appendix II explains creation
    of interfaces to service platforms.
