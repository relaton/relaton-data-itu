abstract:
- language: en
  script: Latn
  content: "End-user equipment, consumer premise equipment and its software have evolved
    to become faster, more powerful and able to perform data collection. This has
    enabled the crowdsourcing approach which seeks to increase the amount of technical
    parameters which can be collected from end-users without modification to existing
    hardware and software.\r\nIncreasingly, players such as regulators and service
    providers have started to assess end-to-end quality of service (QoS) through a
    crowdsourcing approach. However, assessment using data collected through the crowdsourcing
    approach can be deployed in multiple ways and different approaches provide different
    views of QoS.\r\nRecommendation ITU-T E.812 outlines the different crowdsourcing
    approaches used to assess end-to-end QoS on both fixed and mobile broadband networks."
