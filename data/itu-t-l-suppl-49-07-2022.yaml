abstract:
- language: en
  script: Latn
  content: "Supplement 49 to ITU-T L-series Recommendations provides an updated overview
    of existing Recommendations and Technical Standards on the topic of adaptation
    to climate change for ICT networks.\r\nIn this context, adaptation has to be understood
    to have a double meaning:\r\n1)\tHow ICT can help other areas (e.g., transport,
    buildings) to adapt to climate change challenges and effects;\r\n2)\tHow ICT networks
    themselves have to be designed and implemented in an ever more resilient way,
    in order to face climate change's effects (e.g., flooding, stronger winds).\r\nThis
    Supplement takes into account also the work already done on the topic of adaptation
    to climate change for ICT networks at other Workshops and in academia.\r\n"
