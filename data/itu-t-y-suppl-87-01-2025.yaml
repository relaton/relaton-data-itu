abstract:
- language: en
  script: Latn
  content: "As a basic enabler of manufacturing activities, the digital management
    capability of industrial equipment is of great significance to the value creation
    activities of industry in smart sustainable cities (SSC). With the rapid development
    of advanced information and communication technologies such as the Internet of
    things, big data and artificial intelligence (AI), the intelligence level of industrial
    equipment has continuously improved. Enhancing the digital management capability
    of industrial equipment contributes to enhancements in production efficiency,
    reduction in operation costs, and the achievement of economic benefits. Therefore,
    digital management of industrial equipment contributes to urban innovation and
    sustainable development.\r\nThis Supplement 87 to ITU-T Y-series Recommendations
    provides a maturity model of the digital management capability of industrial equipment
    for SSC. The maturity model helps to identify the maturity levels, dimensions,
    and guidelines for the digital management capability of industrial equipment for
    SSC. It is designed as a practical tool for city managers and related stakeholders
    to study the effectiveness of digital management of industrial equipment, from
    resource, environment, and operation perspectives, among others. Thus, it provides
    overall guidance for assessing the maturity of the digital management capability
    of industrial equipment and helping cities achieve sustainable development goals.\r\n"
