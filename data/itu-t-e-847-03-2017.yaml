abstract:
- language: en
  script: Latn
  content: 'This recommendation analyses and identifies QoS parameters for TDM interconnection
    between telecom networks, which are needed to facilitate effective interconnections
    with reasonable traffic handling capacities. The proposals as given in this recommendation
    provide a guiding framework for TDM interconnection of telecom networks and will
    facilitate effective monitoring of Performance, QoS (Quality of Service) at POIs
    (Point of Interconnection); as well as endeavour to ensure end to end customer
    satisfaction and Quality of Experience (QoE). Regulators may also use this document
    to envision effective interconnection regulations in respective countries. '
