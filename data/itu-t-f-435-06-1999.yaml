abstract:
- language: en
  script: Latn
  content: This Recommendation is one of a set of Recommendations for message handling.
    The entire set provides a comprehensive specification for message handling comprising
    any number of cooperating open-systems.Message handling systems and services enable
    users to exchange messages on a store-and-forward basis. A message submitted by
    one user, the originator, is conveyed by the message transfer system (MTS), the
    principal component of a larger message handling system (MHS), and is subsequently
    delivered to one or more additional users, the message's recipients.An MHS comprises
    a variety of interconnected functional entities. Message transfer agents (MTAs)
    cooperate to perform the store-and-forward message transfer function. Message
    stores (MSs) provide storage for messages and enable their submission, retrieval
    and management. User agents (UAs) help users access MHS. Access units (AUs) provide
    links to other communication systems and services of various kinds (e.g. other
    telematic services, postal services).This Recommendation defines the overall system
    and service description of the message handling application called EDI messaging.This
    edition introduces new Elements of Services (EOS) to provide the EDI message store
    with capabilities similar to those of the IPM message store for message store
    correlation and services.
