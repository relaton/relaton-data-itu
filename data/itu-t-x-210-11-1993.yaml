abstract:
- language: en
  script: Latn
  content: The service conventions prescribed in this recommendation ensure that the
    services of OSI standards are defined in a uniform way, which is consistent with
    the OSI Reference Model and the application layer structure standard. The text
    was developed jointly with ISO/IEC. The main intent of this revision is to provide
    extended capabilities, which are useful in specifying services within the application
    layer and also to allow greater flexibility to accommodate new services among
    the layers in the future
