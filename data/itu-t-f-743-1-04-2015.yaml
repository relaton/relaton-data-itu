abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.743.1 defines requirements for intelligent visual
    surveillance (IVS). The requirements are based on identifying specific objects,
    behaviours or attributes in video signals. The IVS system transforms the video
    signals into structured data, which can be transmitted or archived so that the
    video surveillance system can act accordingly.\r\nThis Recommendation defines
    the scenarios, the reference architecture and the requirements for IVS.\r\n"
