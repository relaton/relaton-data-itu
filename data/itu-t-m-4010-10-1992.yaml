  content: Describes agreements necessary between Administrations which intend to
    exchange signalling information over common channel Signalling System No. 6. Examples
    are:- the number and type of links;- signalling method (en-bloc or overlap);-
    options;- etc. The outline of a test programme is provided with information on
    where further details may be found. Keywords - agreement; - common channel; -
    line-up; - signalling No. 6.
