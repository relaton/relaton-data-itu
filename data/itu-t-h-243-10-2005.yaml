abstract:
- language: en
  script: Latn
  content: This Recommendation concerns the system operation for a conference call
    between three or more audiovisual terminals conforming to ITU-T Rec. H.320.This
    revised version of ITU-T Rec. H.243 introduces a number of enhancements and clarifications
    to the previous version, primarily the description on the usage of Unicode characters
    in H.320 systems.
