abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3362 describes the requirements for telecommunication
    anti-fraud management in the telecommunication management network (TMN), the functional
    framework for combating telecommunication fraud management and the functional
    description. The requirements for telecommunication anti-fraud management include
    fraud detection management, fraud monitoring management, fraud mitigation management
    and fraud information sharing management. This Recommendation also describes telecommunication
    fraud scenarios including nuisance calls and spoofing calls.  \r\n"
