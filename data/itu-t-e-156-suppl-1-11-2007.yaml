abstract:
- language: en
  script: Latn
  content: "This Best Practice Guide is intended as a complimentary volume to ITU-T
    Recommendation E.156 \"Guidelines for ITU-T action on reported misuse of E.164
    number resources\" that specifies the measures that the ITU TSB will undertake
    with respect to reported alleged misuse of numbering resources over which it has
    some control.\r\nThis guide is intended to discuss what action other stakeholders
    may wish to take with regard to minimizing and managing the impact of misuse of
    numbering resources for their customers benefit."
