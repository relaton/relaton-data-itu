abstract:
- language: en
  script: Latn
  content: Home country direct is an optional feature of the international telephone
    service which enables a caller in one country to access directly the home country
    direct service provider in a second country for the purpose of placing a call
    terminating within the second country. This feature shall be provided on the basis
    of a bilateral agreement between the cooperating ROAs.Home country direct involves
    a two-stage international call and will require the home country direct service
    provider to have a bilateral agreement in place with the service access provider.
