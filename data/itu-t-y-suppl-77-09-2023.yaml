abstract:
- language: en
  script: Latn
  content: "Supplement 77 to Recommendation ITU-T Y.4051 aims to comprehend the multi-dimensional
    definitions, based on open literature, of the term digital transformation for
    people-centred smart cities and communities (SC&C). It uses keywords and attributes
    from analytical methodology to propose a formal and comprehensive definition for
    the term digital transformation. \r\nThe process for developing a new definition
    will not only give a clear definition of the term but will also help in understanding
    the relevant works and tasks for achieving digital transformation in people-centred
    smart cities and communities.\r\n\r\n"
