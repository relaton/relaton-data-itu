  content: This Recommendation | International Standard provides the protocol implementation
    conformance statement (PICS) proforma for the OSI connectionless protocol for
    the Association Control Service Element (ACSE) which is specified in Recommendation
    X.237. The PICS proforma represents, in tabular form, the mandatory and optional
    elements of the connectionless ACSE protocol. The PICS proforma is used to indicate
    the features and choices of a particular implementation of the connectionless
    ACSE protocol.
