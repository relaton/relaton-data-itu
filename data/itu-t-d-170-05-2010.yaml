abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T D.170 sets out the guidelines for preparing the monthly
    telephone and telex accounts. In particular, it covers the following issues:\r\n•
    General remarks on the preparation of accounts;\r\n• Supply of directories;\r\n•
    Accuracy of traffic data in monthly accounts;\r\n• Estimation of lost accounting
    records;\r\n• Traffic sampling;\r\n• Queries relating to monthly accounts;\r\n•
    Adjustments and refunds;\r\n• Checks of accounting data;\r\n• Keeping of vouchers;\r\n•
    Settlements of accounts."
