abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T Y.4500.6 specifies the usage of the BBF TR-069 protocol
    and the corresponding message flows including normal as well as error cases to
    fulfil oneM2M management requirements.\r\n• Protocol mapping between the oneM2M
    service layer and BBF TR-069 protocol. The Mca reference point, ms interface and
    la interface are possibly involved in this protocol mapping.\r\n• Mapping between
    oneM2M management-related resources and the BBF TR-069 protocol remote procedure
    calls (RPCs) and BBF TR-181i2 data model.\r\n• Specification of new BBF TR-181
    data model elements to fulfil oneM2M specific management requirements that cannot
    be currently translated."
