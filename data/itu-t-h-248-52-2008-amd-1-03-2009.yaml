abstract:
- language: en
  script: Latn
  content: This Recommendation provides H.248 packages for different Quality of Service
    (QoS) support mechanisms. The QoS Class package may be used in various areas with
    relations to QoS e.g. Media Gateway level admission control functions. The Differentiated
    Services package is specifically designed to support QoS marking for IPv4 or IPv6
    based H.248 streams/terminations, but limited to the 6-bit DiffServ field within
    the IP header. The General IP Header QoS Octet package allows QoS marking and
    modification of the entire 8-bit field, related to QoS protocol control information
    elements in IPv4 and IPv6 packet headers.H.248.52 (06/2008) Amendment 1 (03/2009),
    which is integrated in this edition, defined a new version of the Differentiated
    Services package, which clarifies the procedures for copying DSCP values from
    ingress packets to egress ones.
