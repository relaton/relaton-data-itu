abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.743.29 addresses the issue of industry research
    and development progressing without a unified standard framework. This Recommendation
    provides an overview of the model generalization system in intelligent video surveillance
    and specifies the requirements and framework for model generalization system.\r\nWith
    the accelerating integration of artificial intelligence (AI) and the real economy,
    video analysis capabilities based on AI algorithms have become a critical requirement
    for many vertical applications in video surveillance.\r\nWith the popularity of
    artificial intelligence research, AI algorithms have been implemented in intelligent
    video surveillance (IVS) system. However, these AI models face several challenges
    when implemented in IVS systems: \r\n1)the generalization ability of AI models
    is weak, and their algorithm performance is poor across different video surveillance
    scenarios; \r\n2)Data quality is crucial for the training and implementation of
    small AI models. \r\nThere is a lack of high-quality labelled data in the IVS
    system.\r\nTo better promote the application of IVS, ensure the application effect,
    and promote the research of IVS technology, many companies have launched IVS systems
    with high functional integration based on large-scale, pre-trained, generalized
    artificial intelligence models to meet the diverse needs of the IVS. This has
    led to a highly complex, heterogeneous, and fragile ecosystem.\r\n\r\n"
