abstract:
- language: en
  script: Latn
  content: "A DLT-based invoice is an invoice that can be issued, transferred and
    received in a structured electronic format over digital ledgers which allow automatic,
    electronic transactions based on smart contracts. \r\nIt presents as a novel invoice
    service category, emerging as a promising solution to tackle challenges by leveraging
    the capability of distributed ledger technology and the trust requirement of the
    stakeholders in the ecosystem.\r\nThe usage of DLT-based invoices is driven mainly
    by seeking to optimize an end-to-end trustworthy business process across the jurisdictions
    in the major processes, e.g., issuance, routing, processing, reimbursement, auditing
    and so on.\r\nRecommendation ITU-T F.751.4 is not proposing a \"regulatory\" framework.
    However, for any tax implications, regulatory considerations must be addressed
    at a national level and are not the subject of the Recommendation.\r\nThe electronic
    exchange of the invoice content between trading partners' accounts receivable
    and accounts payable business processes is to be recorded over the invoice digital
    ledger in a trustworthy way with local tax compliance. \r\nFrom a technology perspective,
    how the invoice will be transferred in a secure and interoperable way and how
    policies in different jurisdictions are enforced needs to be determined. Meanwhile,
    data privacy, security, trust and confidentiality have to be guaranteed, which
    is relevant to the following aspects:\r\n–\tsecure messaging infrastructure to
    ensure that senders and receivers can trust the system and confidently exchange
    invoices;\r\n–\tprogrammable government tax policies that can be securely enforced;\r\n–\tinvoice
    data validation schemes to ensure the integrity of the invoice content;\r\n–\timmutability
    of the digital distributed ledgers to allow stakeholders to store and validate
    the invoice based on their corresponding privileges.\r\n"
