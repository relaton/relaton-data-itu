abstract:
- language: en
  script: Latn
  content: This Supplement specifies the signalling requirements for the Leaf Initiated
    Join service capability. These signalling requirements cover the UNI and NNI interactions
    (exchange of information flows) and internal serving node procedure requirements
    for a serving node associated with a leaf and associated with the root of the
    connection(s). The signalling requirements include LIJ call creation and release,
    attachment of new parties by the root or by themselves ("leaf initiated join"),
    and detachment of parties by the root or by themselves.
