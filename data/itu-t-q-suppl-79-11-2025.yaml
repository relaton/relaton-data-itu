  content: "Supplement 79 to ITU-T Q-series Recommendations provides an implementation
    of the software-defined wide area networking (SD-WAN) service based on segment
    routing IPv6 (SRv6).\r\nThis Supplement gives more detailed information flow and
    concrete information message parameters of SD-WAN services based on SRv6 to better
    understand the signalling procedures of SD-WAN information flow and illustrate
    the benefits of SD-WAN services.\r\n"
