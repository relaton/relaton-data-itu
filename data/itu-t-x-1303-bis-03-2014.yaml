abstract:
- language: en
  script: Latn
  content: "The common alerting protocol (CAP) is a simple but general format for
    exchanging all-hazard emergency alerts and public warnings over all kinds of networks.
    CAP allows a consistent warning message to be disseminated simultaneously over
    many different warning systems, thus increasing warning effectiveness while simplifying
    the warning task. CAP also facilitates the detection of emerging patterns in local
    warnings of various kinds, such as an undetected hazard or hostile act might indicate.
    CAP also provides a template for effective warning messages based on best practices
    identified in academic research and real-world experience.\r\nRecommendation ITU-T
    X.1303 bis also provides both an XML schema definition (XSD) specification and
    an equivalent ASN.1 specification (which permits a compact binary encoding) and
    allows the use of abstract syntax notation one (ASN.1) as well as XSD tools for
    the generation and processing of CAP messages. This Recommendation enables existing
    systems, such as ITU-T H.323 systems, to more readily encode, transport and decode
    CAP messages."
