abstract:
- language: en
  script: Latn
  content: ITU-T Rec. X.893 | ISO/IEC 24824-3 specifies the application of encryption
    and integrity (either separately or in combination) to a fragment of an XML infoset
    that is serialized using the Fast Infoset specification in ITU-T Rec. X.891 |
    ISO/IEC 24824-1. The specification of encryption uses the W3C Recommendation XML
    Encryption Syntax and Processing. The specification of integrity uses the W3C
    Recommendations W3C Canonical XML Version 1.0, W3C Exclusive XML Canonicalization
    Version 1.0 and XML-Signature Syntax and Processing.
