abstract:
- language: en
  script: Latn
  content: This Recommendation mainly deals with SLA Representation Templates used
    for Service Customers and Service Providers. It briefly introduces the overview
    and characteristics of SLA representation templates, and describes the detailed
    classification of SLA content, and provides the guidelines for the definition
    of SLA representation templates in detail, including the instructions for completing
    SLA templates. In Appendix I a simple example of SLA Representation Templates
    and instances of them are illustrated for reference.
