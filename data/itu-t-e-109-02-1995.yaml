abstract:
- language: en
  script: Latn
  content: Billed Number Screening messages may be used for determining the validity
    of billing calls to a telephone number on collect and third-party calls, and any
    conditions related to the acceptance of charges by the billed party. Information
    on such conditions would be stored within a Billed Number Screening system, most
    likely within a database.This Recommendation describes information used within
    the Billed Number Screening process at a conceptual level and makes no attempt
    to specify any equipment, facilities and data transmission techniques. In addition,
    the use of systems and networks also involve service agreements between ROAs;
    these agreements are beyond the scope of this Recommendation. It should be noted
    that future technological developments may allow operator service functions to
    be automated (e.g. using voice recognition); this Recommendation is not reliant
    on, nor does it preclude, that automation.
