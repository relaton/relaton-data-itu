abstract:
- language: en
  script: Latn
  content: The E.750 series is intended to cover traffic engineering aspects related
    to terminal and personal mobility.This Recommendation outlines the scope and the
    structure of the E.750 series. Recommendations in the E.750 series are identified
    by a three-digit number. Recommendations with the third digit in the range 0 to
    4 are either of a general nature or apply to mobile networks; Recommendations
    with the third digit in the range 5 to 9 normally apply to UPT.
