abstract:
- language: en
  script: Latn
  content: With the development of big data and cloud computing technology, the quantity
    and total capacity of the data centre and telecommunication room as well as information
    and communication technology (ICT) equipment power density is increasing rapidly.
    Furthermore, it has been found that the traditional power systems had the disadvantages
    of low energy efficiency, high energy consumption and maintenance difficulties
    in existing data centre and telecommunication rooms. It is therefore necessary
    to develop a new structure of the whole power system which integrates the traditional
    10 kVAC voltage distribution equipment, transformer, low voltage distribution
    equipment and up to 400 VDC equipment. In the new structure the distribution system
    of each voltage level is simplified, so that the maintenance work is reduced,
    and the reliability of the whole power system is improved. Recommendation ITU-T
    L.1230 includes system composition, general requirements, and monitoring system,
    etc. of 10 kVAC input and up to 400 VDC.
