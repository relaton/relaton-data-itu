  content: Supplement 10 to the ITU-T L series of Recommendations refers to the best
    practices defined in Recommendation ITU-T L.1300. More precisely, this Supplement
    provides an overview of verification experiments related to the increase of efficiency
    of air-conditioning and control technologies. The results of such verification
    experiments are provided and an estimation of their applicability to real data
    centres is reported.
