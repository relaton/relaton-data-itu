abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.743.16 defines the architecture and specifies the
    requirements for communication resource management in intelligent visual surveillance
    (IVS) systems, including the requirements of communication resource monitoring,
    resource provisioning and resource scheduling. Communication resource management
    in the IVS system aims to make rational use of communication resources, so that
    it can complete the tasks which are generated by the IVS system efficiently.
