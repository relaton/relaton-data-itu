abstract:
- language: en
  script: Latn
  content: "Supplement 37 to Recommendation ITU-T X.1231 defines a technical framework
    for countering spam based on machine learning (ML). It may help some relevant
    persons and companies in spam management, reduce the benefit losses of users and
    providers, improve user experience and promote the healthy development of telecommunication
    business.\r\nThis Supplement to Recommendation ITU-T X.1231 provides some general
    scenarios, and characteristics of spam, and defines the general technical framework,
    and work flows about countering spam based on ML.\r\n"
