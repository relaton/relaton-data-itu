    and Rec. ITU-T T.84 | ISO/IEC 10918-3.\r\nThis second edition integrates the provisions
    of Amendment 1 of ITU-T T.86 (2012) | ISO/IEC 10918-4 (2013) and cancels the provisions
    concerning the registration authority processes originally defined in the first
    edition.\r\nITU-T T.86 is a common text with ISO/IEC 10918-4.\r\n"
