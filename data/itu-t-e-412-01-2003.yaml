abstract:
- language: en
  script: Latn
  content: Network management controls provide the means to alter the flow of traffic
    in the network in support of the network management entities given in ITU-T Rec.
    E.410. Most network management controls are taken by or in the exchange (see ITU-T
    Rec. Q.542), but certain actions can be taken external to exchange. This Recommendation
    provides specific information on network management controls and gives guidance
    concerning their application. However, it should be noted that the suggested use
    for each network management control is given only for the purpose of illustration.
    Other controls, separately or in combination, may be more appropriate in any given
    situation.
