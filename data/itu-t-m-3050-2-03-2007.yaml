abstract:
- language: en
  script: Latn
  content: ITU-T Recommendations M.3050.x series contain a reference framework for
    categorizing the business activities that a service provider will use. The Enhanced
    Telecom Operations Map(r) (or eTOM for short), which has been developed by the
    TeleManagement Forum, describes the enterprise processes required by a service
    provider and analyses them to different levels of detail according to their significance
    and priority for the business. This business process approach has built on the
    concepts of management services and functions in order to develop a framework
    for categorizing all the business activities. This Recommendation provides further
    detail concerning the eTOM through definition of the process elements within the
    eTOM business process framework at several levels of detail.
