abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.149 specifies methods for measuring the passive
    intermodulation level of array antenna systems in mobile communication systems,
    including test equipment and test procedures. \r\n\r\nThis Recommendation covers
    the following frequency ranges, but is not limited to the following ranges: LTE
    700, APT 700, LTE 800, Cellular 850, E-GSM 900, DCS 1800, PCS 1900, AWS 1700/2100,
    UMTS 2100 and LTE 2600 operating bands. \r\n"
