abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T J.298 describes the requirements and technical specifications
    of a cable TV hybrid set-top box compatible with terrestrial and satellite TV
    transport. The main purpose of the Recommendation is to specify minimum and basic
    requirements for a hybrid set-top box (STB), which meets the requirements of developing
    countries and regions. The hybrid set-top box has full functionalities for traditional
    cable broadcasting services based on Recommendation ITU-T J.83, at the same time,
    satellite or a terrestrial broadcast receiving functions will also be implemented
    so that the STB is able to receive satellite or terrestrial broadcasting services.
    The basic functionalities for IP-based interactive video services are also required
    so that the STB be able to support the latest Internet protocol (IP) interactive
    services together with legacy cable and satellite/terrestrial services.
