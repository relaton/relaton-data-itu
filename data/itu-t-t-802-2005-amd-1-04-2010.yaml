abstract:
- language: en
  script: Latn
  content: Amendment 1 to ITU-T T.802 (2005) | ISO/IEC 15444-3:2007 introduces additional
    profiles for archiving applications that define preservation and access profiles
    for moving pictures within the Motion JPEG 2000 file format.In the new parts of
    Annex A, profiles are defined, audio formats and image code stream profiles for
    archival purposes (with code stream profile indicator 5 to 7) are referenced and
    constraints are set.In the new parts of Annex B, guidelines are given for ingesting
    content into cinematic archives, for disseminating of content from cinematic archives,
    for the exchange of content between archives, for the use of the MXF file format
    in archives and for general procedures to manage archives.
