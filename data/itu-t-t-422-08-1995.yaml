abstract:
- language: en
  script: Latn
  content: This Recommendation is one of two (T.422 and T.424) which are designed
    to support the interchange of processable and formatted hypermedia documents (HyperODA).
    This Recommendation | International Standard defines location expressions, to
    identify document fragments; external references, for identification and handling
    of information that is external to given documents; and sub(document) profiles,
    for the provision of, mainly, management information applying to a document fragment.
