abstract:
- language: en
  script: Latn
  content: "ITU-T Rec. X.1051 | ISO/IEC 27011:\r\n\r\na)          establishes guidelines
    and general principles for initiating, implementing, maintaining, and improving
    information security management in telecommunications organizations based on ISO/IEC
    27002;\r\n\r\nb)          provides an implementation baseline of information security
    management within telecommunications organizations to ensure the confidentiality,
    integrity and availability of telecommunications facilities and services.\r\n\r\nAs
    a result of implementing this Recommendation | International Standard, telecommunications
    organizations, both within and between jurisdictions, will: \r\n\r\na)          be
    able to assure the confidentiality, integrity and availability of the global telecommunications
    facilities and services;\r\n\r\nb)          have adopted secure collaborative
    processes and controls ensuring the lowering of risks in the delivery of telecommunications
    services;\r\n\r\nc)          be able to redeployed resources to more productive
    activities;\r\n\r\nd)          have adopted a consistent holistic approach to
    information security;\r\n\r\ne)          be able to improve personnel awareness
    and morale, and increase public trust."
