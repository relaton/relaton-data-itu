abstract:
- language: en
  script: Latn
  content: The purpose of Supplement 10 to ITU-T Y-series Recommendations is:- to
    describe the general characteristics of distributed service network (DSN) service
    delivery from both control and data plane perspectives;- to identify, classify
    and define some examples of DSN services by means of use cases; - to further illustrate
    capabilities to be utilized in DSN; and- to elaborate on the procedures for the
    deployment and operation of the corresponding DSN services.
