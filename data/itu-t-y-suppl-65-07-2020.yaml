abstract:
- language: en
  script: Latn
  content: "Supplement 65 to ITU-T Y-3600 series of Recommendations seeks to assess
    the situation of the use of big data technologies in developing countries based
    on data collected mainly via a survey that targeted ITU-T members from developing
    countries.\r\nThis Supplement studies the main use cases for big data technologies
    within organizations from developing countries as well as their requirements,
    mainly in terms of standards. Challenges for big data deployment as well as the
    opportunities it can offer, mainly to achieve the United Nations Sustainable Development
    Goals, were also identified."
