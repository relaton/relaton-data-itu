abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T X.509 | ISO/IEC 9594-8 defines frameworks for public-key
    certificates and attribute certificates. The public-key certificate framework
    is the base specification for public-key certificates, for the different components
    going into a public-key infrastructure (PKI) for validation procedures and for
    public-key certificate revocation, etc. The attribute certificate framework is
    the base specification for attribute certificates and the different components
    going into the Privilege Management Infrastructure (PMI). These frameworks may
    be used by standards bodies to profile their application to PKIs and PMIs. '
