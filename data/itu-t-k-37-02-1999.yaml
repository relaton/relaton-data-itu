abstract:
- language: en
  script: Latn
  content: This Recommendation defines mitigation techniques which the telecommunication
    operators may use to avoid disturbances, interference and damages caused by power
    and electrified railway plants, radio transmitters, both intentional and unintentional,
    and electrostatic discharges.This Recommendation contains guidance for the telecommunications
    system normal operation:- use of telecommunications equipment fulfilling relevant
    EMC requirements;- proper installation practices such as well-controlled earthing
    and bonding networks and a.c. power distribution networks in buildings, avoidance
    of disturbing equipment close to telecommunications equipment, environmental control
    and well-designed cabling;- proper working practices such as avoiding use of hand-held
    radios close to telecommunications equipment and applying special precautions
    when handling electrostatic discharge sensitive devices;- proper working practices
    in areas subject to high levels of low-frequency induction.Special mitigation
    methods like shielding and filtering are discussed for cases where EMC problems
    arise.This Recommendation does not include circuit or equipment design rules or
    guidelines for manufacturing - it is noted that this information is already widely
    available.
