abstract:
- language: en
  script: Latn
  content: "Annex B to Recommendation ITU-T E.218 specifies the administration of
    global terrestrial trunk radio access mobile network codes by the ITU-T by detailing
    the scope of the resource covered by the annex. The annex also specifies the principles
    used for assignment, the criteria for assignment (against which applications for
    assignment of a global terrestrial trunk radio access mobile network codes will
    be assessed), the process for considering the application, and the circumstances
    under which a terrestrial trunk radio access mobile network code would be reclaimed.
    \r\n"
