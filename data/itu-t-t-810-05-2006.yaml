abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation | International Standard is to provide
    a syntax that allows to protect JPEG 2000 coded image data for transmission over
    wireless channels and networks. Protection services include error detection and
    correction capability for header and bitstream, a description of the error sensitivity
    of different portions of the compressed data, and a description of possible residual
    errors in the compressed data. The syntax allows these protection services to
    be applied to coded image data in part or in their entirety. These services are
    designed so as to maintain the inherent features of JPEG 2000, such as scalability
    and access to various spatial areas, resolution levels, colour components, and
    quality layers, while providing protection services on these elements.
