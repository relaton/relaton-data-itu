abstract:
- language: en
  script: Latn
  content: This Recommendation defines those performance parameters needed to describe
    the performance of a frame relay Switched Virtual Connection (SVC) service. Only
    those parameters that are needed in addition to the frame relay PVC parameters
    of Recommendation X.144 are defined. These include call control delay and accuracy
    and dependability parameters as well as an expanded service availability definition.
