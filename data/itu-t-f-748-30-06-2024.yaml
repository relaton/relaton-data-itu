abstract:
- language: en
  script: Latn
  content: "Digital human technology is developing rapidly and is being used in various
    fields. Recommendation ITU-T F.748.30 defines the communication services for digital
    humans and the requirements for developing and utilizing digital humans. This
    Recommendation defines entities and their roles in communication services for
    digital humans, interaction and communication types between entities, and describes
    human and digital human communication service types. It also defines the concept
    model for communication services for digital humans.\r\nEmotions and memories
    are needed for perfect communication, and digital human communication also requires
    emotions and memories. This Recommendation also defines requirements of communication
    services of digital human using emotions and memory.\r\n"
