abstract:
- language: en
  script: Latn
  content: "Gateway control protocols may require additional session description protocol
    (SDP) codepoints for specific interworking functions supported at bearer plane
    level beyond for example the SDP information used by call control protocols.\r\n\r\nSupplement
    14 to ITU-T H-series Recommendations summarizes SDP codepoints that have been
    identified in the time-frame from June 2000 to the date of approval of this Supplement.
    It identifies SDP codepoints that meet ITU-T H.248.x sub-series requirements for
    gateway control protocols and that are available for general use by the wider
    standards community.\r\n\r\nRelease 1 of this Supplement covers:\r\n\r\n–           SDP
    codepoints for the ITU-T H.248 based control of transport layer security (TLS)
    and datagram transport layer security (DTLS) traffic in ITU-T H.248 media gateways.\r\n\r\n–
    \          Preliminary SDP codepoint information for stream control transmission
    protocol (SCTP) traffic [ITU-T H.248.97].\r\n\r\nRelease 2 adds:\r\n\r\n–           Information
    about the IANA registration process.– Fixes SDP codepoint information as required
    for [ITU-T H.248.97].\r\n\r\nThis Supplement is used as a codepoint repository
    for the Internet Engineering Task Force (IETF) driven registration process of
    SDP codepoints with the Internet Assigned Numbers Authority (IANA)."
