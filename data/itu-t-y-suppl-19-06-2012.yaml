abstract:
- language: en
  script: Latn
  content: Supplement 19 to the ITU-T Y-series Recommendations deals with the risk
    analysis service, which is a service that is capable of identifying risks, assessing
    them and then invoking processes to identify the proper actions that should be
    taken to reduce damage that could affect users or organizations subscribed to
    a next generation network (NGN). Provided that a risk situation exists, the risk
    analysis function performs the analysis and assessment of the risk event data
    with an algorithm that applies the most recent pattern according to procedures,
    and reports the analysis results and the proper complementary measures which,
    if invoked, will reduce risk.
