abstract:
- language: en
  script: Latn
  content: The multi-technology network management (MTNM) solution suite realizes
    a TMN interface between the NML and EML according to ITU-T Recommendation M.3010
    for the FCAPS management of multi-technology fixed transport, access and aggregation
    networks.This Recommendation explains the structure of the MTNM business agreement
    (TMF513) and relates its components to key Recommendations on TMN functionality
    for q reference points between the NML and EML. It wraps TMF513 and associated
    supporting documents by referencing them normatively and relating them to identified
    Recommendations on TMN (NGNM) and principles of functional (NG) network architectures
    (such as transmission layering without adaptation details). This Recommendation
    can also be used as a lead-in to the MTNM business agreement.
