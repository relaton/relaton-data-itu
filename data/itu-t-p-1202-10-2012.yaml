abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.1202 provides an overview of algorithmic models
    for non-intrusive monitoring of the video quality of IP-based video services based
    on packet-header and bitstream information. The ITU-T P.1202-series of Recommendations
    addresses two application areas:\r\n–\tITU-T P.1202.1 specifies the model algorithm
    for the lower resolution (LR) application area, including services such as mobile
    TV.\r\n–\tITU-T P.1202.2 specifies the model algorithm for the higher resolution
    (HR) application area, which includes services such as IPTV. \r\nThe ITU-T P.1202
    model algorithms are no-reference (i.e., non-intrusive) models which operate by
    analysing packet header and bitstream information as available from respective
    packet trace data provided to the model algorithms in the packet capture format
    (PCAP). Further input information on more general aspects of the stream, which
    may not be available from packet header and bitstream information, is provided
    to the model algorithm out-of-band, for example in the form of stream specific
    side information. \r\nITU-T P.1202.1 describes one model, the model for the LR
    application area. ITU-T P.1202.2 describes two models for the HR application area
    corresponding to two modes: mode 1 and mode 2, which are both no-reference (i.e.,
    non-intrusive) models. Mode 1 refers to a parsing mode; the model operates by
    analysing information in the video bitstream without fully decoding the bitstream
    (i.e., no pixel information is used) for MOS estimation. Mode 2 refers to a full
    decoding mode, in addition to the bitstream information which mode 1 uses, the
    model can also decode parts or all of the video bitstream (i.e., pixel information
    is used) for MOS estimation. Further client specific information, such as concealment
    type, is provided to the algorithm out-of-band, for example in the form of stream-specific
    side information. As output, the model algorithms provide individual estimates
    of video quality in terms of the five-point absolute category rating (ACR) mean
    opinion score (MOS). Further, diagnostic information on causes of quality degradations
    can be made available, too, since different types of performance parameters are
    derived during model calculations. \r\nComplementary to the ITU-T P.1202 models,
    there are two further models described in Recommendations ITU T P.1201.1 and ITU-T
    P.1201.2. The respective entry-Recommendation for these models is ITU T P.1201.
    It describes packet-header-only-based video, and audio and audiovisual quality
    models. The main differences with ITU-T P.1202 can be summarized as follows: \r\n–\tThe
    ITU-T P.1201 models provide audio, video and audiovisual quality estimates, while
    the ITU-T P.1202-only models provide video quality estimates.\r\nThe ITU-T P.1201
    models use packet header information, while the ITU-T P.1202 models exploit further
    bitstream information, such as coding-related information. As a consequence, the
    ITU T P.1202 models can be more accurate in their quality predictions. In turn,
    they require non encrypted streams to enable access to payload information. Since
    the ITU-T P.1202 models are more complex, they also require more computational
    power to estimate the video quality.\r\n"
