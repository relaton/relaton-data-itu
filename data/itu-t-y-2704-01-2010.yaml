abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.2701, Security requirements for NGN release 1, provides
    security requirements for next generation networks (NGNs) and its interfaces (e.g.,
    UNIs, NNIs and ANIs). Recommendation ITU-T Y.2704 describes some security mechanisms
    that can be used to fulfil the requirements described in Recommendation ITU-T
    Y.2701 and specifies the suite of options for each selected mechanism. Specifically,
    this Recommendation describes identification, authentication and authorization
    mechanisms; then it discusses transport security for signalling and OAMP, and
    media security. It then describes audit-trail-related mechanisms and finally describes
    the provisioning. The security mechanisms described in this Recommendation are
    based on use of the trust model defined in Recommendation ITU-T Y.2701.The list
    of security mechanisms described in this Recommendation is not exhaustive. NGN
    providers are encouraged to support additional security tools, capabilities and
    operational measures as needed beyond the mechanisms specified in this Recommendation
    for NGN security protection.
