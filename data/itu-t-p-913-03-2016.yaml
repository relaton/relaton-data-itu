abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.913 describes non-interactive subjective assessment
    methods for evaluating the one-way overall video quality, audio quality and/or
    audiovisual quality for applications such as Internet video and distribution quality
    video. These methods can be used for several different purposes including, but
    not limited to, comparing the quality of multiple devices, comparing the performance
    of a device in multiple environments, and subjective assessment where the quality
    impact of the device and the audiovisual material is confounded. \r\n"
