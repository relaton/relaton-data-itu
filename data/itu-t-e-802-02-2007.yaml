abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation E.802 provides a framework and methodologies for the
    identification of QoS criteria relevant to users and guidelines for conversion
    of these criteria into QoS parameters that can be used to evaluate the QoS of
    telecommunication services. Guidelines are also given to obtain user's QoS requirements
    and to prioritize the criteria or parameters. All these may be applied to services
    supported by the terrestrial and wireless legacy networks as well as services
    supported by the emerging IP network.
