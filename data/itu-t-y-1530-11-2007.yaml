  content: ITU-T Recommendation Y.1530 defines performance parameters and objectives
    for point-to-point call processing for voice service provided by hybrid IP networks.
    The parameter definitions are based on the principles and generic performance
    parameters defined in ITU-T Recommendation I.350, and make use of relevant definitions
    from ISDN call processing performance Recommendations where appropriate.
