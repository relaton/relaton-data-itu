abstract:
- language: en
  script: Latn
  content: L.Suppl.Sat provides requirements for a low cost sustainable telecommunications
    infrastructure for rural communications in developing countries with focus on
    Very Small Aperture Antennas for the users. It provides details on the generic
    requirements set out in L.1700 “Requirements and framework for low-cost sustainable
    telecommunications infrastructure for rural communications in developing countries”.
    These requirements are drawn up taking account of examples of best practices from
    systems already in use and the special needs of remote communities such as costs
    and the lack of access to grid electricity. Broadband satellite is available in
    many countries at an entry cost comparable or even lower than terrestrial systems.
    To close the digital divide, developing countries should consider using broadband
    satellite. This will provide coverage to all rural and remote locations.
