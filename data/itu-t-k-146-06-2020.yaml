abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T K.146 deals with the management of electromagnetic
    interference produced by electrified railway traction systems on telecommunication
    systems in DSL frequency bands. This Recommendation defines only a procedure to
    evaluate the acceptability of an electromagnetic DSL draft interference and gives:
    – the criteria defining the quality of service that has to be reached; – the limits
    of the commercial ADSL offer guaranteed by an Internet service provider in conjunction
    with a telecommunication operator if necessary, in the vicinity of a potentially
    obstructive railway; – the installation conditions of electrified traction and
    telecommunication systems under which the Recommendation applies. This Recommendation
    helps to establish a contract between Internet service providers in conjunction
    with telecommunication operators, if necessary, and railway operators in order
    to clearly share responsibilities, and, as a consequence, and if necessary, the
    relevant expenses for mitigation measures. \r\n"
