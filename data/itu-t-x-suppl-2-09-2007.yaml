abstract:
- language: en
  script: Latn
  content: Supplement 2 to ITU-T X.800 series of Recommendations defines a security
    baseline against which network operators can assess their network and information
    security status in terms of readiness and ability to collaborate with other entities
    (operators, users and law enforcement authorities) to counteract information security
    threats. This supplement can be used by network operators to provide meaningful
    criteria against which each network operator can be assessed if required.
