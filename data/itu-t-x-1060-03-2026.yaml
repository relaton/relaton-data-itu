abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T X.1060 defines cyber defence centre/cyber security
    centre (CDC/CSC) as an entity that plays a central role in an organization to
    address cybersecurity risks. The three processes of build, management and evaluation
    that a CDC/CSC should practically implement are described as a framework. The
    services that the organization should have in order to implement more specific
    cybersecurity measures are also provided.\r\n"
