abstract:
- language: en
  script: Latn
  content: "This Recommendation describes the requirements of the network for the
    Internet of Things (IoT) that enhance the common requirements of the IoT identified
    in ITU-T Recommendation Y.2066. The requirements focus on the transport functions
    of the network, but also cover service support functions. \r\n\r\nThe requirements
    described in this Recommendation are common requirements for core network, access
    network and IoT area network. \r\n\r\nThere are a lot of use cases of the IoT
    with heterogeneous characteristics. Considering the current status of deployments
    in the IoT market, this Recommendation focuses on the requirements of the network
    for the IoT with smart meters and sensors as devices. Other use cases will be
    covered in the future revisions of this Recommendation.\r\n"
