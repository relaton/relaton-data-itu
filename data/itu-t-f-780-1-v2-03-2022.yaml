abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.780.1 describes requirements for using ultra-high
    definition (UHD) imaging, such as 4K and 8K video, for telemedicine. The purpose
    of these requirements is to use UHD systems for medical practices that use endoscopes
    and/or microscopes. This Recommendation also describes a list of requirements
    for using a UHD-based \"endoscopic video camera\" as a medical device.\r\nIn addition,
    Annex A describes the requirements on the use of this technology as a medical
    device.\r\nThis revision adds the clause for profiles of UHD imaging for medical
    services, as well as new definitions and abbreviations.\r\n"
