abstract:
- language: en
  script: Latn
  content: Amendment 1 presents a new Appendix III to Recommendation ITU-T P.863 which
    gives advice on how ITU-T P.863 can be used for the prediction of listening quality
    of acoustically recorded speech data in a narrowband context. Narrowband context
    means that the reference signal is narrowband. The prediction is using a narrowband
    scale and ITU-T P.863 predicts as a listener in a pure narrowband listening test.
