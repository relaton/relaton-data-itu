abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.791 defines words describing accessibility, disability,
    and technical terms to be used for improving the writing in relation to standardization,
    and to facilitate accurately the needs and the mainstreaming of accessibility
    in standards that will include persons with disabilities (PWDs), older persons
    with age related disabilities and persons with specific needs. See WTDC Res. 58,
    WTDC AD and ITU–T F.790, listed in the Bibliography.\r\nWith the advent of the
    United Nations Convention on the Rights of Persons with Disabilities (see UNCRPD
    in the Bibliography) its passage in 2006, and its ratification by numerous countries,
    many new terms and definitions were created. Some of these terms and definitions
    were created at the behest of PWDs themselves to eradicate terms that were demeaning,
    insulting, and inaccurate.\r\nStandard writers are able to mainstream accessibility
    features into standards, as well as to write specific standards for accessibility.
    To design products and services successfully, there needs to be a common language.
    This document is intended to give definitions so that it will make it easier for
    industries to implement these accessibility features and accessibility standards
    if everyone is using the same language and vocabulary. It is also important that
    governments, government agencies, non-government organizations (NGOs), the UN,
    and its respective agencies be \"normalized\" in mainstream everyday language.\r\nThe
    UN Convention on the Rights of Persons with Disabilities (UNCRPD), article 9,
    made clear the need to include PWDs, older persons with age related disabilities,
    and persons with specific needs by mainstreaming them into all aspects of modern
    life. This can only be done by including them in the design of modern technology
    and information and communication technologies (ICTs) using universal design as
    defined in the UNCRPD and using a common language and vocabulary.\r\n\r\n"
