abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T E.119 describes the requirements for safety confirmation
    and broadcast messaging for disaster relief, which can realize public organizations’
    business continuity plans (BCP) and can, to the best of their ability, help protect
    lives and property during a disaster.\r\n\r\nIn the event of a disaster, it is
    very important that public organizations, such as telecommunication companies,
    electric power companies, hospitals, fire departments and local governments continue
    to operate and help save the lives of victims. Confirmation of the safety of officials
    or company staff is important in order to continue operating their necessary tasks.
    In addition, to be effective, broadcast message systems should automatically confirm
    the status of officials or staff.\r\n"
