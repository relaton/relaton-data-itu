abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T J.202 defines APIs, semantic guarantees and system
    aspects of platform behaviour for harmonized procedural content formats for interactive
    TV applications.Since this Recommendation was approved in 2003, several procedural
    content formats for interactive TV applications developed by other standardization
    bodies have been updated or newly developed. Updated specifications include: DVB-GEM,
    DVB-MHP 1.0, DVB-MHP 1.1, DVB-MHP 1.2, OCAP-1.0, OCAP-1.1 and ARIB STD-B23. Also,
    ATSC developed ACAP and ABNT has now developed GINGA-J. The purpose of the third
    revision of this Recommendation is to harmonize the specifications with a wider
    variety of standards including GEM 1.2, ARIB-J, GINGA-J, DVB-MHP, ACAP and OCAP.
    To achieve this, the common core defined in this Recommendation consists of two
    sets of APIs; one related to core Java technology and another for broadcast extensions,
    to conform to either DVB-GEM, from which several specifications are derived, or
    JavaDTV specification, which is the core of GINGA-J and functionally equivalent
    to DVB-GEM. Additional APIs specific to the standards listed above are included
    for information in the appendices, which are not included in the harmonized common
    core.'
