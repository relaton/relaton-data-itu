abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T E.218 specifies the structure of the Individual Terrestrial
    trunk radio Subscriber Identity (ITSI), and describes the manner by which the
    ITU-TSB shall allocate, assign and manage the terrestrial trunk radio access Mobile
    Country Code ((T)MCC).\r\nThe administration of the terrestrial trunk radio access
    Mobile Network Code ((T)MNC) by a National Administration is a national matter
    and is therefore outside of the scope of this Recommendation.\r\nThe 2024 revision
    of this Recommendation clarifies the conditions for reclamation in the case of
    non-payment of membership fees as well as amending clause 2.\r\n"
