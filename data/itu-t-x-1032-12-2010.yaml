abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1032 proposes four models that make possible a review
    of interrelationships between a telecommunication IP-based network security system
    (TNSS) and various groups of external objects. Each object is considered in terms
    of its main functions and its probable effect on TNSS construction and functioning
    principles. This Recommendation provides a basis for developing detailed recommendations
    on network security with regard to the effect on external objects.
