abstract:
- language: en
  script: Latn
  content: "Supplement 38 to ITU-T L-series Recommendations supports information and
    communication technology (ICT) organizations in setting science-based targets
    for greenhouse gases (GHGs) according to the decarbonization pathways described
    in detail in Recommendation ITU-T L.1470, aligned with the Special report: Global
    warming of 1.5°C by the Intergovernmental Panel on Climate Change (IPCC), and
    is intended for provision to the Science Based Targets Initiative (SBTi) for use
    as a sectoral target-setting approach. Supplement 38 to ITU-T L-series Recommendations
    focuses exclusively on ICT manufacturers. Guidance for additional sub-sectors,
    including semi-conductor manufacturers and printed circuit board (PCB) manufacturers,
    is for further study. \r\n\r\nNOTE 1 – The term \"ICT manufacturers\" refers to
    organizations that have the financial and organizational control of the design
    and production of ICT goods, including software providers. \r\n\r\nNOTE 2 – Guidance
    for ICT network and datacentre operators have earlier been published as [SBT-I
    2020b] and [ITU-T L-Suppl.37]. \r\n"
