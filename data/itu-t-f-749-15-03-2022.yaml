abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T F.749.15 specifies requirements for high-definition
    (HD) and virtual reality inspection and examination (IaE) services by human beings
    using civilian unmanned aerial vehicles (CUAVs), including those for fore-end
    devices capturing HD images and videos of objects and surroundings, network communication,
    service and application support, as well as service presentation and playback.
    There are many requirements for careful IaE of specific objects or facilities
    and surroundings, such as power lines, oil pipelines, bridges and viaducts on
    water and land, rivers and lakes or inspection of areas subject to emergency or
    disaster. With the help of HD cameras, panoramic cameras and other sensors (such
    as infrared sensors), a CUAV can easily accomplish IaE tasks quickly and efficiently
    with high quality.
