abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T K.106 describes techniques used to mitigate the effects
    of interference between radio devices used in the home and cable or equipment
    connected to wired broadband networks and cable television networks. With the
    advancement of household appliances, many widely used devices are now connected
    to home networks. This Recommendation introduces the relevant electromagnetic
    compatibility (EMC) requirements applicable to wired home network devices, and
    feasible solutions to resolve EMC problems caused by the use of radio devices
    in proximity to other wired network equipment.
