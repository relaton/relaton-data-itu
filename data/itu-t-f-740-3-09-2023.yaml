abstract:
- language: en
  script: Latn
  content: "The augmented reality cultural service system (ARCSS) is a kind of digital
    interpretation system based on augmented reality (AR). ARCSS is able to present
    a story or history behind cultural relics/artworks in a dynamic and actual fusion
    way. \r\nRecommendation ITU-T F.740.3 describes the information flows of augmented
    reality cultural service, including AR content creation information flow and AR
    content display information flow. Based on the information flows, this Recommendation
    specifies the metadata for digital representation of cultural relics/artworks
    using augmented reality.\r\n"
