  content: Recommendation ITU-T G.8011.4/Y.1307.4 defines the service attributes and
    parameters for carrying Ethernet characteristic information over shared bandwidth,
    rooted multipoint connections, provided by SDH, PDH, ATM, MPLS, OTH, ETY or ETH
    server layer networks. This type of service is referred to as Ethernet virtual
    private rooted multipoint service. This Recommendation is based on the Ethernet
    service framework as defined in Recommendation ITU-T G.8011/Y.1307.
