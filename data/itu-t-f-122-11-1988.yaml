abstract:
- language: en
  script: Latn
  content: The purpose of this Recommendation is:a)to standardize the procedures for
    subscribers of a public data network (PDN) calling ship earth stations in the
    Maritime Satellite Data Transmission Service;b)to standardize the procedures for
    calling subscribers of a PDN from ship earth stations using the packet switched
    data transmission service defined in Recommendations X.25 and X.352;c)to standardize
    the procedures for calling subscribers of a PDN from ship earth stations by accessing
    packet assembly/disassembly facilities (PAD) as defined in Recommendation X.351.This
    Recommendation does not cover data calls passed through the international public
    switched telephone network other than those which are accessed through PADs designed
    in accordance with Recommendation X.351
