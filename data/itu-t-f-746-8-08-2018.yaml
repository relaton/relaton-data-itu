abstract:
- language: en
  script: Latn
  content: This Recommendation describes requirements and functional architecture
    for a unified status monitoring (USM) system which allows network providers and
    application service providers to get the status information they need. The USM
    system, which consists of a USM server and a set of USM agents, collects both
    static and dynamic status information from network providers and application service
    providers. It can also parse the status requests from network providers and application
    service providers, generate the status reports, and send the reports back to them.
