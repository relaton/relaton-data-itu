abstract:
- language: en
  script: Latn
  content: This Recommendation as approved in 1992 defines a Programming Communication
    Interface called "APPLI/COM", providing unified access to Telefax Group 3, Telefax
    Group 4, telex and teletex services.Recommendation T.611 has been revised for
    clarity and to include E-mail services in general, Message Handling Systems (MHS),
    as described in the ITU-T X.400-series of Recommendations, in particular and File
    Transfer Services.Special consideration has been taken to assure backwards compatibility
    with the 1992 version of this Recommendation.
