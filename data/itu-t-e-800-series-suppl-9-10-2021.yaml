  content: This Supplement 9 to the ITU-T E.800-series Recommendations provides information
    on regulatory aspects of quality of service (QoS) supplementary to guidelines
    provided in the Recommendations of the E.800 series of the ITU-T. The intent of
    these Recommendations and of this supplement is to assist regulators or administrations
    who need desired levels of QoS for one or more ICT services to be achieved within
    the area for which they are responsible.
