abstract:
- language: en
  script: Latn
  content: "Emerging services, such as cross-domain data storage applications, artificial
    intelligence (AI) training and inference applications, scientific computing applications,
    and intelligent video applications, have increased dramatically. These application
    services demand enhanced next generation network evolution (NGNe) to support service-oriented
    transport and integrated resource scheduling capabilities. \r\nSupplement 99 to
    ITU-T Y series Recommendations describes use cases of service-oriented capability
    enhancement in NGNe and addresses the necessities of potential requirements.\r\n"
