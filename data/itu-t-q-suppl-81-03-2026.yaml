abstract:
- language: en
  script: Latn
  content: "As enterprise services and network resources increasingly span multiple
    domains, coordinated inter-domain software-defined wide area networking (SD-WAN)
    service becomes essential for end-to-end consistent service delivery. \r\nSupplement
    81 to ITU-T Q-series Recommendations specifies the signalling architecture, procedures
    and requirements for coordination between SD-WAN controllers across domains, including
    the interactions of customer demand negotiation, configuration parameters negotiation,
    and service and network monitoring results notification. Supplement 81 to ITU-T
    Q-series contributes to automated provisioning and end-to-end performance assurance
    for inter-domain SD-WAN services.\r\n"
