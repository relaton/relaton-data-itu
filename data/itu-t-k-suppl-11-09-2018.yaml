abstract:
- language: en
  script: Latn
  content: Supplement 11 to ITU-T K-series of Recommendations describes soft error
    mitigation for field programmable gate arrays (FPGAs). FPGAs are a mainstream
    component of recent large‑scale integrated circuits (LSIs), and many FPGAs are
    used as the main component in equipment for communication. First, this Supplement
    describes trends of soft error rates corresponding with the miniaturization of
    manufacturing process rules for semiconductors, and outlines mitigation techniques
    such as materials, physical layout and design tools that FPGA venders provide
    to users. Second, this Supplement discusses the design methodology of communication
    equipment, including consideration of reliability specification by using these
    mitigation measures. Finally, this Supplement discusses recent trends for mitigation
    measures for FPGAs.
