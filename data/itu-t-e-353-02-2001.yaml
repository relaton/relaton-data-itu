abstract:
- language: en
  script: Latn
  content: To be able to meet the increasing demand of efficient utilization of numbering
    resources and to satisfy operational needs which will arise according to deregulation
    of the telecommunication market, there is a need to create an International Network
    Routing Addressing system.Without such an addressing system operators may need
    to allocate dedicated routing numbers (series) from the E.164 numbering plan for
    certain types of calls, e.g. calls to global services, due to national regulation
    and bilateral agreements.This Recommendation proposes formats for the International
    Network Routing Addresses, the Serving Service Provider Identification and provides
    guidance on how to route calls when using International Network Routing Addresses.
