abstract:
- language: en
  script: Latn
  content: Supplement 30 to ITU-T X.805 to the ITU-T X-series of Recommendations provides
    security guidelines for mobile virtual network operators (MVNOs). Security is
    very important to MVNOs and most MVNOs have a lot of security similarities. This
    Supplement analyses the main features of MVNOs and the typical security threats
    that they face. Based on the structure of MVNOs, this Supplement provides a security
    framework for MVNOs, including security objectives and security requirements.
