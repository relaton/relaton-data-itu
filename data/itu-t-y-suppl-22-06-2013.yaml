abstract:
- language: en
  script: Latn
  content: Information communication technologies (ICTs) play an important role with
    regard to greenhouse gas (GHG) monitoring. GHG monitoring is an integral part
    of the global initiative to reduce greenhouse gases in an attempt to resolve climate
    change issues. The next generation network (NGN) is considered to be a communications
    platform suited to support the GHG monitoring task. This supplement describes
    general aspects of the GHG monitoring issue, and it provides requirements and
    required functions. In addition, a service model and functional architecture for
    a GHG monitoring service are presented. NGN-based GHG monitoring service scenarios
    are also presented.
