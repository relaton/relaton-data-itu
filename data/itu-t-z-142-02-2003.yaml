abstract:
- language: en
  script: Latn
  content: This Recommendation provides a graphical presentation format for the test
    specification and implementation language TTCN-3 (the Testing and Test Control
    Notation) called GFT. GFT is used for the graphical presentation of test behaviour
    in form of sequence charts. GFT provides a number of graphical symbols to enable
    the graphical presentation of TTCN-3 test cases, functions, altsteps and control
    parts. GFT can be applied whenever it is necessary to define or document test
    behaviour graphically.
