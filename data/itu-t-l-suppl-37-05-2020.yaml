abstract:
- language: en
  script: Latn
  content: "Supplement 37 to ITU-T L-series Recommendations supports information and
    communication technology (ICT) organizations in setting science-based targets
    for greenhouse gases (GHGs) according to the decarbonisation pathways, described
    in detail in ITU-T L.1470 aligned to the IPCC Special Report on 1.5°C and developed
    to be used as a sectoral target-setting approach by the Science Based Targets
    Initiative (SBTi). This Supplement focuses exclusively on ICT organizations operating
    mobile networks, fixed networks and/or data centres. Guidance for further ICT
    sub-sectors will be covered separately. \r\n"
