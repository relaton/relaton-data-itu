abstract:
- language: en
  script: Latn
  content: "This Supplement summarizes packages that have been standardized in the
    time-frame from June 2000 to July 2007. It identifies packages that meet H.248.x
    sub-series requirements for package definition and are for general use by the
    wider standards community.H.248.x sub-series packages guide - Release 10 provides
    for the:\r• identification of packages that are considered technically consistent
    with H.248.x sub-series principles and packages definition rules in clause 12/H.248.1;\r•
    identification of packages that are currently being worked upon;\r• identification
    of packages that have been worked upon over a certain period of time;\r• identification
    of packages with overlapping functionality.Implementors are encouraged to review
    the packages in this Supplement before proposing new packages.Release 10 contains:\r•
    New packages defined in ITU-T Recs H.248.12 Amd.2, H.248.43, H.248.53.\r• New
    ETSI 3GPP package.\r• Revised packages defined in ITU-T Rec. H.248.47.\r• References
    to new work items: H.248.57, H.248.58, H.248.59, H.248.resman, H.248.CCI, H.248.ipocs,
    H.248.ra."
