abstract:
- language: en
  script: Latn
  content: "This Recommendation describes terminals for low bit-rate multimedia communication,
    utilizing V.34 modems operating over the GSTN. H.324 terminals may carry real-time
    voice, data, and video, or any combination, including videotelephony.\r\nH.324
    terminals may be integrated into personal computers or implemented in stand-alone
    devices such as videotelephones. Support for each media type (voice, data, video)
    is optional, but if supported, the ability to use a specified common mode of operation
    is required, so that all terminals supporting that media type can interwork. This
    Recommendation allows more than one channel of each type to be in use. Other ITU-T
    Recommendations in the H.324-Series include the H.223 multiplex, H.245 control,
    H.263 video codec, and G.723.1 audio codec.\r\nThis Recommendation makes use of
    the logical channel signalling procedures of ITU-T Rec. H.245, in which the content
    of each logical channel is described when the channel is opened. Procedures are
    provided for expression of receiver and transmitter capabilities, so transmissions
    are limited to what receivers can decode, and so that receivers may request a
    particular desired mode from transmitters. Since the procedures of this Recommendation
    are also planned for use by ITU-T Rec. H.310 for ATM networks, and ITU-T Rec.
    H.323 for non-guaranteed bandwidth LANs, interworking with these systems should
    be straightforward.\r\nH.324 terminals may be used in multipoint configurations
    through MCUs, and may interwork with H.320 terminals on the ISDN, as well as with
    terminals on wireless networks.\r\nAnnex A defines the data protocol stack for
    use with the H.324 control channel.\r\nAnnex B defines HDLC frame structure transparency
    for asynchronous transmission.\r\nAnnex C defines the use of H.324 terminals in
    error-prone transmission environments (\"also referred to elsewhere as H.324/M\").\r\nAnnex
    D defines the use of H.324 terminals on ISDN circuits (\"also referred to elsewhere
    as H.324/I\").\r\nAnnex E defines timer T401 initialization for operation over
    geostationary satellite channels.\r\nAnnex F supports multilink operation on the
    GSTN and ISDN.\r\nAnnex G defines the use of ISO/IEC 14496-1 (\"MPEG-4 Systems\")
    generic capabilities in H.324 terminals.\r\nAnnex H supports multilink operation
    on error-prone mobile networks.\r\nAnnex I defines the use of HTTP in H.324 terminals,
    enabling non-conversational services with a user interface through web-like menus.\r\nAnnex
    J summarizes the OIDs defined in ITU-T Rec. H.324 and defines H.324 generic capabilities
    which are used in H.245 signalling-based systems.\r\nThis 2005 revision of H.324
    integrates into H.324 (March 2002) the changes introduced by Corrigendum 1 (November
    2002) and Amendment 1 (January 2005) to H.324, and incorporates the following
    new elements: new clause 6.5.6 and modified clause 7.7.1 giving information on
    resolution of logical channel conflicts and session reset procedures, which will
    help to resolve interoperability problems experienced in the field, new clause
    A.4 with WNSRP, which will permit quicker session startup, and clarifications
    to C.8.1.2.2 regarding the maximum CCSRL-SDU size."
