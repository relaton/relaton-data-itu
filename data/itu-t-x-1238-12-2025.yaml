abstract:
- language: en
  script: Latn
  content: "Rich communication service (RCS) messaging is the evolution of mobile
    messaging. End users benefit from no longer needing to download multiple apps.
    Instead, they can engage with businesses from within the messaging app itself.\r\nRecommendation
    ITU-T X.1238 specifies guidance and technical enablers supporting RCS providers
    to prevent spam distribution based on RCS specificities and defines spam prevention
    and control mechanisms supported by the RCS client.\r\nThis Recommendation quotes
    the RCS architecture as defined by the GSM Association (GSMA) and focuses on how
    to mitigate spam risks of RCS messaging.\r\n"
