abstract:
- language: en
  script: Latn
  content: Annex A proposes two test signals (a pn-sequence with a low crest factor
    and a logarithmically distributed multi-sine wave) for the measurement of Terminal
    Coupling Loss (TCL).Annex B provides speech files and noise sequences to be used
    in combination with objective speech quality evaluation methods. This speech material
    does not replace the speech material found in Supplement 23.
