abstract:
- language: en
  script: Latn
  content: 'Supplement 59 to ITU-T Q-series Recommendations specifies the signalling
    flows for next generation network (NGN) resource and admission control functions
    (RACFs), which include the entities: policy decision physical entity (PD-PE);
    transport resource control physical entity (TRC-PE); and policy enforcement physical
    entity (PE-PE). It also specifies the quality of service (QoS) parameter mapping
    across the various protocols for different signalling flows.'
