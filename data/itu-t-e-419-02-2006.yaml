abstract:
- language: en
  script: Latn
  content: The scope of this KPI Recommendation is to find areas where meaningful
    measures can be identified and correlated to the broader business objectives.Often
    measurements are taken because they are available not because they are meaningful.
    It is envisaged that the model in this Recommendation will assist carriers to
    direct operations areas to play a more key role in supporting the business. Network
    management requires real-time monitoring of current network status and performance
    and the ability to take prompt action to control the performance and resources
    of the network and services when necessary. It should be noted that the complete
    range of network status and performance parameters are not necessary for the introduction
    of a network management capability
