abstract:
- language: en
  script: Latn
  content: This Recommendation is one of a series of Recommendations of the Telecommunications
    Management Network (TMN), providing specifications of TMN management functions
    and TMN management function sets. The content is developed in support of Task
    Information Base B (Roles, resources and functions), associated with Task 2 (Describe
    TMN management context) in the TMN interface specification methodology specified
    in ITU-T M.3020. When performing the analysis of TMN management context, it is
    desirable to consider maximal use of the TMN management function sets available
    in this Recommendation.
