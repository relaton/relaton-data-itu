abstract:
- language: en
  script: Latn
  content: This amendment specifies the PER encodings for the TIME type, for the useful
    time types (DATE, TIME-OF-DAY, DATE-TIME, and DURATION) and for the defined time
    types specified in the ASN.1 module DefinedTimeTypes of ITU-T Rec. X.680/Amd.3
    | ISO/IEC 8824-1/Amd.3, Annex A bis.Property settings for the abstract values
    of the useful and defined types are specified in ITU-T Rec. X.680/Amd.3 | ISO/IEC
    8824-1/Amd.3, Annex A bis. Property settings for the additional time types are
    defined by an application designer using the property setting subtype notation
    (which is PER visible). These property settings are used to determine optimal
    PER encodings. In particular, a DATE will normally encode into 15 bits, a TIME-OF-DAY
    into 17 bits, a DATE-TIME into 32 bits (four octets) and a DURATION will frequently
    encode into 16 bits or less (two octets).
