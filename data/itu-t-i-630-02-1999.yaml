abstract:
- language: en
  script: Latn
  content: This Recommendation "ATM Protection Switching" provides architectures and
    mechanisms for protection switching at ATM layer. The architecture includes the
    extent of the protected domain and arrangement of protected domain. The resource
    for protection entities is pre-allocated. The mechanism includes protection switching
    trigger, hold-off mechanisms and protection switching control protocol.This Recommendation
    describes individual VP/VC protection and group protection. The individual VP/VC
    protection is a technique where a single network and/or subnetwork connection
    is used for working entity and protection entity. The group protection is a technique
    where a logical bundle of one or more network and/or subnetwork connections is
    used for working entity and protection entity.Currently, this Recommendation describes
    1+1 and 1:1 bidirectional protection switching as well as 1+1 unidirectional protection
    switching.
