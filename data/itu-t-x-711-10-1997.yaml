abstract:
- language: en
  script: Latn
  content: "This Recommendation | International Standard specifies a protocol which
    is used by application layer entities to exchange management information.\r\nThis
    Recommendation | International Standard specifies:\r\n–\tprocedures for the transmission
    of management information between application entities;\r\n–\tthe abstract syntax
    of the Common Management Information Protocol (CMIP) and the associated encoding
    rules to be applied;\r\n–\tprocedures for the correct interpretation of protocol
    control information;\r\n–\tthe conformance requirements to be met by implementation
    of this Recommendation | International Standard.\r\n"
