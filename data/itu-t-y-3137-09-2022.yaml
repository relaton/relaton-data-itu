abstract:
- language: en
  script: Latn
  content: Application addressing is the process to discover the Internet protocol
    (IP) address of the server on which the application is running when user equipment
    (UE) intends to access the application. Recommendation ITU-T Y.3137 specifies
    the technical requirements for supporting application addressing in edge computing
    for future networks including IMT-2020, and also proposes new requirements towards
    fixed mobile convergence (FMC) architecture for future networks including IMT-2020.
