abstract:
- language: en
  script: Latn
  content: The deployment of broadband services fundamentally changes the utilization
    of the telecommunication network. First, the transmission is present on the network
    at all times ('always-on'). Second, the transmission frequency range employed
    is much greater than for previous access systems. Hence, the risk of interference
    with radio services has increased. In case of interference, the share of responsibility
    between the network operator and the national responsible body as well as the
    levels of the radiated field are not clearly defined.The purpose of this Recommendation
    is to propose a measurement method and target levels to be used in case of interference
    with radio services. In addition, a methodology for solving the interference's
    case is mentioned, and under what circumstances the case has to be forwarded to
    the national responsible body.
