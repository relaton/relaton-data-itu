abstract:
- language: en
  script: Latn
  content: This Recommendation provides a procedure to protect the telecommunication
    lines using fibre optics against direct lightning discharges to the line itself
    or to the structures that the line enters. The protection procedure is related
    to the exposure of the line to direct lightning discharges and includes the selection
    of cable characteristics/installation, use of shield wires, bonding/earthing of
    the cable shield, installation of surge protective devices (SPD) and route redundancy.
