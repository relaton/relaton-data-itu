abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T E.371 defines deemed impermissible traffic, namely
    international traffic that may be contrary to the legal and regulatory framework
    of a country. Such traffic may include practices such as call masking, call refiling,
    international call back, and other similar forms of traffic manipulation. The
    determination of what constitutes impermissible traffic is made on a countrybycountry
    basis.\r\nDeemed impermissible traffic can have serious legal and privacy implications,
    leading to financial loss, compromised personal information and invasion of privacy.\r\nThe
    Recommendation emphasizes the importance of understanding impermissible traffic
    and its potential consequences. It highlights the negative impact on security,
    privacy and user experience as well as quality of service (QoS) and quality of
    experience (QoE). The solutions and the use case sections of the Recommendation
    provide practical measures to combat impermissible traffic effectively.\r\n"
