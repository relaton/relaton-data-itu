abstract:
- language: en
  script: Latn
  content: "This Recommendation defines the characteristics of Group 3 facsimile terminals
    which enable black and white documents and also optionally colour documents to
    be transmitted on the general switched telephone network, international leased
    circuits and the Integrated Services Digital Network (ISDN). Group 3 facsimile
    terminals may be operated manually or automatically and document transmission
    may be requested alternatively with telephone conversation. The procedures used
    by Group 3 facsimile terminals are defined in ITU-T Rec. T.30.This revised version
    consolidates features previously approved as amendments to the text as well as
    recently approved capabilities, including:\r• support of all standardized image
    resolutions;\r• support of mixed raster content for black and white images;\r•
    definitions for transmission of sYCC colour space using facsimile protocol."
