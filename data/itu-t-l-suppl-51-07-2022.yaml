  script: Latn
  content: This Supplement 51 to ITU-T L-series Recommendation provides successful
    examples of cities that have already employed the city science approach to solve
    different challenges. By employing scientific techniques and methods used by the
    scientific community, city science application framework provides a reliable and
    consistent way for cities to tackle the rising environmental and sustainability
    challenges. Recommendation ITU-T L.1610, City science application framework, illustrates
    the methodology behind the application of city science.
