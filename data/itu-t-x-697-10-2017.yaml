  content: Rec. ITU-T X.697 | ISO/IEC 8825-8 specifies a set of JavaScript Object
    Notation Encoding Rules (JER) that may be used to derive a transfer syntax for
    values of types defined in Rec. ITU-T X.680 | ISO/IEC 8824-1, Rec. ITU T X.681
    | ISO/IEC 8824-2, Rec. ITU-T X.682 | ISO/IEC 8824-3, Rec. ITU-T X.683 | ISO/IEC
    8824-4. It is implicit in the specification of these encoding rules that they
    are also to be used for decoding.
