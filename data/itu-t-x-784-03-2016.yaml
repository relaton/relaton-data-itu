abstract:
- language: en
  script: Latn
  content: "As SNMP has been widely used to manage nodes in IP network, such as servers,
    workstations, routers, switches and etc. When SNMP based management systems need
    to be interconnected, system testing is required in order to ensure the operability
    between them. Implement Conformance Statements (ICS) proformas is a way for implementers
    to claim conformance to a standardized SNMP interface specification.\r\n\r\nThis
    Recommendation proposed the guidelines for ICS proformas for SNMP based interface
    systems. It provided the overview and constructions for the MIB and SMI, and provided
    several proformas (tables) for each SMI components to be used in interface. The
    instructions on how to fill in each column in the tables are also described. At
    last some examples on the SNMP Interface ICS are provided in Appendix. \r\n"
