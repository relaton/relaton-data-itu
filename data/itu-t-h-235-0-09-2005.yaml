abstract:
- language: en
  script: Latn
  content: "This Recommendation describes enhancements within the framework of the
    H.3xx-series Recommendations to incorporate security services such as Authentication
    and Privacy (data encryption). The proposed scheme is applicable to both simple
    point-to-point and multipoint conferences for any terminals which utilize ITU-T
    Rec. H.245 as a control protocol; also to H.323 systems that use the H.225.0 RAS
    and/or Call Signalling Protocol.\r\n\r\nFor example, H.323 systems operate over
    packet-based networks which do not provide a guaranteed quality of service. For
    the same technical reasons that the base network does not provide QOS, the network
    does not provide a secure service. Secure real-time communication over insecure
    networks generally involves two major areas of concern – authentication and privacy.\r\n\r\nThis
    Recommendation describes the security infrastructure and specific privacy techniques
    to be employed by the H.3xx-series of multimedia systems. This Recommendation
    will cover areas of concern for interactive conferencing. These areas include,
    but are not strictly limited to, authentication and privacy of all real-time media
    streams that are exchanged in the conference. This Recommendation provides the
    protocol and algorithms needed between the H.323 entities.\r\n\r\nThis Recommendation
    utilizes the general facilities supported in ITU-T Rec. H.245 and as such, any
    standard which operates in conjunction with this control protocol may use this
    security framework. It is expected that, wherever possible, other H-series terminals
    may interoperate and directly utilize the methods described in this Recommendation.
    This Recommendation will not initially provide for complete implementation in
    all areas, and will specifically highlight endpoint authentication and media privacy.\r\n\r\nThis
    Recommendation includes the ability to negotiate services and functionality in
    a generic manner, and to be selective concerning cryptographic techniques and
    capabilities utilized. The specific manner in which they are used relates to systems
    capabilities, application requirements and specific security policy constraints.
    This Recommendation supports varied cryptographic algorithms, with varied options
    appropriate for different purposes; e.g., key lengths. Certain cryptographic algorithms
    may be allocated to specific security services (e.g., one for fast media stream
    encryption and another for signalling encryption). \r\n\r\nIt should also be noted
    that some of the available cryptographic algorithms or mechanisms may be reserved
    for export or other national issues (e.g., with restricted key lengths). This
    Recommendation supports signalling of well-known algorithms in addition to signalling
    non‑standardized or proprietary cryptographic algorithms. There are no specifically
    mandated algorithms; however, it is strongly suggested that endpoints support
    as many of the applicable algorithms as possible in order to achieve interoperability.
    This parallels the concept that the support of ITU-T Rec. H.245 does not guarantee
    the interoperability between two entities' codecs.\r\n\r\nVersion 4 of ITU-T Rec.
    H.235 breaks up the former ITU-T Rec. H.235v3 into a suite of H.235.x subseries
    Recommendations, and restructures the subseries. New ITU-T Recs H.235.8 and H.235.9
    have been added to the suite; other subseries Recommendations have been extended
    with new functionality (ITU-T Recs H.235.3, H.235.5). ITU-T Rec. H.235.0 holds
    the H.323 security framework with common text and useful general information for
    all H.235.x subseries Recommendations.\r\n\r\nNew H.235.0 Appendices IV, V, and
    VI provide a mapping of text, figures and tables from ITU-T Rec. H.235 version
    3 (2003), including the subsequent Corrigendum 1 and amendments, to the new structure.\r\n"
