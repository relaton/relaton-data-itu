abstract:
- language: en
  script: Latn
  content: ITU-T Recommendation X.660 | ISO/IEC 9834-1 defines a generic registration-hierarchical-name-tree
    (RH-name-tree) and a specific form of this RH-name-tree that supports international
    object identifiers (OIDs). It includes registration of the top-level arcs of the
    OID tree. It also specifies procedures for the operation of an International Registration
    Authority for use, when needed, by other Recommendations and/or International
    Standards. For easy reference, and to emphasize that this tree is an extended
    form of the original OID tree (defined in earlier versions of this Recommendation
    | International Standard), this specific RH-name-tree can be referred to as "the
    international OID tree", or more commonly as just "the OID tree".The OID tree
    (defined as the International Object Identifier Tree) specified in this edition
    is a superset of the original OID tree, which did not support Unicode labels (names
    of arcs in any language, using the Unicode character set).The original OID tree
    required all arcs to be unambiguously identified by a primary integer value, with
    the use for human readability of (not necessarily unambiguous) secondary identifiers
    (restricted to the Latin alphabet). Secondary identifiers were not normally carried
    in protocols or used for machine identification. The International Object Identifier
    tree extends this by allowing an arc to also be unambiguously identified by a
    Unicode label (a string of Unicode characters) that can be carried in protocols
    and can be used for machine identification.The primary integers and secondary
    identifiers of the International Object Identifier tree continue to be used in
    encoding (primary integers only) and value notation (primary integers and secondary
    identifiers) of the ASN.1 OBJECT IDENTIFIER type, which is unchanged. The Unicode
    labels can only be used in encodings and value notation of the ASN.1 OID-IRI type,
    and in the specification of an IRI or URI (see IETF RFC 3987).It also provides
    recommendations on an appropriate fee structure for registration of lower level
    arcs (see clause 11).
