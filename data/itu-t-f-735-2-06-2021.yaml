abstract:
- language: en
  script: Latn
  content: "As defined in Recommendation ITU-T F.735.1, software-defined cameras can
    provide the basic hardware service application programming interfaces (APIs) and
    the common software service APIs for application developers; these APIs are called
    \"service-oriented interfaces\". Through these APIs the upper layer applications
    can obtain raw video, pan/tilt/zoom (PTZ), common software and hardware resource
    to realize video intelligent analysis and non-intelligent businesses. Recommendation
    ITU-T F.735.2 specifies the architecture and service-oriented interface protocols
    for software-defined cameras, including functional architecture of software-defined
    camera system, service-oriented interface message protocol structure, and service-oriented
    interface protocols. \r\n"
