abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T H.847 provides a test suite structure (TSS) and the
    test purposes (TP) for personal health devices using Bluetooth Low Energy transport
    in the Personal Health Device (PHD) interface, based on the requirements defined
    in the Recommendations of the ITU-T H.810 sub-series, of which Recommendation
    ITU‑T H.810 (2016) is the base Recommendation. The objective of this test specification
    is to provide a high probability of interoperability at this interface.\r\n\r\nRecommendation
    ITU-T H.847 is a transposition of Continua  Test Tool DG2016, Test Suite Structure
    & Test Purposes, Personal Health Devices Interface; Part 7: Continua Design Guidelines.
    Personal Health Device BLE (Version 1.6, 2016-09-20), that was developed by the
    Personal Connected Health Alliance. A number of versions of this specification
    existed before transposition.\r\n\r\nThis Recommendation includes an electronic
    attachment with the protocol implementation conformance statements (PICS) and
    the protocol implementation extra information for testing (PIXIT) required for
    the implementation of Annex A.\r\n"
