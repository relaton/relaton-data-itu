abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T M.3375 specifies a framework for the management of
    cross-domain network slices in IMT-2020 network and beyond to efficiently implement
    management and coordination of cross-domain network slices, including cross-domain
    network slices interworking.\r\nNetwork slicing has emerged as a crucial feature
    and enabler for the IMT-2020 networks. The increasing demand for network slices
    renders cross-domain network slice interworking a challenging task. Therefore,
    it is highly imperative to ensure coordination among the three network slice subnet
    management systems for the access network, transport network and core network.\r\n\r\n"
