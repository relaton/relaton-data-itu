abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T Y.1292 describes the framework for requirements and
    capabilities to enable the customization of IP networks and related IP service
    and IP transfer capability to meet the customer's needs. Such a framework includes
    the service requirements and functional requirements and capabilities as well
    as the architectural considerations.In addition, this Recommendation identifies
    the application scenarios and service procedures applicable to the context of
    customization using the capabilities made available to and/or performed by the
    customer of IP services.
