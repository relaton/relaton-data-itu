abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.1100 specifies performance requirements and test
    methods for narrowband (300 to 3 400 Hz) handsfree communication in vehicles.
    This Recommendation covers:\r\n–built-in hands-free systems,\r\n–after-market
    hands-free car kits,\r\n–single microphones,\r\n–mobile phones connected via short-range
    wireless to hands-free systems,\r\nto be used in vehicles for communication while
    driving.\r\nThis Recommendation addresses the test of complete systems, as well
    as the subsystems of handsfree microphones and telephones with short-range wireless
    transmission links used to interconnect the hands-free system to mobile networks.\r\nFor
    testing, test set-ups and recommended environmental conditions are described.\r\nThe
    methods, analysis and performance parameters specified in this Recommendation
    are based on test signals and test procedures defined in Recommendations ITU-T
    P.501, ITUT P.502, ITU-T P.340 and ITU-T P.581.\r\n"
