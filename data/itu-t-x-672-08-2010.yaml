abstract:
- language: en
  script: Latn
  content: This Recommendation | International Standard specifies the object identifier
    (OID) resolution system (ORS). This enables (arbitrary) information to be associated
    with any ORS-supported OID node (of the international object identifier tree defined
    in Rec. ITU-T X.660 | ISO/IEC 9834-1). This associated information is identified
    by an application specification that may have a requirement for instances of that
    application (running on any computer system) to obtain the associated information
    by an ORS search, using an ASN.1 OID-IRI value to identify the node.Currently
    defined application information for a node includes the canonical form of an international
    object identifier, child node information, registration information about the
    owner of the node, a reference to an ASN.1 module identified by the node, information
    supporting tag-based applications, and information supporting cybersecurity.
