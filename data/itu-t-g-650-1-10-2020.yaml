abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T G.650.1 contains definitions of the linear, deterministic
    parameters of single-mode optical fibres and cables. It also contains both reference
    test methods and alternative test methods for characterizing these parameters.
    \r\n\r\nThese test methods are suitable mainly for factory measurements of the
    linear, deterministic attributes of single-mode fibres and cables. Some of the
    test methods may also be used to characterize discrete optical components. \r\n\r\nThe
    history of this Recommendation is as follows: \r\n\r\n1993 Definitions and test
    methods were removed from single-mode fibre Recommendations such as Recommendation
    ITU-T G.652 and used to create the initial version of Recommendation ITU-T G.650.
    \r\n\r\n1997 The second version of Recommendation ITU-T G.650 added definitions
    and test methods for polarization mode dispersion and appendices I, II and III.
    The improved determination of cut-off wavelength (clause 5.3.1.3.4) was also added.
    \r\n\r\n2000 The third version established reference and alternative test methods
    for polarization mode dispersion, modified the definitions and test methods for
    core concentricity error (clauses 3.4 and 5.2), and added clause 5.1.4 and appendices
    IV, V and VI. \r\n\r\n2002 In order to facilitate maintenance, Recommendation
    ITU-T G.650 was divided into smaller Recommendations. Recommendation ITU-T G.650.2
    contains definitions and test methods for statistical and non-linear attributes
    of single-mode fibre and cable. \r\n\r\n2004 The second version of Recommendation
    ITU-T G.650.1 added a third alternative test method \"Spectral attenuation modelling\"
    (clause 5.4.4) and new Appendix III \"Example of a matrix model\". This material
    has been moved from the single-mode fibre Recommendations into this Recommendation
    ITU-T G.650.1. In addition, chromatic dispersion fitting procedures have been
    added (Annex A). \r\n\r\n2010 The third version of Recommendation ITU-T G.650.1
    added the test method \"Test methods for the macrobend loss\" (clause 5.6). Jumper
    cut-off wavelength has been deleted from clause 5.3. An additional description
    has been added in cut-off wavelength test method (clause 5.3.1.3.2). Equation
    5-1 has been corrected. A detailed description has been added in proof test method
    (clause 5.7). Appendix II has been updated. \r\n\r\n2018 The fourth version of
    Recommendation ITU-T G.650.1 added Appendix IV (from Amendment 1 published in
    2012) to provide measurement procedures for coherent multipath interference (MPI).
    The interferometric technique for chromatic dispersion measurement has been deleted
    from clause 6.5 and moved to Appendix V. The description of measurement details
    for ITU-T G.657 fibre on MFD, cut-off wavelength and spectral attenuation tests
    has been improved. The RTM and ATM of cable cut-off wavelength measurement has
    been modified. An example of the interpolation method has been added in clause
    I.3. Equation 6-1 has been corrected. \r\n\r\nii Rec. ITU-T G.650.1 (10/2020)
    \r\n\r\n2020 The fifth version of Recommendation ITU-T G.650.1 revised third alternative
    test method \"Spectral attenuation modelling\" (clause 6.4.4) to cover the applicability
    of fewer predictor wavelengths for the modelling of much narrower wavelength range.
    In Appendix III, \"Example of a matrix model\", existing example matrix for ITU-T
    G.652 fibre was replaced with a new matrix using four predictor wavelengths, and
    added a new matrix for ITU-T G.654.E fibre using three predictor wavelengths.
    Wavelength dependence of modelling error as a function of the number of predictor
    wavelengths was explained. \r\n"
