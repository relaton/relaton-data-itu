abstract:
- language: en
  script: Latn
  content: Supplement 20 to ITU-T Y-series Recommendations provides mobile IPTV use
    cases as informative illustrations of how mobile IPTV services can be designed,
    deployed and operated. The use cases are described with sample scenarios and operational
    procedures of mobile IPTV services. In addition, the use cases detail functional
    procedures to illustrate how the service scenarios can be supported with IPTV
    architectural functions. Finally, the use cases have been categorized in terms
    of service aspects and capability aspects.
