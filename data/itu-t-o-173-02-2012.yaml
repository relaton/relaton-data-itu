abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T O.173 specifies instrumentation that is used to generate
    and measure jitter in digital systems based on the optical transport network (OTN).
    Measurement requirements for client interfaces, e.g., SDH line interfaces are
    not addressed in this Recommendation.\r\n\r\nThe requirements for the characteristics
    of the jitter measuring equipment that are specified in this Recommendation must
    be adhered to in order to ensure consistency of results between equipment produced
    by different manufacturers."
