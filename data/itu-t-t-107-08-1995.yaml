abstract:
- language: en
  script: Latn
  content: This Recommendation specifies the syntax to be used by videotex or other
    retrieval services for implementation of an enhanced man machine interface (VEMMI).The
    VEMMI is a means to improve the ergonomics and interactivity of retrieval systems
    using graphical dialogue elements such as application bar, button bar, pop-up
    menus, dialogue box.The standard plane continues to receive the standard data
    of the underlying platform. Standard Videotex Applications can therefore run also
    on a VEMMI terminal. The VEMMI objects plane receives VEMMI objects. An automatic
    switching mechanism between standard mode and VEMMI mode is provided.This Recommendation
    defines datatypes (VEMMI-high quality text, VEMMI bitmaps) and allows the integration
    of other widely used datatypes (e.g. JPEG, BMP, WAVE, MIDI, Videotex) in the VEMMI
    dialogue. Also operative objects are defined to extent the capabilities of a VEMMI
    application during runtime.VEMMI objects can be distributed between a host and
    a VEMMI terminal to improve the performance of interactive applications. The VEMMI
    application can control (save, load, update) VEMMI objects on the terminal.This
    Recommendation contains the service description, the service elements and their
    coding.
