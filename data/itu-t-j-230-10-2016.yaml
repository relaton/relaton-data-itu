abstract:
- language: en
  script: Latn
  content: "With the increasing availability of sophisticated mobile devices that
    include broadband Internet access services, cable operators, broadcasters and
    consumer electronics manufacturers have started taking advantage of this trend
    by providing connected devices that work as companion devices to enhance the experience
    of watching television (TV). This technology creates several opportunities for
    players in all segments involved in delivering enriched and customized content
    and user experiences.\r\nThe integration of these companion mobile devices, also
    known as second screens with TV and cable set top box (STB) platforms, support
    several scenarios based on content sharing, synchronization, user interaction
    and customized presentations. This integration also offers opportunities for the
    inclusion of intuitive and convenient user interfaces and additional areas for
    the presentation of information. In addition, collaborative work of multiple STBs
    is also taken into account to enhance capability of the services. For example,
    we can add 4K video service capability to the existing user STB by providing external
    plug-in STB.\r\nRecommendation ITU-T J.230 defines high level requirements for
    the cable STB and mobile platforms involved in these scenarios. This Recommendation
    also describes some useful application cases to illustrate the ideas behind the
    requirements.\r\n"
