abstract:
- language: en
  script: Latn
  content: Recommendations T.2 and T.3 define Group 1 and Group 2 facsimile terminals
    respectively; such stand-alone terminals have not been manufactured for many years
    and Group 3 facsimile terminals are the only type being used on the GSTN.In recognition
    of this market situation, Study Group 8 has agreed to delete references to Groups
    1 and 2 in Recommendations T.4 and T.30.In order to be consistent and to minimize
    the possibility of any confusion, it is proposed that this Recommendation be amended
    to delete references to Group 1 and Group 2 terminals and also to use consistent
    terminology.
