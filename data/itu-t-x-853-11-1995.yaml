  content: This Recommendation | International Standard provides the Protocol Implementation
    Conformance Statement (PICS) proforma for the OSI Commitment, Concurrency and
    Recovery (CCR) protocol specified in ITU-T Rec. X.852 | ISO/IEC 9805-1. The PICS
    proforma represents, in tabular form, the mandatory and optional elements of the
    CCR protocol. The PICS proforma is used to indicate the features and choices of
    a particular implementation of the CCR protocol.
