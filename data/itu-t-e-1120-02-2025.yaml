abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T E.1120 specifies procedures to be used by an applicant,
    the Director of the Telecommunication Standardization Bureau (TSB) and the appropriate
    ITU-T Study Group1 (currently ITU-T SG2), for the assignment of:\r\n–ITU-T E.164
    identification codes (ICs) associated within the shared country codes (CCs) for
    the networks category of ITU-T E.164, whose combination is designated CC + IC.\r\n–ITU-T
    E.212 shared mobile country codes for networks and their respective mobile network
    codes.\r\n–ITU-T E.118.1 assigned global issuer identifier numbers (IINs).\r\n–ITU-T
    E.218 shared terrestrial trunk radio access mobile network codes.\r\n"
