abstract:
- language: en
  script: Latn
  content: This Recommendation defines the two independent technical solutions which
    may be used in the context of secure facsimile transmission. The two technical
    solutions are based upon the HKM/HFX40 algorithms and the RSA algorithm.Annex
    A contains information regarding the HKM/HFX40 algorithms.Annex B contains information
    regarding the RSA algorithm.Annex C describes the use of the HKM system to provide
    secure key management capabilities for facsimile terminals. The provision of the
    capabilities is described in terms of two main procedures:- the procedure for
    one way registration between entities X and Y (procREGxy); and- the procedure
    for the secure transmission of a secret key between entities X and Y (procSTKxy).Annex
    D covers the procedures for the use of the HFX40 carrier cipher system to provide
    message confidentiality for facsimile terminals.Annex E describes the HFX40-I
    hashing algorithm, in terms of its use, the necessary calculations and the information
    to be exchanged between the facsimile terminals to provide integrity for a transmitted
    facsimile message as either a selected or pre-programmed alternative to the encryption
    of the message.
