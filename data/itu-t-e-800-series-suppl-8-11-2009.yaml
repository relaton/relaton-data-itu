- language: en
  script: Latn
  content: Supplement 8 to the ITU-T E.800-series of Recommendations was originally
    prepared as a white paper by the Interconnection Working Group of the Communications
    Futures Program (CFP) of the Massachusetts Institute of Technology (MIT). It presents
    an approach to the deployment of inter-provider quality of service (QoS) to enable
    further consideration of the topic. This Supplement discusses key issues that
    service providers need to agree upon if inter-provider QoS is to be readily deployable.
