abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T X.1244 specifies the basic concepts, characteristics,
    and technical issues related to countering spam in IP multimedia applications
    such as IP telephony, instant messaging, etc. The various types of IP multimedia
    application spam are categorized, and each categorized group is described according
    to its characteristics. This Recommendation describes various spam security threats
    that can cause IP multimedia application spam. There are various techniques developed
    to control the e-mail spam which has become a social problem. Some of those techniques
    can be used in countering IP multimedia application spam. This Recommendation
    analyses the conventional spam countering mechanisms and discusses their applicability
    to countering IP multimedia application spam. This Recommendation concludes by
    mentioning various aspects that should be considered in countering IP multimedia
    application spam.
