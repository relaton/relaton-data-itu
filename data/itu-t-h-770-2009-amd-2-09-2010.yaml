abstract:
- language: en
  script: Latn
  content: Recommendation ITU-T H.770 describes the mechanisms for service provider
    discovery, service discovery and selection for IPTV services. The mechanisms enable
    IPTV terminal devices to provide the end-users with effective ways for consuming
    IPTV services. The expected types of IPTV services using service discovery information
    include linear TV and video-on-demand, etc.This Recommendation identifies service
    discovery metadata elements and attributes providing information concerning service
    providers and contents/services, and its delivery protocols covering both unicast
    and multicast transport mechanisms.Amendment 1 (11/2009) adds descriptive texts
    concerning service provider discovery to Appendix I and corrects errors identified
    in Appendix II.Amendment 2 (09/2010) to Recommendation ITU-T H.770 adds new Appendix
    V on information for service discovery using Broadband Forum TR-069 and introduces
    changes in the main body of the Recommendation concerning its use.
