abstract:
- language: en
  script: Latn
  content: Recommendation F.160 lays down general provisions for all forms of international
    public facsimile services. The specific provisions concerning international public
    facsimile service between public bureaux (bureaufax) and between subscriber stations
    are contained in Recommendations F.170, F.171, F.180, F.182 and F.184. With a
    view of increasing the flexibility and range of these facsimile services, this
    Recommendation deals with the international transmission of facsimile documents:a)from
    a public bureau to a subscriber facsimile station (public-to-private); andb)from
    a subscriber facsimile station to a public bureau (private-to-public).The relevant
    tariff provisions may be found in Recommendation D.73
