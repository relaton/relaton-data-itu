abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.749.7 specifies the requirements for vulnerable
    road user (VRU) protection services using a vehicle gateway. The protection of
    vulnerable traffic participants has a positive impact on road traffic safety.
    By establishing harmonized functional requirements, this framework enables vehicle
    systems to more effectively detect and protect VRUs, thereby helping to avoid
    traffic accidents and reduce the severity and frequency of serious injuries. In
    addition, the adoption of uniform requirements across manufacturers supports cost
    efficiency in system development and facilitates interoperability among different
    automotive platforms.\r\n"
