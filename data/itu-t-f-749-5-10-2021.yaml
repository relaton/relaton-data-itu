abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.749.5 provides a basic definition of vehicle domain
    service and supplementary information on detailed concepts, as well as definitions
    of the typical and supplementary use cases being used to define the specification
    of applications. Connected vehicles are expected to expand and become even more
    popular in different markets worldwide. A variety of technologies is being developed
    and discussed for many applications. Detailed specifications of communications
    and applications are provided in other documents in the Recommendation ITU-T F.749
    series; they are not provided in Recommendation ITU-T F.749.5.\r\nRecommendation
    ITU-T F.749.5 (2021) is technically aligned with ISO 23239-1. It was developed
    jointly by ITU-T Study Group 16 and ISO TC22/SC31 under the Joint Project Team
    on Vehicular Domain Service (JVDS).\r\n\r\n"
