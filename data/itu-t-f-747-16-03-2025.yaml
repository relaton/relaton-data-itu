abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T F.747.16 provides the requirements for 3D machine
    vision-based surface defect detection service of industrial products. Three-dimensional
    (3D) machine vision can obtain the complete geometric information of the real
    3D scene, and the images with depth information can be used to achieve high-precision
    measurement, detection, positioning, reconstruction, and scene understanding.
    It can process various types of industrial products that cannot be processed by
    two-dimensional (2D) machine vision (e.g., highly reflective surfaces and low-contrast
    surfaces), such as electronic products and printed circuit board (PCB) surface
    detection, free-form surface optical mirror measurement, and measurement and detection
    of steel product surfaces or curved surfaces, etc.\r\n\r\n"
