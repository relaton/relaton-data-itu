abstract:
- language: en
  script: Latn
  content: This Recommendation makes provision for the operational and Quality of
    Service requirements for both air-to-ground and ground-to-air aeronautical passenger
    communications mobile-satellite services. This Recommendation follows the principles
    laid down in Recommendation F.111. Operation in the Aeronautical mobile-satellite
    (route) service band must meet the standards established by the International
    Civil Aviation Organization (ICAO). This includes the technical specifications,
    preemptive and priority functions, as defined in ICAO Annex 10, Aeronautical Telecommunications.
    This Recommendation only covers aeronautical passenger communications. Other service
    and operational provisions are not covered by this Recommendation. Aeronautical
    passengers communications (APC), a form of communications, unrelated to safety
    and regularity of flight or the aircraft operating agency, which is at the disposal
    of the passenger and crew of an aircraft in flight status on a controlled basis
    subject to flight safety requirements. Aeronautical passenger communications is
    one form of public correspondence
