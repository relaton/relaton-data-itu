abstract:
- language: en
  script: Latn
  content: Supplement 8 to ITU-T Y-series Recommendations provides the basic information
    about global information and communication technologies (ICTs) forums/consortia.
    This supplement describes basic investigation data and the results of statistical
    analysis about ICT-related forums/consortia in the world. In addition, this supplement
    also particularly describes the current status of the home-network related standardization
    organizations in details, including their overview, scope, objectives, and standardization
    activities. In this supplement, the total number of the forums/consortia surveyed
    is 227. Besides, it also includes two appendices, one is the detailed information
    tables of the forums/consortia, and the other is the research on the home-network
    related standardization, as well as the new trend of the technologies in this
    area.
