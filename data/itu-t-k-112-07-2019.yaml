abstract:
- language: en
  script: Latn
  content: 'Recommendation ITU-T K.112 provides a set of practical procedures related
    to the lightning protection, earthing and bonding of radio base stations (RBSs).
    It considers two types of RBS: those that are stand-alone installations, comprising
    a tower and the associated equipment and those that are installed on the roof
    of a building. In both cases, this Recommendation provides the procedures for
    the design and installation of the lightning air-termination system, down-conductors,
    earthing network, bonding conductors and surge protective devices (SPDs). This
    includes the specification of the materials, anti‑corrosion protection and special
    treatment for rocky areas. Particular attention is directed to the protection
    of the navigation light systems and of the electric power conductors that feed
    the RBS, especially in the case where the RBS is installed on the roof of a building.
    Annex A presents practical examples of earthing network design, whereas Annex
    B presents an overview of the techniques for measuring the earthing resistance
    and the earth resistivity.'
