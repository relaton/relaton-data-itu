abstract:
- language: en
  script: Latn
  content: "Supplement 43 to ITU-T X series Recommendations describes the security
    threats and deployment scenarios for cellular vehicle-to-everything (C-V2X) services
    supporting ultra-reliable and low-latency communication (URLLC). \r\nMeeting low
    latency in URLLC is a critical condition for C-V2X services and autonomous driving
    services to provide secure and safe driving experiences to passengers. Network
    security problems regarding URLLC bring not only inefficient service performance
    but also can also cause critical accidents affecting passengers and other people.
    \r\nTo address this security problem, this Supplement identifies security threats
    which arise when providing C-V2X services and that result in degradation of URLLC
    performance. In addition, this Supplement describes security deployment scenarios
    for C-V2X services to address the security threats.\r\n"
