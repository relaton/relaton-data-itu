abstract:
- language: en
  script: Latn
  content: This Recommendation is concerned with the definition of control procedures
    which allow cell level GOS objectives to be fulfilled. The primary objective is
    to define practical CAC procedures allowing the network operator to decide when
    a new connection can be accepted on individual ATM links or network VPCs. Theoretical
    background is included where necessary to clarify assumptions and to situate the
    context of proposed control options. This Recommendation also addresses adaptive
    resource management techniques, where these are required by defined ATM transfer
    capabilities, and it identifies procedures for service integration.
