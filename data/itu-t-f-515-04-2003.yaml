abstract:
- language: en
  script: Latn
  content: This Recommendation provides a directory specification to fulfil the service
    requirements of ITU-T Rec. F.510. The directory specification is named Unified
    Directory Specification (UDS) to reflect that it allows a great variety of database
    structures to be supported. The ITU-T Rec. F.510 service is realized by the Unified
    Directory Access Protocol (UDAP). This protocol is expressed using the eXtensible
    Markup Language (XML) schema notation.UDAP has been designed in a way that facilitates
    an easy mapping to ITU-T Rec. E.115.The structure of this Recommendation follows
    the structure of ITU-T Rec. F.510. Certain clauses in ITU-T Rec. F.510 do not
    require a corresponding specification and are left void.
