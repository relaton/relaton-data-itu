- language: en
  script: Latn
  content: "Control and management are concerned with secure, stable, efficient, and
    robust operations of the quantum key distribution network (QKDN). Recommendation
    ITU-T X.1717 specifies security requirements and measures for control and management
    in the quantum key distribution network based on the functional architecture for
    control and management in the QKDN, which is defined in Recommendation ITU-T Y.3804.\r\n"
