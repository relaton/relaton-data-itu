abstract:
- language: en
  script: Latn
  content: The dynamic adaptation between various service environments using the application
    profiles for the continuous service is a key issue of the profile-based application
    adaptation service (PAAS) using NGN. PAAS offers an optimized service framework
    for providing continuous services for users, which are multimedia, educational
    broadcasting, game, etc., using the various devices that are not restricted by
    the service environment of the user. This Supplement specifies the functional
    model and service scenario of PAAS.
