abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T L.1391 specifies IMT-2020 (also known as 5G) network
    sharing and coconstruction (NSCC) and their contribution to climate change mitigation,
    identifies their key technologies and specifies how to assess NSCC in their adaptation
    to climate change. Recommendation ITU-T L.1391 also addresses the cost-benefit
    analysis and best practice for IMT2020 NSCC.\r\nMobile network operators around
    the world are facing unprecedented difficulties in IMT-2020 deployment. Restricted
    by expensive spectrum resources, the need for high investment and high energy
    consumption of IMT-2020, the profit gap between operators and equipment manufacturers
    is growing, and a large number of problems related to business increment with
    no increase in revenue are arising. Methods of reduction in the cost of network
    construction and operation, adaptation to climate change mitigation and enablement
    of the rapid benefits of IMT-2020, especially in underdeveloped communications
    regions, present major challenges to the global industry and operators.\r\n"
