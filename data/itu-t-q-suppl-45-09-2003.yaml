abstract:
- language: en
  script: Latn
  content: This Supplement to ITU-T Q-Series Recommendations is a technical report
    on the procedures, information flows and information elements needed to interwork
    Bearer Independent Call Control (BICC) peer-to-peer protocol (i.e., ITU-T Rec.
    Q.1902) and ISDN User Part (ISUP) protocol (i.e., ITU-T Recs Q.761-Q.764, Q.73y.x,
    Q.765.x, Q.769.x), with Session Initiation Protocol (SIP) and Session Description
    Protocol (SDP) at the BICC Interface Serving Node (ISN). The SIP/SDP is assumed
    on a "Network-to-Network Interface" (NNI) between the BICC/ISUP network and a
    SIP network, which is an originating or terminating/destination network.
