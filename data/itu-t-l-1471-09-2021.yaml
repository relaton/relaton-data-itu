abstract:
- language: en
  script: Latn
  content: "Currently, the definitions of Net Zero and related concepts such as carbon
    neutrality and climate neutrality for organizations are still under development.
    Several initiatives, including, inter alia, the Science Based Target Initiative,
    the United Nations Framework Convention on Climate Change (UNFCCC) Race to Zero,
    ISO TC 207 and the Net Zero Initiative are working on defining or aligning the
    different views of these concepts to avoid confusion and reduce risks for green
    washing.\r\nRecommendation ITU-T L.1471 seeks to guide information and communication
    technology (ICT) organizations in clarifying the meaning of Net Zero in the context
    of the ICT sector and setting Net Zero targets and strategies. It also identifies
    actions that would lead the sector towards Net Zero according to the trajectories
    described in Recommendation ITU T L.1470.\r\n"
