abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.311 provides audio performance requirements for
    wideband (8000 Hz) handset and headset telephones.\r\nRequirements and test methods
    are specified for the major audio transmission parameters affecting wideband audio,
    including sending and receiving levels, frequency response, noise, distortion,
    sidetone, stability, echo path and delay. Wideband audio represents a considerable
    departure from traditional narrow-band telephony, offering significantly improved
    quality.\r\nMajor changes over the previous version of this Recommendation (2005)
    are as follows:\r\n– The structure of the Recommendation is modified, the objective
    measurement methods originally in Annex A have been transferred into the main
    body. \r\n– In addition to sinusoidal and noise signals, speech-like stimulus
    signals as described in Recommendation ITU-T P.50 and Recommendation ITU-T P.501
    are also recommended for the measurements.\r\n– HATS method is used for better
    simulation of real telephone communication.\r\n– Specific headset requirements
    are incorporated.\r\n– Some technical requirements and related test methods have
    been modified based on the latest research, e.g., frequency response, distortion,
    STMR, D-factor, and delay."
