abstract:
- language: en
  script: Latn
  content: "Recommendation ITU-T P.1201.1 specifies the algorithmic model for the
    lower resolution (LR) application area of Recommendation ITU-T P.1201. The ITU-T
    P.1201 series of Recommendations specifies models for monitoring the audio, video
    and audiovisual quality of IP-based video services based on packet-header information.
    The lower resolution application area of the ITU-T P.1201.1 part of ITU-T P.1201
    can be applied to the monitoring of performance and quality of experience (QoE)
    of video services such as mobile TV. The algorithm for the higher resolution (HR)
    case is specified in ITU-T P.1201.2. See ITU-T P.1201 for details and respective
    application ranges and limitations of use.\r\nThis Recommendation includes an
    electronic attachment for testing compliance.\r\n"
