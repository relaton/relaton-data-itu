abstract:
- language: en
  script: Latn
  content: Annex B to Recommendation ITU-T V.152 defines a method that uses data signal
    detection and silence insertion in voiceband data that adds a means of providing
    bandwidth savings during transmission. Annex C to Recommendation ITU-T V.152 addresses
    a problem discovered during the implementation of V.152 gateways with the transmission
    of facsimile terminals. While this issue has been resolved by an amendment to
    Recommendation ITU-T T.30, due to the extremely large numbers of terminals deployed
    in the field and the low probability that they would be corrected retroactively,
    it was considered pre-emptive to include a solution in a V.152 media gateway.
