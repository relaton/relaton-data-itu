abstract:
- language: en
  script: Latn
  content: Ubiquitous wireless access to IP-based networks in many areas raises the
    scenario of multiple communications opportunities, possibly among both free and
    subscription network services. Recommendation ITU-T Y.1546 provides common reference
    events and parameters for attachment and hand-over performance. The mapping between
    the set of common events and technology-specific protocol events are provided
    in Annex A and Annex B, and these will be expanded as needed.
