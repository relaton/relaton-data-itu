# NOT synced by Cimas, unlike this repo's other workflows. relaton/support's
# cimas-config/cimas.yml deliberately leaves .github/workflows/crawler.yml unmapped
# for relaton-data-itu (see the comment beside that repo's entry), so this file is
# hand-maintained and `cimas sync` will not revert it. It has to deviate: the shared
# template offers one nightly cron and no way to say WHICH kind of crawl, and this
# dataset has two — a ~3.5 h full re-derivation of both ITU sectors and a ~0.6 h
# top-up. Everything else here follows the template, including the permissions grant
# and its rationale.
#
# Keep `name: Crawler`: deploy.yml's `workflow_run` trigger matches on it.
name: Crawler

# Scheduled or by hand, and nothing else.
#
# Dropped `pull_request`: the shared crawler.yml gates its "Push data" step on
# `github.event_name != 'pull_request'`, so a PR crawled both sectors for hours and
# then discarded the result. What that costs — worth knowing before editing
# crawler.rb — is that the PR run was the only NON-MUTATING way to exercise a change
# to it. A `workflow_dispatch` run is not gated by that step: it commits and pushes
# to whatever branch it runs on. Exercise crawler.rb with `bundle exec rspec`.
#
# Dropped `push`: it re-ran a full-cost crawl on every commit to the default branch,
# documentation-only ones included, that a cron below would run anyway.
on:
  # Two crons, one job. `github.event.schedule` holds the cron string that fired,
  # verbatim as written here, and that is the only thing distinguishing them: the
  # reusable workflow has no env input, so the mode travels as an argument (see
  # crawler.rb's .apply_mode!). Keep these strings byte-identical to the expression
  # in `args:` below.
  schedule:
  # Sunday: re-derive everything, making ITU the sole author of both sectors. ~3.5 h
  # (ITU-R ~2 h + ITU-T ~1.6 h), inside the 6 h per-job cap. This is also the only
  # run that PRUNES — a top-up only ever adds — so it must not be dropped once the
  # daily runs look healthy.
  - cron: '0 14 * * 0'
  # Mon-Sat: deep-fetch only what the dataset lacks. ~0.6 h on a quiet day.
  - cron: '0 14 * * 1-6'
  workflow_dispatch:
    inputs:
      args:
        description: Crawl mode, passed to crawler.rb as ARGV[0]
        required: false
        type: choice
        default: full
        options:
        - full
        - top_up

jobs:
  crawl:
    # Required, not hardening. The shared crawler.yml's "Push data" step runs
    # `git commit` + `git push` with the credentials actions/checkout persists,
    # i.e. GITHUB_TOKEN — and a caller granting less caps what the called workflow
    # gets. With only `contents: read` the crawl runs to completion and then fails
    # on the push, having thrown away hours of www.itu.int traffic.
    #
    # The grant cannot live in crawler.yml itself: a called workflow's
    # `permissions:` can only downgrade the caller's.
    permissions:
      contents: write
    # One crawl at a time, queued rather than cancelled. Two runs can otherwise
    # overlap — a hand-started full crawl meeting a cron, or a Sunday run delayed
    # far enough to meet Monday's (Actions cron drift on this fleet is 45-60+ min).
    # Both would push to the same branch, and the loser's `git push` fails
    # non-fast-forward after hours of traffic: the shared workflow neither retries
    # nor rebases. `cancel-in-progress: false` because the run already in flight is
    # the one holding the hours.
    concurrency:
      group: crawler
      cancel-in-progress: false
    uses: relaton/support/.github/workflows/crawler.yml@main
    with:
      # A dispatch says which mode it wants; a cron is identified by its own string.
      # -> Sunday 'full', Mon-Sat 'top_up', dispatch whatever was chosen. The shared
      # workflow interpolates this into `bundle exec ruby crawler.rb <args>`, so it
      # lands in ARGV[0], and crawler.rb aborts on anything it does not recognise.
      # The fallback is 'top_up', so an unmatched cron runs cheap rather than
      # expensive — but note the corollary: edit the Sunday string here without
      # editing it above and the only run that prunes silently stops happening.
      args: ${{ inputs.args || (github.event.schedule == '0 14 * * 0' && 'full' || 'top_up') }}
